}
function StrategyPage({ showToast, openBacktestWithStrategy }) {
    const [strategies, setStrategies] = useState([]);
    const [selected, setSelected] = useState(null);
    const [code, setCode] = useState('');
    const [name, setName] = useState('');
    const [desc, setDesc] = useState('');
    const [saving, setSaving] = useState(false);
    const [aiPrompt, setAiPrompt] = useState('');
    const [aiLoading, setAiLoading] = useState(false);
    const [deletingId, setDeletingId] = useState(null);
    const [strategySearch, setStrategySearch] = useState('');
    const [aiSkills, setAiSkills] = useState([]);
    const [aiContext, setAiContext] = useState({ news_count: 0, news_items: [] });
    const [factorCatalog, setFactorCatalog] = useState([]);
    const [factorSearch, setFactorSearch] = useState('');
    const [includeMarketContext, setIncludeMarketContext] = useState(true);
    const [deleteTarget, setDeleteTarget] = useState(null);
    const selectedIdRef = useRef(null);
    const pendingBacktestContextRef = useRef(null);
    const [aiMessages, setAiMessages] = useState([
        {
            role: 'assistant',
            content: '告诉我你的交易目标、市场偏好和风险要求，我会生成可直接保存并用于回测的 QTsys 策略代码。',
        },
    ]);

    useEffect(() => {
        selectedIdRef.current = selected ? selected.id : null;
    }, [selected]);

    const load = useCallback(async (preferredId) => {
        try {
            const items = await api.get('/api/strategies');
            setStrategies(items);
            const targetId = preferredId || selectedIdRef.current;
            if (targetId) {
                const target = items.find(item => item.id === targetId);
                if (target) {
                    setSelected(target);
                    setName(target.name || '');
                    setDesc(target.description || '');
                    setCode(target.code || '');
                }
            }
        } catch (_) {}
    }, []);

    useEffect(() => { load(); }, [load]);
    useEffect(() => {
        api.get('/api/strategies/ai/skills')
            .then(res => setAiSkills((res && res.skills) || []))
            .catch(() => setAiSkills([]));
    }, []);
    useEffect(() => {
        api.get('/api/factors/catalog')
            .then(res => setFactorCatalog((res && res.factors) || []))
            .catch(() => setFactorCatalog([]));
    }, []);

    const selectStrategy = (strategy) => {
        setSelected(strategy);
        setName(strategy.name || '');
        setDesc(strategy.description || '');
        setCode(strategy.code || '');
    };

    const filteredStrategies = useMemo(() => {
        const keyword = String(strategySearch || '').trim().toLowerCase();
        if (!keyword) return strategies;
        return strategies.filter(item => {
            const text = [item.id, item.name, item.description].join(' ').toLowerCase();
            return text.includes(keyword);
        });
    }, [strategies, strategySearch]);
    const filteredFactorCatalog = useMemo(() => {
        const keyword = String(factorSearch || '').trim().toLowerCase();
        if (!keyword) return factorCatalog.slice(0, 18);
        return factorCatalog
            .filter(item => [item.name, item.description, item.category, item.source, item.expression].join(' ').toLowerCase().includes(keyword))
            .slice(0, 18);
    }, [factorCatalog, factorSearch]);

    const bindStrategyBacktestContext = (strategyId, overrideContext) => {
        const resolved = normalizeBacktestContext(overrideContext || pendingBacktestContextRef.current);
        if (!strategyId || !resolved || !resolved.stock_codes || !resolved.stock_codes.length) return null;
        saveStrategyBacktestContext(strategyId, resolved);
        pendingBacktestContextRef.current = null;
        return resolved;
    };

    const jumpToBacktest = (strategy, overrideContext) => {
        if (!strategy || !strategy.id) {
            showToast('请先保存策略后再进入回测', 'error');
            return;
        }
        const benchmarkCode = /上证50/.test(strategy.name || '') ? '000016.SH'
            : /中证500/.test(strategy.name || '') ? '000905.SH'
            : /中证1000/.test(strategy.name || '') ? '000852.SH'
            : '000300.SH';
        const defaultUniverse = benchmarkCode === '000016.SH'
            ? '600519.SH,601318.SH,600036.SH'
            : benchmarkCode === '000905.SH'
                ? '000738.SZ,002050.SZ,300124.SZ'
                : benchmarkCode === '000852.SH'
                    ? '300750.SZ,688111.SH,002371.SZ'
                    : '600519.SH,000858.SZ,601318.SH';
        const linkedContext = normalizeBacktestContext(overrideContext || readStrategyBacktestContext(strategy.id));
        const finalBenchmark = linkedContext && linkedContext.benchmark ? linkedContext.benchmark : benchmarkCode;
        const finalUniverse = linkedContext && linkedContext.universe ? linkedContext.universe : defaultUniverse;
        pushBacktestPrefill({
            strategy_id: String(strategy.id),
            strategy_name: strategy.name || '',
            benchmark: finalBenchmark,
            universe: finalUniverse,
            start_date: linkedContext && linkedContext.start_date ? linkedContext.start_date : '',
            end_date: linkedContext && linkedContext.end_date ? linkedContext.end_date : '',
            universe_type: linkedContext && linkedContext.universe_type ? linkedContext.universe_type : '',
            universe_code: linkedContext && linkedContext.universe_code ? linkedContext.universe_code : '',
            universe_name: linkedContext && linkedContext.universe_name ? linkedContext.universe_name : '',
            custom_pool_id: linkedContext && linkedContext.custom_pool_id ? linkedContext.custom_pool_id : null,
            stock_items: linkedContext && linkedContext.stock_items ? linkedContext.stock_items : [],
            stock_count: linkedContext && linkedContext.stock_count ? linkedContext.stock_count : 0,
            source: linkedContext && linkedContext.source ? linkedContext.source : 'strategy',
            source_label: linkedContext && linkedContext.source_label ? linkedContext.source_label : '',
        });
        if (openBacktestWithStrategy) openBacktestWithStrategy();
    };

    const newStrategy = () => {
        setSelected(null);
        setName('新策略草稿');
        setDesc('AI 或手工创建的策略草稿');
        setCode(STRATEGY_TEMPLATE);
    };

    const initBuiltin = async () => {
        try {
            const res = await api.post('/api/strategies/init_builtin');
            await load();
            showToast((res && res.message) || '内置策略已加载', 'success');
        } catch (e) {
            showToast((e && e.detail) || '加载内置策略失败', 'error');
        }
    };

    const save = async () => {
        if (!name.trim()) { showToast('请填写策略名称', 'error'); return; }
        if (!code.trim()) { showToast('策略代码不能为空', 'error'); return; }
        setSaving(true);
        try {
            if (selected) {
                await api.put('/api/strategies/' + selected.id, { name, description: desc, code });
                bindStrategyBacktestContext(selected.id);
                showToast('策略已更新', 'success');
                await load(selected.id);
            } else {
                const created = await api.post('/api/strategies', { name, description: desc, code });
                if (created && created.id) bindStrategyBacktestContext(created.id);
                showToast('策略已创建', 'success');
                await load(created.id);
                if (created && created.id) {
                    const detail = await api.get('/api/strategies/' + created.id);
                    selectStrategy(detail);
                }
            }
        } catch (e) {
            showToast((e && e.detail) || '保存策略失败', 'error');
        }
        setSaving(false);
    };

    const delStrategy = async (id) => {
        if (deletingId === id) return;
        setDeletingId(id);
        try {
            await api.remove('/api/strategies/' + id);
            clearStrategyBacktestContext(id);
            const nextStrategies = strategies.filter(item => item.id !== id);
            setStrategies(nextStrategies);
            if (selected && selected.id === id) {
                const nextSelected = nextStrategies[0] || null;
                setSelected(nextSelected);
                setName(nextSelected ? (nextSelected.name || '') : '');
                setDesc(nextSelected ? (nextSelected.description || '') : '');
                setCode(nextSelected ? (nextSelected.code || '') : '');
                selectedIdRef.current = nextSelected ? nextSelected.id : null;
            }
            setDeleteTarget(null);
            await load();
            showToast('策略已删除', 'success');
        } catch (e) {
            showToast((e && e.detail) || '删除策略失败', 'error');
        }
        setDeletingId(null);
    };

    const requestDeleteStrategy = (strategy, event) => {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
        if (!strategy || !strategy.id) return;
        setDeleteTarget(strategy);
    };

    const insertFactorSnippet = (factor, mode) => {
        if (!factor || !factor.name) return;
        const varPrefix = String(factor.name || 'factor').replace(/[^a-zA-Z0-9_]/g, '_') || 'factor';
        const safeName = String(factor.name).replace(/'/g, "\\'");
        const snippet = mode === 'history'
            ? `\n# 因子历史：${factor.name}\nconst_${varPrefix}_hist = context.get_factor_history('${safeName}', ts_code, 20)\nif len(const_${varPrefix}_hist) < 5:\n    continue\n`
            : `\n# 因子当前值：${factor.name}\nconst_${varPrefix} = context.get_factor('${safeName}', ts_code)\n`;
        setCode(prev => `${prev || ''}${snippet}`);
        showToast(`已插入因子模板：${factor.name}`, 'success');
    };

    const requestAI = async (saveDirect, promptOverride) => {
        const finalPrompt = (promptOverride || aiPrompt || '').trim();
        if (!finalPrompt) { showToast('请输入你希望 AI 生成的策略需求', 'error'); return; }
        const originalPrompt = finalPrompt;
        const userMessage = { role: 'user', content: finalPrompt };
        const nextMessages = [...aiMessages.map(item => ({ role: item.role, content: item.content })), userMessage];
        setAiMessages(prev => [...prev, userMessage]);
        setAiPrompt('');
        setAiLoading(true);
        try {
            const res = await api.post('/api/strategies/ai/generate', {
                messages: nextMessages,
                current_strategy: { name, description: desc, code },
                include_market_context: includeMarketContext,
                save: saveDirect,
            });
            if (!res || !res.strategy || !res.strategy.code || !String(res.strategy.code).trim()) {
                throw { detail: 'AI 已返回结果，但未生成可用的策略代码，请重试或缩短需求描述。' };
            }
            const assistantMessage = {
                role: 'assistant',
                content: res.assistant_reply || 'AI 已生成策略草稿。',
                strategy: res.strategy || null,
                saved_strategy: res.saved_strategy || null,
            };
            setAiMessages(prev => [...prev, assistantMessage]);
            if (res.context_summary) setAiContext(res.context_summary);
            if (res.strategy) {
                setName(res.strategy.name || 'AI 生成策略');
                setDesc(res.strategy.description || '');
                setCode(res.strategy.code || '');
            }
            if (res.saved_strategy && res.saved_strategy.id) {
                const linkedContext = bindStrategyBacktestContext(res.saved_strategy.id);
                await load(res.saved_strategy.id);
                const detail = await api.get('/api/strategies/' + res.saved_strategy.id);
                selectStrategy(detail);
                jumpToBacktest(detail, linkedContext);
                showToast('AI 策略已保存，并已带入回测页', 'success');
            } else {
                setSelected(null);
                showToast('AI 已生成策略草稿', 'success');
            }
        } catch (e) {
            setAiPrompt(originalPrompt);
            setAiMessages(prev => {
                const next = [...prev];
                const last = next[next.length - 1];
                if (last && last.role === 'user' && last.content === originalPrompt) {
                    next.pop();
                }
                next.push({
                    role: 'assistant',
                    content: '生成失败：' + ((e && e.detail) || 'AI 生成失败，请稍后重试。'),
                    strategy: null,
                    saved_strategy: null,
                });
                return next;
            });
            showToast((e && e.detail) || 'AI 生成失败', 'error');
        }
        setAiLoading(false);
    };

    useEffect(() => {
        const applyStrategyPrefill = () => {
            const prefill = readStrategyAIPrefill();
            if (!prefill || !prefill.prompt) return;
            clearStrategyAIPrefill();
            pendingBacktestContextRef.current = normalizeBacktestContext(prefill.backtest_context || null);
            setAiPrompt(prefill.prompt);
            if (prefill.auto_generate) setTimeout(() => requestAI(false, prefill.prompt), 0);
        };
        applyStrategyPrefill();
        window.addEventListener('qtsys:strategy-ai-prefill', applyStrategyPrefill);
        return () => window.removeEventListener('qtsys:strategy-ai-prefill', applyStrategyPrefill);
    }, [aiMessages, name, desc, code, includeMarketContext]);

    return (
        <div className="fade-in strategy-layout">
            <div className="strategy-card strategy-sidebar">
                <div className="strategy-sidebar-head">
                    <div>
                        <div className="strategy-sidebar-title">策略库</div>
                        <div className="strategy-sidebar-subtitle">统一管理手工策略、内置模板和 AI 生成策略。当前共 {strategies.length} 个。</div>
                    </div>
                    <div className="flex gap-sm">
                        <button className="btn btn-primary flex-1 text-sm" onClick={newStrategy}>新建草稿</button>
                        <button className="btn btn-secondary flex-1 text-sm" onClick={initBuiltin}>加载内置</button>
                    </div>
                </div>
                <input className="input" value={strategySearch} onChange={e => setStrategySearch(e.target.value)} placeholder="按名称、描述或编号搜索策略" style={{marginBottom:12}} />
                <div className="strategy-list">
                    {filteredStrategies.length === 0 && <div className="strategy-empty-hint">{strategies.length === 0 ? '当前还没有策略，可先新建或加载内置模板。' : '没有匹配的策略。'}</div>}
                    {filteredStrategies.map(strategy => (
                        <div
                            key={strategy.id}
                            onClick={() => selectStrategy(strategy)}
                            className={'strategy-item' + (selected && selected.id === strategy.id ? ' selected' : '')}
                        >
                            <div className="strategy-item-name">{strategy.name}</div>
                            <div className="strategy-item-desc">#{strategy.id}</div>
                            <div className="strategy-item-desc">{strategy.description || '暂无描述'}</div>
                            <button type="button" className="btn-danger mt-2" disabled={deletingId === strategy.id} onClick={(e) => requestDeleteStrategy(strategy, e)}>
                                {deletingId === strategy.id ? '删除中...' : '删除'}
                            </button>
                        </div>
                    ))}
                </div>
            </div>
            <div className="strategy-card strategy-editor-shell">
                <div className="strategy-topbar">
                    <div>
                        <div className="strategy-panel-eyebrow">Strategy Workspace</div>
                        <div className="strategy-panel-title">{selected ? '编辑现有策略' : '策略草稿工作台'}</div>
                        <div className="strategy-panel-subtitle">AI 生成的策略会自动写入当前编辑器，你可以继续修改、保存、回测和分析。</div>
                    </div>
                    <div className="strategy-toolbar-actions">
                        <button className="btn btn-secondary" onClick={newStrategy}>重置草稿</button>
                        <button className="btn btn-secondary" onClick={() => jumpToBacktest(selected)} disabled={!selected || saving}>前往回测</button>
                        <button className="btn btn-primary" onClick={save} disabled={saving}>
                            {saving ? <span className="spinner"/> : null}
                            {selected ? '保存修改' : '保存为新策略'}
                        </button>
                    </div>
                </div>
                <div className="strategy-form-grid">
                    <input className="input" value={name} onChange={e => setName(e.target.value)} placeholder="策略名称" />
                    <input className="input" value={desc} onChange={e => setDesc(e.target.value)} placeholder="策略描述" />
                    <div className="strategy-mini-card">
                        <div className="strategy-mini-label">状态</div>
                        <div className="strategy-mini-value">{selected ? `已选中 #${selected.id}` : '未保存草稿'}</div>
                    </div>
                </div>
                <div className="strategy-editor-tip">
                    <div className="strategy-chip muted">模板要求：必须包含 initialize / handle_data</div>
                    <div className="strategy-chip muted">保存后可直接进入回测页面使用</div>
                    <div className="strategy-chip muted">AI 会自动进行本地模板校验</div>
                    <div className="strategy-chip muted">支持直接调用因子库：context.get_factor / context.get_factor_history</div>
                </div>
                <div className="strategy-mini-card">
                    <div className="strategy-mini-label">因子库助手</div>
                    <div className="strategy-mini-value">策略代码和 AI 都可以直接复用因子库。搜索后可一键插入当前值或历史序列模板。</div>
                    <input className="input" value={factorSearch} onChange={e => setFactorSearch(e.target.value)} placeholder="搜索因子名称、分类、表达式" style={{marginTop:10}} />
                    <div className="strategy-factor-list" style={{marginTop:10}}>
                        {filteredFactorCatalog.length === 0 ? (
                            <div className="strategy-empty-hint">当前没有可展示的因子。</div>
                        ) : filteredFactorCatalog.map(factor => (
                            <div key={`${factor.source}-${factor.id}-${factor.name}`} className="strategy-factor-item">
                                <div className="strategy-factor-name">{factor.name}</div>
                                <div className="strategy-factor-meta">{[factor.category, factor.source, factor.expression].filter(Boolean).join(' · ')}</div>
                                <div className="strategy-factor-desc">{factor.description || '暂无因子说明'}</div>
                                <div className="strategy-factor-actions">
                                    <button className="btn btn-secondary" type="button" style={{fontSize:12,padding:'4px 10px'}} onClick={() => insertFactorSnippet(factor, 'value')}>插入当前值</button>
                                    <button className="btn btn-secondary" type="button" style={{fontSize:12,padding:'4px 10px'}} onClick={() => insertFactorSnippet(factor, 'history')}>插入历史序列</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
                <CodeEditor value={code} onChange={setCode} />
            </div>
            <div className="strategy-card strategy-ai-panel">
                <div className="strategy-ai-header">
                    <div>
                        <div className="strategy-ai-title">AI 策略助手</div>
                        <div className="strategy-ai-subtitle">结合系统模板、最新市场新闻和量化风控规则，生成可直接落库的策略。</div>
                    </div>
                    <label className="strategy-switch">
                        <input
                            type="checkbox"
                            checked={includeMarketContext}
                            onChange={e => setIncludeMarketContext(e.target.checked)}
                        />
                        结合最新市场消息
                    </label>
                </div>
                <div className="strategy-chip-row">
                    {(aiSkills || []).map(skill => (
                        <div key={skill.key || skill.name} className="strategy-chip" title={skill.description || ''}>
                            {skill.name}
                        </div>
                    ))}
                    <div className="strategy-chip muted">可用因子 {factorCatalog.length} 个</div>
                </div>
                <div>
                    <div className="strategy-mini-label" style={{marginBottom:8}}>常用提示</div>
                    <div className="strategy-suggestion-grid">
                        {STRATEGY_AI_SUGGESTIONS.map(item => (
                            <button key={item} className="strategy-suggestion" onClick={() => setAiPrompt(item)}>{item}</button>
                        ))}
                    </div>
                </div>
                {!!((aiContext.news_items || []).length) && (
                    <div>
                        <div className="strategy-mini-label" style={{marginBottom:8}}>已注入市场快照（{aiContext.news_count || 0} 条）</div>
                        <div className="strategy-ai-market-list">
                            {(aiContext.news_items || []).slice(0, 3).map((item, idx) => (
                                <div key={idx} className="strategy-ai-market-item">
                                    <div className="strategy-ai-market-title">{item.title || '未命名新闻'}</div>
                                    <div className="strategy-ai-market-meta">{[item.publish_time, item.source, item.sentiment_label].filter(Boolean).join(' · ')}</div>
                                    <div className="strategy-ai-market-summary">{item.summary || '暂无摘要'}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
                <div className="strategy-ai-messages">
                    {aiMessages.map((message, idx) => (
                        <div key={idx} className={'strategy-ai-message ' + message.role}>
                            <div className="strategy-ai-message-head">
                                <span>{message.role === 'user' ? '你的需求' : 'AI 输出'}</span>
                                {message.saved_strategy ? <span>已保存 #{message.saved_strategy.id}</span> : null}
                            </div>
                            <div className="strategy-ai-message-body">{message.content}</div>
                            {message.saved_strategy ? (
                                <div style={{marginTop:10}}>
                                    <button className="btn btn-secondary" onClick={() => jumpToBacktest(message.saved_strategy)}>立即回测</button>
                                </div>
                            ) : null}
                            {message.strategy ? (
                                <div className="strategy-ai-block">
                                    <div className="strategy-ai-block-title">本轮生成结果</div>
                                    <div className="strategy-mini-value" style={{marginTop:0}}>
                                        <strong>{message.strategy.name}</strong>
                                        <div style={{marginTop:6, color:'var(--text-400)'}}>{message.strategy.description}</div>
                                    </div>
                                    {!!(message.strategy.logic_points || []).length && (
                                        <div style={{marginTop:10}}>
                                            <div className="strategy-mini-label" style={{marginBottom:8}}>核心逻辑</div>
                                            <div className="strategy-ai-list">
                                                {(message.strategy.logic_points || []).map((item, pointIdx) => (
                                                    <div key={pointIdx} className="strategy-ai-bullet">{item}</div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    {!!(message.strategy.risk_points || []).length && (
                                        <div style={{marginTop:10}}>
                                            <div className="strategy-mini-label" style={{marginBottom:8}}>风险提示</div>
                                            <div className="strategy-ai-list">
                                                {(message.strategy.risk_points || []).map((item, pointIdx) => (
                                                    <div key={pointIdx} className="strategy-ai-bullet">{item}</div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    {message.strategy.market_view ? (
                                        <div style={{marginTop:10}}>
                                            <div className="strategy-mini-label" style={{marginBottom:8}}>市场判断</div>
                                            <div className="strategy-mini-value" style={{marginTop:0}}>{message.strategy.market_view}</div>
                                        </div>
                                    ) : null}
                                </div>
                            ) : null}
                        </div>
                    ))}
                </div>
                <textarea
                    className="input strategy-ai-textarea"
                    value={aiPrompt}
                    onChange={e => setAiPrompt(e.target.value)}
                    placeholder="例如：请生成一个适合当前震荡行情、面向沪深300成分股的低换手趋势策略，并控制最大单股仓位。"
                />
                <div className="strategy-ai-actions">
                    <button className="btn btn-secondary" onClick={() => requestAI(false)} disabled={aiLoading}>
                        {aiLoading ? <span className="spinner"/> : null}生成草稿
                    </button>
                    <button className="btn btn-primary" onClick={() => requestAI(true)} disabled={aiLoading}>
                        {aiLoading ? <span className="spinner"/> : null}生成并保存
                    </button>
                </div>
            </div>
            {deleteTarget ? (
                <div className="factor-board-modal" onClick={() => setDeleteTarget(null)}>
                    <div className="factor-board-modal-card" onClick={e => e.stopPropagation()} style={{maxWidth: 520}}>
                        <div className="factor-board-modal-head" style={{marginBottom: 12}}>
                            <div>
                                <div className="factor-board-modal-title" style={{fontSize: 22}}>确认删除策略</div>
                                <div className="factor-board-modal-copy" style={{marginTop: 8}}>
                                    将要删除策略：{deleteTarget.name || `#${deleteTarget.id}`}。删除后不会自动恢复，相关联的本地回测上下文也会一并清除。
                                </div>
                            </div>
                        </div>
                        <div className="strategy-mini-card" style={{marginBottom: 16}}>
                            <div className="strategy-mini-label">策略信息</div>
                            <div className="strategy-mini-value">#{deleteTarget.id} · {deleteTarget.description || '暂无描述'}</div>
                        </div>
                        <div className="strategy-toolbar-actions" style={{justifyContent: 'flex-end'}}>
                            <button type="button" className="btn btn-secondary" onClick={() => setDeleteTarget(null)} disabled={deletingId === deleteTarget.id}>取消</button>
                            <button type="button" className="btn btn-primary" onClick={() => delStrategy(deleteTarget.id)} disabled={deletingId === deleteTarget.id}>
                                {deletingId === deleteTarget.id ? '删除中...' : '确认删除'}
                            </button>
                        </div>
                    </div>
                </div>
            ) : null}
        </div>
    );
}
/* ===== Backtest Page ===== */
function BacktestPage({ showToast, openHistoryWithResult }) {
    const [strategies, setStrategies] = useState([]);
    const [strategyId, setStrategyId] = useState('');
    const [startDate, setStartDate] = useState('20230101');
    const [endDate, setEndDate] = useState('20231231');
    const [cash, setCash] = useState(1000000);
    const [benchmark, setBenchmark] = useState('000300.SH');
    const [running, setRunning] = useState(false);
    const [result, setResult] = useState(null);
    const [resultTab, setResultTab] = useState('chart');
    const [logs, setLogs] = useState([]);
    const [showOptimizer, setShowOptimizer] = useState(false);
    const [paramGrid, setParamGrid] = useState('{"short_period": [3, 5, 10], "long_period": [15, 20, 30]}');
    const [optimizing, setOptimizing] = useState(false);
    const [optimizeResults, setOptimizeResults] = useState(null);
    const [maxPosPct, setMaxPosPct] = useState(0.25);
    const [maxDdLimit, setMaxDdLimit] = useState(0);
    const [wfRunning, setWfRunning] = useState(false);
    const [wfResult, setWfResult] = useState(null);
    const [prefillInfo, setPrefillInfo] = useState(null);
    const [universeInputMode, setUniverseInputMode] = useState('codes');
    const [dateInputMode, setDateInputMode] = useState('manual');
    const [benchmarkInputMode, setBenchmarkInputMode] = useState('manual');
    const [universeOptions, setUniverseOptions] = useState({ system_universes: [], custom_pools: [], unsupported_universes: [] });
    const [systemUniverseCode, setSystemUniverseCode] = useState('000300.SH');
    const [customPoolId, setCustomPoolId] = useState('');
    const [codeList, setCodeList] = useState(['000001.SZ']);
    const [codeDraft, setCodeDraft] = useState('');
    const [showPoolManager, setShowPoolManager] = useState(false);
    const [poolForm, setPoolForm] = useState({ id: null, name: '', description: '', stock_items: [] });
    const [stockKeyword, setStockKeyword] = useState('');
    const [stockResults, setStockResults] = useState([]);
    const [showStockResults, setShowStockResults] = useState(false);
    const [poolSaving, setPoolSaving] = useState(false);
    const [poolDeleting, setPoolDeleting] = useState(false);
    const resultRef = useRef(null);
    const lastAppliedSavedContextRef = useRef('');

    const selectedSystemUniverse = (universeOptions.system_universes || []).find(item => item.code === systemUniverseCode) || null;
    const selectedCustomPool = (universeOptions.custom_pools || []).find(item => String(item.id) === String(customPoolId)) || null;
    const linkedPoolAvailable = !!(prefillInfo && prefillInfo.universe_type);
    const universe = codeList.join(',');

    const parseCodes = useCallback((text) => {
        const seen = new Set();
        return String(text || '')
            .split(/[\s,，;；]+/)
            .map(item => item.trim().toUpperCase())
            .filter(item => {
                if (!item || seen.has(item)) return false;
                seen.add(item);
                return true;
            });
    }, []);

    const loadUniverseOptions = useCallback(async () => {
        try {
            const res = await api.get('/api/backtest/universe_options');
            setUniverseOptions(res || { system_universes: [], custom_pools: [], unsupported_universes: [] });
        } catch (_) {
            try {
                const res = await api.get('/api/factor_board/universe_options');
                setUniverseOptions({ ...(res || { system_universes: [], custom_pools: [] }), unsupported_universes: [] });
            } catch (_) {
                setUniverseOptions({ system_universes: [], custom_pools: [], unsupported_universes: [] });
            }
        }
    }, []);

    useEffect(() => {
        api.get('/api/strategies').then(s => {
            setStrategies(s);
            if (s.length > 0) setStrategyId(String(s[0].id));
        }).catch(() => {});
        loadUniverseOptions();
    }, [loadUniverseOptions]);

    useEffect(() => {
        if (!stockKeyword || stockKeyword.trim().length < 1) {
            setStockResults([]);
            setShowStockResults(false);
            return;
        }
        const timer = setTimeout(async () => {
            try {
                const res = await api.get('/api/factor_board/stock_search?q=' + encodeURIComponent(stockKeyword.trim()));
                setStockResults(Array.isArray(res) ? res : []);
                setShowStockResults(true);
            } catch (_) {
                setStockResults([]);
                setShowStockResults(false);
            }
        }, 250);
        return () => clearTimeout(timer);
    }, [stockKeyword]);

    const applyBacktestContext = useCallback((context, options = {}) => {
        const normalized = normalizeBacktestContext(context);
        if (!normalized) return;
        const asPrefill = !!options.asPrefill;
        if (normalized.benchmark) setBenchmark(normalized.benchmark);
        if (normalized.start_date) setStartDate(normalized.start_date);
        if (normalized.end_date) setEndDate(normalized.end_date);
        if (normalized.max_position_pct !== undefined && normalized.max_position_pct !== null && normalized.max_position_pct !== '') {
            const nextMaxPos = Number(normalized.max_position_pct);
            if (Number.isFinite(nextMaxPos)) setMaxPosPct(nextMaxPos);
        }
        if (normalized.stock_codes && normalized.stock_codes.length) setCodeList(normalized.stock_codes);
        if (normalized.universe_type === 'system') {
            setSystemUniverseCode(normalized.universe_code || '000300.SH');
            setUniverseInputMode(asPrefill ? 'linked' : 'system');
        } else if (normalized.universe_type === 'custom') {
            setCustomPoolId(normalized.custom_pool_id ? String(normalized.custom_pool_id) : '');
            setUniverseInputMode(asPrefill ? 'linked' : 'custom');
        } else {
            setUniverseInputMode('codes');
        }
        setDateInputMode(normalized.start_date || normalized.end_date ? 'source' : 'manual');
        setBenchmarkInputMode(normalized.benchmark ? 'source' : 'manual');
        setPrefillInfo(asPrefill ? normalized : null);
    }, []);

    const applyBacktestPrefill = useCallback((strategyList) => {
        const prefill = readBacktestPrefill();
        if (!prefill || !prefill.strategy_id) return;
        const list = strategyList || strategies;
        const exists = (list || []).some(item => String(item.id) === String(prefill.strategy_id));
        if (!exists) return;
        setStrategyId(String(prefill.strategy_id));
        applyBacktestContext(prefill, { asPrefill: true });
    }, [strategies, applyBacktestContext]);

    useEffect(() => {
        applyBacktestPrefill(strategies);
    }, [strategies, applyBacktestPrefill]);

    useEffect(() => {
        const handler = () => applyBacktestPrefill();
        window.addEventListener('qtsys:backtest-prefill', handler);
        return () => window.removeEventListener('qtsys:backtest-prefill', handler);
    }, [applyBacktestPrefill]);

    useEffect(() => {
        if (!strategyId || prefillInfo) return;
        const saved = normalizeBacktestContext(readStrategyBacktestContext(strategyId));
        if (!saved) return;
        const nextMarker = `${strategyId}:${saved.updated_at || ''}`;
        if (lastAppliedSavedContextRef.current === nextMarker) return;
        applyBacktestContext(saved, { asPrefill: false });
        lastAppliedSavedContextRef.current = nextMarker;
    }, [strategyId, prefillInfo, applyBacktestContext]);

    useEffect(() => {
        if (!result || !resultRef.current) return;
        setTimeout(() => {
            try { resultRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (_) {}
        }, 80);
    }, [result]);

    useEffect(() => {
        if (universeInputMode !== 'system') return;
        if (benchmarkInputMode === 'manual') return;
        if (selectedSystemUniverse && selectedSystemUniverse.benchmark_code) {
            setBenchmark(selectedSystemUniverse.benchmark_code);
        }
    }, [universeInputMode, selectedSystemUniverse, benchmarkInputMode]);

    const addCodesToList = useCallback((text) => {
        const incoming = parseCodes(text);
        if (!incoming.length) return false;
        setCodeList(prev => {
            const merged = [...prev];
            incoming.forEach(code => {
                if (!merged.includes(code)) merged.push(code);
            });
            return merged;
        });
        return true;
    }, [parseCodes]);

    const addCodeDraft = useCallback((e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        if (addCodesToList(codeDraft)) setCodeDraft('');
    }, [codeDraft, addCodesToList]);

    const removeCodeFromList = useCallback((code) => {
        setCodeList(prev => prev.filter(item => item !== code));
    }, []);

    const restoreSourceDateRange = () => {
        if (prefillInfo && prefillInfo.start_date) setStartDate(prefillInfo.start_date);
        if (prefillInfo && prefillInfo.end_date) setEndDate(prefillInfo.end_date);
        setDateInputMode(prefillInfo && (prefillInfo.start_date || prefillInfo.end_date) ? 'source' : 'manual');
    };

    const restoreSourceBenchmark = () => {
        if (prefillInfo && prefillInfo.benchmark) setBenchmark(prefillInfo.benchmark);
        setBenchmarkInputMode(prefillInfo && prefillInfo.benchmark ? 'source' : 'manual');
    };

    const buildContextSnapshot = useCallback(() => {
        const base = {
            source: 'backtest',
            source_label: '回测配置',
            benchmark,
            start_date: startDate,
            end_date: endDate,
        };
        if (universeInputMode === 'linked' && linkedPoolAvailable) {
            return normalizeBacktestContext({ ...prefillInfo, ...base, strategy_id: strategyId, strategy_name: prefillInfo && prefillInfo.strategy_name ? prefillInfo.strategy_name : '' });
        }
        if (universeInputMode === 'system') {
            return normalizeBacktestContext({
                ...base,
                universe_type: 'system',
                universe_code: (selectedSystemUniverse && selectedSystemUniverse.code) || systemUniverseCode,
                universe_name: (selectedSystemUniverse && selectedSystemUniverse.name) || systemUniverseCode,
                benchmark: benchmarkInputMode === 'manual' ? benchmark : ((selectedSystemUniverse && selectedSystemUniverse.benchmark_code) || benchmark),
                stock_items: [],
            });
        }
        if (universeInputMode === 'custom') {
            return normalizeBacktestContext({
                ...base,
                universe_type: 'custom',
                custom_pool_id: selectedCustomPool ? selectedCustomPool.id : null,
                universe_code: selectedCustomPool ? `custom:${selectedCustomPool.id}` : 'custom',
                universe_name: (selectedCustomPool && selectedCustomPool.name) || '自定义股票池',
                stock_items: normalizeStockItems(selectedCustomPool && selectedCustomPool.stock_items ? selectedCustomPool.stock_items : []),
            });
        }
        return normalizeBacktestContext({
            ...base,
            universe_type: '',
            universe_name: '代码列表',
            stock_items: codeList.map(code => ({ ts_code: code, name: '' })),
        });
    }, [benchmark, startDate, endDate, universeInputMode, linkedPoolAvailable, prefillInfo, strategyId, selectedSystemUniverse, systemUniverseCode, benchmarkInputMode, selectedCustomPool, codeList]);

    const buildUniversePayload = useCallback(() => {
        if (universeInputMode === 'linked' && linkedPoolAvailable) {
            return {
                payload: {
                    universe: parseCodes(prefillInfo && prefillInfo.universe ? prefillInfo.universe : ''),
                    universe_type: prefillInfo.universe_type || '',
                    universe_code: prefillInfo.universe_code || '',
                    universe_name: prefillInfo.universe_name || '',
                    custom_pool_id: prefillInfo.custom_pool_id || null,
                    stock_items: Array.isArray(prefillInfo.stock_items) ? prefillInfo.stock_items : [],
                },
            };
        }
        if (universeInputMode === 'system') {
            const systemMeta = selectedSystemUniverse || { code: systemUniverseCode, name: systemUniverseCode };
            return {
                payload: {
                    universe: [],
                    universe_type: 'system',
                    universe_code: systemMeta.code,
                    universe_name: systemMeta.name,
                    custom_pool_id: null,
                    stock_items: [],
                },
            };
        }
        if (universeInputMode === 'custom') {
            if (!selectedCustomPool) {
                throw new Error('请选择自定义股票池');
            }
            return {
                payload: {
                    universe: [],
                    universe_type: 'custom',
                    universe_code: `custom:${selectedCustomPool.id}`,
                    universe_name: selectedCustomPool.name || '自定义股票池',
                    custom_pool_id: selectedCustomPool.id,
                    stock_items: normalizeStockItems(selectedCustomPool.stock_items || []),
                },
            };
        }
        return { payload: { universe: codeList.slice() } };
    }, [universeInputMode, linkedPoolAvailable, prefillInfo, selectedSystemUniverse, systemUniverseCode, selectedCustomPool, codeList, parseCodes]);

    const persistCurrentContext = useCallback(() => {
        const snapshot = buildContextSnapshot();
        if (!snapshot) return;
        if (strategyId) saveStrategyBacktestContext(strategyId, snapshot);
        pushBacktestPrefill({
            strategy_id: String(strategyId || ''),
            strategy_name: (strategies.find(item => String(item.id) === String(strategyId)) || {}).name || '',
            ...snapshot,
        });
    }, [buildContextSnapshot, strategyId, strategies]);

    const addStockToPool = (item) => {
        if (!item || !item.ts_code) return;
        if ((poolForm.stock_items || []).some(existing => existing.ts_code === item.ts_code)) {
            showToast('该股票已在自定义股票池中', 'error');
            return;
        }
        setPoolForm(prev => ({
            ...prev,
            stock_items: [...(prev.stock_items || []), { ts_code: item.ts_code, name: item.name || '' }],
        }));
        setStockKeyword('');
        setStockResults([]);
        setShowStockResults(false);
    };

    const removeStockFromPool = (tsCode) => {
        setPoolForm(prev => ({
            ...prev,
            stock_items: (prev.stock_items || []).filter(item => item.ts_code !== tsCode),
        }));
    };

    const editPool = (pool) => {
        setPoolForm({
            id: pool.id,
            name: pool.name || '',
            description: pool.description || '',
            stock_items: normalizeStockItems(pool.stock_items || []),
        });
        setCustomPoolId(String(pool.id));
        setUniverseInputMode('custom');
        setShowPoolManager(true);
    };

    const resetPoolForm = () => {
        setPoolForm({ id: null, name: '', description: '', stock_items: [] });
        setStockKeyword('');
        setStockResults([]);
        setShowStockResults(false);
    };

    const savePool = async () => {
        if (!poolForm.name.trim()) {
            showToast('请输入股票池名称', 'error');
            return;
        }
        if ((poolForm.stock_items || []).length === 0) {
            showToast('请至少添加一只股票', 'error');
            return;
        }
        setPoolSaving(true);
        try {
            const payload = {
                name: poolForm.name.trim(),
                description: poolForm.description || '',
                stock_items: normalizeStockItems(poolForm.stock_items || []),
            };
            const res = poolForm.id
                ? await api.put('/api/factor_board/custom_pools/' + poolForm.id, payload)
                : await api.post('/api/factor_board/custom_pools', payload);
            showToast(poolForm.id ? '自定义股票池已更新' : '自定义股票池已保存', 'success');
            await loadUniverseOptions();
            setCustomPoolId(String(res.id));
            setUniverseInputMode('custom');
            setPoolForm({
                id: res.id,
                name: res.name || '',
                description: res.description || '',
                stock_items: normalizeStockItems(res.stock_items || []),
            });
        } catch (e) {
            showToast((e && e.detail) || '保存自定义股票池失败', 'error');
        }
        setPoolSaving(false);
    };

    const deletePool = async () => {
        if (!poolForm.id) return;
        setPoolDeleting(true);
        try {
            await api.remove('/api/factor_board/custom_pools/' + poolForm.id);
            showToast('自定义股票池已删除', 'success');
            if (String(customPoolId) === String(poolForm.id)) setCustomPoolId('');
            resetPoolForm();
            await loadUniverseOptions();
        } catch (e) {
            showToast((e && e.detail) || '删除自定义股票池失败', 'error');
        }
        setPoolDeleting(false);
    };

    const runBacktest = async () => {
        if (!strategyId) { showToast('请选择策略', 'error'); return; }
        if (universeInputMode === 'codes' && codeList.length === 0) { showToast('请先添加至少一只股票', 'error'); return; }
        if (universeInputMode === 'custom' && !selectedCustomPool) { showToast('请选择自定义股票池', 'error'); return; }
        persistCurrentContext();
        setRunning(true);
        setResult(null);
        setLogs([]);
        try {
            const universePayload = buildUniversePayload();
            const res = await api.post('/api/backtest/run', {
                strategy_id: parseInt(strategyId),
                ...universePayload.payload,
                start_date: startDate,
                end_date: endDate,
                initial_cash: cash,
                benchmark,
                max_position_pct: maxPosPct,
                max_drawdown_limit: maxDdLimit,
            });
            setResult(res);
            setLogs(res.logs || []);
            setResultTab('chart');
            if (res && res.id) pushHistoryFocus({ result_id: res.id, tab: 'chart' });
            showToast('回测完成', 'success');
        } catch (e) {
            showToast((e && e.detail) || e.message || '回测失败', 'error');
        }
        setRunning(false);
    };

    const openResultInHistory = () => {
        if (!result || !result.id) {
            showToast('请先运行回测并生成结果', 'error');
            return;
        }
        pushHistoryFocus({ result_id: result.id, tab: resultTab || 'risk' });
        if (openHistoryWithResult) openHistoryWithResult();
    };

    const runOptimize = async () => {
        if (!strategyId) { showToast('请选择策略', 'error'); return; }
        let grid;
        try { grid = JSON.parse(paramGrid); } catch { showToast('参数网格格式错误，请输入有效 JSON', 'error'); return; }
        if (universeInputMode === 'codes' && codeList.length === 0) { showToast('请先添加至少一只股票', 'error'); return; }
        persistCurrentContext();
        setOptimizing(true);
        setOptimizeResults(null);
        try {
            const universePayload = buildUniversePayload();
            const res = await api.post('/api/backtest/optimize', {
                strategy_id: parseInt(strategyId),
                ...universePayload.payload,
                start_date: startDate,
                end_date: endDate,
                initial_cash: cash,
                benchmark,
                param_grid: grid,
            });
            setOptimizeResults(res.results);
            showToast(`优化完成，共 ${res.results.length} 组参数`, 'success');
        } catch (e) {
            showToast((e && e.detail) || e.message || '优化失败', 'error');
        }
        setOptimizing(false);
    };

    const runWalkForward = async () => {
        if (!strategyId) { showToast('请选择策略', 'error'); return; }
        let grid;
        try { grid = JSON.parse(paramGrid); } catch { showToast('参数网格格式错误', 'error'); return; }
        if (universeInputMode === 'codes' && codeList.length === 0) { showToast('请先添加至少一只股票', 'error'); return; }
        persistCurrentContext();
        setWfRunning(true);
        setWfResult(null);
        try {
            const universePayload = buildUniversePayload();
            const res = await api.post('/api/backtest/walk_forward', {
                strategy_id: parseInt(strategyId),
                ...universePayload.payload,
                start_date: startDate,
                end_date: endDate,
                param_grid: grid,
                benchmark,
            });
            setWfResult(res);
            showToast('Walk-Forward 验证完成', 'success');
        } catch (e) {
            showToast((e && e.detail) || e.message || 'Walk-Forward 验证失败', 'error');
        }
        setWfRunning(false);
    };

    const unsupportedLabels = (universeOptions.unsupported_universes || []).map(item => `${item.name}：${item.reason}`);

    return (
        <div className="fade-in space-y">
            {prefillInfo ? (
                <div className="card" style={{padding:'12px 16px'}}>
                    <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',flexWrap:'wrap'}}>
                        <div>
                            <div style={{fontSize:12,color:'var(--text-500)',textTransform:'uppercase',letterSpacing:'0.06em'}}>策略联动回测</div>
                            <div style={{fontSize:15,fontWeight:700,color:'var(--text-100)',marginTop:4}}>{prefillInfo.strategy_name || `策略 #${prefillInfo.strategy_id}`}</div>
                            <div style={{fontSize:12,color:'var(--text-400)',marginTop:4}}>已带入上一次或外部联动的回测上下文；你可以继续使用“联动股票池”，也可以切换到系统池、自定义池或代码列表。</div>
                        </div>
                        <button type="button" className="btn btn-secondary" onClick={(e) => { e.preventDefault(); setPrefillInfo(null); setUniverseInputMode('codes'); setDateInputMode('manual'); setBenchmarkInputMode('manual'); clearBacktestPrefill(); }}>关闭提示</button>
                    </div>
                </div>
            ) : null}

            <BacktestForm
                strategies={strategies}
                strategyId={strategyId}
                setStrategyId={setStrategyId}
                running={running}
                onRun={runBacktest}
                startDate={startDate}
                setStartDate={setStartDate}
                endDate={endDate}
                setEndDate={setEndDate}
                cash={cash}
                setCash={setCash}
                benchmark={benchmark}
                setBenchmark={setBenchmark}
                maxPosPct={maxPosPct}
                setMaxPosPct={setMaxPosPct}
                maxDdLimit={maxDdLimit}
                setMaxDdLimit={setMaxDdLimit}
                prefillInfo={prefillInfo}
                linkedPoolAvailable={linkedPoolAvailable}
                universeInputMode={universeInputMode}
                setUniverseInputMode={setUniverseInputMode}
                dateInputMode={dateInputMode}
                setDateInputMode={setDateInputMode}
                benchmarkInputMode={benchmarkInputMode}
                setBenchmarkInputMode={setBenchmarkInputMode}
                restoreSourceDateRange={restoreSourceDateRange}
                restoreSourceBenchmark={restoreSourceBenchmark}
                universeOptions={universeOptions}
                systemUniverseCode={systemUniverseCode}
                setSystemUniverseCode={setSystemUniverseCode}
                customPoolId={customPoolId}
                setCustomPoolId={setCustomPoolId}
                selectedSystemUniverse={selectedSystemUniverse}
                selectedCustomPool={selectedCustomPool}
                codeList={codeList}
                codeDraft={codeDraft}
                setCodeDraft={setCodeDraft}
                addCodeDraft={addCodeDraft}
                removeCodeFromList={removeCodeFromList}
                unsupportedLabels={unsupportedLabels}
                openPoolManager={() => setShowPoolManager(true)}
                resetPoolForm={resetPoolForm}
                editPool={editPool}
            />

            <div className="card space-y">
                <div className="flex items-center justify-between">
                    <div className="card-title" style={{marginBottom:0}}>参数优化</div>
                    <button type="button" className="btn btn-secondary" onClick={(e) => { e.preventDefault(); setShowOptimizer(!showOptimizer); }}>
                        {showOptimizer ? '收起' : '展开'}
                    </button>
                </div>
                {showOptimizer && (
                    <div className="space-y">
                        <div className="backtest-pool-panel" style={{padding:'14px 16px'}}>
                            <div>
                                <div className="backtest-pool-title">当前优化上下文</div>
                                <div className="backtest-pool-copy">参数优化和 Walk-Forward 会继承当前页中的股票池、回测区间和基准设置。</div>
                            </div>
                            <div className="backtest-pool-meta" style={{justifyContent:'flex-end'}}>
                                <span className="backtest-badge">{universeInputMode === 'codes' ? '代码列表' : universeInputMode === 'system' ? '系统股票池' : universeInputMode === 'custom' ? '自定义股票池' : '联动股票池'}</span>
                                <span className="backtest-badge">{dateInputMode === 'source' ? '区间跟随来源' : '区间手动覆盖'}</span>
                                <span className="backtest-badge">{benchmarkInputMode === 'source' ? '基准跟随来源' : '基准手动覆盖'}</span>
                                {universeInputMode === 'codes' ? <span className="backtest-badge">{codeList.length}只股票</span> : null}
                            </div>
                        </div>
                        <div className="field">
                            <label className="label">参数网格（JSON 格式）</label>
                            <textarea className="input" rows={3} value={paramGrid} onChange={e => setParamGrid(e.target.value)} style={{fontFamily:'monospace',fontSize:13}} />
                        </div>
                        <div className="flex gap-sm">
                            <button type="button" className="btn btn-primary" onClick={(e) => { e.preventDefault(); runOptimize(); }} disabled={optimizing}>{optimizing ? <><span className="spinner"/> {'优化中...'}</> : '开始网格搜索'}</button>
                            <button type="button" className="btn btn-secondary" onClick={(e) => { e.preventDefault(); runWalkForward(); }} disabled={wfRunning}>{wfRunning ? <><span className="spinner"/> {'验证中...'}</> : 'Walk-Forward 验证'}</button>
                        </div>
                        {optimizeResults && optimizeResults.length > 0 && (
                            <div className="table-wrap">
                                <table>
                                    <thead><tr><th>排名</th><th>参数</th><th style={{textAlign:'right'}}>夏普比率</th><th style={{textAlign:'right'}}>总收益</th><th style={{textAlign:'right'}}>年化收益%</th><th style={{textAlign:'right'}}>最大回撤</th></tr></thead>
                                    <tbody>
                                        {optimizeResults.map((r, i) => (
                                            <tr key={i}>
                                                <td>{i + 1}</td>
                                                <td style={{fontFamily:'monospace',fontSize:12}}>{JSON.stringify(r.params)}</td>
                                                <td style={{textAlign:'right'}} className={r.sharpe_ratio >= 1 ? 'text-profit' : 'text-loss'}>{r.sharpe_ratio}</td>
                                                <td style={{textAlign:'right'}} className={r.total_return >= 0 ? 'text-profit' : 'text-loss'}>{r.total_return}</td>
                                                <td style={{textAlign:'right'}} className={r.annual_return >= 0 ? 'text-profit' : 'text-loss'}>{r.annual_return}</td>
                                                <td style={{textAlign:'right'}} className="text-loss">{r.max_drawdown}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        {wfResult && wfResult.summary && (
                            <div>
                                <div style={{fontSize:13,fontWeight:600,color:'var(--text-100)',marginBottom:8}}>Walk-Forward 验证结果</div>
                                <div className="grid-4" style={{gap:8,marginBottom:10}}>
                                    <div className="metric-card"><div className="metric-label">窗口数</div><div className="metric-value">{wfResult.summary.total_windows}</div></div>
                                    <div className="metric-card"><div className="metric-label">训练期夏普</div><div className="metric-value">{wfResult.summary.avg_train_sharpe}</div></div>
                                    <div className="metric-card"><div className="metric-label">样本外夏普</div><div className="metric-value" style={{color: wfResult.summary.avg_oos_sharpe >= 0 ? 'var(--profit)' : 'var(--loss)'}}>{wfResult.summary.avg_oos_sharpe}</div></div>
                                    <div className="metric-card"><div className="metric-label">过拟合比率</div><div className="metric-value" style={{color: wfResult.summary.overfit_ratio >= 0.5 ? 'var(--loss)' : 'var(--profit)'}}>{wfResult.summary.overfit_ratio}</div></div>
                                </div>
                                <div className="table-wrap">
                                    <table>
                                        <thead><tr><th>窗口</th><th>训练期</th><th>测试期</th><th>最优参数</th><th style={{textAlign:'right'}}>训练夏普</th><th style={{textAlign:'right'}}>测试夏普</th><th style={{textAlign:'right'}}>测试收益%</th></tr></thead>
                                        <tbody>
                                            {wfResult.windows.map((w, i) => (
                                                <tr key={i}>
                                                    <td>{w.window}</td>
                                                    <td className="text-xs">{w.train_period}</td>
                                                    <td className="text-xs">{w.test_period}</td>
                                                    <td style={{fontFamily:'monospace',fontSize:11}}>{JSON.stringify(w.best_params)}</td>
                                                    <td style={{textAlign:'right'}}>{w.train_sharpe}</td>
                                                    <td style={{textAlign:'right'}} className={w.test_sharpe >= 0 ? 'text-profit' : 'text-loss'}>{w.test_sharpe}</td>
                                                    <td style={{textAlign:'right'}} className={w.test_return >= 0 ? 'text-profit' : 'text-loss'}>{w.test_return}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>
                )}
            </div>

            {showPoolManager ? (
                <div className="factor-board-modal" onClick={() => setShowPoolManager(false)}>
                    <div className="factor-board-modal-card" onClick={e => e.stopPropagation()}>
                        <div className="factor-board-modal-head">
                            <div>
                                <div className="factor-board-modal-title">回测股票池管理</div>
                                <div className="factor-board-modal-copy">在回测页直接搜索股票、保存自定义股票池，并立即用于当前回测。</div>
                            </div>
                            <button className="btn btn-secondary" type="button" onClick={() => setShowPoolManager(false)}>关闭</button>
                        </div>
                        <div className="factor-board-modal-grid">
                            <div className="factor-board-modal-stack">
                                <div className="card" style={{padding:'18px'}}>
                                    <div className="flex items-center justify-between" style={{marginBottom:12}}>
                                        <div>
                                            <div className="card-title" style={{marginBottom:4}}>编辑股票池</div>
                                            <div className="factor-board-subtle">新建、修改、删除自定义股票池；保存后会同步到回测股票池列表。</div>
                                        </div>
                                        <div className="backtest-mode-row">
                                            <button className="btn btn-secondary" type="button" onClick={resetPoolForm}>新建</button>
                                            <button className="btn btn-primary" type="button" onClick={savePool} disabled={poolSaving}>{poolSaving ? '保存中...' : (poolForm.id ? '更新股票池' : '保存股票池')}</button>
                                            {poolForm.id ? <button className="btn btn-secondary" type="button" onClick={deletePool} disabled={poolDeleting}>{poolDeleting ? '删除中...' : '删除'}</button> : null}
                                        </div>
                                    </div>
                                    <div className="grid-2" style={{gap:12}}>
                                        <div className="field"><label className="label">股票池名称</label><input className="input" value={poolForm.name} placeholder="例如：消费龙头池" onChange={e => setPoolForm({ ...poolForm, name: e.target.value })} /></div>
                                        <div className="field"><label className="label">成分数量</label><div className="backtest-pool-panel" style={{padding:'10px 12px'}}><div className="backtest-side-value" style={{marginTop:0}}>{(poolForm.stock_items || []).length} 只股票</div></div></div>
                                    </div>
                                    <div className="field" style={{marginTop:12}}><label className="label">说明</label><textarea className="input" rows="2" value={poolForm.description} placeholder="记录该股票池的行业主题、因子偏好或选股逻辑" onChange={e => setPoolForm({ ...poolForm, description: e.target.value })}></textarea></div>
                                    <div className="field stock-search-wrap" style={{marginTop:12}}>
                                        <label className="label">搜索并添加股票</label>
                                        <input className="input" value={stockKeyword} placeholder="输入股票代码或名称，例如：600519 / 贵州茅台" onChange={e => setStockKeyword(e.target.value)} />
                                        {showStockResults ? (
                                            <div className="stock-search-dropdown">
                                                {stockResults.length === 0 ? <div className="stock-search-item" style={{justifyContent:'center',color:'var(--text-500)'}}>未找到匹配股票</div> : stockResults.map(item => (
                                                    <div key={item.ts_code} className="stock-search-item" onClick={() => addStockToPool(item)}>
                                                        <span>{item.name || item.ts_code}</span>
                                                        <span style={{color:'var(--text-500)'}}>{item.ts_code}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : null}
                                    </div>
                                    <div className="factor-board-list" style={{maxHeight:260, overflowY:'auto', marginTop:12}}>
                                        {(poolForm.stock_items || []).length === 0 ? <div className="factor-board-empty">当前股票池还没有股票，请先搜索并添加。</div> : (poolForm.stock_items || []).map((item, idx) => (
                                            <div key={item.ts_code + '-' + idx} className="factor-board-list-item">
                                                <div>
                                                    <div style={{fontWeight:600, color:'#f8fafc'}}>{item.name || item.ts_code}</div>
                                                    <div className="factor-board-subtle">{item.ts_code}</div>
                                                </div>
                                                <button className="btn-link" type="button" onClick={() => removeStockFromPool(item.ts_code)}>移除</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="factor-board-modal-stack">
                                <div className="card" style={{padding:'18px'}}>
                                    <div className="card-title" style={{marginBottom:4}}>已保存股票池</div>
                                    <div className="factor-board-subtle">点击“用于回测”可直接切换当前回测股票池。</div>
                                    <div className="factor-board-list" style={{maxHeight:420, overflowY:'auto', marginTop:14}}>
                                        {(universeOptions.custom_pools || []).length === 0 ? <div className="factor-board-empty">暂无已保存的自定义股票池。</div> : (universeOptions.custom_pools || []).map(pool => (
                                            <div key={pool.id} className="factor-board-list-item">
                                                <div>
                                                    <div style={{fontWeight:600, color:'#f8fafc'}}>{pool.name}</div>
                                                    <div className="factor-board-subtle">{pool.stock_count} 只股票 · {pool.description || '未填写说明'}</div>
                                                </div>
                                                <div className="factor-board-toolbar-right">
                                                    <button className="btn-link" type="button" onClick={() => { setCustomPoolId(String(pool.id)); setUniverseInputMode('custom'); setShowPoolManager(false); }}>用于回测</button>
                                                    <button className="btn-link" type="button" onClick={() => editPool(pool)}>编辑</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            ) : null}

            {result ? <div ref={resultRef}><BacktestResultView result={result} tab={resultTab} setTab={setResultTab} logs={logs} onOpenHistory={openResultInHistory} /></div> : null}
            <QualityPanel universe={universe} startDate={startDate} endDate={endDate} showToast={showToast} />
        </div>
    );
}

function BacktestForm({
    strategies, strategyId, setStrategyId, running, onRun,
    startDate, setStartDate, endDate, setEndDate, cash, setCash, benchmark, setBenchmark,
    maxPosPct, setMaxPosPct, maxDdLimit, setMaxDdLimit,
    prefillInfo, linkedPoolAvailable, universeInputMode, setUniverseInputMode,
    dateInputMode, setDateInputMode, benchmarkInputMode, setBenchmarkInputMode,
    restoreSourceDateRange, restoreSourceBenchmark,
    universeOptions, systemUniverseCode, setSystemUniverseCode, customPoolId, setCustomPoolId,
    selectedSystemUniverse, selectedCustomPool,
    codeList, codeDraft, setCodeDraft, addCodeDraft, removeCodeFromList, unsupportedLabels,
    openPoolManager, resetPoolForm, editPool
}) {
    const hasSourceDate = !!(prefillInfo && (prefillInfo.start_date || prefillInfo.end_date));
    const hasSourceBenchmark = !!(prefillInfo && prefillInfo.benchmark);
    const linkedSummary = linkedPoolAvailable
        ? [prefillInfo.universe_name || '', prefillInfo.universe_code || '', prefillInfo.stock_count ? `${prefillInfo.stock_count}只股票` : '', prefillInfo.start_date && prefillInfo.end_date ? `${prefillInfo.start_date} ~ ${prefillInfo.end_date}` : ''].filter(Boolean).join(' · ')
        : '';
    const currentPoolLabel = universeInputMode === 'linked'
        ? (prefillInfo && prefillInfo.universe_name) || '联动股票池'
        : universeInputMode === 'system'
            ? ((selectedSystemUniverse && selectedSystemUniverse.name) || '系统股票池')
            : universeInputMode === 'custom'
                ? ((selectedCustomPool && selectedCustomPool.name) || '未选择自定义股票池')
                : '代码列表';
    const poolHint = universeInputMode === 'linked'
        ? '将直接复用联动来源中的股票池描述'
        : universeInputMode === 'system'
            ? '将使用真实指数成分股作为股票池，后端按最新成分解析'
            : universeInputMode === 'custom'
                ? '将使用你保存的自定义股票池'
                : '将使用下方代码列表中的股票直接回测';
    const stateSummary = [
        universeInputMode === 'linked' ? '联动股票池' : universeInputMode === 'system' ? '系统股票池' : universeInputMode === 'custom' ? '自定义股票池' : '代码列表',
        dateInputMode === 'source' && hasSourceDate ? '区间跟随来源' : '区间手动覆盖',
        benchmarkInputMode === 'source' && hasSourceBenchmark ? '基准跟随来源' : '基准手动覆盖',
    ].join(' · ');

    return (
        <div className="card backtest-card space-y">
            <div className="backtest-hero">
                <div>
                    <div className="card-title" style={{marginBottom: 8}}>回测配置</div>
                    <div className="backtest-hero-copy">回测页现在支持独立选择系统股票池、自定义股票池和代码列表；点击运行前会先保存当前配置，避免页面异常刷新时丢失输入。</div>
                </div>
                <div className="backtest-mode-row">

/* ===== Backtest Result View ===== */
function buildBacktestInsightModel(result) {
    const metrics = result && result.metrics ? result.metrics : {};
    const trades = Array.isArray(result && result.trades) ? result.trades : [];
    const equityCurve = Array.isArray(result && result.equity_curve) ? result.equity_curve : [];
    const benchmarkCurve = Array.isArray(result && result.benchmark_curve) ? result.benchmark_curve : [];
    const strategyProfile = result && result.strategy_profile ? result.strategy_profile : {};

    const toNum = (value, fallback = 0) => {
        const num = Number(value);
        return Number.isFinite(num) ? num : fallback;
    };
    const toDate = (value) => {
        const text = String(value || '').replace(/-/g, '');
        if (!/^\d{8}$/.test(text)) return null;
        return new Date(Number(text.slice(0, 4)), Number(text.slice(4, 6)) - 1, Number(text.slice(6, 8)));
    };
    const diffDays = (startValue, endValue) => {
        const startDate = toDate(startValue);
        const endDate = toDate(endValue);
        if (!startDate || !endDate) return 0;
        return Math.max(Math.round((endDate - startDate) / 86400000), 0);
    };
    const formatPct = (value) => {
        if (value == null || !Number.isFinite(Number(value))) return '-';
        const num = Number(value);
        return `${num >= 0 ? '+' : ''}${num.toFixed(2)}%`;
    };
    const formatSigned = (value, digits = 2) => {
        if (value == null || !Number.isFinite(Number(value))) return '-';
        const num = Number(value);
        return `${num >= 0 ? '+' : ''}${num.toFixed(digits)}`;
    };
    const formatDays = (value) => {
        if (!Number.isFinite(Number(value))) return '-';
        return `${Number(value).toFixed(1)}天`;
    };

    const startDate = result && result.start_date ? result.start_date : (equityCurve[0] && equityCurve[0].date) || '';
    const endDate = result && result.end_date ? result.end_date : (equityCurve[equityCurve.length - 1] && equityCurve[equityCurve.length - 1].date) || '';
    const totalDays = diffDays(startDate, endDate) + 1;
    const totalMonths = Math.max(totalDays / 30, 1);
    const uniqueSymbols = Array.from(new Set(trades.map(item => item.ts_code).filter(Boolean)));
    const tradeDates = Array.from(new Set(trades.map(item => item.date).filter(Boolean))).sort();

    let avgTradeGap = null;
    if (tradeDates.length > 1) {
        let totalGap = 0;
        for (let idx = 1; idx < tradeDates.length; idx += 1) totalGap += diffDays(tradeDates[idx - 1], tradeDates[idx]);
        avgTradeGap = totalGap / (tradeDates.length - 1);
    }

    const buyCount = trades.filter(item => item.side === 'buy').length;
    const sellCount = trades.filter(item => item.side === 'sell').length;
    const monthlyTradeCount = trades.length / totalMonths;
    const benchmarkReturn = benchmarkCurve.length >= 2 ? (toNum(benchmarkCurve[benchmarkCurve.length - 1].value, 1) - 1) * 100 : null;
    const excessReturn = benchmarkReturn == null ? null : toNum(metrics.total_return) - benchmarkReturn;
    const returnDrawdownRatio = toNum(metrics.max_drawdown) < 0 ? toNum(metrics.total_return) / Math.abs(toNum(metrics.max_drawdown)) : null;

    const openLots = {};
    let closedTradeCount = 0;
    let winTrades = 0;
    let positivePnl = 0;
    let negativePnl = 0;
    let holdingDaysWeighted = 0;
    let holdingAmountWeighted = 0;
    const symbolClosedPnl = {};

    [...trades].sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))).forEach((trade) => {
        const code = String(trade.ts_code || '').trim();
        if (!code) return;
        openLots[code] = openLots[code] || [];
        const amount = Math.max(toNum(trade.amount), 0);
        const price = toNum(trade.price);
        if (trade.side === 'buy') {
            openLots[code].push({ amount, price, date: trade.date });
            return;
        }
        let remaining = amount;
        while (remaining > 0 && openLots[code].length > 0) {
            const lot = openLots[code][0];
            const matchedAmount = Math.min(remaining, lot.amount);
            const pnl = (price - toNum(lot.price)) * matchedAmount;
            const holdDays = diffDays(lot.date, trade.date);
            closedTradeCount += 1;
            if (pnl >= 0) {
                winTrades += 1;
                positivePnl += pnl;
            } else {
                negativePnl += pnl;
            }
            symbolClosedPnl[code] = (symbolClosedPnl[code] || 0) + pnl;
            holdingDaysWeighted += holdDays * matchedAmount;
            holdingAmountWeighted += matchedAmount;
            lot.amount -= matchedAmount;
            remaining -= matchedAmount;
            if (lot.amount <= 0) openLots[code].shift();
        }
    });

    const winRateClosed = closedTradeCount > 0 ? (winTrades / closedTradeCount) * 100 : null;
    const profitFactor = negativePnl < 0 ? positivePnl / Math.abs(negativePnl) : null;
    const avgHoldingDays = holdingAmountWeighted > 0 ? holdingDaysWeighted / holdingAmountWeighted : null;
    const symbolContribution = Object.entries(symbolClosedPnl).sort((a, b) => b[1] - a[1]);
    const bestSymbol = symbolContribution[0] || null;
    const worstSymbol = symbolContribution.length ? symbolContribution[symbolContribution.length - 1] : null;

    const diagnosticTags = [];
    if (excessReturn != null) diagnosticTags.push(excessReturn >= 0 ? `跑赢基准 ${formatPct(excessReturn)}` : `落后基准 ${formatPct(excessReturn)}`);
    if (toNum(metrics.sharpe_ratio) >= 1) diagnosticTags.push(`风险调整后表现较好（Sharpe ${formatSigned(metrics.sharpe_ratio)})`);
    else diagnosticTags.push(`风险收益效率一般（Sharpe ${formatSigned(metrics.sharpe_ratio)})`);
    if (avgHoldingDays != null) diagnosticTags.push(avgHoldingDays <= 5 ? '更接近短周期择时/轮动执行' : avgHoldingDays >= 20 ? '更接近中周期持有策略' : '持有周期位于中短周期区间');
    if (monthlyTradeCount >= 25) diagnosticTags.push('交易频率偏高，需重点关注冲击成本与滑点');
    else if (monthlyTradeCount <= 8) diagnosticTags.push('交易频率较低，执行压力相对较小');

    return {
        periodText: startDate && endDate ? `${startDate} ~ ${endDate}` : '-',
        totalDays,
        buyCount,
        sellCount,
        uniqueSymbolCount: uniqueSymbols.length,
        universeSize: strategyProfile.universe_size ?? result.resolved_universe_count ?? null,
        monthlyTradeCount,
        avgTradeGap,
        avgHoldingDays,
        closedTradeCount,
        winRateClosed,
        profitFactor,
        benchmarkReturn,
        excessReturn,
        returnDrawdownRatio,
        bestSymbol,
        worstSymbol,
        diagnosticTags,
        formatPct,
        formatSigned,
        formatDays,
    };
}
