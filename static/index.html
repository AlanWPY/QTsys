/* ===== Toast ===== */

/* ===== 鍥犲瓙宸ヤ綔娴侀〉闈?===== */
.wf-page { display: flex; flex-direction: column; gap: 0; overflow-y: auto; max-height: calc(100vh - 120px); }
.wf-toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bg-700); border-radius: 10px 10px 0 0; flex-wrap: wrap; }
.wf-toolbar .input { width: 160px; }
.wf-toolbar select.input { width: 120px; }
.wf-body { display: flex; height: 500px; min-height: 500px; border: 1px solid var(--border); border-top: none; overflow: hidden; }
.wf-palette { width: 200px; background: var(--bg-700); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
.wf-palette-cat { padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--text-400); cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
.wf-palette-cat:hover { background: var(--bg-600); }
.wf-palette-item { padding: 6px 12px 6px 20px; font-size: 12px; color: var(--text-300); cursor: grab; user-select: none; display: flex; align-items: center; gap: 6px; }
.wf-palette-item:hover { background: var(--bg-600); color: var(--text-100); }
.wf-palette-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.wf-canvas-wrap { flex: 1; position: relative; background: var(--bg-900); overflow: hidden; }
.wf-canvas { position: absolute; top: 0; left: 0; }
.wf-inspector { width: 220px; background: var(--bg-700); border-left: 1px solid var(--border); padding: 12px; overflow-y: auto; flex-shrink: 0; }
.wf-inspector-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text-100); }
.wf-expr-bar { background: var(--bg-700); border-top: 1px solid var(--border); padding: 8px 16px; font-family: monospace; font-size: 12px; color: var(--text-300); min-height: 32px; display: flex; align-items: center; gap: 8px; }
.wf-expr-bar.error { color: var(--loss); }
.wf-minimap { position: absolute; right: 8px; bottom: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-800); opacity: 0.8; }
.wf-backtest-panel { background: var(--bg-700); border-top: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 16px; }

/* ===== 椋庨櫓鍒嗘瀽 ===== */
.underwater-chart { background: var(--bg-600); border-radius: 8px; padding: 12px; }
.drawdown-table { max-height: 300px; overflow-y: auto; }
.risk-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.risk-card { background: var(--bg-600); border-radius: 8px; padding: 12px; text-align: center; }
.risk-card-label { font-size: 11px; color: var(--text-400); }
.risk-card-value { font-size: 20px; font-weight: 700; margin-top: 4px; }
.monthly-heatmap-wrap { overflow-x: auto; }
.monthly-heatmap canvas { border-radius: 8px; }
.histogram-wrap canvas { border-radius: 8px; }

/* ===== 褰掑洜鍒嗘瀽 ===== */
.pnl-bar { display: inline-block; height: 14px; border-radius: 3px; min-width: 2px; vertical-align: middle; }
.pnl-bar-profit { background: var(--profit); }
.pnl-bar-loss { background: var(--loss); }

/* ===== 缁勫悎鍒嗘瀽 ===== */
.portfolio-page { display: flex; flex-direction: column; gap: 16px; }
.portfolio-selector { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.portfolio-check { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; background: var(--bg-600); font-size: 12px; cursor: pointer; transition: all 0.15s; }
.portfolio-check.selected { background: var(--accent); color: white; }
.portfolio-check:hover { background: var(--bg-500); }
.portfolio-check.selected:hover { background: var(--accent-light); }
.corr-heatmap-wrap canvas { border-radius: 8px; }
.weight-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.weight-bar-fill { height: 20px; border-radius: 4px; background: var(--accent); transition: width 0.3s; }
.weight-bar-label { font-size: 12px; min-width: 80px; }
.weight-bar-value { font-size: 12px; color: var(--text-300); min-width: 50px; text-align: right; }

/* ===== 鏁版嵁璐ㄩ噺 ===== */
.quality-panel { background: var(--bg-700); border-radius: 12px; padding: 16px; }
.quality-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.quality-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.quality-badge-clean { background: #14532d; color: #4ade80; }
.quality-badge-warning { background: #713f12; color: #fbbf24; }
.quality-badge-error { background: #450a0a; color: #f87171; }
@media (max-width: 900px) { .risk-cards { grid-template-columns: repeat(2, 1fr); } .quality-summary { grid-template-columns: repeat(2, 1fr); } }
    
/* ===== 2026 Shell Refinement ===== */
body {
    background:
        radial-gradient(circle at top left, rgba(99, 102, 241, 0.20), transparent 30%),
        radial-gradient(circle at top right, rgba(16, 185, 129, 0.16), transparent 26%),
        linear-gradient(180deg, #07111f 0%, #0b1324 45%, #0a1020 100%);
    background-attachment: fixed;
}
body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0.08));
    opacity: 0.34;
}
body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 55%, rgba(2, 6, 23, 0.36) 100%);
}
#root, .app, .main, .header, .card, .metric-card {
    position: relative;
    z-index: 1;
}
.header {
    position: sticky;
    top: 0;
    z-index: 20;
    min-height: 72px;
    height: auto;
    padding: 14px 24px;
    gap: 16px;
    flex-wrap: wrap;
    background: rgba(7, 14, 28, 0.82);
    border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    box-shadow: 0 18px 40px rgba(2, 6, 23, 0.38);
    backdrop-filter: blur(18px);
}
.header-brand {
    gap: 14px;
}
.header-brand h1 {
    font-size: 24px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #eef2ff;
    text-shadow: 0 0 24px rgba(129, 140, 248, 0.22);
}
.header-brand span {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.72);
    border: 1px solid rgba(99, 102, 241, 0.16);
    color: #94a3b8;
}
.nav {
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px;
    border-radius: 18px;
    border: 1px solid rgba(148, 163, 184, 0.12);
    background: rgba(15, 23, 42, 0.68);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
}
.nav-btn {
    padding: 9px 15px;
    border-radius: 12px;
    border: 1px solid transparent;
    color: #94a3b8;
    font-weight: 600;
    letter-spacing: 0.01em;
}
.nav-btn:hover {
    color: #e2e8f0;
    background: rgba(30, 41, 59, 0.88);
    border-color: rgba(148, 163, 184, 0.12);
    transform: translateY(-1px);
}
.nav-btn.active {
    color: #ffffff;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.92), rgba(59, 130, 246, 0.88));
    border-color: rgba(165, 180, 252, 0.32);
    box-shadow: 0 10px 24px rgba(59, 130, 246, 0.22);
}
.main {
    max-width: 1440px;
    padding: 30px 24px 44px;
}
.card,
.metric-card {
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.78));
    border: 1px solid rgba(148, 163, 184, 0.12);
    box-shadow: 0 22px 44px rgba(2, 6, 23, 0.24);
}
.card:hover,
.metric-card:hover {
    border-color: rgba(99, 102, 241, 0.20);
    box-shadow: 0 26px 52px rgba(2, 6, 23, 0.30);
}
.card-title {
    letter-spacing: 0.01em;
}
.metric-card {
    overflow: hidden;
}
.metric-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, rgba(99, 102, 241, 0), rgba(99, 102, 241, 0.75), rgba(16, 185, 129, 0.75), rgba(16, 185, 129, 0));
    opacity: 0.92;
}
.metric-label {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 11px;
}
.metric-value {
    color: #f8fafc;
}
.input {
    background: rgba(15, 23, 42, 0.80);
    border-color: rgba(148, 163, 184, 0.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
}
.input:hover {
    border-color: rgba(148, 163, 184, 0.24);
}
.input:focus {
    border-color: rgba(99, 102, 241, 0.70);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.16);
}
.btn {
    min-height: 38px;
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 12px;
}
.btn-primary {
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    box-shadow: 0 12px 24px rgba(59, 130, 246, 0.20);
}
.btn-primary:hover {
    background: linear-gradient(135deg, #7477f7, #4f8ef8);
}
.btn-secondary {
    background: rgba(30, 41, 59, 0.78);
    color: #dbeafe;
}
.btn-secondary:hover {
    background: rgba(51, 65, 85, 0.88);
}
.btn-link {
    color: #93c5fd;
}
.btn-link:hover {
    color: #bfdbfe;
}
.label {
    color: #94a3b8;
    letter-spacing: 0.04em;
}
.table-wrap,
.table-container {
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.12);
    background: rgba(15, 23, 42, 0.72);
}
.trades-table-wrap {
    max-height: min(62vh, 720px);
    overflow-x: auto !important;
    overflow-y: auto !important;
}
.trades-table-wrap table {
    min-width: 760px;
}
.toast {
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 44px rgba(2, 6, 23, 0.35);
}
@media (max-width: 1100px) {
    .header {
        justify-content: center;
    }
    .nav {
        width: 100%;
        justify-content: center;
    }
    .main {
        padding-top: 24px;
    }
}
@media (max-width: 720px) {
    .header {
        padding: 12px 14px;
    }
    .main {
        padding: 18px 14px 28px;
    }
    .nav {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
    }
    .nav-btn {
        white-space: nowrap;
    }
    .grid-2, .grid-3, .grid-4, .grid-6 {
        grid-template-columns: 1fr;
    }
}


.factor-board-shell { display: flex; flex-direction: column; gap: 20px; }
.factor-board-hero { display: grid; grid-template-columns: 1.45fr 0.95fr; gap: 18px; align-items: stretch; }
.factor-board-hero > :nth-child(3) { grid-column: 1 / -1; }
.factor-board-overview { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.factor-board-overview-card {
    position: relative;
    overflow: hidden;
    padding: 18px 18px 16px;
    border-radius: 18px;
    border: 1px solid rgba(148, 163, 184, 0.12);
    background: linear-gradient(180deg, rgba(15,23,42,0.92), rgba(15,23,42,0.74));
    box-shadow: 0 18px 38px rgba(2, 6, 23, 0.22);
}
.factor-board-overview-card::after {
    content: '';
    position: absolute;
    inset: auto -10% -30% auto;
    width: 120px;
    height: 120px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(59,130,246,0.18), transparent 70%);
    pointer-events: none;
}
.factor-board-overview-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.factor-board-overview-value { color: #f8fafc; font-size: 24px; font-weight: 800; line-height: 1.15; }
.factor-board-overview-value.small { font-size: 18px; }
.factor-board-overview-meta { color: #94a3b8; font-size: 12px; margin-top: 8px; line-height: 1.6; }
.factor-board-workbench { display: grid; grid-template-columns: 1.08fr 0.92fr; gap: 18px; align-items: start; }
.factor-board-workbench > .factor-board-panel { min-width: 0; }
.factor-board-quickgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.factor-board-mini-card {
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid rgba(148, 163, 184, 0.10);
    background: linear-gradient(180deg, rgba(2, 6, 23, 0.46), rgba(15, 23, 42, 0.72));
}
.factor-board-mini-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.factor-board-mini-value { color: #f8fafc; font-size: 17px; font-weight: 700; line-height: 1.35; }
.factor-board-mini-value.small { font-size: 14px; }
.factor-board-mini-meta { color: #94a3b8; font-size: 12px; margin-top: 6px; line-height: 1.6; }
.factor-board-glass {
    position: relative;
    overflow: hidden;
    padding: 24px;
    border-radius: 20px;
    border: 1px solid rgba(148, 163, 184, 0.12);
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.78));
    box-shadow: 0 28px 60px rgba(2, 6, 23, 0.28);
}
.factor-board-glass::before {
    content: '';
    position: absolute;
    inset: -30% auto auto -10%;
    width: 220px;
    height: 220px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.26), transparent 70%);
    pointer-events: none;
}
.factor-board-title { font-size: 28px; font-weight: 700; color: #f8fafc; letter-spacing: 0.02em; margin-bottom: 10px; }
.factor-board-copy { color: #94a3b8; line-height: 1.7; max-width: 720px; }
.factor-board-pillrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.factor-board-pill {
    display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 999px;
    border: 1px solid rgba(99, 102, 241, 0.18); background: rgba(15, 23, 42, 0.72); color: #cbd5e1; font-size: 12px;
}
.factor-board-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.factor-board-panel { display: flex; flex-direction: column; gap: 14px; }
.factor-board-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.factor-board-toolbar-left, .factor-board-toolbar-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.factor-board-kv { display: flex; flex-direction: column; gap: 4px; min-width: 128px; }
.factor-board-kv-label { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
.factor-board-kv-value { color: #f8fafc; font-size: 15px; font-weight: 600; }
.factor-board-status {
    display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px; border-radius: 14px;
    border: 1px solid rgba(148, 163, 184, 0.12); background: rgba(15, 23, 42, 0.68); color: #cbd5e1;
}
.factor-board-dot { width: 10px; height: 10px; border-radius: 999px; background: #64748b; box-shadow: 0 0 0 6px rgba(100, 116, 139, 0.16); }
.factor-board-dot.running { background: #22c55e; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.18); }
.factor-board-progress { height: 8px; border-radius: 999px; background: rgba(30, 41, 59, 0.92); overflow: hidden; }
.factor-board-progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6366f1, #22c55e); }
.factor-board-stage-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.factor-board-stage-card {
    padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(148,163,184,0.10);
    background: linear-gradient(180deg, rgba(2,6,23,0.34), rgba(15,23,42,0.72));
}
.factor-board-stage-card.active { border-color: rgba(96,165,250,0.28); box-shadow: 0 18px 32px rgba(37,99,235,0.12); }
.factor-board-stage-card.done { border-color: rgba(34,197,94,0.24); }
.factor-board-stage-title { color: #e2e8f0; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.factor-board-stage-meta { color: #94a3b8; font-size: 12px; line-height: 1.6; }
.factor-board-stage-value { color: #f8fafc; font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.factor-board-process-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 14px; }
.factor-board-process-card {
    min-height: 0; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(148,163,184,0.10);
    background: linear-gradient(180deg, rgba(2,6,23,0.30), rgba(15,23,42,0.70));
}
.factor-board-process-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.factor-board-log-panel {
    max-height: 240px; overflow: auto; padding-right: 4px;
    display: flex; flex-direction: column; gap: 8px;
}
.factor-board-log-line {
    padding: 10px 12px; border-radius: 12px; background: rgba(15,23,42,0.78);
    border: 1px solid rgba(148,163,184,0.08); color: #cbd5e1; font-size: 12px; line-height: 1.55;
    font-family: Consolas, Monaco, monospace;
}
.factor-board-chip-list { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.factor-board-results-wrap { overflow: auto; max-height: min(78vh, 1200px); border-radius: 18px; border: 1px solid rgba(148, 163, 184, 0.10); background: rgba(2, 6, 23, 0.26); }
.factor-board-table { width: 100%; min-width: 1080px; border-collapse: separate; border-spacing: 0; }
.factor-board-table th, .factor-board-table td { padding: 12px 14px; border-bottom: 1px solid rgba(148, 163, 184, 0.08); text-align: left; }

.factor-board-table thead th:first-child { z-index: 4; }

.factor-board-row-positive td:first-child { box-shadow: inset 3px 0 0 rgba(34, 197, 94, 0.72); }
.factor-board-row-negative td:first-child { box-shadow: inset 3px 0 0 rgba(239, 68, 68, 0.72); }
.factor-board-link { color: #c7d2fe; cursor: pointer; font-weight: 700; }
.factor-board-link:hover { color: #eef2ff; text-decoration: underline; }
.factor-board-fav-btn {
    width: 30px; height: 30px; border: 1px solid rgba(148,163,184,0.12); border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; background: rgba(15,23,42,0.72); color: #94a3b8; cursor: pointer;
    transition: all 0.18s ease; flex: 0 0 auto;
}
.factor-board-fav-btn:hover { color: #fde68a; border-color: rgba(250,204,21,0.26); transform: translateY(-1px); }
.factor-board-fav-btn.active { color: #fbbf24; background: rgba(120,53,15,0.28); border-color: rgba(250,204,21,0.30); box-shadow: 0 10px 24px rgba(120,53,15,0.18); }
.factor-board-filterbar { display: flex; flex-wrap: wrap; gap: 8px; }
.factor-board-filterchip {
    min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(148,163,184,0.12);
    background: rgba(15,23,42,0.78); color: #cbd5e1; cursor: pointer; transition: all .18s ease;
}
.factor-board-filterchip:hover { border-color: rgba(96,165,250,0.24); color: #eff6ff; }
.factor-board-filterchip.active { background: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(99,102,241,0.18)); color: #dbeafe; border-color: rgba(96,165,250,0.34); }
.factor-board-badge { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 10px; border-radius: 999px; font-weight: 700; font-size: 12px; letter-spacing: 0.02em; border: 1px solid transparent; }
.factor-board-badge.positive { color: #bbf7d0; background: rgba(20, 83, 45, 0.42); border-color: rgba(34, 197, 94, 0.24); }
.factor-board-badge.negative { color: #fecaca; background: rgba(127, 29, 29, 0.40); border-color: rgba(239, 68, 68, 0.24); }
.factor-board-factor-cell { display: flex; align-items: center; gap: 10px; }
.factor-board-factor-meta { display: flex; flex-direction: column; gap: 4px; }
.factor-board-row-action { text-align: right; }

function downloadTextFile(filename, content, mimeType = 'text/plain;charset=utf-8') {
    const blob = new Blob(['\uFEFF' + String(content || '')], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);
    URL.revokeObjectURL(url);
}

function repairMojibakeText(value) {
    if (typeof value !== 'string' || !value) return value;
    const score = (text) => {
        const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
        const weird = (text.match(/[脙脗脜脝脟脨脩脴脵脷脹脺脻脼脽脿-谩芒茫盲氓忙莽猫-茅锚毛矛-茂冒帽貌-枚酶-眉媒镁每]/g) || []).length;
        const replacement = (text.match(/锟?g) || []).length;
        const question = (text.match(/\?/g) || []).length;
        return cjk * 3 - weird * 2 - replacement * 4 - question;
    };
    let best = value;
    let bestScore = score(value);
    try {
        const bytes = Uint8Array.from([...value].map(ch => ch.charCodeAt(0)));
        const decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        const decodedScore = score(decoded);
        if (decodedScore > bestScore) {
            best = decoded;
            bestScore = decodedScore;
        }
    } catch (_) {}
    return best;
}

function compactDate(value) {
    return String(value || '').replace(/-/g, '').trim().slice(0, 8);
}
function todayCompactDate() {
    const now = new Date();
    return `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
}
function shiftCompactDate(value, offsetDays) {
    const text = compactDate(value);
    if (!/^\d{8}$/.test(text)) return '';
    const year = parseInt(text.slice(0, 4), 10);
    const month = parseInt(text.slice(4, 6), 10);
    const day = parseInt(text.slice(6, 8), 10);
    const current = new Date(year, month - 1, day);
    current.setDate(current.getDate() + offsetDays);
    return `${current.getFullYear()}${String(current.getMonth() + 1).padStart(2, '0')}${String(current.getDate()).padStart(2, '0')}`;
}
function resolveAnalysisWindow(startDate, endDate, backtestDays) {
    const safeEnd = compactDate(endDate) || todayCompactDate();
    const safeStart = compactDate(startDate);
    if (safeStart && (!safeEnd || safeStart <= safeEnd)) {
        return { start_date: safeStart, end_date: safeEnd };
    }
    const days = Math.max(parseInt(backtestDays, 10) || 365, 1);
    return { start_date: shiftCompactDate(safeEnd, -(days + 40)), end_date: safeEnd };
}
function normalizeStockItems(stockItems) {
    const seen = new Set();
    return (Array.isArray(stockItems) ? stockItems : [])
        .map(item => ({ ts_code: String((item && (item.ts_code || item.code)) || '').trim().toUpperCase(), name: String((item && item.name) || '').trim() }))
        .filter(item => {
            if (!item.ts_code || seen.has(item.ts_code)) return false;
            seen.add(item.ts_code);
            return true;
        });
}
function normalizeBacktestContext(context) {
    if (!context || typeof context !== 'object') return null;
    const stockItems = normalizeStockItems(context.stock_items);
    const stockCodes = stockItems.map(item => item.ts_code);
    const window = resolveAnalysisWindow(context.start_date, context.end_date, context.backtest_days);
    return {
        ...context,
        stock_items: stockItems,
        stock_codes: stockCodes,
        stock_count: stockCodes.length,
        benchmark: context.benchmark || context.benchmark_code || '000300.SH',
        start_date: window.start_date,
        end_date: window.end_date,
        universe: stockCodes.join(','),
    };
}

function CodeEditor({ value, onChange }) {
    const ref = useRef(null);
    const cmRef = useRef(null);
    useEffect(() => {
        if (ref.current && !cmRef.current) {
            cmRef.current = CodeMirror(ref.current, {
                value: value || '', mode: 'python', theme: 'dracula',
                lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
                extraKeys: { 'Tab': (cm) => cm.replaceSelection('    ', 'end') },
            });
            cmRef.current.on('change', (cm) => onChange(cm.getValue()));
        }
    }, []);
    useEffect(() => {
        if (cmRef.current && value !== cmRef.current.getValue()) cmRef.current.setValue(value || '');
    }, [value]);
    return <div ref={ref} />;
}

            if (selected) {
                await api.put('/api/strategies/' + selected.id, { name, description: desc, code });

                showToast('绛栫暐宸叉洿鏂?, 'success');
                await load(selected.id);
            } else {
                const created = await api.post('/api/strategies', { name, description: desc, code });
                if (created && created.id) bindStrategyBacktestContext(created.id);
                showToast('绛栫暐宸插垱寤?, 'success');
                await load(created.id);
                if (created && created.id) {
                    const detail = await api.get('/api/strategies/' + created.id);

        if (!factor || !factor.name) return;

        const safeName = String(factor.name).replace(/'/g, "\\'");
        const snippet = mode === 'history'
            ? `\n# 鍥犲瓙鍘嗗彶锛?{factor.name}\nconst_${varPrefix}_hist = context.get_factor_history('${safeName}', ts_code, 20)\nif len(const_${varPrefix}_hist) < 5:\n    continue\n`
            : `\n# 鍥犲瓙褰撳墠鍊硷細${factor.name}\nconst_${varPrefix} = context.get_factor('${safeName}', ts_code)\n`;
        setCode(prev => `${prev || ''}${snippet}`);

    };

        const userMessage = { role: 'user', content: finalPrompt };
        const nextMessages = [...aiMessages.map(item => ({ role: item.role, content: item.content })), userMessage];

        setAiPrompt('');
        setAiLoading(true);

            const res = await api.post('/api/strategies/ai/generate', {
                messages: nextMessages,
                current_strategy: { name, description: desc, code },
                include_market_context: includeMarketContext,
                save: saveDirect,
            });
            if (!res || !res.strategy || !res.strategy.code || !String(res.strategy.code).trim()) {

            }
            const assistantMessage = {
                role: 'assistant',
                content: res.assistant_reply || 'AI 宸茬敓鎴愮瓥鐣ヨ崏绋裤€?,
                strategy: res.strategy || null,
                saved_strategy: res.saved_strategy || null,

            setAiMessages(prev => [...prev, assistantMessage]);
            if (res.context_summary) setAiContext(res.context_summary);
            if (res.strategy) {

                showToast('AI 宸茬敓鎴愮瓥鐣ヨ崏绋?, 'success');
            }
        } catch (e) {
            setAiPrompt(originalPrompt);
            setAiMessages(prev => {
                const next = [...prev];
                const last = next[next.length - 1];
                if (last && last.role === 'user' && last.content === originalPrompt) {

                    saved_strategy: null,
                });
                return next;

            ) : null}
        </div>
    );
}
/* ===== Backtest Page ===== */
function BacktestPage({ showToast, openHistoryWithResult }) {
    const [strategies, setStrategies] = useState([]);
    const [strategyId, setStrategyId] = useState('');
    const [startDate, setStartDate] = useState('20230101');
    const [endDate, setEndDate] = useState('20231231');

    const [resultTab, setResultTab] = useState('chart');
    const [logs, setLogs] = useState([]);

    const [paramGrid, setParamGrid] = useState('{"short_period": [3, 5, 10], "long_period": [15, 20, 30]}');

    const [wfResult, setWfResult] = useState(null);
    const [prefillInfo, setPrefillInfo] = useState(null);
    const [universeInputMode, setUniverseInputMode] = useState('codes');
    const [dateInputMode, setDateInputMode] = useState('manual');
    const [benchmarkInputMode, setBenchmarkInputMode] = useState('manual');
    const [universeOptions, setUniverseOptions] = useState({ system_universes: [], custom_pools: [], unsupported_universes: [] });
    const [systemUniverseCode, setSystemUniverseCode] = useState('000300.SH');
    const [customPoolId, setCustomPoolId] = useState('');
    const [codeList, setCodeList] = useState(['000001.SZ']);
    const [codeDraft, setCodeDraft] = useState('');
    const [showPoolManager, setShowPoolManager] = useState(false);
    const [poolForm, setPoolForm] = useState({ id: null, name: '', description: '', stock_items: [] });
    const [stockKeyword, setStockKeyword] = useState('');
    const [stockResults, setStockResults] = useState([]);
    const [showStockResults, setShowStockResults] = useState(false);
    const [poolSaving, setPoolSaving] = useState(false);
    const [poolDeleting, setPoolDeleting] = useState(false);
    const resultRef = useRef(null);
    const lastAppliedSavedContextRef = useRef('');

    const selectedSystemUniverse = (universeOptions.system_universes || []).find(item => item.code === systemUniverseCode) || null;
    const selectedCustomPool = (universeOptions.custom_pools || []).find(item => String(item.id) === String(customPoolId)) || null;
    const linkedPoolAvailable = !!(prefillInfo && prefillInfo.universe_type);
    const universe = codeList.join(',');

    const parseCodes = useCallback((text) => {
        const seen = new Set();
        return String(text || '')
            .split(/[\s,锛?锛沒+/)
            .map(item => item.trim().toUpperCase())
            .filter(item => {
                if (!item || seen.has(item)) return false;
                seen.add(item);
                return true;
            });
    }, []);

    const loadUniverseOptions = useCallback(async () => {
        try {
            const res = await api.get('/api/backtest/universe_options');
            setUniverseOptions(res || { system_universes: [], custom_pools: [], unsupported_universes: [] });
        } catch (_) {
            try {
                const res = await api.get('/api/factor_board/universe_options');
                setUniverseOptions({ ...(res || { system_universes: [], custom_pools: [] }), unsupported_universes: [] });
            } catch (_) {
                setUniverseOptions({ system_universes: [], custom_pools: [], unsupported_universes: [] });
            }
        }
    }, []);

    useEffect(() => {
        api.get('/api/strategies').then(s => {
            setStrategies(s);
            if (s.length > 0) setStrategyId(String(s[0].id));
        }).catch(() => {});
        loadUniverseOptions();
    }, [loadUniverseOptions]);

    useEffect(() => {
        if (!stockKeyword || stockKeyword.trim().length < 1) {
            setStockResults([]);
            setShowStockResults(false);
            return;
        }
        const timer = setTimeout(async () => {
            try {
                const res = await api.get('/api/factor_board/stock_search?q=' + encodeURIComponent(stockKeyword.trim()));
                setStockResults(Array.isArray(res) ? res : []);
                setShowStockResults(true);
            } catch (_) {
                setStockResults([]);
                setShowStockResults(false);
            }
        }, 250);
        return () => clearTimeout(timer);
    }, [stockKeyword]);

    const applyBacktestContext = useCallback((context, options = {}) => {
        const normalized = normalizeBacktestContext(context);
        if (!normalized) return;
        const asPrefill = !!options.asPrefill;
        if (normalized.benchmark) setBenchmark(normalized.benchmark);
        if (normalized.start_date) setStartDate(normalized.start_date);
        if (normalized.end_date) setEndDate(normalized.end_date);
        if (normalized.stock_codes && normalized.stock_codes.length) setCodeList(normalized.stock_codes);
        if (normalized.universe_type === 'system') {
            setSystemUniverseCode(normalized.universe_code || '000300.SH');
            setUniverseInputMode(asPrefill ? 'linked' : 'system');
        } else if (normalized.universe_type === 'custom') {
            setCustomPoolId(normalized.custom_pool_id ? String(normalized.custom_pool_id) : '');
            setUniverseInputMode(asPrefill ? 'linked' : 'custom');
        } else {
            setUniverseInputMode('codes');
        }
        setDateInputMode(normalized.start_date || normalized.end_date ? 'source' : 'manual');
        setBenchmarkInputMode(normalized.benchmark ? 'source' : 'manual');
        setPrefillInfo(asPrefill ? normalized : null);
    }, []);

    const applyBacktestPrefill = useCallback((strategyList) => {
        const prefill = readBacktestPrefill();
        if (!prefill || !prefill.strategy_id) return;
        const list = strategyList || strategies;
        const exists = (list || []).some(item => String(item.id) === String(prefill.strategy_id));
        if (!exists) return;
        setStrategyId(String(prefill.strategy_id));
        applyBacktestContext(prefill, { asPrefill: true });
    }, [strategies, applyBacktestContext]);

    useEffect(() => {
        applyBacktestPrefill(strategies);
    }, [strategies, applyBacktestPrefill]);

    useEffect(() => {
        const handler = () => applyBacktestPrefill();
        window.addEventListener('qtsys:backtest-prefill', handler);
        return () => window.removeEventListener('qtsys:backtest-prefill', handler);
    }, [applyBacktestPrefill]);

    useEffect(() => {
        if (!strategyId || prefillInfo) return;
        const saved = normalizeBacktestContext(readStrategyBacktestContext(strategyId));
        if (!saved) return;
        const nextMarker = `${strategyId}:${saved.updated_at || ''}`;
        if (lastAppliedSavedContextRef.current === nextMarker) return;
        applyBacktestContext(saved, { asPrefill: false });
        lastAppliedSavedContextRef.current = nextMarker;
    }, [strategyId, prefillInfo, applyBacktestContext]);

    useEffect(() => {
        if (!result || !resultRef.current) return;
        setTimeout(() => {
            try { resultRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (_) {}
        }, 80);
    }, [result]);

    useEffect(() => {
        if (universeInputMode !== 'system') return;
        if (benchmarkInputMode === 'manual') return;
        if (selectedSystemUniverse && selectedSystemUniverse.benchmark_code) {
            setBenchmark(selectedSystemUniverse.benchmark_code);
        }
    }, [universeInputMode, selectedSystemUniverse, benchmarkInputMode]);

    const addCodesToList = useCallback((text) => {
        const incoming = parseCodes(text);
        if (!incoming.length) return false;
        setCodeList(prev => {
            const merged = [...prev];
            incoming.forEach(code => {
                if (!merged.includes(code)) merged.push(code);
            });
            return merged;
        });
        return true;
    }, [parseCodes]);

    const addCodeDraft = useCallback((e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        if (addCodesToList(codeDraft)) setCodeDraft('');
    }, [codeDraft, addCodesToList]);

    const removeCodeFromList = useCallback((code) => {
        setCodeList(prev => prev.filter(item => item !== code));
    }, []);

    const restoreSourceDateRange = () => {
        if (prefillInfo && prefillInfo.start_date) setStartDate(prefillInfo.start_date);
        if (prefillInfo && prefillInfo.end_date) setEndDate(prefillInfo.end_date);
        setDateInputMode(prefillInfo && (prefillInfo.start_date || prefillInfo.end_date) ? 'source' : 'manual');
    };

    const restoreSourceBenchmark = () => {
        if (prefillInfo && prefillInfo.benchmark) setBenchmark(prefillInfo.benchmark);
        setBenchmarkInputMode(prefillInfo && prefillInfo.benchmark ? 'source' : 'manual');
    };

    const buildContextSnapshot = useCallback(() => {
        const base = {
            source: 'backtest',
            source_label: '鍥炴祴閰嶇疆',
            benchmark,
            start_date: startDate,
            end_date: endDate,
        };
        if (universeInputMode === 'linked' && linkedPoolAvailable) {
            return normalizeBacktestContext({ ...prefillInfo, ...base, strategy_id: strategyId, strategy_name: prefillInfo && prefillInfo.strategy_name ? prefillInfo.strategy_name : '' });
        }
        if (universeInputMode === 'system') {
            return normalizeBacktestContext({
                ...base,
                universe_type: 'system',
                universe_code: (selectedSystemUniverse && selectedSystemUniverse.code) || systemUniverseCode,
                universe_name: (selectedSystemUniverse && selectedSystemUniverse.name) || systemUniverseCode,
                benchmark: benchmarkInputMode === 'manual' ? benchmark : ((selectedSystemUniverse && selectedSystemUniverse.benchmark_code) || benchmark),
                stock_items: [],
            });
        }
        if (universeInputMode === 'custom') {
            return normalizeBacktestContext({
                ...base,
                universe_type: 'custom',
                custom_pool_id: selectedCustomPool ? selectedCustomPool.id : null,
                universe_code: selectedCustomPool ? `custom:${selectedCustomPool.id}` : 'custom',
                universe_name: (selectedCustomPool && selectedCustomPool.name) || '鑷畾涔夎偂绁ㄦ睜',
                stock_items: normalizeStockItems(selectedCustomPool && selectedCustomPool.stock_items ? selectedCustomPool.stock_items : []),
            });
        }
        return normalizeBacktestContext({
            ...base,
            universe_type: '',
            universe_name: '浠ｇ爜鍒楄〃',
            stock_items: codeList.map(code => ({ ts_code: code, name: '' })),
        });
    }, [benchmark, startDate, endDate, universeInputMode, linkedPoolAvailable, prefillInfo, strategyId, selectedSystemUniverse, systemUniverseCode, benchmarkInputMode, selectedCustomPool, codeList]);

    const buildUniversePayload = useCallback(() => {
        if (universeInputMode === 'linked' && linkedPoolAvailable) {
            return {
                payload: {
                    universe: parseCodes(prefillInfo && prefillInfo.universe ? prefillInfo.universe : ''),
                    universe_type: prefillInfo.universe_type || '',
                    universe_code: prefillInfo.universe_code || '',
                    universe_name: prefillInfo.universe_name || '',
                    custom_pool_id: prefillInfo.custom_pool_id || null,
                    stock_items: Array.isArray(prefillInfo.stock_items) ? prefillInfo.stock_items : [],
                },
            };

        if (universeInputMode === 'system') {
            const systemMeta = selectedSystemUniverse || { code: systemUniverseCode, name: systemUniverseCode };
            return {
                payload: {
                    universe: [],
                    universe_type: 'system',
                    universe_code: systemMeta.code,
                    universe_name: systemMeta.name,
                    custom_pool_id: null,
                    stock_items: [],
                },
            };
        }
        if (universeInputMode === 'custom') {
            if (!selectedCustomPool) {
                throw new Error('璇烽€夋嫨鑷畾涔夎偂绁ㄦ睜');

            return {
                payload: {
                    universe: [],
                    universe_type: 'custom',
                    universe_code: `custom:${selectedCustomPool.id}`,
                    universe_name: selectedCustomPool.name || '鑷畾涔夎偂绁ㄦ睜',
                    custom_pool_id: selectedCustomPool.id,
                    stock_items: normalizeStockItems(selectedCustomPool.stock_items || []),
                },
            };
        }
        return { payload: { universe: codeList.slice() } };
    }, [universeInputMode, linkedPoolAvailable, prefillInfo, selectedSystemUniverse, systemUniverseCode, selectedCustomPool, codeList, parseCodes]);

    const persistCurrentContext = useCallback(() => {
        const snapshot = buildContextSnapshot();
        if (!snapshot) return;
        if (strategyId) saveStrategyBacktestContext(strategyId, snapshot);

    const addStockToPool = (item) => {

        if ((poolForm.stock_items || []).some(existing => existing.ts_code === item.ts_code)) {

            return;

        setPoolForm(prev => ({
            ...prev,
            stock_items: [...(prev.stock_items || []), { ts_code: item.ts_code, name: item.name || '' }],

        setStockResults([]);
        setShowStockResults(false);
    };

    const removeStockFromPool = (tsCode) => {
        setPoolForm(prev => ({
            ...prev,
            stock_items: (prev.stock_items || []).filter(item => item.ts_code !== tsCode),

    };

    const editPool = (pool) => {
        setPoolForm({

            description: pool.description || '',

        setUniverseInputMode('custom');
        setShowPoolManager(true);
    };

    const resetPoolForm = () => {
        setPoolForm({ id: null, name: '', description: '', stock_items: [] });
        setStockKeyword('');
        setStockResults([]);
        setShowStockResults(false);
    };

    const savePool = async () => {
        if (!poolForm.name.trim()) {
            showToast('璇疯緭鍏ヨ偂绁ㄦ睜鍚嶇О', 'error');
            return;
        }
        if ((poolForm.stock_items || []).length === 0) {
            showToast('璇疯嚦灏戞坊鍔犱竴鍙偂绁?, 'error');
            return;
        }
        setPoolSaving(true);
        try {
            const payload = {
                name: poolForm.name.trim(),
                description: poolForm.description || '',
                stock_items: normalizeStockItems(poolForm.stock_items || []),
            };
            const res = poolForm.id
                ? await api.put('/api/factor_board/custom_pools/' + poolForm.id, payload)
                : await api.post('/api/factor_board/custom_pools', payload);
            showToast(poolForm.id ? '鑷畾涔夎偂绁ㄦ睜宸叉洿鏂? : '鑷畾涔夎偂绁ㄦ睜宸蹭繚瀛?, 'success');
            await loadUniverseOptions();
            setCustomPoolId(String(res.id));
            setUniverseInputMode('custom');
            setPoolForm({
                id: res.id,
                name: res.name || '',
                description: res.description || '',
                stock_items: normalizeStockItems(res.stock_items || []),
            });
        } catch (e) {
            showToast((e && e.detail) || '淇濆瓨鑷畾涔夎偂绁ㄦ睜澶辫触', 'error');
        }
        setPoolSaving(false);
    };

    const deletePool = async () => {
        if (!poolForm.id) return;
        setPoolDeleting(true);
        try {
            await api.remove('/api/factor_board/custom_pools/' + poolForm.id);
            showToast('鑷畾涔夎偂绁ㄦ睜宸插垹闄?, 'success');
            if (String(customPoolId) === String(poolForm.id)) setCustomPoolId('');
            resetPoolForm();
            await loadUniverseOptions();
        } catch (e) {
            showToast((e && e.detail) || '鍒犻櫎鑷畾涔夎偂绁ㄦ睜澶辫触', 'error');
        }
        setPoolDeleting(false);
    };

    const runBacktest = async () => {
        if (!strategyId) { showToast('璇烽€夋嫨绛栫暐', 'error'); return; }
        if (universeInputMode === 'codes' && codeList.length === 0) { showToast('璇峰厛娣诲姞鑷冲皯涓€鍙偂绁?, 'error'); return; }
        if (universeInputMode === 'custom' && !selectedCustomPool) { showToast('璇烽€夋嫨鑷畾涔夎偂绁ㄦ睜', 'error'); return; }
        persistCurrentContext();
        setRunning(true);
        setResult(null);
        setLogs([]);
        try {
            const universePayload = buildUniversePayload();
            const res = await api.post('/api/backtest/run', {

                benchmark,

        setRunning(false);

        let grid;
        try { grid = JSON.parse(paramGrid); } catch { showToast('鍙傛暟缃戞牸鏍煎紡閿欒锛岃杈撳叆鏈夋晥 JSON', 'error'); return; }
        if (universeInputMode === 'codes' && codeList.length === 0) { showToast('璇峰厛娣诲姞鑷冲皯涓€鍙偂绁?, 'error'); return; }
        persistCurrentContext();
        setOptimizing(true);
        setOptimizeResults(null);
        try {
            const universePayload = buildUniversePayload();
            const res = await api.post('/api/backtest/optimize', {
                strategy_id: parseInt(strategyId),
                ...universePayload.payload,
                start_date: startDate,
                end_date: endDate,
                initial_cash: cash,
                benchmark,
                param_grid: grid,
            });
            setOptimizeResults(res.results);
            showToast(`浼樺寲瀹屾垚锛屽叡 ${res.results.length} 缁勫弬鏁癭, 'success');
        } catch (e) {
            showToast((e && e.detail) || e.message || '浼樺寲澶辫触', 'error');
        }
        setOptimizing(false);
    };

    const runWalkForward = async () => {
        if (!strategyId) { showToast('璇烽€夋嫨绛栫暐', 'error'); return; }
        let grid;
        try { grid = JSON.parse(paramGrid); } catch { showToast('鍙傛暟缃戞牸鏍煎紡閿欒', 'error'); return; }
        if (universeInputMode === 'codes' && codeList.length === 0) { showToast('璇峰厛娣诲姞鑷冲皯涓€鍙偂绁?, 'error'); return; }
        persistCurrentContext();
        setWfRunning(true);
        setWfResult(null);
        try {
            const universePayload = buildUniversePayload();
            const res = await api.post('/api/backtest/walk_forward', {
                strategy_id: parseInt(strategyId),
                ...universePayload.payload,
                start_date: startDate,
                end_date: endDate,
                param_grid: grid,
                benchmark,
            });
            setWfResult(res);
            showToast('Walk-Forward 楠岃瘉瀹屾垚', 'success');
        } catch (e) {
            showToast((e && e.detail) || e.message || 'Walk-Forward 楠岃瘉澶辫触', 'error');

                    <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',flexWrap:'wrap'}}>
                        <div>

                        </div>

                    </div>

                strategyId={strategyId}
                setStrategyId={setStrategyId}
                running={running}
                onRun={runBacktest}
                startDate={startDate}
                setStartDate={setStartDate}
                endDate={endDate}
                setEndDate={setEndDate}
                cash={cash}
                setCash={setCash}
                benchmark={benchmark}
                setBenchmark={setBenchmark}
                maxPosPct={maxPosPct}
                setMaxPosPct={setMaxPosPct}
                maxDdLimit={maxDdLimit}
                setMaxDdLimit={setMaxDdLimit}
                prefillInfo={prefillInfo}
                linkedPoolAvailable={linkedPoolAvailable}
                universeInputMode={universeInputMode}
                setUniverseInputMode={setUniverseInputMode}
                dateInputMode={dateInputMode}
                setDateInputMode={setDateInputMode}
                benchmarkInputMode={benchmarkInputMode}
                setBenchmarkInputMode={setBenchmarkInputMode}
                restoreSourceDateRange={restoreSourceDateRange}
                restoreSourceBenchmark={restoreSourceBenchmark}
                universeOptions={universeOptions}
                systemUniverseCode={systemUniverseCode}
                setSystemUniverseCode={setSystemUniverseCode}
                customPoolId={customPoolId}
                setCustomPoolId={setCustomPoolId}
                selectedSystemUniverse={selectedSystemUniverse}
                selectedCustomPool={selectedCustomPool}
                codeList={codeList}
                codeDraft={codeDraft}
                setCodeDraft={setCodeDraft}
                addCodeDraft={addCodeDraft}
                removeCodeFromList={removeCodeFromList}
                unsupportedLabels={unsupportedLabels}

                <div className="flex items-center justify-between">
                    <div className="card-title" style={{marginBottom:0}}>鍙傛暟浼樺寲</div>
                    <button type="button" className="btn btn-secondary" onClick={(e) => { e.preventDefault(); setShowOptimizer(!showOptimizer); }}>
                        {showOptimizer ? '鏀惰捣' : '灞曞紑'}

/* ===== Backtest Result View ===== */
function buildBacktestInsightModel(result) {
    const metrics = result && result.metrics ? result.metrics : {};
    const trades = Array.isArray(result && result.trades) ? result.trades : [];
    const equityCurve = Array.isArray(result && result.equity_curve) ? result.equity_curve : [];
    const benchmarkCurve = Array.isArray(result && result.benchmark_curve) ? result.benchmark_curve : [];
    const strategyProfile = result && result.strategy_profile ? result.strategy_profile : {};

    const toNum = (value, fallback = 0) => {
        const num = Number(value);
        return Number.isFinite(num) ? num : fallback;
    };
    const toDate = (value) => {
        const text = String(value || '').replace(/-/g, '');
        if (!/^\d{8}$/.test(text)) return null;
        return new Date(Number(text.slice(0, 4)), Number(text.slice(4, 6)) - 1, Number(text.slice(6, 8)));
    };
    const diffDays = (startValue, endValue) => {
        const startDate = toDate(startValue);
        const endDate = toDate(endValue);
        if (!startDate || !endDate) return 0;
        return Math.max(Math.round((endDate - startDate) / 86400000), 0);
    };
    const formatPct = (value) => {
        if (value == null || !Number.isFinite(Number(value))) return '-';
        const num = Number(value);
        return `${num >= 0 ? '+' : ''}${num.toFixed(2)}%`;
    };
    const formatSigned = (value, digits = 2) => {
        if (value == null || !Number.isFinite(Number(value))) return '-';
        const num = Number(value);
        return `${num >= 0 ? '+' : ''}${num.toFixed(digits)}`;
    };
    const formatDays = (value) => {
        if (!Number.isFinite(Number(value))) return '-';
        return `${Number(value).toFixed(1)}澶ー;
    };

    const startDate = result && result.start_date ? result.start_date : (equityCurve[0] && equityCurve[0].date) || '';
    const endDate = result && result.end_date ? result.end_date : (equityCurve[equityCurve.length - 1] && equityCurve[equityCurve.length - 1].date) || '';
    const totalDays = diffDays(startDate, endDate) + 1;
    const totalMonths = Math.max(totalDays / 30, 1);
    const uniqueSymbols = Array.from(new Set(trades.map(item => item.ts_code).filter(Boolean)));
    const tradeDates = Array.from(new Set(trades.map(item => item.date).filter(Boolean))).sort();

    let avgTradeGap = null;
    if (tradeDates.length > 1) {
        let totalGap = 0;
        for (let idx = 1; idx < tradeDates.length; idx += 1) totalGap += diffDays(tradeDates[idx - 1], tradeDates[idx]);
        avgTradeGap = totalGap / (tradeDates.length - 1);
    }

    const buyCount = trades.filter(item => item.side === 'buy').length;
    const sellCount = trades.filter(item => item.side === 'sell').length;
    const monthlyTradeCount = trades.length / totalMonths;
    const benchmarkReturn = benchmarkCurve.length >= 2 ? (toNum(benchmarkCurve[benchmarkCurve.length - 1].value, 1) - 1) * 100 : null;
    const excessReturn = benchmarkReturn == null ? null : toNum(metrics.total_return) - benchmarkReturn;
    const returnDrawdownRatio = toNum(metrics.max_drawdown) < 0 ? toNum(metrics.total_return) / Math.abs(toNum(metrics.max_drawdown)) : null;

    const openLots = {};
    let closedTradeCount = 0;
    let winTrades = 0;
    let positivePnl = 0;
    let negativePnl = 0;
    let holdingDaysWeighted = 0;
    let holdingAmountWeighted = 0;
    const symbolClosedPnl = {};

    [...trades].sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))).forEach((trade) => {
        const code = String(trade.ts_code || '').trim();
        if (!code) return;
        openLots[code] = openLots[code] || [];
        const amount = Math.max(toNum(trade.amount), 0);
        const price = toNum(trade.price);
        if (trade.side === 'buy') {
            openLots[code].push({ amount, price, date: trade.date });
            return;
        }
        let remaining = amount;
        while (remaining > 0 && openLots[code].length > 0) {
            const lot = openLots[code][0];
            const matchedAmount = Math.min(remaining, lot.amount);
            const pnl = (price - toNum(lot.price)) * matchedAmount;
            const holdDays = diffDays(lot.date, trade.date);
            closedTradeCount += 1;
            if (pnl >= 0) {
                winTrades += 1;
                positivePnl += pnl;
            } else {
                negativePnl += pnl;
            }
            symbolClosedPnl[code] = (symbolClosedPnl[code] || 0) + pnl;
            holdingDaysWeighted += holdDays * matchedAmount;
            holdingAmountWeighted += matchedAmount;
            lot.amount -= matchedAmount;
            remaining -= matchedAmount;
            if (lot.amount <= 0) openLots[code].shift();
        }
    });

    const winRateClosed = closedTradeCount > 0 ? (winTrades / closedTradeCount) * 100 : null;
    const profitFactor = negativePnl < 0 ? positivePnl / Math.abs(negativePnl) : null;
    const avgHoldingDays = holdingAmountWeighted > 0 ? holdingDaysWeighted / holdingAmountWeighted : null;
    const symbolContribution = Object.entries(symbolClosedPnl).sort((a, b) => b[1] - a[1]);
    const bestSymbol = symbolContribution[0] || null;
    const worstSymbol = symbolContribution.length ? symbolContribution[symbolContribution.length - 1] : null;

    const diagnosticTags = [];
    if (excessReturn != null) diagnosticTags.push(excessReturn >= 0 ? `璺戣耽鍩哄噯 ${formatPct(excessReturn)}` : `钀藉悗鍩哄噯 ${formatPct(excessReturn)}`);
    if (toNum(metrics.sharpe_ratio) >= 1) diagnosticTags.push(`椋庨櫓璋冩暣鍚庤〃鐜拌緝濂斤紙Sharpe ${formatSigned(metrics.sharpe_ratio)})`);
    else diagnosticTags.push(`椋庨櫓鏀剁泭鏁堢巼涓€鑸紙Sharpe ${formatSigned(metrics.sharpe_ratio)})`);
    if (avgHoldingDays != null) diagnosticTags.push(avgHoldingDays <= 5 ? '鏇存帴杩戠煭鍛ㄦ湡鎷╂椂/杞姩鎵ц' : avgHoldingDays >= 20 ? '鏇存帴杩戜腑鍛ㄦ湡鎸佹湁绛栫暐' : '鎸佹湁鍛ㄦ湡浣嶄簬涓煭鍛ㄦ湡鍖洪棿');
    if (monthlyTradeCount >= 25) diagnosticTags.push('浜ゆ槗棰戠巼鍋忛珮锛岄渶閲嶇偣鍏虫敞鍐插嚮鎴愭湰涓庢粦鐐?);
    else if (monthlyTradeCount <= 8) diagnosticTags.push('浜ゆ槗棰戠巼杈冧綆锛屾墽琛屽帇鍔涚浉瀵硅緝灏?);

    return {
        periodText: startDate && endDate ? `${startDate} ~ ${endDate}` : '-',
        totalDays,
        buyCount,
        sellCount,
        uniqueSymbolCount: uniqueSymbols.length,
        universeSize: strategyProfile.universe_size ?? result.resolved_universe_count ?? null,
        monthlyTradeCount,
        avgTradeGap,
        avgHoldingDays,
        closedTradeCount,
        winRateClosed,
        profitFactor,
        benchmarkReturn,
        excessReturn,
        returnDrawdownRatio,
        bestSymbol,
        worstSymbol,
        diagnosticTags,
        formatPct,
        formatSigned,
        formatDays,
    };
}

/* ===== Return Histogram (Canvas) ===== */
function ReturnHistogram({ histogram, var95, cvar95 }) {
    const canvasRef = useRef(null);
    useEffect(() => {
        if (!histogram || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const W = 600, H = 250;
        canvas.width = W; canvas.height = H;
        ctx.fillStyle = '#252a3a'; ctx.fillRect(0, 0, W, H);
        const counts = histogram.counts || [];
        const edges = histogram.bin_edges || [];
        if (counts.length === 0) return;
        const maxCount = Math.max(...counts);
        const barW = (W - 60) / counts.length;
        const chartH = H - 40;
        // bars
        for (let i = 0; i < counts.length; i++) {
            const h = maxCount > 0 ? (counts[i] / maxCount) * chartH : 0;
            const x = 40 + i * barW;
            const mid = (edges[i] + edges[i + 1]) / 2;
            ctx.fillStyle = mid >= 0 ? '#22c55e88' : '#ef444488';
            ctx.fillRect(x, H - 20 - h, barW - 1, h);
        }
        // VaR/CVaR lines
        const minE = edges[0], maxE = edges[edges.length - 1];
        const range = maxE - minE || 1;
        if (var95 != null) {
            const vx = 40 + ((var95 / 100 - minE) / range) * (W - 60);
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
            ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(vx, 10); ctx.lineTo(vx, H - 20); ctx.stroke();
            ctx.setLineDash([]); ctx.fillStyle = '#f59e0b'; ctx.font = '10px sans-serif'; ctx.fillText('VaR', vx + 2, 18);
        }
        if (cvar95 != null) {
            const cx = 40 + ((cvar95 / 100 - minE) / range) * (W - 60);
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
            ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(cx, 10); ctx.lineTo(cx, H - 20); ctx.stroke();
            ctx.setLineDash([]); ctx.fillStyle = '#ef4444'; ctx.font = '10px sans-serif'; ctx.fillText('CVaR', cx + 2, 18);
        }
        // axis labels
        ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
        ctx.fillText((minE * 100).toFixed(1) + '%', 40, H - 4);
        ctx.fillText((maxE * 100).toFixed(1) + '%', W - 50, H - 4);
    }, [histogram, var95, cvar95]);
    if (!histogram) return null;
    return (
        <div>
            <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>鏃ユ敹鐩婂垎甯?/div>
            <div className="histogram-wrap"><canvas ref={canvasRef} style={{width:'100%',maxWidth:600,height:250}}/></div>
        </div>
    );
}

/* ===== Monthly Heatmap (Canvas) ===== */
function MonthlyHeatmap({ data }) {
    const canvasRef = useRef(null);
    const MONTHS = ['1鏈?,'2鏈?,'3鏈?,'4鏈?,'5鏈?,'6鏈?,'7鏈?,'8鏈?,'9鏈?,'10鏈?,'11鏈?,'12鏈?,'骞村害'];
    useEffect(() => {
        if (!data || data.length === 0 || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const cellW = 52, cellH = 28, padL = 50, padT = 24;
        const W = padL + 13 * cellW + 10, H = padT + data.length * cellH + 10;
        canvas.width = W; canvas.height = H;
        ctx.fillStyle = '#252a3a'; ctx.fillRect(0, 0, W, H);
        // header
        ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        MONTHS.forEach((m, i) => ctx.fillText(m, padL + i * cellW + cellW / 2, 16));
        // rows
        data.forEach((row, ri) => {
            ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'right';
            ctx.fillText(String(row.year), padL - 6, padT + ri * cellH + cellH / 2 + 4);
            const vals = [...(row.months || []), row.annual];
            vals.forEach((v, ci) => {
                const x = padL + ci * cellW, y = padT + ri * cellH;
                if (v == null) { ctx.fillStyle = '#1a1d29'; ctx.fillRect(x + 1, y + 1, cellW - 2, cellH - 2); return; }
                const intensity = Math.min(Math.abs(v) / 10, 1);
                if (v >= 0) ctx.fillStyle = `rgba(34,197,94,${0.15 + intensity * 0.6})`;
                else ctx.fillStyle = `rgba(239,68,68,${0.15 + intensity * 0.6})`;
                ctx.fillRect(x + 1, y + 1, cellW - 2, cellH - 2);
                ctx.fillStyle = '#e2e8f0'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(v.toFixed(1) + '%', x + cellW / 2, y + cellH / 2 + 4);
            });
        });
    }, [data]);
    if (!data || data.length === 0) return null;
    return (
        <div>
            <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>鏈堝害鏀剁泭鐑姏鍥?/div>
            <div className="monthly-heatmap-wrap"><canvas ref={canvasRef} style={{maxWidth:'100%'}}/></div>
        </div>
    );
}

function TopContributorsChart({ stocks }) {
    if (!stocks || stocks.length === 0) return null;
    const valueOf = (item) => item.total_pnl ?? item.realized_pnl ?? 0;
    const sorted = [...stocks].sort((a, b) => valueOf(b) - valueOf(a));
    const top5 = sorted.slice(0, 5);

    const items = [...top5, ...bottom5].filter((v, i, arr) => arr.findIndex(x => x.ts_code === v.ts_code) === i);
    const maxAbs = Math.max(...items.map(s => Math.abs(valueOf(s))), 1);

/* ===== Equity Chart (Enhanced) ===== */
function EquityChart({ data, benchmarkData, trades }) {
    if (!data || data.length === 0) return <div className="text-muted text-center py-10">鏆傛棤鏁版嵁</div>;

    const initial = data[0].value || 1;
    // 鏋勫缓鍩哄噯鏌ユ壘琛?
    const bmMap = {};
    if (benchmarkData && benchmarkData.length > 0) {
        benchmarkData.forEach(b => { bmMap[b.date] = b.value; });
    }
    // 鏋勫缓涔板崠鏍囪鏌ユ壘琛?
    const buyMap = {};
    const sellMap = {};
    if (trades && trades.length > 0) {
        trades.forEach(t => {
            if (t.side === 'buy') buyMap[t.date] = true;
            else sellMap[t.date] = true;
        });
    }

    const chartData = data.map(d => {
        const strategyReturn = ((d.value - initial) / initial) * 100;
        const item = { date: d.date, strategy: parseFloat(strategyReturn.toFixed(2)) };
        if (bmMap[d.date] !== undefined) {
            item.benchmark = parseFloat(((bmMap[d.date] - 1) * 100).toFixed(2));
        }
        if (buyMap[d.date]) item.buy = item.strategy;
        if (sellMap[d.date]) item.sell = item.strategy;
        return item;
    });

    const BuyShape = (props) => {
        const { cx, cy } = props;
        if (cx == null || cy == null) return null;
        return <polygon points={`${cx},${cy-7} ${cx-6},${cy+5} ${cx+6},${cy+5}`} fill="#22c55e" />;
    };
    const SellShape = (props) => {
        const { cx, cy } = props;
        if (cx == null || cy == null) return null;
        return <polygon points={`${cx},${cy+7} ${cx-6},${cy-5} ${cx+6},${cy-5}`} fill="#ef4444" />;
    };

    return (
        <ResponsiveContainer width="100%" height={380}>
            <ComposedChart data={chartData}>
                <defs>
                    <linearGradient id="colorStrategy" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="5%" stopColor="#6366f1" stopOpacity={0.3} />
                        <stop offset="95%" stopColor="#6366f1" stopOpacity={0} />
                    </linearGradient>
                </defs>
                <CartesianGrid strokeDasharray="3 3" stroke="#2d3348" />
                <XAxis dataKey="date" tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false}
                    interval={Math.floor(chartData.length / 6)} />
                <YAxis tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false}
                    tickFormatter={v => v.toFixed(1) + '%'} />
                <Tooltip contentStyle={{ background: '#1e2235', border: '1px solid #2d3348', borderRadius: 8, color: '#e2e8f0' }}
                    formatter={(v, name) => {
                        const labels = { strategy: '绛栫暐鏀剁泭', benchmark: '鍩哄噯鏀剁泭', buy: '涔板叆', sell: '鍗栧嚭' };
                        return [v + '%', labels[name] || name];
                    }}
                    labelFormatter={l => '鏃ユ湡: ' + l} />
                <Legend formatter={(v) => {
                    const labels = { strategy: '绛栫暐鏀剁泭', benchmark: '鍩哄噯鏀剁泭', buy: '涔板叆', sell: '鍗栧嚭' };
                    return labels[v] || v;
                }} />
                <Area type="monotone" dataKey="strategy" stroke="#6366f1" strokeWidth={2}
                    fillOpacity={1} fill="url(#colorStrategy)" name="strategy" />
                {benchmarkData && benchmarkData.length > 0 &&
                    <Line type="monotone" dataKey="benchmark" stroke="#f59e0b" strokeWidth={1.5}
                        strokeDasharray="5 3" dot={false} name="benchmark" />
                }
                <Scatter dataKey="buy" shape={<BuyShape />} name="buy" />
                <Scatter dataKey="sell" shape={<SellShape />} name="sell" />
            </ComposedChart>
        </ResponsiveContainer>
    );
}

/* ===== History Page ===== */
function HistoryPage({ showToast, openPortfolioWorkspace }) {
    const [results, setResults] = useState([]);
    const [detail, setDetail] = useState(null);
    const [detailTab, setDetailTab] = useState('risk');
    const [selectedIds, setSelectedIds] = useState([]);
    const [comparing, setComparing] = useState(false);
    const [compareData, setCompareData] = useState(null);
    const [historyFocusId, setHistoryFocusId] = useState(null);
    const [searchText, setSearchText] = useState('');
    const [resultFilter, setResultFilter] = useState('all');
    const [sortKey, setSortKey] = useState('created_at');
    const [sortDir, setSortDir] = useState('desc');
    const [resultMetaMap, setResultMetaMap] = useState({});
    const [prefillBanner, setPrefillBanner] = useState(null);

    const loadResults = useCallback(() => {
        api.get('/api/backtest/history').then(setResults).catch(() => {});
    }, []);

    const viewDetail = useCallback(async (id, preferredTab) => {
        try {
            const res = await api.get('/api/backtest/history/' + id);
            setDetail(res);
            setDetailTab(preferredTab || 'risk');
            setHistoryFocusId(id);
        } catch (_) {
            showToast('鍔犺浇璇︽儏澶辫触', 'error');
        }
    }, [showToast]);

    const applyHistoryFocus = useCallback(() => {
        const focus = readHistoryFocus();
        if (!focus || !focus.result_id) return;
        setHistoryFocusId(focus.result_id);
        viewDetail(focus.result_id, focus.tab || 'risk');
    }, [viewDetail]);

    const refreshMeta = useCallback(() => {
        setResultMetaMap(readResultMetaMap());
    }, []);

    useEffect(() => { loadResults(); }, [loadResults]);
    useEffect(() => { applyHistoryFocus(); }, [applyHistoryFocus]);
    useEffect(() => { refreshMeta(); }, [refreshMeta]);
    useEffect(() => {
        const handler = () => applyHistoryFocus();
        window.addEventListener('qtsys:history-focus', handler);
        return () => window.removeEventListener('qtsys:history-focus', handler);
    }, [applyHistoryFocus]);

    const toggleSelect = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    };
    const toggleFavorite = (id) => {
        const current = getResultMeta(id);
        saveResultMeta(id, { favorite: !current.favorite });
        refreshMeta();
    };
    const editNote = (id) => {
        const current = getResultMeta(id);
        const nextNote = window.prompt('璇疯緭鍏ヨ繖娆″洖娴嬬殑澶囨敞锛屼究浜庡悗缁瓫閫夊拰澶嶇洏', current.note || '');
        if (nextNote === null) return;
        saveResultMeta(id, { note: String(nextNote || '').trim() });
        refreshMeta();
    };

    const filteredResults = useMemo(() => {
        const keyword = String(searchText || '').trim().toLowerCase();
        const filtered = (results || []).filter(item => {
            const totalReturn = Number(item.metrics?.total_return || 0);
            const sharpe = Number(item.metrics?.sharpe_ratio || 0);
            const meta = resultMetaMap[String(item.id)] || {};
            if (resultFilter === 'positive' && totalReturn < 0) return false;
            if (resultFilter === 'negative' && totalReturn >= 0) return false;
            if (resultFilter === 'high_sharpe' && sharpe < 1) return false;
            if (resultFilter === 'favorites' && !meta.favorite) return false;
            if (!keyword) return true;
            const haystack = [item.strategy_name, item.universe, item.start_date, item.end_date, item.id, meta.note || ''].join(' ').toLowerCase();
            return haystack.includes(keyword);
        });
        return [...filtered].sort((a, b) => {
            let left;
            let right;
            if (sortKey === 'created_at') {
                left = String(a.created_at || '');
                right = String(b.created_at || '');
            } else if (sortKey === 'strategy_name') {
                left = String(a.strategy_name || '');
                right = String(b.strategy_name || '');
            } else if (sortKey === 'final_value') {
                left = Number(a.final_value || 0);
                right = Number(b.final_value || 0);
            } else {
                left = Number(a.metrics?.[sortKey] || 0);
                right = Number(b.metrics?.[sortKey] || 0);
            }
            const cmp = typeof left === 'string' ? left.localeCompare(right) : left - right;
            return sortDir === 'asc' ? cmp : -cmp;
        });
    }, [results, resultMetaMap, searchText, resultFilter, sortKey, sortDir]);

    const summary = useMemo(() => {
        const total = filteredResults.length;
        const positive = filteredResults.filter(item => Number(item.metrics?.total_return || 0) >= 0).length;
        const avgReturn = total ? filteredResults.reduce((sum, item) => sum + Number(item.metrics?.total_return || 0), 0) / total : 0;
        const avgSharpe = total ? filteredResults.reduce((sum, item) => sum + Number(item.metrics?.sharpe_ratio || 0), 0) / total : 0;
        const best = total ? [...filteredResults].sort((a, b) => Number(b.metrics?.total_return || 0) - Number(a.metrics?.total_return || 0))[0] : null;
        return { total, positive, avgReturn, avgSharpe, best };
    }, [filteredResults]);

    const runCompare = async () => {
        if (selectedIds.length < 2) { showToast('鑷冲皯閫夋嫨 2 涓粨鏋滄墠鑳藉姣?, 'error'); return; }
        setComparing(true);
        setCompareData(null);
        try {
            const res = await api.post('/api/backtest/compare', { result_ids: selectedIds });
            setCompareData(res);
        } catch (e) {
            showToast((e && e.detail) || '瀵规瘮鍒嗘瀽澶辫触', 'error');
        }
        setComparing(false);
    };

    const sendToPortfolio = () => {
        if (selectedIds.length < 2) { showToast('鑷冲皯閫夋嫨 2 涓粨鏋滄墠鑳藉仛缁勫悎鍒嗘瀽', 'error'); return; }
        pushPortfolioPrefill({ result_ids: selectedIds, method: 'max_sharpe' });
        setPrefillBanner(`宸插皢 ${selectedIds.length} 涓洖娴嬬粨鏋滃甫鍏ョ粍鍚堝垎鏋恅);
        if (openPortfolioWorkspace) openPortfolioWorkspace();
    };

    if (detail) {
        return (
            <div className="fade-in space-y">
                <div className="flex items-center justify-between">
                    <button className="btn-link" onClick={() => { setDetail(null); setDetailTab('risk'); clearHistoryFocus(); }}>&larr; 杩斿洖鍘嗗彶</button>
                    <div className="text-xs text-muted">缁撴灉 #{detail.id}</div>
                </div>
                <BacktestResultView result={detail} tab={detailTab} setTab={setDetailTab} logs={detail.logs || []} />
            </div>
        );
    }

    if (compareData) {
        return (
            <div className="fade-in space-y">
                <button className="btn-link" onClick={() => setCompareData(null)}>&larr; 杩斿洖鍘嗗彶</button>
                <h2 style={{fontSize:20,fontWeight:600}}>绛栫暐瀵规瘮鍒嗘瀽</h2>
                <CompareView data={compareData} />
            </div>
        );
    }

    return (
        <div className="fade-in space-y">
            <div className="history-toolbar">
                <div>
                    <h2 style={{fontSize:20,fontWeight:600}}>鍥炴祴鍘嗗彶</h2>
                    <div className="text-xs text-muted" style={{marginTop:6}}>闆嗕腑鏌ョ湅鍘嗗彶缁撴灉銆佸仛妯悜瀵规瘮锛屽苟鎶婂涓瓥鐣ヤ竴閿€佸叆缁勫悎鍒嗘瀽銆?/div>
                </div>
                <div className="flex gap-sm items-center" style={{gap:8}}>
                    {selectedIds.length >= 2 && (
                        <button className="btn btn-primary" style={{fontSize:13,padding:'6px 14px'}} onClick={runCompare} disabled={comparing}>
                            {comparing ? '瀵规瘮涓?..' : `瀵规瘮缁撴灉 (${selectedIds.length})`}
                        </button>
                    )}
                    {selectedIds.length >= 2 && (
                        <button className="btn btn-secondary" style={{fontSize:13,padding:'6px 14px'}} onClick={sendToPortfolio}>閫佸叆缁勫悎鍒嗘瀽</button>
                    )}
                    {selectedIds.length > 0 && (
                        <button className="btn btn-secondary" style={{fontSize:12,padding:'4px 12px'}} onClick={() => setSelectedIds([])}>娓呯┖閫夋嫨</button>

                    <div className="history-mini-meta">褰撳墠绛涢€夋潯浠朵笅鐨勫洖娴嬭褰?/div>
                </div>

function buildCompareSummary(data) {
    const metricsList = Array.isArray(data && data.metrics) ? data.metrics : [];
    const metricValue = (item, key) => Number((item && item.metrics && item.metrics[key]) || 0);
    const bestBy = (key, mode = 'max') => {
        if (!metricsList.length) return null;
        const sorted = [...metricsList].sort((a, b) => mode === 'max' ? metricValue(b, key) - metricValue(a, key) : metricValue(a, key) - metricValue(b, key));
        return sorted[0] || null;
    };
    return {
        bestReturn: bestBy('total_return', 'max'),
        bestSharpe: bestBy('sharpe_ratio', 'max'),
        lowestDrawdown: bestBy('max_drawdown', 'max'),
        bestAnnual: bestBy('annual_return', 'max'),
    };
}

function buildPortfolioDiagnosticModel(data) {
    const corrMatrix = data?.correlations?.correlation_matrix || [];
    const names = data?.correlations?.names || [];
    const weights = data?.weights?.weights || [];
    const portfolioMetrics = data?.portfolio?.metrics || {};
    const weightValues = weights.map(item => Math.max(Number(item.weight || 0), 0));
    const nonZeroWeights = weightValues.filter(v => v > 0);
    const hhi = nonZeroWeights.reduce((sum, value) => sum + value * value, 0);
    const effectiveCount = hhi > 0 ? 1 / hhi : 0;
    const maxWeight = weightValues.length ? Math.max(...weightValues) : 0;
    let avgCorr = 0;
    let highestPair = null;
    let pairCount = 0;
    for (let i = 0; i < corrMatrix.length; i += 1) {
        for (let j = i + 1; j < corrMatrix[i].length; j += 1) {
            const current = Number(corrMatrix[i][j] || 0);
            avgCorr += current;
            pairCount += 1;
            if (!highestPair || current > highestPair.value) {
                highestPair = { left: names[i], right: names[j], value: current };
            }
        }
    }
    avgCorr = pairCount ? avgCorr / pairCount : 0;
    return {
        method: data?.weights?.method || '-',
        avgCorr,
        effectiveCount,
        maxWeight,
        sharpe: Number(portfolioMetrics.sharpe_ratio || 0),
        totalReturn: Number(portfolioMetrics.total_return || 0),
        annualReturn: Number(portfolioMetrics.annual_return || 0),
        maxDrawdown: Number(portfolioMetrics.max_drawdown || 0),
        highestPair,
    };
}

/* ===== Correlation Heatmap (Canvas) ===== */
function CorrelationHeatmap({ names, matrix }) {
    const canvasRef = useRef(null);
    useEffect(() => {
        if (!matrix || matrix.length === 0 || !canvasRef.current) return;
        const n = names.length;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const cellS = 60, padL = 80, padT = 40;
        const W = padL + n * cellS + 10, H = padT + n * cellS + 10;
        canvas.width = W; canvas.height = H;
        ctx.fillStyle = '#252a3a'; ctx.fillRect(0, 0, W, H);
        // headers
        ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
        names.forEach((rawName, i) => {
            const nm = repairMojibakeText(rawName);
            ctx.save(); ctx.translate(padL + i * cellS + cellS/2, padT - 6);
            ctx.rotate(-0.5); ctx.textAlign = 'left';
            ctx.fillText(nm.slice(0,8), 0, 0); ctx.restore();
            ctx.textAlign = 'right';
            ctx.fillText(nm.slice(0,8), padL - 6, padT + i * cellS + cellS/2 + 4);
        });
        // cells
        for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
                const v = matrix[i][j];
                const x = padL + j * cellS, y = padT + i * cellS;
                const intensity = Math.abs(v);
                if (v >= 0) ctx.fillStyle = `rgba(239,68,68,${0.1 + intensity*0.7})`;
                else ctx.fillStyle = `rgba(99,102,241,${0.1 + intensity*0.7})`;
                ctx.fillRect(x+1, y+1, cellS-2, cellS-2);
                ctx.fillStyle = '#e2e8f0'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(v.toFixed(2), x + cellS/2, y + cellS/2 + 4);
            }
        }
    }, [names, matrix]);
    if (!matrix || matrix.length === 0) return <div className="text-muted">鏃犳暟鎹?/div>;
    return <div className="corr-heatmap-wrap"><canvas ref={canvasRef} style={{maxWidth:'100%'}}/></div>;
}

/* ===== Rolling Correlation Section ===== */
function RollingCorrelationSection({ corr }) {
    const COLORS = ['#6366f1','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];
    if (!corr.rolling_correlations || corr.rolling_correlations.length === 0) return null;
    const chartData = {};
    corr.rolling_correlations.forEach((rc, i) => {
        (rc.series || []).forEach(p => {
            if (!chartData[p.idx]) chartData[p.idx] = { idx: p.idx };
            chartData[p.idx]['p' + i] = p.value;
        });
    });
    const sorted = Object.values(chartData).sort((a, b) => a.idx - b.idx);
    return (
        <div className="card">
            <div className="card-title">婊氬姩鐩稿叧鎬?(60鏃?</div>

}
