                                style={{width:50,padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}} />
                            <label style={{color:'#aaa'}}>璋冧粨(澶?</label>
                            <input type="number" value={btRebalDays} onChange={e => setBtRebalDays(parseInt(e.target.value)||5)} min={1} max={60}
                                style={{width:40,padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}} />
                        </div>
                    ) : (

                            <label style={{color:'#aaa'}}>寮€浠?/label>
                            <select value={btOpenCond} onChange={e => setBtOpenCond(e.target.value)}
                                style={{padding:'3px 4px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}}>

                                style={{width:50,padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}} />
                            <label style={{color:'#aaa'}}>骞充粨</label>
                            <select value={btCloseCond} onChange={e => setBtCloseCond(e.target.value)}
                                style={{padding:'3px 4px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}}>
                                <option value="lt">&lt;</option><option value="gt">&gt;</option>
                            </select>
                            <input type="number" value={btCloseThresh} onChange={e => setBtCloseThresh(parseFloat(e.target.value)||0)} step={0.1}
                                style={{width:50,padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}} />
                        </div>
                    )}
                    <button className="btn btn-sm" onClick={runBacktest} disabled={btLoading} style={{fontSize:11}}>
                        {btLoading ? '鍥炴祴涓?..' : '杩愯鍥炴祴'}
                    </button>

            </div>

            {/* Backtest Result */}
            {btResult && btResult.metrics && (
                <div style={{padding:'8px 12px',background:'#1a1a2e',borderTop:'1px solid #333'}}>
                    <div style={{display:'flex',gap:16,flexWrap:'wrap',fontSize:12,marginBottom:6}}>
                        {Object.entries(btResult.metrics).slice(0,10).map(([k,v]) => (
                            <span key={k} style={{color:'#aaa'}}>{k}: <b style={{color: typeof v==='number'&&v<0?'#f87171':'#eee'}}>{typeof v==='number'?v.toFixed(4):v}</b></span>
                        ))}
                    </div>
                    {btResult.equity_curve && btResult.equity_curve.length > 1 && (
                        <div style={{height:140,background:'#111827',borderRadius:4,padding:4}}>
                            <EquityCurveChart data={btResult.equity_curve} />
                        </div>
                    )}
                    {btResult.trades && btResult.trades.length > 0 && (
                        <details style={{marginTop:6,fontSize:11}}>
                            <summary style={{cursor:'pointer',color:'#888'}}>浜ゆ槗璁板綍 ({btResult.trades.length}绗?</summary>
                            <div style={{maxHeight:320,overflowY:'auto',overflowX:'auto',marginTop:4}}>
                                <table style={{width:'100%',fontSize:10,borderCollapse:'collapse'}}>
                                    <thead><tr style={{color:'#888'}}>
                                        <th style={{textAlign:'left',padding:'2px 4px'}}>鏃ユ湡</th>
                                        <th style={{textAlign:'left',padding:'2px 4px'}}>鑲＄エ</th>
                                        <th style={{textAlign:'left',padding:'2px 4px'}}>鏂瑰悜</th>
                                        <th style={{textAlign:'right',padding:'2px 4px'}}>浠锋牸</th>
                                        <th style={{textAlign:'right',padding:'2px 4px'}}>鏁伴噺</th>

            {/* Advanced Analysis Panel */}
            {expression && (
                <div style={{padding:'12px',background:'#1a1a2e',borderTop:'1px solid #333',marginTop:8}}>

function EquityCurveChart({ series, selectedQuantile, onSelectQuantile, rangeKey, onRangeChange, rangeOptions, spreadSeries, spreadReturnPct }) {
    const [viewMode, setViewMode] = useState('all');
    const usableSeries = Array.isArray(series) ? series.filter(item => Array.isArray(item.points) && item.points.length > 1) : [];
    const usableSpread = Array.isArray(spreadSeries) && spreadSeries.length > 1 ? spreadSeries : [];
    if (!usableSeries.length) return null;

    const activeSeries = usableSeries.find(item => String(item.quantile) === String(selectedQuantile)) || usableSeries[0];
    const drawSeries = viewMode === 'focus' ? [activeSeries] : (viewMode === 'spread' ? [] : usableSeries);
    const drawSpread = usableSpread.length > 1 && (viewMode === 'all' || viewMode === 'spread');
    const allDates = Array.from(new Set([
        ...usableSeries.flatMap(item => item.points.map(point => String(point.date || ''))),
        ...usableSpread.map(point => String(point.date || '')),
    ])).sort();
    const dateIndexMap = Object.fromEntries(allDates.map((date, index) => [date, index]));
    const allValues = [
        ...drawSeries.flatMap(item => item.points.map(point => Number(point.value) || 0)),
        ...(drawSpread ? usableSpread.map(point => Number(point.value) || 0) : []),
        1,
    ];
    const rawMin = Math.min(...allValues);
    const rawMax = Math.max(...allValues);
    const padding = Math.max((rawMax - rawMin) * 0.08, 0.02);
    const minV = rawMin - padding;
    const maxV = rawMax + padding;
    const valueRange = maxV - minV || 1;
    const w = 860, h = 390, pad = { left: 58, right: 54, top: 26, bottom: 48 };
    const chartW = w - pad.left - pad.right;
    const chartH = h - pad.top - pad.bottom;

    const formatAxisDate = (value) => {
        const text = String(value || '');
        if (text.length === 8 && !text.includes('-')) return `${text.slice(4, 6)}-${text.slice(6, 8)}`;
        if (text.length >= 10 && text.includes('-')) return text.slice(5, 10);
        return text;
    };
    const yScale = (value) => pad.top + chartH - ((value - minV) / valueRange) * chartH;
    const xScale = (date) => {
        const idx = dateIndexMap[String(date)] || 0;
        return pad.left + ((allDates.length <= 1 ? 0 : idx / (allDates.length - 1)) * chartW);
    };

    const yTicks = Array.from({ length: 5 }, (_, index) => {
        const ratio = index / 4;
        const value = maxV - ratio * valueRange;
        return { value, y: pad.top + ratio * chartH };
    });
    const xTicks = Array.from({ length: Math.min(6, allDates.length) }, (_, index) => {
        const idx = allDates.length <= 1 ? 0 : Math.round((index / Math.max(1, Math.min(5, allDates.length - 1))) * (allDates.length - 1));
        const date = allDates[idx];
        return { date, x: xScale(date) };
    }).filter((item, index, arr) => index === arr.findIndex(other => other.date === item.date));

    const selectedReturn = Number(activeSeries.returnPct || 0);
    const spreadReturn = Number(spreadReturnPct || 0);
    const dateStart = allDates[0] ? formatAxisDate(allDates[0]) : '-';
    const dateEnd = allDates[allDates.length - 1] ? formatAxisDate(allDates[allDates.length - 1]) : '-';
    const spreadPoints = usableSpread.map(point => `${xScale(point.date)},${yScale(point.value)}`).join(' ');
    const spreadLast = usableSpread.length ? usableSpread[usableSpread.length - 1] : null;
    const activePolyline = activeSeries.points.map(point => `${xScale(point.date)},${yScale(point.value)}`).join(' ');
    const activeArea = activeSeries.points.length
        ? `${xScale(activeSeries.points[0].date)},${h - pad.bottom} ${activePolyline} ${xScale(activeSeries.points[activeSeries.points.length - 1].date)},${h - pad.bottom}`
        : '';
    const baselineY = yScale(1);
    const noteText = viewMode === 'focus'
        ? '鑱氱劍瑙嗗浘浠呯獊鍑哄綋鍓嶉€変腑鍒嗕綅锛屽苟浠?.00浣滀负鍩哄噯鍑€鍊肩嚎銆?
        : (viewMode === 'spread'
            ? '澶氱┖瑙嗗浘鍗曠嫭瑙傚療鏈€楂樺垎浣嶄笌鏈€浣庡垎浣嶄箣闂寸殑缁勫悎鏀剁泭宸€?
            : '鍏ㄦ櫙瑙嗗浘鍚屾椂灞曠ず鎵€鏈夊垎浣嶇粍鍚堬紝鐧借壊铏氱嚎浠ｈ〃澶氱┖浠峰樊銆?);

    return (
        <div className="factor-board-chart-shell">
            <div className="factor-board-chart-head">
                <div className="factor-board-chart-meta">
                    <div className="factor-board-chart-kpi">
                        <span className="label">{'鍖洪棿'}</span>
                        <span className="value">{dateStart}{' ~ '}{dateEnd}</span>
                    </div>
                    <div className="factor-board-chart-kpi">
                        <span className="label">{'鍒嗕綅鏁?}</span>
                        <span className="value">{usableSeries.length}</span>
                    </div>
                    <div className="factor-board-chart-kpi">
                        <span className="label">{'褰撳墠鑱氱劍'}</span>
                        <span className={'value ' + (selectedReturn >= 0 ? 'text-profit' : 'text-loss')}>Q{activeSeries.quantile} {selectedReturn >= 0 ? '+' : ''}{selectedReturn.toFixed(2)}%</span>
                    </div>
                    <div className="factor-board-chart-kpi">
                        <span className="label">{'澶氱┖浠峰樊'}</span>
                        <span className={'value ' + (spreadReturn >= 0 ? 'spread-positive' : 'spread-negative')}>{spreadReturn >= 0 ? '+' : ''}{spreadReturn.toFixed(2)}%</span>
                    </div>
                </div>
                <div className="factor-board-range-tabs">
                    {(rangeOptions || []).map(item => (
                        <button key={item.key} className={'factor-board-range-chip' + (rangeKey === item.key ? ' active' : '')} onClick={() => onRangeChange(item.key)}>{item.label}</button>
                    ))}
                </div>
            </div>
            <div className="factor-board-chart-toolbar">
                <div className="factor-board-chart-viewtabs">
                    <button className={'factor-board-range-chip' + (viewMode === 'all' ? ' active' : '')} onClick={() => setViewMode('all')}>{'鍏ㄦ櫙鍒嗕綅'}</button>
                    <button className={'factor-board-range-chip' + (viewMode === 'focus' ? ' active' : '')} onClick={() => setViewMode('focus')}>{'鑱氱劍鍒嗕綅'}</button>
                    <button className={'factor-board-range-chip' + (viewMode === 'spread' ? ' active' : '')} onClick={() => setViewMode('spread')}>{'澶氱┖浠峰樊'}</button>
                </div>
                <div className="factor-board-subtle">{'鍗曞嚮涓嬫柟 Q 鏍囩鍙垏鎹㈣仛鐒﹀垎浣?}</div>
            </div>
            <div className="factor-board-chart-tabs">
                {usableSeries.map(item => (
                    <button key={item.quantile} className={'factor-board-chip' + (String(selectedQuantile) === String(item.quantile) ? ' active' : '')} onClick={() => onSelectQuantile(item.quantile)}>Q{item.quantile}</button>
                ))}
            </div>
            <svg viewBox={`0 0 ${w} ${h}`} className="factor-board-chart-svg">
                <defs>
                    <linearGradient id="factorBoardActiveGlow" x1="0" x2="1" y1="0" y2="0">
                        <stop offset="0%" stopColor={activeSeries.color} stopOpacity="0.34" />
                        <stop offset="100%" stopColor={activeSeries.color} stopOpacity="0.08" />
                    </linearGradient>
                    <linearGradient id="factorBoardActiveArea" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stopColor={activeSeries.color} stopOpacity="0.24" />
                        <stop offset="100%" stopColor={activeSeries.color} stopOpacity="0.01" />
                    </linearGradient>
                </defs>
                {yTicks.map((tick, index) => (
                    <g key={'y-' + index}>
                        <line x1={pad.left} y1={tick.y} x2={w - pad.right} y2={tick.y} stroke="rgba(148,163,184,0.16)" strokeDasharray="4 6" />
                        <text x={pad.left - 10} y={tick.y + 4} fill="#94a3b8" fontSize="11" textAnchor="end">{tick.value.toFixed(2)}</text>
                    </g>
                ))}
                {xTicks.map((tick, index) => (
                    <g key={'x-' + index}>
                        <line x1={tick.x} y1={pad.top} x2={tick.x} y2={h - pad.bottom} stroke="rgba(51,65,85,0.22)" />
                        <text x={tick.x} y={h - pad.bottom + 22} fill="#94a3b8" fontSize="11" textAnchor="middle">{formatAxisDate(tick.date)}</text>
                    </g>
                ))}
                <line x1={pad.left} y1={pad.top} x2={pad.left} y2={h - pad.bottom} stroke="rgba(148,163,184,0.28)" />
                <line x1={pad.left} y1={h - pad.bottom} x2={w - pad.right} y2={h - pad.bottom} stroke="rgba(148,163,184,0.28)" />
                <line x1={pad.left} y1={baselineY} x2={w - pad.right} y2={baselineY} stroke="rgba(148,163,184,0.40)" strokeDasharray="6 6" />
                <text x={w - pad.right} y={baselineY - 8} textAnchor="end" className="factor-board-chart-baseline">{'鍩哄噯 1.00'}</text>
                {viewMode !== 'spread' && activeArea ? <polygon points={activeArea} fill="url(#factorBoardActiveArea)" /> : null}
                {drawSeries.map(item => {
                    const points = item.points.map(point => `${xScale(point.date)},${yScale(point.value)}`).join(' ');
                    const lastPoint = item.points[item.points.length - 1];
                    const isActive = String(item.quantile) === String(activeSeries.quantile);
                    const strokeWidth = isActive ? 3.2 : 1.6;
                    const opacity = viewMode === 'focus' ? 1 : (isActive ? 1 : 0.48);
                    return (
                        <g key={item.quantile}>
                            {isActive && (
                                <polyline points={points} fill="none" stroke="url(#factorBoardActiveGlow)" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" />
                            )}
                            <polyline points={points} fill="none" stroke={item.color} strokeWidth={strokeWidth} strokeOpacity={opacity} strokeLinecap="round" strokeLinejoin="round" />
                            {lastPoint && (
                                <g>
                                    <circle cx={xScale(lastPoint.date)} cy={yScale(lastPoint.value)} r={isActive ? 4.8 : 3.2} fill={item.color} fillOpacity={opacity} />
                                    {isActive && (
                                        <text x={Math.min(w - 6, xScale(lastPoint.date) + 10)} y={yScale(lastPoint.value) - 8} fill={item.color} fontSize="11" fontWeight="700">Q{item.quantile}</text>
                                    )}
                                </g>
                            )}
                        </g>
                    );
                })}
                {drawSpread && (
                    <g>
                        <polyline points={spreadPoints} fill="none" stroke="rgba(248,250,252,0.92)" strokeWidth={viewMode === 'spread' ? '3' : '2.2'} strokeDasharray="8 6" strokeLinecap="round" strokeLinejoin="round" />
                        {spreadLast && (
                            <g>
                                <circle cx={xScale(spreadLast.date)} cy={yScale(spreadLast.value)} r="4.2" fill="#f8fafc" />
                                <text x={Math.min(w - 10, xScale(spreadLast.date) + 10)} y={yScale(spreadLast.value) + 14} fill="#f8fafc" fontSize="11" fontWeight="700">LS</text>
                            </g>
                        )}
                    </g>
                )}
            </svg>
            <div className="factor-board-chart-legend">
                {usableSeries.map(item => (
                    <button key={'legend-' + item.quantile} className={'factor-board-legend-item' + (String(selectedQuantile) === String(item.quantile) ? ' active' : '')} onClick={() => onSelectQuantile(item.quantile)}>
                        <div className="factor-board-legend-main">
                            <span className="factor-board-legend-swatch" style={{ background: item.color }}></span>
                            <span className="factor-board-legend-name">Q{item.quantile}</span>
                        </div>
                        <span className={'factor-board-legend-return ' + (Number(item.returnPct || 0) >= 0 ? 'positive' : 'negative')}>
                            {Number(item.returnPct || 0) >= 0 ? '+' : ''}{Number(item.returnPct || 0).toFixed(2)}%
                        </span>
                    </button>
                ))}
                {usableSpread.length > 1 && (
                    <div className="factor-board-legend-item spread">
                        <div className="factor-board-legend-main">
                            <span className="factor-board-legend-swatch spread"></span>
                            <span className="factor-board-legend-name subtle">{'澶氱┖浠峰樊'}</span>
                        </div>
                        <span className={'factor-board-legend-return ' + (spreadReturn >= 0 ? 'positive' : 'negative')}>
                            {spreadReturn >= 0 ? '+' : ''}{spreadReturn.toFixed(2)}%
                        </span>
                    </div>
                )}
            </div>
            <div className="factor-board-chart-note">{noteText}</div>
        </div>
    );
}

/* ===== Factor Mining Page ===== */
function FactorMiningPage({ showToast }) {
    const MINING_STORE_KEY = 'qtsys_factor_mining_ui_state_v3';
    const getMiningStore = () => {
        if (!window.__QTSYS_FACTOR_MINING__) {
            let persisted = {};
            try { persisted = JSON.parse(localStorage.getItem(MINING_STORE_KEY) || '{}') || {}; } catch (e) { persisted = {}; }
            window.__QTSYS_FACTOR_MINING__ = {
                sessionId: persisted.sessionId || '',
                status: persisted.status || null,
                results: Array.isArray(persisted.results) ? persisted.results : [],
                lastId: Number(persisted.lastId || 0),
                logs: Array.isArray(persisted.logs) ? persisted.logs : [],
                form: persisted.form || null,
            };
        }
        return window.__QTSYS_FACTOR_MINING__;
    };
    const saveMiningStore = (patch) => {
        const store = getMiningStore();
        Object.assign(store, patch || {});
        try {
            localStorage.setItem(MINING_STORE_KEY, JSON.stringify({
                sessionId: store.sessionId || '',
                status: store.status || null,
                results: [],
                lastId: Number(store.lastId || 0),
                logs: (store.logs || []).slice(-120),
                form: store.form || null,
            }));
        } catch (e) {}
    };
    const storedMining = getMiningStore();
    const toInputDate = (text) => {
        const value = compactDate(text);
        return value && value.length === 8 ? `${value.slice(0, 4)}-${value.slice(4, 6)}-${value.slice(6, 8)}` : '';
    };
    const defaultMiningForm = {
        universe_type: 'system',
        universe_code: '000016.SH',
        custom_pool_id: '',
        start_date: toInputDate(shiftCompactDate(todayCompactDate(), -430)),
        end_date: toInputDate(todayCompactDate()),
        max_stocks: 50,
        candidate_count: 12,
        gp_generations: 2,
        gp_population: 12,
        select_pct: 0.1,
        rebalance_days: 5,
        protocol_version: 'v4',
        research_mode: 'professional',
        factor_themes: [],
        neutralize: 'rank_zscore',
        walk_forward_windows: 3,
        embargo_days: 5,
        max_trials: 0,
        capacity_limit_pct: 0.10,
        min_dsr: -0.25,
    };
    const [options, setOptions] = useState({ system_universes: [], custom_pools: [] });
    const [form, setForm] = useState({ ...defaultMiningForm, ...(storedMining.form || {}) });
    const [starting, setStarting] = useState(false);
    const [stopping, setStopping] = useState(false);
    const [sessionId, setSessionId] = useState(storedMining.sessionId || '');
    const [status, setStatus] = useState(storedMining.status || null);
    const [results, setResults] = useState(Array.isArray(storedMining.results) ? storedMining.results : []);
    const [lastId, setLastId] = useState(Number(storedMining.lastId || 0));
    const [logs, setLogs] = useState(Array.isArray(storedMining.logs) ? storedMining.logs : []);
    const [savingExpression, setSavingExpression] = useState('');
    const [revalidatingId, setRevalidatingId] = useState(null);
    const [reportModal, setReportModal] = useState(null);
    const [reportLoadingId, setReportLoadingId] = useState(null);
    const pollRef = useRef(null);
    const lastIdRef = useRef(Number(storedMining.lastId || 0));

    useEffect(() => {
        api.get('/api/factor_mining/options').then(setOptions).catch(() => {});
    }, []);

    useEffect(() => {
        return () => { if (pollRef.current) clearInterval(pollRef.current); };
    }, []);

    useEffect(() => {
        saveMiningStore({ form });
    }, [form]);

    useEffect(() => {
        saveMiningStore({ sessionId, status, results, lastId, logs, form });
    }, [sessionId, status, results, lastId, logs, form]);

    const factorRankScore = (item) => {
        const excess = Number(item && (item.test_excess_return ?? (item.backtest_metrics && item.backtest_metrics.excess_return)));
        const score = Number(item && item.score);
        const drawdown = Number(item && item.backtest_metrics && item.backtest_metrics.max_drawdown);
        const value = (Number.isFinite(excess) ? excess : 0) + (Number.isFinite(score) ? score * 6 : 0) - (Number.isFinite(drawdown) ? Math.max(drawdown, 0) * 0.03 : 0);
        return Number.isFinite(value) ? value : -999999;
    };
    const rankedResults = useMemo(() => [...results].sort((a, b) => factorRankScore(b) - factorRankScore(a)), [results]);
    const best = rankedResults.length ? rankedResults[0] : null;
    const chartResults = useMemo(() => {
        const sorted = [...rankedResults];
        const top = sorted.slice(0, 5);
        const bottom = sorted.length > 5 ? sorted.slice(-5) : [];
        const map = new Map();
        [...top, ...bottom].forEach(item => {
            if (item && item.id !== undefined) map.set(item.id, item);
        });
        return Array.from(map.values());
    }, [rankedResults]);
    const chartData = useMemo(() => {
        const map = {};
        const toFinite = (value, fallback = null) => {
            const numValue = Number(value);
            return Number.isFinite(numValue) ? numValue : fallback;
        };
        const pickDisplayCurve = (item) => (item && (item.display_normalized_curve || item.normalized_curve)) || [];
        chartResults.forEach((item, idx) => {
            pickDisplayCurve(item).forEach(point => {
                const date = String(point.date || '');
                if (!date) return;
                if (!map[date]) map[date] = { date };
                map[date]['f' + idx] = toFinite(point.value);
            });
        });
        const benchmarkCurve = best && (best.display_benchmark_normalized_curve || best.benchmark_normalized_curve);
        if (Array.isArray(benchmarkCurve)) {
            benchmarkCurve.forEach(point => {
                const date = String(point.date || '');
                if (!date) return;
                if (!map[date]) map[date] = { date };
                map[date].benchmark = toFinite(point.value);
            });
        }
        const excessCurve = best && (best.display_excess_curve || best.excess_curve);
        if (Array.isArray(excessCurve)) {
            const rawExcess = excessCurve.map(point => Number(point && point.value)).filter(Number.isFinite);
            const looksLikeNormalizedExcess = rawExcess.length > 0
                && Math.abs(rawExcess[0] - 1) < 0.08
                && rawExcess.every(value => value > 0.2 && value < 2.5);
            excessCurve.forEach(point => {
                const date = String(point.date || '');
                if (!date) return;
                if (!map[date]) map[date] = { date };
                const value = toFinite(point.value);
                map[date].excessPct = value === null ? null : (looksLikeNormalizedExcess ? (value - 1) * 100 : value);
            });
        }
        return Object.values(map).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    }, [chartResults, best]);
    const chartYDomain = useMemo(() => {
        const values = [];
        chartData.forEach(row => {
            Object.keys(row).forEach(key => {
                if (key === 'date' || key === 'excessPct') return;
                const value = Number(row[key]);
                if (Number.isFinite(value)) values.push(value);
            });
        });
        if (!values.length) return [0.95, 1.05];
        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);
        const center = (minVal + maxVal) / 2;
        const halfRange = Math.max((maxVal - minVal) / 2, 0.015);
        const pad = halfRange * 0.28;
        return [Number((center - halfRange - pad).toFixed(4)), Number((center + halfRange + pad).toFixed(4))];
    }, [chartData]);
    const excessYDomain = useMemo(() => {
        const values = [];
        chartData.forEach(row => {
            const value = Number(row.excessPct);
            if (Number.isFinite(value)) values.push(value);
        });
        if (!values.length) return [-5, 5];
        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);
        const span = Math.max(maxVal - minVal, 2);
        const pad = Math.max(span * 0.18, 1);
        return [Number((minVal - pad).toFixed(2)), Number((maxVal + pad).toFixed(2))];
    }, [chartData]);
    const palette = ['#60a5fa', '#34d399', '#f59e0b', '#f472b6', '#a78bfa', '#22d3ee', '#fb7185', '#84cc16'];
    const pct = (value) => {
        const num = Number(value);
        return Number.isFinite(num) ? num.toFixed(2) + '%' : '-';
    };
    const num = (value, digits = 3) => {
        const n = Number(value);
        return Number.isFinite(n) ? n.toFixed(digits) : '-';
    };
    const rankScore = (item) => {
        const excess = Number(item && (item.test_excess_return ?? (item.backtest_metrics && item.backtest_metrics.excess_return)));
        if (Number.isFinite(excess)) return excess;
        return Number(item && item.score || 0);
    };
    const isRunning = !!(status && status.running);
    const tested = Number(status && status.tested_count || 0);
    const accepted = Number(status && status.accepted_count || 0);
    const hitRate = tested > 0 ? Math.min(100, accepted / tested * 100) : 0;
    const statusKind = status && status.status === 'failed' ? 'failed' : isRunning ? 'running' : '';
    const directionLabel = (value) => value === 'bottom' ? '\u4f4e\u503c\u7ec4\u5360\u4f18' : '\u9ad8\u503c\u7ec4\u5360\u4f18';
    const metricValueClass = (value) => {
        const n = Number(value);
        if (!Number.isFinite(n) || n === 0) return '';
        return n > 0 ? 'text-profit' : 'text-loss';
    };
    const csvEscape = (value) => `"${String(value === undefined || value === null ? '' : value).replace(/"/g, '""')}"`;
    const downloadSummary = () => {
        const headers = ['鍥犲瓙鍚嶇О', '涓婚', '鍥犲瓙鍏紡', 'IC鍊?, 'IR鍊?, 'p-value', 'DSR', 'PBO椋庨櫓', '鏈€澶у洖鎾?, '娴嬭瘯瓒呴', '骞村寲鏀剁泭', '鍗忚鐗堟湰'];
        const rows = results.map(item => [
            item.name || '',
            item.theme || '',
            item.expression || '',
            num(item.valid_metrics && item.valid_metrics.ic_mean, 6),
            num(item.valid_metrics && item.valid_metrics.ic_ir, 6),
            num(item.p_value, 6),
            num(item.dsr, 4),
            item.pbo_risk || '',
            pct(item.backtest_metrics && item.backtest_metrics.max_drawdown),
            pct(item.backtest_metrics && item.backtest_metrics.excess_return),
            pct(item.backtest_metrics && item.backtest_metrics.annual_return),
            item.protocol_version || '',
        ]);
        const csv = '\ufeff' + [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `factor_mining_${sessionId || 'results'}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    };

    const appendLog = (message) => {
        const text = String(message || '').trim();
        if (!text) return;
        setLogs(prev => {
            if (prev.length && prev[prev.length - 1].text === text) return prev;
            return [...prev.slice(-80), { time: new Date().toLocaleTimeString(), text }];
        });
    };

    const mergeResults = (items) => {
        if (!Array.isArray(items) || !items.length) return;
        setResults(prev => {
            const map = new Map(prev.map(item => [item.id, item]));
            items.forEach(item => map.set(item.id, item));
            return Array.from(map.values()).sort((a, b) => rankScore(b) - rankScore(a));
        });
    };

    const fetchIncrementalResults = async (sid) => {
        const res = await api.get(`/api/factor_mining/sessions/${sid}/results?after_id=${lastIdRef.current}&limit=80`);
        const items = Array.isArray(res && res.items) ? res.items : [];
        if (items.length) {
            mergeResults(items);
            const nextId = Number(res.last_id || items[items.length - 1].id || lastIdRef.current);
            lastIdRef.current = nextId;
            setLastId(nextId);
        }
    };
    const loadSessionResults = async (sid) => {
        const res = await api.get(`/api/factor_mining/sessions/${sid}/results?after_id=0&limit=200`);
        const items = Array.isArray(res && res.items) ? res.items : [];
        setResults(items.sort((a, b) => rankScore(b) - rankScore(a)));
        const nextId = Number(res.last_id || (items.length ? items[items.length - 1].id : 0) || 0);
        lastIdRef.current = nextId;
        setLastId(nextId);
    };

    const pollSession = (sid) => {
        if (pollRef.current) clearInterval(pollRef.current);
        const tick = async () => {
            try {
                const st = await api.get(`/api/factor_mining/sessions/${sid}/status`);
                setStatus(st);
                appendLog(st.message);
                await fetchIncrementalResults(sid);
                if (!st.running && pollRef.current) {
                    clearInterval(pollRef.current);
                    pollRef.current = null;
                }
            } catch (e) {
                appendLog((e && e.detail) || '\u8f6e\u8be2\u6316\u6398\u72b6\u6001\u5931\u8d25');
                if (pollRef.current) {
                    clearInterval(pollRef.current);
                    pollRef.current = null;
                }
            }
        };
        tick();
        pollRef.current = setInterval(tick, 2000);
    };

    const attachSession = async (sid, options = {}) => {
        if (!sid) return;
        setSessionId(sid);
        if (options.reset) {
            setResults([]);
            setLogs([]);
            lastIdRef.current = 0;
            setLastId(0);
        }
        try {
            const st = await api.get(`/api/factor_mining/sessions/${sid}/status`);
            setStatus(st);
            appendLog(st.message || (st.running ? '宸叉仮澶嶆鍦ㄨ繍琛岀殑鎸栨帢浼氳瘽' : '宸叉仮澶嶆渶杩戜竴娆℃寲鎺樹細璇?));
            await loadSessionResults(sid);
            if (st.running) pollSession(sid);
        } catch (e) {
            appendLog((e && e.detail) || '鎭㈠鎸栨帢浼氳瘽澶辫触');
        }
    };

    useEffect(() => {
        let cancelled = false;
        const restore = async () => {
            const storedSid = getMiningStore().sessionId;
            if (storedSid) {
                await attachSession(storedSid);
                return;
            }
            try {
                const active = await api.get('/api/factor_mining/sessions/active');
                if (!cancelled && active && active.has_session && active.session && active.session.session_id) {
                    await attachSession(active.session.session_id);
                }
            } catch (e) {}
        };
        restore();
        return () => { cancelled = true; };
    }, []);

    const runMining = async () => {
        setStarting(true);
        try {
            const payload = {
                universe_type: form.universe_type,
                universe_code: form.universe_type === 'system' ? form.universe_code : '',
                custom_pool_id: form.universe_type === 'custom' ? Number(form.custom_pool_id || 0) || null : null,
                start_date: compactDate(form.start_date),
                end_date: compactDate(form.end_date),
                max_stocks: Number(form.max_stocks || 50),
                candidate_count: Number(form.candidate_count || 12),
                gp_generations: Number(form.gp_generations || 0),
                gp_population: Number(form.gp_population || 0),
                select_pct: Number(form.select_pct || 0.1),
                rebalance_days: Number(form.rebalance_days || 5),
                max_depth: 4,
                max_expression_length: 600,
                auto_stop_candidates: 0,
                protocol_version: 'v4',
                research_mode: form.research_mode || 'professional',
                factor_themes: Array.isArray(form.factor_themes) ? form.factor_themes : [],
                neutralize: form.neutralize || 'rank_zscore',
                walk_forward_windows: Number(form.walk_forward_windows || 3),
                embargo_days: Number(form.embargo_days || 5),
                max_trials: Number(form.max_trials || 0),
                capacity_limit_pct: Number(form.capacity_limit_pct || 0.10),
                min_dsr: Number(form.min_dsr ?? -0.25),
            };
            const data = await api.post('/api/factor_mining/sessions', payload);
            const sid = data.session_id;
            setSessionId(sid);
            setResults([]);
            setStatus({ running: true, status: 'running', phase: 'queued', message: '\u6316\u6398\u4efb\u52a1\u5df2\u63d0\u4ea4', tested_count: 0, accepted_count: 0, best_score: 0 });
            lastIdRef.current = 0;
            setLastId(0);
            setLogs([]);
            appendLog(data.already_running ? '\u5df2\u6709\u6316\u6398\u4efb\u52a1\u5728\u8fd0\u884c\uff0c\u5df2\u63a5\u5165\u5f53\u524d\u4f1a\u8bdd' : '\u6301\u7eed\u6316\u6398\u5df2\u542f\u52a8');
            pollSession(sid);
            if (data.already_running) await loadSessionResults(sid);
            showToast('\u6301\u7eed\u56e0\u5b50\u6316\u6398\u5df2\u542f\u52a8', 'success');
        } catch (e) {
            showToast((e && e.detail) || '\u56e0\u5b50\u6316\u6398\u5931\u8d25', 'error');
        }
        setStarting(false);
    };

    const stopMining = async () => {
        if (!sessionId) return;
        setStopping(true);
        try {
            const res = await api.post(`/api/factor_mining/sessions/${sessionId}/stop`, {});
            appendLog((res && res.message) || '\u5df2\u53d1\u9001\u505c\u6b62\u8bf7\u6c42');
            showToast((res && res.message) || '\u5df2\u53d1\u9001\u505c\u6b62\u8bf7\u6c42', 'success');
        } catch (e) {
            showToast((e && e.detail) || '\u505c\u6b62\u6316\u6398\u5931\u8d25', 'error');
        }
        setStopping(false);
    };

    const saveFactor = async (item) => {
        if (!item || !item.expression) return;
        setSavingExpression(item.expression);
        try {
            const res = await api.post('/api/factor_mining/save_factor', {
                name: item.name || '\u6316\u6398\u56e0\u5b50',
                description: `${item.description || ''}\nprotocol=${item.protocol_version || 'legacy_unverified'}; status=${item.validation_status || item.revalidation_status || '-'}; test_ic=${num(item.test_metrics && item.test_metrics.ic_mean)}; test_excess=${pct(item.backtest_metrics && item.backtest_metrics.excess_return)}; return=${pct(item.backtest_metrics && item.backtest_metrics.total_return)}`,
                expression: item.expression,
                candidate_id: item.id,
            });
            showToast((res && res.name ? res.name : '\u56e0\u5b50') + ' \u5df2\u4fdd\u5b58', 'success');
        } catch (e) {
            showToast((e && e.detail) || '\u4fdd\u5b58\u56e0\u5b50\u5931\u8d25', 'error');
        }
        setSavingExpression('');
    };

    const revalidateCandidate = async (item) => {
        if (!item || !item.id) return;
        setRevalidatingId(item.id);
        try {
            const res = await api.post(`/api/factor_mining/candidates/${item.id}/revalidate`, {});
            if (res && res.success && res.candidate) {
                mergeResults([res.candidate]);
                showToast('\u5df2\u6309\u4e25\u683c\u6837\u672c\u5916\u53e3\u5f84\u91cd\u65b0\u9a8c\u8bc1', 'success');
            } else {
                showToast((res && res.message) || '\u5019\u9009\u672a\u901a\u8fc7\u4e25\u683c\u9a8c\u8bc1', 'warning');
            }
        } catch (e) {
            showToast((e && e.detail) || '\u91cd\u65b0\u9a8c\u8bc1\u5931\u8d25', 'error');
        }
        setRevalidatingId(null);
    };

    const openResearchReport = async (item) => {
        if (!item || !item.id) return;
        setReportLoadingId(item.id);
        try {
            const res = await api.get(`/api/factor_mining/research_report/${item.id}`);
            setReportModal(res && res.research_card ? res.research_card : null);
        } catch (e) {
            showToast((e && e.detail) || '\u7814\u7a76\u62a5\u544a\u52a0\u8f7d\u5931\u8d25', 'error');
        }
        setReportLoadingId(null);
    };

    return (
        <div className="factor-mining-shell fade-in">
            <section className="card factor-mining-panel">
                <div className="factor-mining-toolbar">
                    <div>
                        <div className="factor-mining-title">{'\u56e0\u5b50\u6316\u6398'}</div>
                        <div className="factor-mining-copy">{'\u6301\u7eed\u641c\u7d22\u6570\u5b66\u3001\u65f6\u5e8f\u3001\u7edf\u8ba1\u56de\u5f52\u548c\u6761\u4ef6\u903b\u8f91\u7b97\u5b50\u7ec4\u5408\uff0c\u6bcf\u53d1\u73b0\u4e00\u4e2a\u901a\u8fc7\u771f\u5b9e\u6570\u636e\u9a8c\u8bc1\u7684\u56e0\u5b50\u5c31\u7acb\u5373\u5c55\u793a\u3002'}</div>
                    </div>
                    <div className="factor-mining-actions">
                        <button className="btn btn-primary" onClick={runMining} disabled={starting || isRunning || (form.universe_type === 'custom' && !form.custom_pool_id)}>
                            {starting ? <span className="spinner"/> : null}{starting ? '\u542f\u52a8\u4e2d...' : '\u5f00\u59cb\u6301\u7eed\u6316\u6398'}
                        </button>
                        <button className="btn btn-secondary" onClick={stopMining} disabled={!isRunning || stopping}>
                            {stopping ? <span className="spinner"/> : null}{stopping ? '\u505c\u6b62\u4e2d...' : '\u505c\u6b62\u6316\u6398'}
                        </button>
                    </div>
                </div>
            </section>

            <section className="card factor-mining-panel space-y">
                <div className="grid-4">
                    <div className="field">
                        <label className="label">{'\u80a1\u7968\u6c60\u7c7b\u578b'}</label>
                        <select className="input" value={form.universe_type} onChange={e => setForm(prev => ({ ...prev, universe_type: e.target.value }))}>
                            <option value="system">{'\u7cfb\u7edf\u80a1\u7968\u6c60'}</option>
                            <option value="custom">{'\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60'}</option>
                        </select>
                    </div>
                    {form.universe_type === 'system' ? (
                        <div className="field">
                            <label className="label">{'\u7cfb\u7edf\u80a1\u7968\u6c60'}</label>
                            <select className="input" value={form.universe_code} onChange={e => setForm(prev => ({ ...prev, universe_code: e.target.value }))}>
                                {(options.system_universes || []).map(item => <option key={item.code} value={item.code}>{item.name || item.code}</option>)}
                            </select>
                        </div>
                    ) : (
                        <div className="field">
                            <label className="label">{'\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60'}</label>
                            <select className="input" value={form.custom_pool_id} onChange={e => setForm(prev => ({ ...prev, custom_pool_id: e.target.value }))}>
                                <option value="">{'\u8bf7\u9009\u62e9'}</option>
                                {(options.custom_pools || []).map(item => <option key={item.id} value={item.id}>{item.name} ({item.stock_count})</option>)}
                            </select>
                        </div>
                    )}
                    <div className="field"><label className="label">{'\u5f00\u59cb\u65e5\u671f'}</label><input className="input" type="date" value={form.start_date} onChange={e => setForm(prev => ({ ...prev, start_date: e.target.value }))}/></div>
                    <div className="field"><label className="label">{'\u7ed3\u675f\u65e5\u671f'}</label><input className="input" type="date" value={form.end_date} onChange={e => setForm(prev => ({ ...prev, end_date: e.target.value }))}/></div>
                    <div className="field"><label className="label">{'\u6700\u5927\u80a1\u7968\u6570'}</label><input className="input" type="number" min="5" max="500" value={form.max_stocks} onChange={e => setForm(prev => ({ ...prev, max_stocks: Number(e.target.value || 50) }))}/></div>
                    <div className="field"><label className="label">{'\u5c55\u793a\u76ee\u6807\u6570'}</label><input className="input" type="number" min="3" max="200" value={form.candidate_count} onChange={e => setForm(prev => ({ ...prev, candidate_count: Number(e.target.value || 12) }))}/></div>
                    <div className="field"><label className="label">{'\u9057\u4f20\u4ee3\u6570'}</label><input className="input" type="number" min="0" max="8" value={form.gp_generations} onChange={e => setForm(prev => ({ ...prev, gp_generations: Number(e.target.value || 0) }))}/></div>
                    <div className="field"><label className="label">{'\u8c03\u4ed3\u95f4\u9694'}</label><input className="input" type="number" min="1" max="60" value={form.rebalance_days} onChange={e => setForm(prev => ({ ...prev, rebalance_days: Number(e.target.value || 5) }))}/></div>
                    <div className="field">
                        <label className="label">{'\u9884\u5904\u7406\u53e3\u5f84'}</label>
                        <select className="input" value={form.neutralize} onChange={e => setForm(prev => ({ ...prev, neutralize: e.target.value }))}>
                            <option value="rank_zscore">{'\u53bb\u6781\u503c + Rank + ZScore'}</option>
                            <option value="rank">{'\u53bb\u6781\u503c + Rank'}</option>
                            <option value="zscore">{'\u53bb\u6781\u503c + ZScore'}</option>
                        </select>
                    </div>
                    <div className="field"><label className="label">{'Walk-forward \u7a97\u53e3'}</label><input className="input" type="number" min="2" max="8" value={form.walk_forward_windows} onChange={e => setForm(prev => ({ ...prev, walk_forward_windows: Number(e.target.value || 3) }))}/></div>
                    <div className="field"><label className="label">{'Embargo \u5929\u6570'}</label><input className="input" type="number" min="0" max="30" value={form.embargo_days} onChange={e => setForm(prev => ({ ...prev, embargo_days: Number(e.target.value || 5) }))}/></div>
                    <div className="field"><label className="label">{'\u6700\u5927\u5c1d\u8bd5\u6570'}</label><input className="input" type="number" min="0" max="100000" value={form.max_trials} onChange={e => setForm(prev => ({ ...prev, max_trials: Number(e.target.value || 0) }))}/></div>
                    <div className="field"><label className="label">{'\u5bb9\u91cf\u4e0a\u9650'}</label><input className="input" type="number" step="0.01" min="0.01" max="0.5" value={form.capacity_limit_pct} onChange={e => setForm(prev => ({ ...prev, capacity_limit_pct: Number(e.target.value || 0.1) }))}/></div>
                    <div className="field"><label className="label">{'DSR \u95e8\u69db'}</label><input className="input" type="number" step="0.05" min="-5" max="5" value={form.min_dsr} onChange={e => setForm(prev => ({ ...prev, min_dsr: Number(e.target.value || -0.25) }))}/></div>
                </div>
                <div className="factor-mining-toggle" style={{marginTop:10}}>

                            <div className="factor-mining-metric"><span>{'\u56e0\u5b50\u5bb6\u65cf'}</span><b>{reportModal.fingerprint && reportModal.fingerprint.family || '-'}</b></div>
                        </div>
                        <div className="factor-mining-expression" style={{whiteSpace:'pre-wrap'}}>
                            {'\u7ecf\u6d4e\u5b66\u5047\u8bbe\uff1a'}{reportModal.hypothesis || '-'}{'\n\n'}
                            {'\u56e0\u5b50\u516c\u5f0f\uff1a'}{reportModal.formula || '-'}{'\n\n'}
                            {'\u9884\u5904\u7406\uff1a'}{JSON.stringify(reportModal.preprocessing || {}, null, 2)}{'\n\n'}
                            {'\u7a33\u5065\u6027\uff1a'}{JSON.stringify(reportModal.robustness || {}, null, 2)}{'\n\n'}
                            {'\u56e0\u5b50\u6307\u7eb9\uff1a'}{JSON.stringify(reportModal.fingerprint || {}, null, 2)}{'\n\n'}
                            {'JoinQuant \u590d\u9a8c\u8bf4\u660e\uff1a'}{JSON.stringify(reportModal.joinquant || {}, null, 2)}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

/* ===== Main App ===== */
function App() {
    const pageNavItems = [
        { key: 'backtest', label: '鍥炴祴' },
        { key: 'strategy', label: '绛栫暐' },
        { key: 'portfolio', label: '缁勫悎' },
        { key: 'market', label: '鐪嬬洏' },
        { key: 'factor', label: '鍥犲瓙' },
        { key: 'factormining', label: '\u56e0\u5b50\u6316\u6398' },
        { key: 'workflow', label: '鍥犲瓙宸ヤ綔娴? },
        { key: 'factorboard', label: '鍥犲瓙鐪嬫澘' },
        { key: 'news', label: '鏂伴椈' },
        { key: 'history', label: '鍘嗗彶' },
        { key: 'settings', label: '璁剧疆' },
        { key: 'help', label: '甯姪' },
    ];
    const resolveInitialPage = () => {
        try {
            const params = new URLSearchParams(window.location.search || '');
            const pageParam = params.get('page');
            const hashPage = (window.location.hash || '').replace(/^#/, '');
            const allowed = new Set(pageNavItems.map(item => item.key));
            if (pageParam && allowed.has(pageParam)) return pageParam;
            if (hashPage && allowed.has(hashPage)) return hashPage;
        } catch (_) {}
        return 'backtest';
    };
    const [page, setPage] = useState(resolveInitialPage);
    const [toast, setToast] = useState(null);
    const [sysVersion, setSysVersion] = useState('');
    const [health, setHealth] = useState({ status: 'checking' });
    const showToast = (message, type) => setToast({ message, type: type || 'info' });
    const loadHealth = useCallback(() => {
        api.get('/api/system/health', { timeoutMs: 12000 })
            .then(setHealth)
            .catch(e => setHealth({ status: 'degraded', database: { ok: false, error: (e && e.detail) || '鍋ュ悍妫€鏌ュけ璐? }, settings: {} }));
    }, []);

    useEffect(() => {
        api.get('/api/system/version').then(v => setSysVersion(v.version || '')).catch(() => {});
        loadHealth();
    }, [loadHealth]);

    useEffect(() => {
        try {
            const url = new URL(window.location.href);
            url.searchParams.set('page', page);
            url.hash = page;
            window.history.replaceState({}, '', url.toString());
        } catch (_) {}
    }, [page]);

    const navItems = [
        { key: 'backtest', label: '鍥炴祴' },
        { key: 'strategy', label: '绛栫暐' },
        { key: 'portfolio', label: '缁勫悎' },
        { key: 'market', label: '鐪嬬洏' },
        { key: 'factor', label: '鍥犲瓙' },
        { key: 'factormining', label: '\u56e0\u5b50\u6316\u6398' },
        { key: 'workflow', label: '鍥犲瓙宸ヤ綔娴? },
        { key: 'factorboard', label: '鍥犲瓙鐪嬫澘' },
        { key: 'news', label: '鏂伴椈' },
        { key: 'history', label: '鍘嗗彶' },
        { key: 'settings', label: '璁剧疆' },
        { key: 'help', label: '甯姪' },
    ];

    return (
        <div className="app">
            <header className="header">
                <div className="header-brand">
                    <h1>QTsys</h1>
                    <span>閲忓寲浜ゆ槗鍒嗘瀽鍥炴祴绯荤粺</span>
                    {sysVersion && <span style={{fontSize:10,color:'var(--text-500)',marginLeft:4}}>v{sysVersion}</span>}
                </div>
                <nav className="nav">
                    {navItems.map(n => (
                        <button key={n.key} onClick={() => setPage(n.key)}
                            className={'nav-btn' + (page === n.key ? ' active' : '')}>
                            {n.label}
                        </button>
                    ))}
                </nav>
            </header>
            <SystemHealthStrip health={health} onRefresh={loadHealth} />
            <main className="main">
                {page === 'settings' && <SettingsPage showToast={showToast} />}
                {page === 'strategy' && <StrategyPage showToast={showToast} openBacktestWithStrategy={() => setPage('backtest')} />}
                {page === 'backtest' && <BacktestPage showToast={showToast} openHistoryWithResult={() => setPage('history')} />}
                {page === 'portfolio' && <PortfolioPage showToast={showToast} />}
                {page === 'market' && <MarketPage showToast={showToast} />}
                {page === 'factor' && <FactorPage showToast={showToast} openStrategyWorkspace={() => setPage('strategy')} openBacktestWithStrategy={() => setPage('backtest')} />}
                {page === 'factormining' && <FactorMiningPage showToast={showToast} />}
                {page === 'workflow' && <FactorWorkflowPage showToast={showToast} />}
                {page === 'factorboard' && <FactorBoardPage showToast={showToast} openStrategyWorkspace={() => setPage('strategy')} />}
                {page === 'news' && <NewsPage showToast={showToast} />}
                {page === 'history' && <HistoryPage showToast={showToast} openPortfolioWorkspace={() => setPage('portfolio')} />}
                {page === 'help' && <HelpPage showToast={showToast} />}
            </main>
            {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
