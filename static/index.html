                    <div className="field"><label className="label">{'\u5f53\u524d\u80a1\u7968\u6c60'}</label><div className="factor-board-status"><span className="factor-board-dot"></span><span>{analysisForm.universe_type === 'system' ? ((selectedSystemUniverse && selectedSystemUniverse.name) || '\u7cfb\u7edf\u80a1\u7968\u6c60') : ((selectedCustomPool && selectedCustomPool.name) || '\u672a\u9009\u62e9\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60')}</span></div></div>
                </div>
            </section>
            </div>

            <section className="card space-y factor-board-panel">
                <div className="factor-board-toolbar">
                    <div>
                        <div className="card-title" style={{marginBottom: 6}}>因子收益总览</div>
                        <div className="factor-board-subtle">点击任意因子可查看详细收益曲线、公式说明和最新持仓</div>
                    </div>
                    <div className="factor-board-toolbar-right">
                        <div className="factor-board-results-tip">{'\u8868\u683c\u652f\u6301\u6eda\u52a8\u67e5\u770b\u5168\u90e8\u5217'}</div>
                        <div className="factor-board-results-tip">{'高分位超额=最高因子值分位相对基准超额；低分位超额=最低因子值分位相对基准超额；低分位超额高于高分位超额时，通常表示反向信号更强。'}</div>
                        <div className="factor-board-subtle">{'\u5c55\u793a '}{filteredResults.length}{' / '}{results.length}{' \u4e2a\u56e0\u5b50'}</div>
                    </div>
                </div>
                {loading ? <div className="factor-board-empty">正在加载因子看板数据...</div> : filteredResults.length === 0 ? <div className="factor-board-empty">暂无可展示的因子结果，请先配置数据库并运行分析。</div> : (
                    <div className="table-wrap factor-board-results-wrap">
                        <table className="factor-board-table">
                            <thead>
                                <tr>
                                    <th>因子</th>
                                    <th>股票池</th>
                                    <th>高分位超额</th>
                                    <th>低分位超额</th>
                                    <th>IC 均值</th>
                                    <th>IR</th>
                                    <th>覆盖率</th>
                                    <th>换手</th>
                                    <th>最新交易日</th>
                                    <th>详情</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredResults.map(item => {
                                    const rowPositive = getSpreadExcess(item) >= 0;
                                    return (
                                        <tr key={(item.factor_name || '-') + '-' + (item.universe_name || '-')} className={rowPositive ? 'factor-board-row-positive' : 'factor-board-row-negative'}>
                                            <td>
                                                <div className="factor-board-factor-cell">
                                                    <button className={'factor-board-fav-btn' + (isFavoriteFactor(item.factor_name) ? ' active' : '')} onClick={() => toggleFavoriteFactor(item.factor_name)} title={isFavoriteFactor(item.factor_name) ? '取消收藏' : '收藏因子'}>{isFavoriteFactor(item.factor_name) ? '★' : '☆'}</button>
                                                    <span className={getFactorDirectionClass(item)}>{getFactorDirectionLabel(item)}</span>
                                                    <div className="factor-board-factor-meta">
                                                        <span className="factor-board-link" onClick={() => setSelectedFactor(item.factor_name)}>{item.factor_name}</span>
                                                        <span className="factor-board-subtle">{item.universe_name || '\u9ed8\u8ba4\u80a1\u7968\u6c60'}{' · 高低分位差 '}{formatPct(getSpreadExcess(item))}{' · 最新 '}{item.latest_trade_date || '-'}</span>
                                                    </div>
                                                </div>
                                            </td>
                                            <td>{item.universe_name || '-'}</td>
                                            <td><span className={metricToneClass(item.max_quantile_excess)}>{formatPct(item.max_quantile_excess)}</span></td>
                                            <td><span className={metricToneClass(item.min_quantile_excess)}>{formatPct(item.min_quantile_excess)}</span></td>
                                            <td className={metricTextClass(item.ic_mean)}>{formatNum(item.ic_mean)}</td>
                                            <td className={metricTextClass(item.ir_value)}>{formatNum(item.ir_value)}</td>
                                            <td>{formatPct(item.coverage_ratio)}</td>
                                            <td>{formatPct(item.max_quantile_turnover)}</td>
                                            <td>{item.latest_trade_date || '-'}</td>
                                            <td className="factor-board-row-action">
                                                <button className="btn btn-secondary factor-board-detail-btn" onClick={() => setSelectedFactor(item.factor_name)}>查看详情</button>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                )}
            </section>

            {showPoolManager && (
                <div className="factor-board-modal" onClick={() => setShowPoolManager(false)}>
                    <div className="factor-board-modal-card" onClick={e => e.stopPropagation()}>
                        <div className="factor-board-modal-head">
                            <div>
                                <div className="factor-board-modal-title">{'\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60\u7ba1\u7406'}</div>
                                <div className="factor-board-modal-copy">{'\u641c\u7d22\u80a1\u7968\u3001\u4fdd\u5b58\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60\uff0c\u5e76\u5728\u5206\u6790\u65f6\u590d\u7528\u3002'}</div>
                            </div>
                            <button className="btn btn-secondary" onClick={() => setShowPoolManager(false)}>{'\u5173\u95ed'}</button>
                        </div>
                        <section className="card space-y factor-board-panel">
                            <div className="factor-board-toolbar">
                                <div>
                                    <div className="card-title" style={{marginBottom: 6}}>{'\u80a1\u7968\u6c60\u7f16\u8f91\u5668'}</div>
                                    <div className="factor-board-subtle">{'\u53ef\u65b0\u5efa\u3001\u7f16\u8f91\u3001\u5220\u9664\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60\u3002'}</div>
                                </div>
                                <div className="factor-board-toolbar-right">
                                    <button className="btn btn-secondary" onClick={resetPoolForm}>{'\u65b0\u5efa'}</button>
                                    <button className="btn btn-primary" onClick={savePool} disabled={poolSaving}>{poolSaving ? '\u4fdd\u5b58\u4e2d...' : (poolForm.id ? '\u66f4\u65b0\u80a1\u7968\u6c60' : '\u4fdd\u5b58\u80a1\u7968\u6c60')}</button>
                                    {poolForm.id ? <button className="btn btn-secondary" onClick={deletePool} disabled={poolDeleting}>{poolDeleting ? '\u5220\u9664\u4e2d...' : '\u5220\u9664'}</button> : null}
                                </div>
                            </div>
                            <div className="grid-2">
                                <div className="field"><label className="label">{'\u80a1\u7968\u6c60\u540d\u79f0'}</label><input className="input" value={poolForm.name} placeholder="\u4f8b\u5982\uff1a\u6d88\u8d39\u9f99\u5934\u6c60" onChange={e => setPoolForm({ ...poolForm, name: e.target.value })} /></div>
                                <div className="field"><label className="label">{'\u6210\u5206\u6570\u91cf'}</label><div className="factor-board-status"><span className="factor-board-dot"></span><span>{(poolForm.stock_items || []).length}{' \u53ea\u80a1\u7968'}</span></div></div>
                            </div>
                            <div className="field"><label className="label">{'\u8bf4\u660e'}</label><textarea className="input" rows="2" value={poolForm.description} placeholder="\u8bb0\u5f55\u8be5\u80a1\u7968\u6c60\u7684\u7814\u7a76\u4e3b\u9898\u6216\u9009\u80a1\u903b\u8f91" onChange={e => setPoolForm({ ...poolForm, description: e.target.value })}></textarea></div>
                            <div className="field"><label className="label">{'\u6dfb\u52a0\u80a1\u7968'}</label><div className="stock-search-wrap"><input className="input" value={stockKeyword} placeholder="\u8f93\u5165\u80a1\u7968\u4ee3\u7801\u6216\u540d\u79f0" onChange={e => setStockKeyword(e.target.value)} onFocus={() => stockResults.length > 0 && setShowStockResults(true)} />{showStockResults && stockResults.length > 0 ? <div className="stock-search-dropdown">{stockResults.map(item => <div key={item.ts_code} className="stock-search-item" onMouseDown={() => addStockToPool(item)}><span>{item.name}</span><span style={{color:'var(--text-500)'}}>{item.ts_code}</span></div>)}</div> : null}</div></div>
                            <div className="factor-board-list" style={{maxHeight: 220, overflowY: 'auto'}}>{(poolForm.stock_items || []).length === 0 ? <div className="factor-board-empty">{'\u5f53\u524d\u80a1\u7968\u6c60\u8fd8\u6ca1\u6709\u80a1\u7968\uff0c\u8bf7\u5148\u641c\u7d22\u5e76\u6dfb\u52a0\u3002'}</div> : (poolForm.stock_items || []).map((item, idx) => <div key={item.ts_code + '-' + idx} className="factor-board-list-item"><div><div style={{fontWeight: 600, color: '#f8fafc'}}>{item.name || item.ts_code}</div><div className="factor-board-subtle">{item.ts_code}</div></div><button className="btn-link" onClick={() => removeStockFromPool(item.ts_code)}>{'\u79fb\u9664'}</button></div>)}</div>
                        </section>
                        <section className="card space-y factor-board-panel">
                            <div>
                                <div className="card-title" style={{marginBottom: 6}}>{'\u5df2\u4fdd\u5b58\u80a1\u7968\u6c60'}</div>
                                <div className="factor-board-subtle">{'\u70b9\u51fb\u201c\u7528\u4e8e\u5206\u6790\u201d\u5373\u53ef\u5207\u6362\u5230\u8be5\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60\u3002'}</div>
                            </div>
                            <div className="factor-board-list" style={{maxHeight: 240, overflowY: 'auto'}}>{(universeOptions.custom_pools || []).length === 0 ? <div className="factor-board-empty">{'\u6682\u65e0\u5df2\u4fdd\u5b58\u7684\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60\u3002'}</div> : (universeOptions.custom_pools || []).map(pool => <div key={pool.id} className="factor-board-list-item"><div><div style={{fontWeight: 600, color: '#f8fafc'}}>{pool.name}</div><div className="factor-board-subtle">{pool.stock_count}{' \u53ea\u80a1\u7968 \u00b7 '}{pool.description || '\u672a\u586b\u5199\u8bf4\u660e'}</div></div><div className="factor-board-toolbar-right"><button className="btn-link" onClick={() => { setAnalysisForm(prev => ({ ...prev, universe_type: 'custom', custom_pool_id: String(pool.id) })); setShowPoolManager(false); }}>{'\u7528\u4e8e\u5206\u6790'}</button><button className="btn-link" onClick={() => editPool(pool)}>{'\u7f16\u8f91'}</button></div></div>)}</div>
                        </section>
                    </div>
                </div>
            )}

            {selectedFactor && (
                <div className="factor-board-modal" onClick={() => setSelectedFactor(null)}>
                    <div className="factor-board-modal-card" onClick={e => e.stopPropagation()}>
                        <div className="factor-board-modal-head">
                            <div>
                                <div className="factor-board-modal-title">{selectedFactor}</div>
                                <div className="factor-board-modal-copy">{'\u67e5\u770b\u8be5\u56e0\u5b50\u7684\u6700\u65b0\u6279\u6b21\u8868\u73b0\u3001\u5206\u4f4d\u6536\u76ca\u66f2\u7ebf\u3001Alpha191 \u516c\u5f0f\u4e0e\u5bf9\u5e94\u6301\u4ed3\u3002'}</div>
                            </div>
                            <button className="btn btn-secondary" onClick={() => setSelectedFactor(null)}>{'\u5173\u95ed'}</button>
                        </div>
                        {detailLoading ? <div className="factor-board-empty">{'\u6b63\u5728\u52a0\u8f7d\u56e0\u5b50\u8be6\u60c5...'}</div> : (
                            <div className="factor-board-modal-grid">
                                <div className="factor-board-modal-stack">
                                    <section className="factor-board-chart-wrap">
                                        <div className="factor-board-toolbar">
                                            <div>
                                                <div className="card-title" style={{marginBottom: 6}}>{'\u6536\u76ca\u66f2\u7ebf'}</div>
                                                <div className="factor-board-subtle">{'\u5347\u7ea7\u4e3a\u591a\u5206\u4f4d\u540c\u5c4f\u5bf9\u6bd4\uff0c\u5e76\u652f\u6301\u6309\u533a\u95f4\u5207\u6362\u7814\u7a76\u7a97\u53e3\u3002'}</div>
                                            </div>
                                        </div>
                                        {chartHasData ? (
                                            <EquityCurveChart
                                                series={quantileChartSeries}
                                                selectedQuantile={detail.selectedQuantile}
                                                onSelectQuantile={(quantile) => setDetail(prev => ({ ...prev, selectedQuantile: String(quantile) }))}
                                                rangeKey={detail.rangeKey}
                                                onRangeChange={(rangeKey) => setDetail(prev => ({ ...prev, rangeKey }))}
                                                rangeOptions={detailRangeOptions}
                                                spreadSeries={spreadSeries}
                                                spreadReturnPct={spreadReturnPct}
                                            />
                                        ) : <div className="factor-board-empty">{'\u6682\u65e0\u8db3\u591f\u7684\u66f2\u7ebf\u6570\u636e'}</div>}
                                    </section>
                                    <section className="card space-y">
                                        <div className="card-title" style={{marginBottom: 6}}>{'\u6700\u65b0\u7ee9\u6548\u5feb\u7167'}</div>
                                        <div className="factor-board-grid">
                                            <div className="metric-card compact"><div className="metric-label">{'高分位超额'}</div><div className={'metric-value ' + metricTextClass(latestResult && latestResult.max_quantile_excess)}>{formatPct(latestResult && latestResult.max_quantile_excess)}</div></div>
                                            <div className="metric-card compact"><div className="metric-label">{'低分位超额'}</div><div className={'metric-value ' + metricTextClass(latestResult && latestResult.min_quantile_excess)}>{formatPct(latestResult && latestResult.min_quantile_excess)}</div></div>
                                            <div className="metric-card compact"><div className="metric-label">{'高低分位差'}</div><div className={'metric-value ' + metricTextClass(getSpreadExcess(latestResult))}>{formatPct(getSpreadExcess(latestResult))}</div></div>
                                            <div className="metric-card compact"><div className="metric-label">{'IC 均值'}</div><div className={'metric-value ' + (safeNum(latestResult && latestResult.ic_mean) >= 0 ? 'text-profit' : 'text-loss')}>{formatNum(latestResult && latestResult.ic_mean)}</div></div>
                                        </div>
                                    </section>
                                </div>
                                <div className="factor-board-modal-stack">
                                    <section className="factor-board-research-panel">
                                        <div className="factor-board-research-head">
                                            <div>
                                                <div className="factor-board-research-kicker">{'\u7814\u7a76\u6458\u8981'}</div>
                                                <div className="factor-board-research-title">{selectedFactor}</div>
                                                <div className="factor-board-research-copy">{infoDescription}</div>
                                            </div>
                                            <span className={getFactorDirectionClass(latestResult)}>{getFactorDirectionLabel(latestResult)}</span>
                                        </div>
                                        <div className="factor-board-research-grid">
                                            <div className="factor-board-research-item"><div className="factor-board-research-label">{'\u6700\u65b0\u4ea4\u6613\u65e5'}</div><div className="factor-board-research-value">{latestTradeDateLabel}</div></div>
                                            <div className="factor-board-research-item"><div className="factor-board-research-label">{'\u9009\u4e2d\u5206\u4f4d'}</div><div className="factor-board-research-value">{'Q'}{detail.selectedQuantile}{' / '}{quantileCount}</div></div>
                                            <div className="factor-board-research-item"><div className="factor-board-research-label">{'高分位超额'}</div><div className={'factor-board-research-value ' + metricTextClass(latestResult && latestResult.max_quantile_excess)}>{formatPct(latestResult && latestResult.max_quantile_excess)}</div></div>
                                            <div className="factor-board-research-item"><div className="factor-board-research-label">{'低分位超额'}</div><div className={'factor-board-research-value ' + metricTextClass(latestResult && latestResult.min_quantile_excess)}>{formatPct(latestResult && latestResult.min_quantile_excess)}</div></div>
                                            <div className="factor-board-research-item"><div className="factor-board-research-label">{'IC \u5747\u503c'}</div><div className={'factor-board-research-value ' + metricTextClass(latestResult && latestResult.ic_mean)}>{formatNum(latestResult && latestResult.ic_mean)}</div></div>
                                        </div>
                                        <div className="factor-board-tagrow">
                                            <span className="factor-board-tag">{activeUniverseLabel}</span>
                                            <span className="factor-board-tag">{'\u533a\u95f4 '}{detail.rangeKey}</span>
                                            <span className="factor-board-tag">{'\u8986\u76d6\u7387 '}{formatPct(latestResult && latestResult.coverage_ratio)}</span>
                                            <span className="factor-board-tag">{'\u6362\u624b '}{formatPct(latestResult && latestResult.max_quantile_turnover)}</span>
                                        </div>
                                    </section>
                                    <section className="card space-y">
                                        <div className="card-title" style={{marginBottom: 6}}>{'\u56e0\u5b50\u4ecb\u7ecd'}</div>
                                        <div className="factor-board-desc-box">{infoDescription}</div>
                                    </section>
                                    <section className="card space-y">
                                        <div className="card-title" style={{marginBottom: 6}}>{'\u7ecf\u6d4e\u5b66\u542b\u4e49'}</div>
                                        <div className="factor-board-desc-box">{economicMeaning}</div>
                                    </section>
                                    <section className="card space-y">
                                        <div className="factor-board-section-head">
                                            <div className="card-title" style={{marginBottom: 6}}>{'Alpha191 \u516c\u5f0f'}</div>
                                            <div className="factor-board-formula-meta">{'\u771f\u5b9e\u53ef\u6267\u884c\u7248\u672c'}</div>
                                        </div>
                                        <div className="factor-board-formula-title">{'\u516c\u5f0f\u4e0e\u53d8\u91cf\u7ed3\u6784'}</div>
                                        <pre className="factor-board-code">{detail.info && detail.info.formula ? detail.info.formula : '\u6682\u65e0\u516c\u5f0f'}</pre>
                                    </section>
                                    <section className="card space-y">
                                        <div className="factor-board-toolbar">
                                            <div>
                                                <div className="card-title" style={{marginBottom: 6}}>{'\u6700\u65b0\u6301\u4ed3'}</div>
                                                <div className="factor-board-subtle">{'\u6700\u65b0\u4ea4\u6613\u65e5 '}{latestTradeDateLabel}</div>
                                            </div>
                                            <div className="factor-board-subtle">{'Q'}{detail.selectedQuantile}{' / '}{quantileCount}</div>
                                        </div>
                                        <div className="factor-board-holdings-summary">
                                            <div className="factor-board-holdings-stat"><span className="label">{'\u6301\u4ed3\u6837\u672c'}</span><span className="value">{currentHoldings.length}</span></div>
                                            <div className="factor-board-holdings-stat"><span className="label">{'\u5e73\u5747\u6743\u91cd'}</span><span className="value">{formatRate(avgHoldingWeight)}</span></div>
                                            <div className="factor-board-holdings-stat"><span className="label">{'\u6700\u9ad8\u6743\u91cd'}</span><span className="value">{topHolding ? topHolding.ts_code : '-'}</span></div>
                                        </div>
                                        {currentHoldings.length === 0 ? <div className="factor-board-empty">{'\u5f53\u524d\u5206\u4f4d\u6682\u65e0\u6301\u4ed3\u6837\u672c'}</div> : (
                                            <div className="factor-board-list">
                                                {currentHoldings.map((item, idx) => (
                                                    <div key={item.ts_code + '-' + idx} className="factor-board-list-item">
                                                        <div>
                                                            <div style={{fontWeight: 600, color: '#f8fafc'}}>{item.ts_code}</div>
                                                            <div className="factor-board-subtle">{'\u56e0\u5b50\u503c '}{formatNum(item.factor_value)}{' \u00b7 \u6743\u91cd '}{formatRate(item.weight)}</div>
                                                        </div>
                                                        <div className="text-xs text-muted">{'Q'}{item.quantile}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </section>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            )}
        </div>
    );
}

/* ===== Main App ===== */
function App() {
    const [page, setPage] = useState('backtest');
    const [toast, setToast] = useState(null);
    const [sysVersion, setSysVersion] = useState('');
    const showToast = (message, type) => setToast({ message, type: type || 'info' });

    useEffect(() => {
        api.get('/api/system/version').then(v => setSysVersion(v.version || '')).catch(() => {});
    }, []);

    const navItems = [
        { key: 'backtest', label: '回测' },
        { key: 'strategy', label: '策略' },
        { key: 'portfolio', label: '组合' },
        { key: 'market', label: '看盘' },
        { key: 'factor', label: '因子' },
        { key: 'workflow', label: '因子工作流' },
        { key: 'factorboard', label: '因子看板' },
        { key: 'news', label: '新闻' },
        { key: 'history', label: '历史' },
        { key: 'settings', label: '设置' },
        { key: 'help', label: '帮助' },
    ];

    return (
        <div className="app">
            <header className="header">
                <div className="header-brand">
                    <h1>QTsys</h1>
                    <span>量化交易回测系统</span>
                    {sysVersion && <span style={{fontSize:10,color:'var(--text-500)',marginLeft:4}}>v{sysVersion}</span>}
                </div>
                <nav className="nav">
                    {navItems.map(n => (
                        <button key={n.key} onClick={() => setPage(n.key)}
                            className={'nav-btn' + (page === n.key ? ' active' : '')}>
                            {n.label}
                        </button>
                    ))}
                </nav>
            </header>
            <main className="main">
                {page === 'settings' && <SettingsPage showToast={showToast} />}
                {page === 'strategy' && <StrategyPage showToast={showToast} />}
                {page === 'backtest' && <BacktestPage showToast={showToast} />}
                {page === 'portfolio' && <PortfolioPage showToast={showToast} />}
                {page === 'market' && <MarketPage showToast={showToast} />}
                {page === 'factor' && <FactorPage showToast={showToast} />}
                {page === 'workflow' && <FactorWorkflowPage showToast={showToast} />}
                {page === 'factorboard' && <FactorBoardPage showToast={showToast} />}
                {page === 'news' && <NewsPage showToast={showToast} />}
                {page === 'history' && <HistoryPage showToast={showToast} />}
                {page === 'help' && <HelpPage showToast={showToast} />}
            </main>
            {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
