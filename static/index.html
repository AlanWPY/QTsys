function FactorPage({ showToast, openStrategyWorkspace, openBacktestWithStrategy }) {
    const [factors, setFactors] = useState([]);
    const [factorCategories, setFactorCategories] = useState(DEFAULT_FACTOR_CATEGORIES);
    const [activeCategory, setActiveCategory] = useState('all');
    const [factorSearch, setFactorSearch] = useState('');
    const [selected, setSelected] = useState(null);
    const [evalResult, setEvalResult] = useState(null);
    const [evalTab, setEvalTab] = useState('ic');
    const [loading, setLoading] = useState(false);
    const [factorCodeModal, setFactorCodeModal] = useState(null);
    const [factorCodeLoading, setFactorCodeLoading] = useState(false);
    const [joinQuantConfig, setJoinQuantConfig] = useState({
        index_symbol: '000300.XSHG',
        benchmark: '000300.XSHG',
        top_n: 10,
        rebalance_days: 5,
        lookback: 260,
        high_is_better: true,
        target_exposure: 0.95,
        max_position_pct: 0.12,
        min_trade_lot: 100,
        stop_loss_pct: 0,
        take_profit_pct: 0,
        include_star_market: false,
    });
    const [mineTab, setMineTab] = useState('none');

    // 新建因子表单
    const [newName, setNewName] = useState('');
    const [newExpr, setNewExpr] = useState('');
    const [newDesc, setNewDesc] = useState('');
    const [newCat, setNewCat] = useState('custom');

    // 评价参数
    const [evalUniverse, setEvalUniverse] = useState('000001.SZ,000002.SZ,600036.SH');
    const [evalStart, setEvalStart] = useState('20230101');
    const [evalEnd, setEvalEnd] = useState('20231231');
    const [evalGroups, setEvalGroups] = useState(5);
    const [forwardDays, setForwardDays] = useState(5);

    // GP挖掘参数
    const [gpPopSize, setGpPopSize] = useState(30);
    const [gpGenerations, setGpGenerations] = useState(10);
    const [gpRunning, setGpRunning] = useState(false);

    // LLM挖掘参数
    const [llmCount, setLlmCount] = useState(5);
    const [llmHint, setLlmHint] = useState('');
    const [llmRunning, setLlmRunning] = useState(false);

    const loadFactorCategories = () => api.get('/api/factors/categories').then(list => {
        const serverCategories = Array.isArray(list) ? list : [];
        const merged = [{ ...DEFAULT_FACTOR_CATEGORIES[0] }, ...serverCategories];
        setFactorCategories(merged.length > 1 ? merged : DEFAULT_FACTOR_CATEGORIES);
    }).catch(() => setFactorCategories(DEFAULT_FACTOR_CATEGORIES));
    const loadFactors = () => api.get('/api/factors').then(list => {
        const items = Array.isArray(list) ? list : [];
        setFactors(items);
        loadFactorCategories();
    }).catch(() => {});
    useEffect(() => { loadFactorCategories(); loadFactors(); }, []);

    const BADGE = { builtin: 'factor-badge-builtin', gp: 'factor-badge-gp', llm: 'factor-badge-llm', user: 'factor-badge-user', workflow: 'factor-badge-gp', factor_mining: 'factor-badge-llm' };
    const BADGE_LABEL = { builtin: '内置', gp: 'GP', llm: 'LLM', user: '自定义', workflow: '工作流', factor_mining: '挖掘' };

    const initBuiltin = async () => {
        try { const r = await api.post('/api/factors/init_builtin'); loadFactors(); showToast(r.message, 'success'); }
        catch (e) { showToast('加载失败', 'error'); }
    };

    const createFactor = async () => {
        if (!newName || !newExpr) { showToast('请填写名称和表达式', 'error'); return; }
        try {
            await api.post('/api/factors', { name: newName, expression: newExpr, description: newDesc, category: newCat });
            loadFactors(); setNewName(''); setNewExpr(''); setNewDesc('');
            showToast('因子已创建', 'success');
        } catch (e) { showToast('创建失败', 'error'); }
    };

    const deleteFactor = async (id) => {
        if (!confirm('确认删除?')) return;
        await api.remove('/api/factors/' + id);
        if (selected && selected.id === id) { setSelected(null); setEvalResult(null); }
        loadFactors(); showToast('已删除', 'success');
    };

    const visibleFactors = useMemo(() => {
        const kw = String(factorSearch || '').trim().toLowerCase();
        return (factors || []).filter(item => {
            const category = item.category || 'custom';
            const categoryOk = activeCategory === 'all' || category === activeCategory;
            if (!categoryOk) return false;
            if (!kw) return true;
            return [item.name, item.display_name, item.category_label, item.category, item.source, item.expression, item.description]
                .some(value => String(value || '').toLowerCase().includes(kw));
        });
    }, [factors, activeCategory, factorSearch]);

    useEffect(() => {
        if (!selected) return;
        const mining = selected.mining_metadata || {};
        if (!mining || !Object.keys(mining).length) return;
        setJoinQuantConfig(prev => {
            const selectPct = Number(mining.select_pct || 0);
            const estimatedTopN = selectPct > 0 ? Math.max(1, Math.round(50 * selectPct)) : Number(prev.top_n || 10);
            const indexSymbol = mining.universe_code ? String(mining.universe_code).replace('.SH', '.XSHG').replace('.SZ', '.XSHE') : prev.index_symbol;
            return {
                ...prev,
                index_symbol: indexSymbol || prev.index_symbol,
                benchmark: indexSymbol || prev.benchmark,
                top_n: Number(mining.max_positions || estimatedTopN || prev.top_n || 10),
                rebalance_days: Number(mining.rebalance_days || prev.rebalance_days || 5),
                high_is_better: mining.high_is_better !== undefined ? !!mining.high_is_better : (mining.direction ? mining.direction !== 'bottom' : prev.high_is_better),
                target_exposure: Number(mining.target_exposure || prev.target_exposure || 0.95),
                max_position_pct: Number(mining.max_position_pct || prev.max_position_pct || 0.12),
                include_star_market: false,
            };
        });
    }, [selected && selected.id]);

    const evaluateFactor = async () => {
        if (!selected) { showToast('请先选择因子', 'error'); return; }
        setLoading(true); setEvalResult(null);
        try {
            const codes = evalUniverse.split(',').map(s => s.trim()).filter(Boolean);
            const res = await api.post('/api/factors/evaluate', {
                factor_id: selected.id, universe: codes,
                start_date: evalStart, end_date: evalEnd, groups: evalGroups,
                forward_days: forwardDays,
            });
            setEvalResult(res); showToast('评价完成', 'success');
        } catch (e) { showToast(e.detail || '评价失败', 'error'); }
        setLoading(false);
    };

    const runGP = async () => {
        setGpRunning(true);
        try {
            const codes = evalUniverse.split(',').map(s => s.trim()).filter(Boolean);
            const res = await api.post('/api/factors/mine/gp', {
                universe: codes, start_date: evalStart, end_date: evalEnd,
                pop_size: gpPopSize, generations: gpGenerations,
            });
            loadFactors();
            showToast(`GP挖掘完成, 发现${res.factors.length}个因子`, 'success');
        } catch (e) { showToast(e.detail || 'GP挖掘失败', 'error'); }
        setGpRunning(false);
    };

    const runLLM = async () => {
        setLlmRunning(true);
        try {
            const codes = evalUniverse.split(',').map(s => s.trim()).filter(Boolean);
            const res = await api.post('/api/factors/mine/llm', {
                universe: codes, start_date: evalStart, end_date: evalEnd,
                count: llmCount, hint: llmHint,
            });
            loadFactors();
            showToast(`LLM挖掘完成, 生成${res.factors.length}个因子`, 'success');
        } catch (e) { showToast(e.detail || 'LLM挖掘失败', 'error'); }
        setLlmRunning(false);
    };

    const buildFactorResearchBacktestContext = () => {
        const mining = selected && selected.mining_metadata ? selected.mining_metadata : {};
        if (mining && Object.keys(mining).length) {
            const isSystem = mining.universe_type === 'system' && mining.universe_code;
            const isCustom = mining.universe_type === 'custom' && mining.custom_pool_id;
            if (isSystem || isCustom) {
                return normalizeBacktestContext({
                    source: 'mined_factor_strategy',
                    source_label: '因子挖掘策略',
                    factor_id: selected.id,
                    factor_name: selected.name,
                    direction: mining.direction || (mining.high_is_better === false ? 'bottom' : 'top'),
                    select_pct: Number(mining.select_pct || 0.1),
                    rebalance_days: Number(mining.rebalance_days || 5),
                    target_exposure: Number(mining.target_exposure || 0.95),
                    max_position_pct: Number(mining.max_position_pct || 0.12),
                    universe_type: mining.universe_type,
                    universe_code: mining.universe_code || '',
                    universe_name: mining.universe_name || (isSystem ? mining.universe_code : '自定义股票池'),
                    custom_pool_id: mining.custom_pool_id || null,
                    benchmark: mining.benchmark || mining.benchmark_code || (isSystem ? mining.universe_code : '000300.SH'),
                    start_date: mining.session_start_date || mining.display_start || mining.test_start || evalStart,
                    end_date: mining.session_end_date || mining.display_end || mining.test_end || evalEnd,
                    stock_items: [],
                });
            }
        }
        const stockItems = normalizeStockItems(
            evalUniverse.split(',').map(code => ({ ts_code: code }))
        );
        return normalizeBacktestContext({
            source: 'factor_research',
            source_label: '因子研究',
            universe_type: 'custom',
            universe_code: 'factor_research_custom',
            universe_name: selected && selected.name ? `${selected.name} 研究股票池` : '因子研究股票池',
            benchmark: '000300.SH',
            backtest_days: Math.max(parseInt(forwardDays, 10) || 5, 20),
            start_date: evalStart,
            end_date: evalEnd,
            stock_items: stockItems,
            commission_rate: 0.0003,
            stamp_tax_rate: 0.001,
            slippage: 0.002,
            max_position_pct: 0.12,
            target_exposure: 0.95,
        });
    };

    const buildFactorResearchPrompt = (factor, resultItem) => {
        if (!factor) return '';
        const metrics = resultItem && resultItem.metrics ? resultItem.metrics : {};
        const parts = [
            `请基于 QTsys 因子库中的因子“${factor.name}”生成一个可直接保存并回测的股票量化策略。`,
            `因子分类：${factor.category || '未分类'}；来源：${factor.source || 'user'}。`,
            `因子表达式：${factor.expression || '-'}`,
        ];
        if (factor.description) {
            parts.push(`因子说明：${factor.description}`);
        }
        if (resultItem) {
            parts.push(
                `该因子最近研究结果：IC均值 ${formatNum(metrics.ic_mean, 4)}，IC_IR ${formatNum(metrics.ic_ir, 4)}，多头收益 ${formatPct(metrics.top_group_return)}，空头收益 ${formatPct(metrics.bottom_group_return)}，多空收益 ${formatPct(metrics.long_short_return)}，平均换手 ${formatPct(metrics.avg_turnover)}。`
            );
        }
        parts.push(`研究股票池：${evalUniverse || '-'}`);
        parts.push(`研究区间：${evalStart || '-'} 至 ${evalEnd || '-'}`);
        parts.push(`预测周期：${forwardDays || '-'} 日，分组数：${evalGroups || '-'}`);
        parts.push('请优先直接复用系统因子接口 context.get_factor(...) 或 context.get_factor_history(...)，不要手工重写该因子公式。');
        parts.push('请给出清晰的开仓、平仓、仓位控制与风险控制逻辑，并确保代码严格符合 QTsys 的 initialize(context) / handle_data(context) 模板。');
        parts.push('如果该因子更适合作为反向信号，请明确使用反向逻辑。');
        return parts.join('\n');
    };

    const openStrategyFromFactor = (factor, resultItem) => {
        if (!factor) {
            showToast('请先选择因子', 'error');
            return;
        }
        const prompt = buildFactorResearchPrompt(factor, resultItem);

                {selected && <FactorEvalPanel selected={selected} evalUniverse={evalUniverse} setEvalUniverse={setEvalUniverse}

                    llmRunning={llmRunning} runLLM={runLLM} />
            </div>
            {factorCodeModal && (
                <div className="factor-board-modal" onClick={() => setFactorCodeModal(null)}>
                    <div className="factor-board-modal-card" onClick={e => e.stopPropagation()} style={{width:'min(1120px, 100%)'}}>
                        <div className="factor-board-modal-head">
                            <div>
                                <div className="factor-board-modal-title">{factorCodeModal.title || '\u56e0\u5b50\u8ba1\u7b97\u4ee3\u7801'}</div>

                </div>
            )}
        </div>
    );
}

const WF_NODE_W = 160;
const WF_PORT_R = 6;
const WF_GRID = 20;

const WF_CATEGORIES = [
    { key: 'data', label: '数据源', color: '#3b82f6' },
    { key: 'math', label: '数学运算', color: '#f59e0b' },
    { key: 'timeseries', label: '时序运算', color: '#22c55e' },
    { key: 'cross_section', label: '截面运算', color: '#a855f7' },
    { key: 'condition', label: '条件逻辑', color: '#ef4444' },
    { key: 'output', label: '输出', color: '#6366f1' },
];

function wfNodeH(reg) {
    const ports = Math.max((reg.inputs||[]).length, (reg.outputs||[]).length, 1);
    return 24 + 28 * ports + 8;
}

function wfPortPos(node, reg, portName, isInput) {
    const ports = isInput ? reg.inputs : reg.outputs;
    const idx = ports.indexOf(portName);
    const h = wfNodeH(reg);
    const py = 24 + 14 + idx * 28;
    return { x: node.x + (isInput ? 0 : WF_NODE_W), y: node.y + py };
}

function FactorWorkflowPage({ showToast }) {
    const [registry, setRegistry] = useState({});
    const [catColors, setCatColors] = useState({});
    const [templates, setTemplates] = useState([]);
    const [nodes, setNodes] = useState([]);

    const [selectedEdge, setSelectedEdge] = useState(null);
    const [expression, setExpression] = useState('');
    const [compileErrors, setCompileErrors] = useState([]);
    const [factorName, setFactorName] = useState('新因子');
    const [factorType, setFactorType] = useState('technical');
    const [savedFactors, setSavedFactors] = useState([]);
    const [editingId, setEditingId] = useState(null);
    const [collapsedCats, setCollapsedCats] = useState({});
    const [previewData, setPreviewData] = useState(null);
    const [previewCode, setPreviewCode] = useState('000001.SZ');
    const [previewStart, setPreviewStart] = useState('20240101');
    const [previewEnd, setPreviewEnd] = useState('20241231');
    const [previewLoading, setPreviewLoading] = useState(false);

    // Backtest state
    const [btMode, setBtMode] = useState('selection');
    const [btUniverse, setBtUniverse] = useState('000001.SZ,000002.SZ,600036.SH,601318.SH,000858.SZ');
    const [btStart, setBtStart] = useState('20230101');
    const [btEnd, setBtEnd] = useState('20241231');
    const [btSelectMode, setBtSelectMode] = useState('top');
    const [btSelectPct, setBtSelectPct] = useState(0.2);
    const [btRebalDays, setBtRebalDays] = useState(5);
    const [btOpenThresh, setBtOpenThresh] = useState(0);
    const [btCloseThresh, setBtCloseThresh] = useState(0);
    const [btOpenCond, setBtOpenCond] = useState('gt');
    const [btCloseCond, setBtCloseCond] = useState('lt');
    const [btTaskId, setBtTaskId] = useState(null);
    const [btResult, setBtResult] = useState(null);
    const [btLoading, setBtLoading] = useState(false);
    const [showAlpha191Select, setShowAlpha191Select] = useState(false);
    const [alpha191Num, setAlpha191Num] = useState(1);

    // Canvas refs
    const canvasRef = useRef(null);
    const overlayRef = useRef(null);
    const wrapRef = useRef(null);
    const stateRef = useRef({ mode: 'idle', dragNode: null, dragWire: null, panStart: null, startVP: null });
    const historyRef = useRef({ stack: [], idx: -1 });
    const nextIdRef = useRef(1);
    const pollRef = useRef(null);

    // Load registry & templates on mount
    useEffect(() => {
        api.get('/api/factors/workflow/templates').then(res => {
            setRegistry(res.node_registry || {});
            setCatColors(res.category_colors || {});
            setTemplates(res.templates || []);
        }).catch(() => {});
        loadSavedFactors();
    }, []);

    const loadSavedFactors = () => {
        api.get('/api/factors').then(list => {
            setSavedFactors(list.filter(f => f.source === 'workflow'));
        }).catch(() => {});
    };

    // Auto-compile on node/edge change
    useEffect(() => {
        if (nodes.length === 0) { setExpression(''); setCompileErrors([]); return; }
        const graph = { nodes, edges, viewport };
        api.post('/api/factors/workflow/compile', { graph }).then(res => {
            setExpression(res.expression || '');
            setCompileErrors(res.errors || []);
        }).catch(() => setCompileErrors(['编译请求失败']));
    }, [nodes, edges]);

    // Draw canvas
    useEffect(() => { drawCanvas(); }, [nodes, edges, viewport, selectedNode, selectedEdge]);

    // Size overlay canvas on mount + resize (separate from drawCanvas to avoid clearing overlay buffer)
    useEffect(() => {
        const syncSize = () => {
            const ov = overlayRef.current;
            const wrap = wrapRef.current;
            if (ov && wrap) { ov.width = wrap.clientWidth; ov.height = wrap.clientHeight; }
        };
        syncSize();
        window.addEventListener('resize', syncSize);
        return () => window.removeEventListener('resize', syncSize);
    }, []);

    const genId = (prefix) => { nextIdRef.current++; return prefix + nextIdRef.current; };

    // Push undo history
    const pushHistory = () => {
        const h = historyRef.current;
        const snap = JSON.stringify({ nodes, edges });
        h.stack = h.stack.slice(0, h.idx + 1);
        h.stack.push(snap);
        if (h.stack.length > 50) h.stack.shift();
        h.idx = h.stack.length - 1;
    };

    const undo = () => {
        const h = historyRef.current;
        if (h.idx > 0) {
            h.idx--;
            const s = JSON.parse(h.stack[h.idx]);
            setNodes(s.nodes); setEdges(s.edges);
        }
    };

    const redo = () => {
        const h = historyRef.current;
        if (h.idx < h.stack.length - 1) {
            h.idx++;
            const s = JSON.parse(h.stack[h.idx]);
            setNodes(s.nodes); setEdges(s.edges);
        }
    };

    // Canvas drawing
    const drawCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const wrap = wrapRef.current;
        if (!wrap) return;
        canvas.width = wrap.clientWidth;
        canvas.height = wrap.clientHeight;
        const ctx = canvas.getContext('2d');
        const { x: vx, y: vy, zoom } = viewport;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(vx, vy);
        ctx.scale(zoom, zoom);

        // Grid
        ctx.strokeStyle = '#1e2235';
        ctx.lineWidth = 0.5 / zoom;
        const gw = canvas.width / zoom + 200;
        const gh = canvas.height / zoom + 200;
        const ox = (-vx / zoom) - 100;
        const oy = (-vy / zoom) - 100;
        for (let x = Math.floor(ox / WF_GRID) * WF_GRID; x < ox + gw; x += WF_GRID) {
            ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + gh); ctx.stroke();
        }
        for (let y = Math.floor(oy / WF_GRID) * WF_GRID; y < oy + gh; y += WF_GRID) {
            ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + gw, y); ctx.stroke();
        }

        // Edges
        edges.forEach(e => {
            const fromNode = nodes.find(n => n.id === e.from.nodeId);
            const toNode = nodes.find(n => n.id === e.to.nodeId);
            if (!fromNode || !toNode) return;
            const fromReg = registry[fromNode.type];
            const toReg = registry[toNode.type];
            if (!fromReg || !toReg) return;
            const fp = wfPortPos(fromNode, fromReg, e.from.port, false);
            const tp = wfPortPos(toNode, toReg, e.to.port, true);
            const sel = selectedEdge === e.id;
            ctx.strokeStyle = sel ? '#818cf8' : '#64748b';
            ctx.lineWidth = sel ? 2.5 / zoom : 1.5 / zoom;
            const dx = Math.abs(fp.x - tp.x) * 0.5;
            ctx.beginPath();
            ctx.moveTo(fp.x, fp.y);
            ctx.bezierCurveTo(fp.x + dx, fp.y, tp.x - dx, tp.y, tp.x, tp.y);
            ctx.stroke();
        });

        // Nodes
        nodes.forEach(node => {
            const reg = registry[node.type];
            if (!reg) return;
            const cat = WF_CATEGORIES.find(c => c.key === reg.category);
            const color = cat ? cat.color : '#6366f1';
            const h = wfNodeH(reg);
            const sel = selectedNode === node.id;

            // Shadow
            ctx.shadowColor = sel ? color : 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = sel ? 12 : 6;
            ctx.shadowOffsetY = 2;

            // Body
            ctx.fillStyle = '#1e2235';
            ctx.beginPath();
            ctx.roundRect(node.x, node.y, WF_NODE_W, h, 6);
            ctx.fill();
            ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

            // Header
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(node.x, node.y, WF_NODE_W, 24, [6, 6, 0, 0]);
            ctx.fill();

            // Title
            ctx.fillStyle = '#fff';
            ctx.font = '11px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(reg.label || node.type, node.x + 8, node.y + 12);

            // Border
            if (sel) {
                ctx.strokeStyle = color;
                ctx.lineWidth = 2 / zoom;
                ctx.beginPath();
                ctx.roundRect(node.x, node.y, WF_NODE_W, h, 6);
                ctx.stroke();
            }

            // Input ports
            (reg.inputs || []).forEach((p, i) => {
                const py = 24 + 14 + i * 28;
                ctx.fillStyle = '#3b4261';
                ctx.beginPath();
                ctx.arc(node.x, node.y + py, WF_PORT_R, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(p, node.x + 10, node.y + py + 1);
            });

            // Output ports
            (reg.outputs || []).forEach((p, i) => {
                const py = 24 + 14 + i * 28;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(node.x + WF_NODE_W, node.y + py, WF_PORT_R, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(p, node.x + WF_NODE_W - 10, node.y + py + 1);
            });

            // Param values
            const params = node.params || {};
            const paramKeys = Object.keys(reg.params || {});
            if (paramKeys.length > 0) {
                ctx.fillStyle = '#64748b';
                ctx.font = '9px monospace';
                ctx.textAlign = 'center';
                const txt = paramKeys.map(k => `${k}=${params[k] !== undefined ? params[k] : reg.params[k].default}`).join(' ');
                ctx.fillText(txt, node.x + WF_NODE_W / 2, node.y + h - 4);
            }
        });

        ctx.restore();
    };

    // Mouse → canvas coords
    const toCanvas = (e) => {
        const rect = wrapRef.current.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left - viewport.x) / viewport.zoom,
            y: (e.clientY - rect.top - viewport.y) / viewport.zoom,
        };
    };

    // Hit test: find node at position
    const hitNode = (cx, cy) => {
        for (let i = nodes.length - 1; i >= 0; i--) {
            const n = nodes[i];
            const reg = registry[n.type];
            if (!reg) continue;
            const h = wfNodeH(reg);
            if (cx >= n.x && cx <= n.x + WF_NODE_W && cy >= n.y && cy <= n.y + h) return n;
        }
        return null;
    };

    // Hit test: find port at position
    const hitPort = (cx, cy) => {
        for (const n of nodes) {
            const reg = registry[n.type];
            if (!reg) continue;
            for (const p of (reg.outputs || [])) {
                const pos = wfPortPos(n, reg, p, false);
                if (Math.hypot(cx - pos.x, cy - pos.y) < WF_PORT_R + 4) return { nodeId: n.id, port: p, isInput: false };
            }
            for (const p of (reg.inputs || [])) {
                const pos = wfPortPos(n, reg, p, true);
                if (Math.hypot(cx - pos.x, cy - pos.y) < WF_PORT_R + 4) return { nodeId: n.id, port: p, isInput: true };
            }
        }
        return null;
    };

    // Mouse handlers
    const onMouseDown = (e) => {
        const c = toCanvas(e);
        const st = stateRef.current;

        // Right/middle click → pan
        if (e.button === 1 || e.button === 2) {
            st.mode = 'pan'; st.panStart = { x: e.clientX, y: e.clientY };
            st.startVP = { ...viewport };
            e.preventDefault(); return;
        }

        // Check port hit first
        const port = hitPort(c.x, c.y);
        if (port && !port.isInput) {
            st.mode = 'drag_wire';
            st.dragWire = { from: { nodeId: port.nodeId, port: port.port }, mx: c.x, my: c.y };
            pushHistory(); return;
        }

        // Check node hit
        const node = hitNode(c.x, c.y);
        if (node) {
            st.mode = 'drag_node';
            st.dragNode = { id: node.id, ox: c.x - node.x, oy: c.y - node.y };
            setSelectedNode(node.id); setSelectedEdge(null);
            pushHistory(); return;
        }

        // Click on empty → deselect
        setSelectedNode(null); setSelectedEdge(null);
    };

    const onMouseMove = (e) => {
        const st = stateRef.current;
        if (st.mode === 'pan') {
            const dx = e.clientX - st.panStart.x;
            const dy = e.clientY - st.panStart.y;
            setViewport({ ...st.startVP, x: st.startVP.x + dx, y: st.startVP.y + dy });
            return;
        }
        if (st.mode === 'drag_node') {
            const c = toCanvas(e);
            setNodes(prev => prev.map(n =>
                n.id === st.dragNode.id ? { ...n, x: c.x - st.dragNode.ox, y: c.y - st.dragNode.oy } : n
            ));
            return;
        }
        if (st.mode === 'drag_wire') {
            const c = toCanvas(e);
            st.dragWire.mx = c.x;
            st.dragWire.my = c.y;
            // Draw wire preview on overlay
            const ov = overlayRef.current;
            if (ov) {
                ov.width = ov.parentElement.clientWidth;
                ov.height = ov.parentElement.clientHeight;
                const octx = ov.getContext('2d');
                octx.clearRect(0, 0, ov.width, ov.height);
                const fromNode = nodes.find(n => n.id === st.dragWire.from.nodeId);
                if (fromNode) {
                    const reg = registry[fromNode.type];
                    if (reg) {
                        const fp = wfPortPos(fromNode, reg, st.dragWire.from.port, false);
                        const sx = fp.x * viewport.zoom + viewport.x;
                        const sy = fp.y * viewport.zoom + viewport.y;
                        const ex = c.x * viewport.zoom + viewport.x;
                        const ey = c.y * viewport.zoom + viewport.y;
                        octx.strokeStyle = '#818cf8';
                        octx.lineWidth = 2;
                        octx.setLineDash([6, 4]);
                        const ddx = Math.abs(sx - ex) * 0.5;
                        octx.beginPath();
                        octx.moveTo(sx, sy);
                        octx.bezierCurveTo(sx + ddx, sy, ex - ddx, ey, ex, ey);
                        octx.stroke();
                        octx.setLineDash([]);
                    }
                }
            }
        }
    };

    const onMouseUp = (e) => {
        const st = stateRef.current;
        if (st.mode === 'drag_wire') {
            const c = toCanvas(e);
            const port = hitPort(c.x, c.y);
            if (port && port.isInput) {
                // Check not connecting to same node
                if (port.nodeId !== st.dragWire.from.nodeId) {
                    const fromInfo = st.dragWire.from;
                    const toInfo = { nodeId: port.nodeId, port: port.port };
                    setEdges(prev => {
                        const filtered = prev.filter(ed =>
                            !(ed.to.nodeId === toInfo.nodeId && ed.to.port === toInfo.port)
                        );
                        filtered.push({ id: genId('e'), from: fromInfo, to: toInfo });
                        return filtered;
                    });
                }
            }
            // Clear overlay
            const ov = overlayRef.current;
            if (ov) { const octx = ov.getContext('2d'); octx.clearRect(0, 0, ov.width, ov.height); }
        }
        st.mode = 'idle';
        st.dragNode = null;
        st.dragWire = null;
    };

    // Keyboard handler (single source, via window listener)
    useEffect(() => {
        const handler = (e) => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedNode) {
                    pushHistory();
                    setNodes(prev => prev.filter(n => n.id !== selectedNode));
                    setEdges(prev => prev.filter(ed => ed.from.nodeId !== selectedNode && ed.to.nodeId !== selectedNode));
                    setSelectedNode(null);
                } else if (selectedEdge) {
                    pushHistory();
                    setEdges(prev => prev.filter(ed => ed.id !== selectedEdge));
                    setSelectedEdge(null);
                }
            }
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
            if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
    }, [selectedNode, selectedEdge]);

    // Attach wheel listener with {passive:false} so preventDefault works
    useEffect(() => {
        const el = overlayRef.current;
        if (!el) return;
        const handler = (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            setViewport(v => {
                const nz = Math.max(0.25, Math.min(3.0, v.zoom * delta));
                const el2 = wrapRef.current;
                if (!el2) return v;
                const rect = el2.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                return { x: mx - (mx - v.x) * (nz / v.zoom), y: my - (my - v.y) * (nz / v.zoom), zoom: nz };
            });
        };
        el.addEventListener('wheel', handler, { passive: false });
        return () => el.removeEventListener('wheel', handler);
    }, []);

    // Add node from palette
    const addNode = (type, posX, posY) => {
        pushHistory();
        const reg = registry[type];
        if (!reg) return;
        const cx = posX != null ? posX : (-viewport.x + 300) / viewport.zoom;
        const cy = posY != null ? posY : (-viewport.y + 200) / viewport.zoom;
        setNodes(prev => [...prev, {
            id: genId('n'), type, x: cx + Math.random() * 40, y: cy + Math.random() * 40,
            params: Object.fromEntries(Object.entries(reg.params || {}).map(([k, v]) => [k, v.default])),
        }]);
    };

    // Update node param
    const updateParam = (nodeId, key, value) => {
        setNodes(prev => prev.map(n =>
            n.id === nodeId ? { ...n, params: { ...n.params, [key]: value } } : n
        ));
    };

    // Save workflow
    const saveWorkflow = async () => {
        if (!expression) { showToast('请先构建有效的工作流', 'error'); return; }
        try {
            const graph = { nodes, edges, viewport };
            if (editingId) {
                await api.put(`/api/factors/workflow/${editingId}`, {
                    name: factorName, graph, factor_type: factorType, category: 'workflow',
                });
                showToast('工作流已更新', 'success');
            } else {
                const res = await api.post('/api/factors/workflow/save', {
                    name: factorName, graph, factor_type: factorType, category: 'workflow',
                });
                setEditingId(res.id);
                showToast('工作流已保存', 'success');
            }
            loadSavedFactors();
        } catch (e) { showToast(e.detail || '保存失败', 'error'); }
    };

    // Load saved workflow
    const loadWorkflow = async (factorId) => {
        try {
            const res = await api.get(`/api/factors/${factorId}/graph`);
            if (res.graph_json) {
                setNodes(res.graph_json.nodes || []);
                setEdges(res.graph_json.edges || []);
                setViewport(res.graph_json.viewport || { x: 0, y: 0, zoom: 1.0 });
                setFactorName(res.name);
                setFactorType(res.factor_type || 'technical');
                setEditingId(factorId);
                showToast('已加载: ' + res.name, 'success');
            }
        } catch (e) { showToast('加载失败', 'error'); }
    };

    // Load template
    const loadTemplate = (idx) => {
        const tpl = templates[idx];
        if (!tpl) return;
        pushHistory();
        setNodes(tpl.graph.nodes || []);
        setEdges(tpl.graph.edges || []);
        setViewport(tpl.graph.viewport || { x: 0, y: 0, zoom: 1.0 });
        setFactorName(tpl.name);
        setEditingId(null);
        showToast('已加载模板: ' + tpl.name, 'success');
    };

    const loadAlpha191 = async () => {
        const num = parseInt(alpha191Num);
        if (num < 1 || num > 191) {
            showToast('请输入1-191之间的数字', 'error');
            return;
        }
        try {
            const res = await api.get(`/api/factors/workflow/alpha191_v2/${num}`);
            setFactorName(res.name);
            setExpression(res.expression);

            // 尝试编译工作流图
            if (res.graph && res.graph.nodes && res.graph.edges) {
                try {
                    const compileRes = await api.post('/api/factors/workflow/compile', { graph: res.graph });
                    if (compileRes.errors && compileRes.errors.length > 0) {
                        // 编译失败，使用表达式模式
                        console.log('工作流编译失败，使用表达式模式:', compileRes.errors);
                        setNodes([]);
                        setEdges([]);
                        showToast(`已加载 ${res.name}（表达式模式）`, 'success');
                    } else {
                        // 编译成功，使用工作流图
                        setNodes(res.graph.nodes);
                        setEdges(res.graph.edges);
                        showToast(`已加载 ${res.name} 工作流图 (${res.graph.nodes.length}节点)`, 'success');
                    }
                } catch (e) {
                    // 编译请求失败，回退到表达式模式
                    console.log('编译请求失败，使用表达式模式');
                    setNodes([]);
                    setEdges([]);
                    showToast(`已加载 ${res.name}（表达式模式）`, 'success');
                }
            } else {
                setNodes([]);
                setEdges([]);
                showToast(`已加载 ${res.name}（表达式模式）`, 'success');
            }
            setShowAlpha191Select(false);
        } catch (e) {
            console.error('加载Alpha191失败:', e);
            showToast('加载失败: ' + (e.response?.data?.detail || e.message), 'error');
        }
    };

    // Preview factor values
    const runPreview = async () => {
        if (!expression) { showToast('请先构建有效工作流或加载因子', 'error'); return; }
        setPreviewLoading(true);
        try {
            // 如果没有节点，使用表达式直接预览（Alpha191模式）
            if (nodes.length === 0 && expression) {
                // 直接使用表达式创建临时因子进行评估
                const tempFactorName = factorName || 'TempFactor_' + Date.now();
                const saveRes = await api.post('/api/factors', {
                    name: tempFactorName,
                    description: 'Temporary factor for preview',
                    expression: expression,
                    category: 'temp'
                });

                const res = await api.post('/api/factors/evaluate', {
                    factor_id: saveRes.id,
                    universe: [previewCode],
                    start_date: previewStart,
                    end_date: previewEnd,
                    groups: 5,
                    forward_days: 5
                });

                if (res.ic_series && res.ic_series.length > 0) {
                    // 转换IC序列为预览数据格式
                    setPreviewData({
                        expression,
                        data: res.ic_series.map(d => ({
                            date: d.date,
                            value: d.ic
                        }))
                    });
                    showToast('预览成功（显示IC值）', 'success');
                } else {
                    showToast('预览失败：无有效数据', 'error');
                }
            } else if (nodes.length > 0) {
                // 有工作流图，使用正常预览
                const graph = { nodes, edges, viewport };
                const res = await api.post('/api/factors/workflow/preview', {
                    graph, ts_code: previewCode, start_date: previewStart, end_date: previewEnd,
                });
                setPreviewData(res);
                showToast('预览成功', 'success');
            } else {
                showToast('请先加载因子或构建工作流', 'error');
            }
        } catch (e) {
            console.error('Preview error:', e);
            showToast(e.response?.data?.detail || e.detail || '预览失败', 'error');
        }
        setPreviewLoading(false);
    };

    // Run factor backtest
    const runBacktest = async () => {
        if (!expression) { showToast('请先构建有效工作流', 'error'); return; }
        setBtLoading(true); setBtResult(null);
        try {
            const codes = btUniverse.split(',').map(s => s.trim()).filter(Boolean);
            let res;
            if (btMode === 'selection') {
                res = await api.post('/api/factor_backtest/selection', {
                    expression, universe: codes, start_date: btStart, end_date: btEnd,
                    select_mode: btSelectMode, select_pct: btSelectPct,
                    rebalance_days: btRebalDays, initial_cash: 1000000, benchmark: '000300.SH',
                });
            } else {
                res = await api.post('/api/factor_backtest/technical', {
                    expression, ts_codes: codes, start_date: btStart, end_date: btEnd,
                    open_threshold: btOpenThresh, close_threshold: btCloseThresh,
                    open_condition: btOpenCond, close_condition: btCloseCond, initial_cash: 1000000,
                });
            }
            if (res.task_id) {
                setBtTaskId(res.task_id);
                pollBacktest(res.task_id);
            }
        } catch (e) { showToast(e.detail || '回测提交失败', 'error'); setBtLoading(false); }
    };

    const pollBacktest = (taskId) => {
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(async () => {
            try {
                const r = await api.get('/api/factor_backtest/result/' + taskId);
                if (r.status === 'completed') {
                    clearInterval(pollRef.current); pollRef.current = null;
                    setBtResult(r.result); setBtLoading(false);
                    showToast('回测完成');
                } else if (r.status === 'failed') {
                    clearInterval(pollRef.current); pollRef.current = null;
                    showToast(r.error || '回测失败', 'error'); setBtLoading(false);
                }
            } catch { clearInterval(pollRef.current); pollRef.current = null; setBtLoading(false); }
        }, 2000);
    };

    // Cleanup poll interval on unmount
    useEffect(() => { return () => { if (pollRef.current) clearInterval(pollRef.current); }; }, []);

    // ===== JSX Return =====
    const selNode = nodes.find(n => n.id === selectedNode);
    const selNodeReg = selNode ? registry[selNode.type] : null;

    return (
        <div className="wf-page">
            {/* Toolbar */}
            <div className="wf-toolbar">
                <input value={factorName} onChange={e => setFactorName(e.target.value)}
                    style={{width:140,padding:'4px 8px',borderRadius:4,border:'1px solid #555',background:'#2a2a2a',color:'#eee'}} />
                <select value={factorType} onChange={e => setFactorType(e.target.value)}
                    style={{padding:'4px 8px',borderRadius:4,border:'1px solid #555',background:'#2a2a2a',color:'#eee'}}>
                    <option value="technical">技术因子</option>
                    <option value="selection">选股因子</option>
                </select>
                <button className="btn btn-sm" onClick={saveWorkflow}>{editingId ? '更新' : '保存'}</button>
                <select onChange={e => {
                    const val = e.target.value;
                    if (val === 'alpha191') {
                        setShowAlpha191Select(true);
                    } else if (val) {
                        loadTemplate(parseInt(val));
                    }
                    e.target.value='';
                }} style={{padding:'4px 8px',borderRadius:4,border:'1px solid #555',background:'#2a2a2a',color:'#eee'}}>
                    <option value="">加载模板...</option>
                    {templates.map((t,i) => <option key={i} value={i}>{t.name}</option>)}
                    <option value="alpha191">Alpha191因子</option>
                </select>
                <select onChange={e => { if (e.target.value) loadWorkflow(parseInt(e.target.value)); e.target.value=''; }}
                    style={{padding:'4px 8px',borderRadius:4,border:'1px solid #555',background:'#2a2a2a',color:'#eee'}}>
                    <option value="">加载已保存...</option>
                    {savedFactors.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                </select>
                <button className="btn btn-sm" onClick={() => { setNodes([]); setEdges([]); setEditingId(null); setFactorName('新因子'); setBtResult(null); setPreviewData(null); }}>清空</button>
                <span style={{marginLeft:'auto',fontSize:12,color:compileErrors.length?'#f87171':'#86efac'}}>
                    {compileErrors.length ? compileErrors[0] : (expression ? '✓ 编译成功' : '')}
                </span>
            </div>

            <div className="wf-body">
                {/* Left: Node Palette */}
                <div className="wf-palette">
                    {WF_CATEGORIES.filter(c => c.key !== 'output').map(cat => {
                        const catNodes = Object.entries(registry).filter(([k,v]) => v.category === cat.key);
                        if (!catNodes.length) return null;
                        const collapsed = collapsedCats[cat.key];
                        return (
                            <div key={cat.key} style={{marginBottom:4}}>
                                <div onClick={() => setCollapsedCats(p => ({...p, [cat.key]: !p[cat.key]}))}
                                    style={{cursor:'pointer',padding:'4px 6px',fontWeight:600,fontSize:12,color:cat.color,display:'flex',alignItems:'center',gap:4}}>
                                    <span style={{transform:collapsed?'rotate(-90deg)':'',transition:'0.15s'}}>▼</span> {cat.label}
                                </div>
                                {!collapsed && catNodes.map(([type, reg]) => (
                                    <div key={type} draggable
                                        onDragStart={e => e.dataTransfer.setData('nodeType', type)}
                                        style={{padding:'3px 8px 3px 16px',fontSize:11,cursor:'grab',color:'#ccc',borderLeft:`3px solid ${cat.color}`,marginBottom:1}}>
                                        {reg.label}
                                    </div>
                                ))}
                            </div>
                        );
                    })}
                    {/* Output node button */}
                    <div style={{marginTop:8,padding:'4px 6px'}}>
                        <button className="btn btn-sm" style={{width:'100%',fontSize:11}}
                            onClick={() => addNode('output', 600, 200)}>+ 输出节点</button>
                    </div>
                </div>

                {/* Center: Canvas */}
                <div className="wf-canvas-wrap" ref={wrapRef}
                    onDrop={e => { e.preventDefault(); const t = e.dataTransfer.getData('nodeType'); if (!t) return; const rect = wrapRef.current.getBoundingClientRect(); const cx = (e.clientX - rect.left - viewport.x) / viewport.zoom; const cy = (e.clientY - rect.top - viewport.y) / viewport.zoom; addNode(t, cx, cy); }}
                    onDragOver={e => e.preventDefault()}>
                    <canvas ref={canvasRef} style={{position:'absolute',top:0,left:0}} />
                    <canvas ref={overlayRef} style={{position:'absolute',top:0,left:0}}
                        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp}
                        onContextMenu={e => e.preventDefault()} tabIndex={0} />
                </div>

                {/* Right: Inspector */}
                <div className="wf-inspector">
                    {selNode && selNodeReg ? (
                        <div>
                            <div style={{fontWeight:600,fontSize:13,marginBottom:8,color:catColors[selNodeReg.category]||'#eee'}}>

                            <select value={btCloseCond} onChange={e => setBtCloseCond(e.target.value)}

                    <button className="btn btn-sm" onClick={runBacktest} disabled={btLoading} style={{fontSize:11}}>

                    </button>
                </div>
            </div>

            {/* Backtest Result */}
            {btResult && btResult.metrics && (
                <div style={{padding:'8px 12px',background:'#1a1a2e',borderTop:'1px solid #333'}}>
                    <div style={{display:'flex',gap:16,flexWrap:'wrap',fontSize:12,marginBottom:6}}>
                        {Object.entries(btResult.metrics).slice(0,10).map(([k,v]) => (
                            <span key={k} style={{color:'#aaa'}}>{k}: <b style={{color: typeof v==='number'&&v<0?'#f87171':'#eee'}}>{typeof v==='number'?v.toFixed(4):v}</b></span>
                        ))}
                    </div>
                    {btResult.equity_curve && btResult.equity_curve.length > 1 && (
                        <div style={{height:140,background:'#111827',borderRadius:4,padding:4}}>
                            <EquityCurveChart data={btResult.equity_curve} />
                        </div>
                    )}
                    {btResult.trades && btResult.trades.length > 0 && (
                        <details style={{marginTop:6,fontSize:11}}>
                            <summary style={{cursor:'pointer',color:'#888'}}>交易记录 ({btResult.trades.length}笔)</summary>
                            <div style={{maxHeight:320,overflowY:'auto',overflowX:'auto',marginTop:4}}>
                                <table style={{width:'100%',fontSize:10,borderCollapse:'collapse'}}>
                                    <thead><tr style={{color:'#888'}}>
                                        <th style={{textAlign:'left',padding:'2px 4px'}}>日期</th>
                                        <th style={{textAlign:'left',padding:'2px 4px'}}>股票</th>
                                        <th style={{textAlign:'left',padding:'2px 4px'}}>方向</th>
                                        <th style={{textAlign:'right',padding:'2px 4px'}}>价格</th>

                                    <tbody>{btResult.trades.map((t,i) => (

                                            <td style={{padding:'2px 4px'}}>{t.date}</td>

                                            <td style={{padding:'2px 4px',color:t.action==='buy'?'#f87171':'#34d399'}}>{t.action}</td>
                                            <td style={{textAlign:'right',padding:'2px 4px'}}>{t.price?.toFixed(2)}</td>
                                            <td style={{textAlign:'right',padding:'2px 4px'}}>{t.amount||t.shares||''}</td>
                                        </tr>
                                    ))}</tbody>

                </div>
            )}

            {/* Advanced Analysis Panel */}
            {expression && (
                <div style={{padding:'12px',background:'#1a1a2e',borderTop:'1px solid #333',marginTop:8}}>
                    <div style={{fontWeight:600,fontSize:14,marginBottom:12,color:'#60a5fa'}}>高级因子分析</div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(280px, 1fr))',gap:12}}>
                        {/* 相关性分析 */}
                        <div style={{background:'#111827',padding:12,borderRadius:6,border:'1px solid #374151'}}>
                            <div style={{fontSize:12,fontWeight:600,marginBottom:8,color:'#a78bfa'}}>因子相关性分析</div>
                            <div style={{fontSize:11,color:'#9ca3af',marginBottom:8}}>分析多个因子间的相关性矩阵</div>
                            <button className="btn btn-sm" style={{fontSize:11,width:'100%'}}
                                onClick={() => showToast('相关性分析功能：分析因子间IC相关性，避免冗余', 'info')}>
                                运行分析
                            </button>
                        </div>

                        {/* 因子组合优化 */}
                        <div style={{background:'#111827',padding:12,borderRadius:6,border:'1px solid #374151'}}>
                            <div style={{fontSize:12,fontWeight:600,marginBottom:8,color:'#34d399'}}>因子组合优化</div>
                            <div style={{fontSize:11,color:'#9ca3af',marginBottom:8}}>基于IC_IR的最优权重组合</div>
                            <button className="btn btn-sm" style={{fontSize:11,width:'100%'}}
                                onClick={() => showToast('组合优化：通过最大化IC_IR找到最优因子权重', 'info')}>
                                优化组合
                            </button>

                        {/* 衰减分析 */}
                        <div style={{background:'#111827',padding:12,borderRadius:6,border:'1px solid #374151'}}>
                            <div style={{fontSize:12,fontWeight:600,marginBottom:8,color:'#fbbf24'}}>因子衰减分析</div>
                            <div style={{fontSize:11,color:'#9ca3af',marginBottom:8}}>分析因子预测能力随时间衰减</div>
                            <button className="btn btn-sm" style={{fontSize:11,width:'100%'}}

                        {/* 中性化处理 */}
                        <div style={{background:'#111827',padding:12,borderRadius:6,border:'1px solid #374151'}}>

                                中性化
                            </button>
                        </div>

                        {/* 归因分析 */}
                        <div style={{background:'#111827',padding:12,borderRadius:6,border:'1px solid #374151'}}>
                            <div style={{fontSize:12,fontWeight:600,marginBottom:8,color:'#fb923c'}}>收益归因分析</div>
                            <div style={{fontSize:11,color:'#9ca3af',marginBottom:8}}>分解因子收益来源</div>
                            <button className="btn btn-sm" style={{fontSize:11,width:'100%'}}
                                onClick={() => showToast('归因分析：分解Alpha、Beta、行业等收益贡献', 'info')}>
                                归因分解
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* Alpha191 Modal */}
            {showAlpha191Select && (
                <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:9999}}>
                    <div style={{background:'var(--bg-700)',padding:24,borderRadius:8,minWidth:300}}>
                        <h3 style={{marginTop:0}}>选择 Alpha191 因子</h3>
                        <div style={{marginBottom:16}}>
                            <label style={{display:'block',marginBottom:8}}>因子编号 (1-191):</label>
                            <input type="number" min="1" max="191" value={alpha191Num}
                                onChange={e => setAlpha191Num(e.target.value)}
                                style={{width:'100%',padding:'8px',borderRadius:4,border:'1px solid #555',background:'#2a2a2a',color:'#eee'}} />
                        </div>
                        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                            <button className="btn btn-sm" onClick={() => setShowAlpha191Select(false)}>取消</button>
                            <button className="btn btn-sm btn-primary" onClick={loadAlpha191}>加载</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

function EquityCurveChart({ series, selectedQuantile, onSelectQuantile, rangeKey, onRangeChange, rangeOptions, spreadSeries, spreadReturnPct }) {
    const [viewMode, setViewMode] = useState('all');
    const usableSeries = Array.isArray(series) ? series.filter(item => Array.isArray(item.points) && item.points.length > 1) : [];
    const usableSpread = Array.isArray(spreadSeries) && spreadSeries.length > 1 ? spreadSeries : [];
    if (!usableSeries.length) return null;

    const activeSeries = usableSeries.find(item => String(item.quantile) === String(selectedQuantile)) || usableSeries[0];
    const drawSeries = viewMode === 'focus' ? [activeSeries] : (viewMode === 'spread' ? [] : usableSeries);
    const drawSpread = usableSpread.length > 1 && (viewMode === 'all' || viewMode === 'spread');
    const allDates = Array.from(new Set([
        ...usableSeries.flatMap(item => item.points.map(point => String(point.date || ''))),
        ...usableSpread.map(point => String(point.date || '')),
    ])).sort();
    const dateIndexMap = Object.fromEntries(allDates.map((date, index) => [date, index]));
    const allValues = [
        ...drawSeries.flatMap(item => item.points.map(point => Number(point.value) || 0)),
        ...(drawSpread ? usableSpread.map(point => Number(point.value) || 0) : []),
        1,
    ];
    const rawMin = Math.min(...allValues);
    const rawMax = Math.max(...allValues);
    const padding = Math.max((rawMax - rawMin) * 0.08, 0.02);
    const minV = rawMin - padding;
    const maxV = rawMax + padding;
    const valueRange = maxV - minV || 1;
    const w = 860, h = 390, pad = { left: 58, right: 54, top: 26, bottom: 48 };
    const chartW = w - pad.left - pad.right;
    const chartH = h - pad.top - pad.bottom;

    const formatAxisDate = (value) => {
        const text = String(value || '');
        if (text.length === 8 && !text.includes('-')) return `${text.slice(4, 6)}-${text.slice(6, 8)}`;
        if (text.length >= 10 && text.includes('-')) return text.slice(5, 10);
        return text;
    };
    const yScale = (value) => pad.top + chartH - ((value - minV) / valueRange) * chartH;
    const xScale = (date) => {
        const idx = dateIndexMap[String(date)] || 0;
        return pad.left + ((allDates.length <= 1 ? 0 : idx / (allDates.length - 1)) * chartW);
    };

    const yTicks = Array.from({ length: 5 }, (_, index) => {
        const ratio = index / 4;
        const value = maxV - ratio * valueRange;
        return { value, y: pad.top + ratio * chartH };
    });
    const xTicks = Array.from({ length: Math.min(6, allDates.length) }, (_, index) => {
        const idx = allDates.length <= 1 ? 0 : Math.round((index / Math.max(1, Math.min(5, allDates.length - 1))) * (allDates.length - 1));
        const date = allDates[idx];
        return { date, x: xScale(date) };
    }).filter((item, index, arr) => index === arr.findIndex(other => other.date === item.date));

    const selectedReturn = Number(activeSeries.returnPct || 0);
    const spreadReturn = Number(spreadReturnPct || 0);
    const dateStart = allDates[0] ? formatAxisDate(allDates[0]) : '-';
    const dateEnd = allDates[allDates.length - 1] ? formatAxisDate(allDates[allDates.length - 1]) : '-';
    const spreadPoints = usableSpread.map(point => `${xScale(point.date)},${yScale(point.value)}`).join(' ');
    const spreadLast = usableSpread.length ? usableSpread[usableSpread.length - 1] : null;
    const activePolyline = activeSeries.points.map(point => `${xScale(point.date)},${yScale(point.value)}`).join(' ');
    const activeArea = activeSeries.points.length
        ? `${xScale(activeSeries.points[0].date)},${h - pad.bottom} ${activePolyline} ${xScale(activeSeries.points[activeSeries.points.length - 1].date)},${h - pad.bottom}`
        : '';
    const baselineY = yScale(1);
    const noteText = viewMode === 'focus'
        ? '聚焦视图仅突出当前选中分位，并以1.00作为基准净值线。'
        : (viewMode === 'spread'
            ? '多空视图单独观察最高分位与最低分位之间的组合收益差。'
            : '全景视图同时展示所有分位组合，白色虚线代表多空价差。');

    return (
        <div className="factor-board-chart-shell">
            <div className="factor-board-chart-head">
                <div className="factor-board-chart-meta">
                    <div className="factor-board-chart-kpi">
                        <span className="label">{'区间'}</span>
                        <span className="value">{dateStart}{' ~ '}{dateEnd}</span>
                    </div>
                    <div className="factor-board-chart-kpi">
                        <span className="label">{'分位数'}</span>
                        <span className="value">{usableSeries.length}</span>
                    </div>
                    <div className="factor-board-chart-kpi">
                        <span className="label">{'当前聚焦'}</span>
                        <span className={'value ' + (selectedReturn >= 0 ? 'text-profit' : 'text-loss')}>Q{activeSeries.quantile} {selectedReturn >= 0 ? '+' : ''}{selectedReturn.toFixed(2)}%</span>
                    </div>
                    <div className="factor-board-chart-kpi">
                        <span className="label">{'多空价差'}</span>
                        <span className={'value ' + (spreadReturn >= 0 ? 'spread-positive' : 'spread-negative')}>{spreadReturn >= 0 ? '+' : ''}{spreadReturn.toFixed(2)}%</span>
                    </div>
                </div>
                <div className="factor-board-range-tabs">
                    {(rangeOptions || []).map(item => (
                        <button key={item.key} className={'factor-board-range-chip' + (rangeKey === item.key ? ' active' : '')} onClick={() => onRangeChange(item.key)}>{item.label}</button>
                    ))}
                </div>
            </div>
            <div className="factor-board-chart-toolbar">
                <div className="factor-board-chart-viewtabs">
                    <button className={'factor-board-range-chip' + (viewMode === 'all' ? ' active' : '')} onClick={() => setViewMode('all')}>{'全景分位'}</button>
                    <button className={'factor-board-range-chip' + (viewMode === 'focus' ? ' active' : '')} onClick={() => setViewMode('focus')}>{'聚焦分位'}</button>
                    <button className={'factor-board-range-chip' + (viewMode === 'spread' ? ' active' : '')} onClick={() => setViewMode('spread')}>{'多空价差'}</button>
                </div>
                <div className="factor-board-subtle">{'单击下方 Q 标签可切换聚焦分位'}</div>
            </div>
            <div className="factor-board-chart-tabs">
                {usableSeries.map(item => (
                    <button key={item.quantile} className={'factor-board-chip' + (String(selectedQuantile) === String(item.quantile) ? ' active' : '')} onClick={() => onSelectQuantile(item.quantile)}>Q{item.quantile}</button>
                ))}
            </div>
            <svg viewBox={`0 0 ${w} ${h}`} className="factor-board-chart-svg">
                <defs>
                    <linearGradient id="factorBoardActiveGlow" x1="0" x2="1" y1="0" y2="0">
                        <stop offset="0%" stopColor={activeSeries.color} stopOpacity="0.34" />
                        <stop offset="100%" stopColor={activeSeries.color} stopOpacity="0.08" />
                    </linearGradient>
                    <linearGradient id="factorBoardActiveArea" x1="0" x2="0" y1="0" y2="1">

        const matchesKeyword = !keyword || String(item.factor_name || '').toLowerCase().includes(keyword) || String(item.universe_name || '').toLowerCase().includes(keyword);
        if (!matchesKeyword) return false;
        if (resultPreset === 'positive') return getSpreadExcess(item) > 0;
        if (resultPreset === 'high_ic') return safeNum(item.ic_mean) >= 0.03;
        if (resultPreset === 'low_turnover') return safeNum(item.max_quantile_turnover) <= 15;
        if (resultPreset === 'favorites') return isFavoriteFactor(item.factor_name);
        return true;
    }).sort((a, b) => {
        const av = resolveSortValue(a, sortKey);
        const bv = resolveSortValue(b, sortKey);
        const aNum = Number(av);
        const bNum = Number(bv);
        let cmp = 0;
        if (Number.isFinite(aNum) && Number.isFinite(bNum)) cmp = aNum - bNum;
        else cmp = String(av).localeCompare(String(bv));
        return sortDir === 'asc' ? cmp : -cmp;
    });

    const avgCoverage = results.length ? results.reduce((sum, item) => sum + safeNum(item.coverage_ratio), 0) / results.length : 0;
    const avgIc = results.length ? results.reduce((sum, item) => sum + safeNum(item.ic_mean), 0) / results.length : 0;
    const bestFactor = results.length ? [...results].sort((a, b) => Math.abs(getSpreadExcess(b)) - Math.abs(getSpreadExcess(a)))[0] : null;
    const latestResult = detail.snapshot && detail.snapshot.latest_result ? detail.snapshot.latest_result : null;
    const infoDescription = detail.info && detail.info.description ? detail.info.description : '暂无因子说明';
    const economicMeaning = detail.info && detail.info.economic_meaning ? detail.info.economic_meaning : infoDescription;
    const latestTradeDateLabel = detail.snapshot && detail.snapshot.latest_trade_date ? detail.snapshot.latest_trade_date : '-';
    const avgHoldingWeight = currentHoldings.length ? currentHoldings.reduce((sum, item) => sum + safeNum(item.weight), 0) / currentHoldings.length : 0;
    const topHolding = currentHoldings.length ? [...currentHoldings].sort((a, b) => safeNum(b.weight) - safeNum(a.weight))[0] : null;
    const activeUniverseLabel = analysisForm.universe_type === 'system'
        ? ((selectedSystemUniverse && selectedSystemUniverse.name) || '系统股票池')
        : ((selectedCustomPool && selectedCustomPool.name) || '未选择自定义股票池');
    const activeUniverseMeta = analysisForm.universe_type === 'system'
        ? ((selectedSystemUniverse && selectedSystemUniverse.code) || (analysisForm.universe_code || '-'))
        : (((selectedCustomPool && selectedCustomPool.stock_count) || (poolForm.stock_items || []).length || 0) + '只股票');
    const customPoolCount = (universeOptions.custom_pools || []).length;
    const selectedPoolCount = analysisForm.universe_type === 'custom'
        ? ((selectedCustomPool && selectedCustomPool.stock_count) || 0)
        : 0;
    const favoriteCount = favoriteFactors.length;

    const buildFactorStrategyPrompt = (factorName, resultItem, factorInfo) => {
        const info = factorInfo || detail.info || {};
        const promptParts = [
            `请基于 Alpha191 因子 ${factorName || selectedFactor || ''} 生成一个适用于 QTsys 的股票量化策略。`,
            `当前研究股票池：${activeUniverseLabel}（${activeUniverseMeta}）。`,
        ];
        if (analysisForm.start_date || analysisForm.end_date) {
            promptParts.push(`建议参考的研究区间：${analysisForm.start_date || '-'} 至 ${analysisForm.end_date || '-' }。`);
        }
        if (resultItem) {
            promptParts.push(`该因子当前回测摘要：高分位超额 ${formatPct(resultItem.max_quantile_excess)}，低分位超额 ${formatPct(resultItem.min_quantile_excess)}，高低分位差 ${formatPct(getSpreadExcess(resultItem))}，IC 均值 ${formatNum(resultItem.ic_mean)}，覆盖率 ${formatPct(resultItem.coverage_ratio)}，换手 ${formatPct(resultItem.max_quantile_turnover)}。`);
        }
        if (info.description) {
            promptParts.push(`因子说明：${info.description}`);
        }
        if (info.economic_meaning) {
            promptParts.push(`经济学含义：${info.economic_meaning}`);
        }
        if (info.formula) {
            promptParts.push(`真实公式：${info.formula}`);
        }
        promptParts.push('请把这个因子转化为可执行的选股/调仓逻辑，并明确买入条件、卖出条件、仓位控制、止损或风险控制。');
        promptParts.push('不要硬编码大量股票列表，直接使用 context.universe。若该因子更适合作为反向信号，请按反向信号设计策略。');
        return promptParts.filter(Boolean).join('\n');
    };

    const buildFactorBacktestContext = async () => {
        const window = resolveAnalysisWindow(analysisForm.start_date, analysisForm.end_date, analysisForm.backtest_days);
        if (analysisForm.universe_type === 'custom') {
            const stockItems = normalizeStockItems(selectedCustomPool && selectedCustomPool.stock_items ? selectedCustomPool.stock_items : []);
            return normalizeBacktestContext({
                source: 'factorboard',
                source_label: '因子看板',
                universe_type: 'custom',
                universe_code: selectedCustomPool ? `custom:${selectedCustomPool.id}` : 'custom',
                universe_name: selectedCustomPool && selectedCustomPool.name ? selectedCustomPool.name : '自定义股票池',
                custom_pool_id: selectedCustomPool ? selectedCustomPool.id : null,
                benchmark: '000300.SH',
                backtest_days: analysisForm.backtest_days,
                start_date: window.start_date,
                end_date: window.end_date,
                stock_items: stockItems,
            });
        }

        const targetCode = (analysisForm.universe_code || '000905.SH');
        const res = await api.get(`/api/factor_board/system_universe_members?code=${encodeURIComponent(targetCode)}`);
        return normalizeBacktestContext({
            source: 'factorboard',
            source_label: '因子看板',
            universe_type: 'system',
            universe_code: res.code || targetCode,
            universe_name: res.name || (selectedSystemUniverse && selectedSystemUniverse.name) || targetCode,
            benchmark: res.benchmark_code || (selectedSystemUniverse && selectedSystemUniverse.benchmark_code) || targetCode,
            backtest_days: analysisForm.backtest_days,
            start_date: window.start_date,
            end_date: window.end_date,
            stock_items: normalizeStockItems(res.stock_items || []),
        });
    };

    const openStrategyFromFactor = async (factorName, resultItem, factorInfo) => {
        const prompt = buildFactorStrategyPrompt(factorName, resultItem, factorInfo);
        let backtestContext = null;
        try {
            backtestContext = await buildFactorBacktestContext();
        } catch (e) {
            showToast((e && e.detail) || '获取股票池成分失败，将仅打开 AI 策略草稿', 'error');
        }
        pushStrategyAIPrefill({
            source: 'factorboard',
            factor_name: factorName,
            prompt,
            auto_generate: true,
            backtest_context: backtestContext,
        });
        if (openStrategyWorkspace) openStrategyWorkspace();
        showToast('已将因子研究上下文发送到 AI 策略助手', 'success');
    };

    return (
        <div className="factor-board-shell fade-in">
            <div className="factor-board-hero">
                <section className="factor-board-glass">
                    <div className="factor-board-title">Alpha191 因子看板</div>
                    <div className="factor-board-copy">基于真实回测结果统一查看 Alpha191 因子的高低分位超额、分位差、IC、覆盖率、换手与当前有效性。这里的“高分位超额/低分位超额”分别对应最高因子值分位与最低因子值分位相对基准的年化超额收益。</div>
                    <div className="factor-board-pillrow">
                        <span className="factor-board-pill">真实数据库结果</span>
                        <span className="factor-board-pill">批量分析任务</span>
                        <span className="factor-board-pill">因子详情与持仓</span>
                        <span className="factor-board-pill">研究筛选与排序</span>
                    </div>

                <section className="factor-board-glass factor-board-panel">
                    <div className="factor-board-toolbar">
                        <div>
                            <div className="card-title" style={{marginBottom: 6}}>{'研究筛选'}</div>
                            <div className="factor-board-subtle">{'已完成 '}{Math.round(Math.max(0, Math.min(100, safeNum(status.progress))))}{'% · 当前因子 '}{status.current_factor || '-'}</div>
                        </div>
                    </div>
                    <div className="factor-board-progress"><span style={{ width: `${Math.max(0, Math.min(100, safeNum(status.progress)))}%` }}></span></div>
                </section>

                            <div className="card-title" style={{marginBottom: 6}}>{'股票池工作台'}</div>
                            <div className="factor-board-subtle">{'主界面仅保留股票池概览，新建、编辑、删除和成分调整统一在独立弹窗中完成。'}</div>
                        </div>
                        <div className="factor-board-toolbar-right">
                            <button className="btn btn-secondary" onClick={() => { resetPoolForm(); setShowPoolManager(true); }}>{'新建股票池'}</button>
                            <button className="btn btn-primary" onClick={() => setShowPoolManager(true)}>{'管理自定义股票池'}</button>
                        </div>
                    </div>
                    <div className="factor-board-quickgrid">
                        <div className="factor-board-mini-card">
                            <div className="factor-board-mini-label">{'当前用于分析'}</div>
                            <div className="factor-board-mini-value small">{activeUniverseLabel}</div>
                            <div className="factor-board-mini-meta">{activeUniverseMeta}</div>
                        </div>
                        <div className="factor-board-mini-card">
                            <div className="factor-board-mini-label">{'自定义股票池数量'}</div>
                            <div className="factor-board-mini-value">{customPoolCount}</div>
                            <div className="factor-board-mini-meta">{'可供后续回测与因子筛选复用'}</div>
                        </div>
                        <div className="factor-board-mini-card">
                            <div className="factor-board-mini-label">{'当前自定义池成分'}</div>
                            <div className="factor-board-mini-value">{selectedPoolCount}</div>
                            <div className="factor-board-mini-meta">{'仅在选中自定义股票池时生效'}</div>
                        </div>
                        <div className="factor-board-mini-card">
                            <div className="factor-board-mini-label">{'快捷操作'}</div>
                            <div className="factor-board-mini-value small">{'统一入口，避免主页拥挤'}</div>
                            <div className="factor-board-mini-meta">{'点击右上角按钮即可打开管理面板'}</div>
                        </div>
                    </div>
                </section>

            <section className="card space-y factor-board-panel">
                <div>
                    <div className="card-title" style={{marginBottom: 6}}>研究筛选</div>

                <div className="grid-2">
                    <div className="field"><label className="label">因子搜索</label><input className="input" value={search} placeholder="例如 Alpha#001 / 中证500" onChange={e => setSearch(e.target.value)} /></div>
                    <div className="field"><label className="label">排序字段</label><select className="input" value={sortKey} onChange={e => setSortKey(e.target.value)}><option value="spread_excess">高低分位差</option><option value="high_quantile_excess">高分位超额</option><option value="low_quantile_excess">低分位超额</option><option value="ic_mean">IC 均值</option><option value="ir_value">IR</option><option value="coverage_ratio">覆盖率</option><option value="max_quantile_turnover">高分位换手率</option></select></div>
                    <div className="field"><label className="label">排序方向</label><select className="input" value={sortDir} onChange={e => setSortDir(e.target.value)}><option value="desc">从高到低</option><option value="asc">从低到高</option></select></div>
                    <div className="field"><label className="label">最新批次</label><div className="factor-board-status"><span className="factor-board-dot"></span><span>{status.analysis_batch || '暂无批次'}</span></div></div>
                </div>
                <div>
                    <div className="label" style={{marginBottom: 10}}>{'快捷筛选'}</div>
                    <div className="factor-board-filterbar">
                        <button className={'factor-board-filterchip' + (resultPreset === 'all' ? ' active' : '')} onClick={() => setResultPreset('all')}>{'全部因子'}</button>
                        <button className={'factor-board-filterchip' + (resultPreset === 'positive' ? ' active' : '')} onClick={() => setResultPreset('positive')}>{'高分位领先'}</button>
                        <button className={'factor-board-filterchip' + (resultPreset === 'high_ic' ? ' active' : '')} onClick={() => setResultPreset('high_ic')}>{'高 IC'}</button>
                        <button className={'factor-board-filterchip' + (resultPreset === 'low_turnover' ? ' active' : '')} onClick={() => setResultPreset('low_turnover')}>{'低换手'}</button>
                        <button className={'factor-board-filterchip' + (resultPreset === 'favorites' ? ' active' : '')} onClick={() => setResultPreset('favorites')}>{'已收藏'}{' ('}{favoriteCount}{')'}</button>
                    </div>
                </div>
            </section>
            </div>

            <div className="factor-board-overview">
                <div className="factor-board-overview-card">
                    <div className="factor-board-overview-label">{'当前股票池'}</div>
                    <div className="factor-board-overview-value small">{analysisForm.universe_type === 'system' ? ((selectedSystemUniverse && selectedSystemUniverse.name) || '系统股票池') : ((selectedCustomPool && selectedCustomPool.name) || '未选择自定义股票池')}</div>
                    <div className="factor-board-overview-meta">{'批次：'}{status.analysis_batch || '暂无批次'}</div>
                </div>
                <div className="factor-board-overview-card">
                    <div className="factor-board-overview-label">{'已分析因子'}</div>
                    <div className="factor-board-overview-value">{results.length}</div>
                    <div className="factor-board-overview-meta">{'当前显示 '}{filteredResults.length}{' 个因子'}</div>
                </div>
                <div className="factor-board-overview-card">
                    <div className="factor-board-overview-label">{'平均覆盖率'}</div>
                    <div className={'factor-board-overview-value ' + metricTextClass(avgCoverage)}>{formatPct(avgCoverage)}</div>
                    <div className="factor-board-overview-meta">{'衡量每个交易日可参与排序的股票覆盖程度'}</div>
                </div>
                <div className="factor-board-overview-card">
                    <div className="factor-board-overview-label">{'平均 IC'}</div>
                    <div className={'factor-board-overview-value ' + metricTextClass(avgIc)}>{formatNum(avgIc)}</div>
                    <div className="factor-board-overview-meta">{'衡量因子排序与后续收益的一致性'}</div>
                </div>
                <div className="factor-board-overview-card">
                    <div className="factor-board-overview-label">{'当前分化最强因子'}</div>
                    <div className="factor-board-overview-value small">{bestFactor ? bestFactor.factor_name : '--'}</div>
                    <div className="factor-board-overview-meta">{bestFactor ? ('高低分位差 ' + formatPct(getSpreadExcess(bestFactor))) : '暂无结果'}</div>
                </div>
                <div className="factor-board-overview-card">
                    <div className="factor-board-overview-label">{'收藏因子'}</div>
                    <div className="factor-board-overview-value">{favoriteCount}</div>
                    <div className="factor-board-overview-meta">{'可对重点跟踪的 Alpha191 因子进行快速筛选'}</div>
                </div>
            </div>

            <section className="card space-y factor-board-panel">
                <div className="factor-board-toolbar">
                    <div>
                        <div className="card-title" style={{marginBottom: 6}}>{'分析过程'}</div>
                        <div className="factor-board-subtle">{status.phase_label || '等待任务'}{' · '}{status.message || '待启动'}</div>
                    </div>
                    <div className="factor-board-toolbar-right">
                        <div className="factor-board-results-tip">{'当前批次 '}{status.analysis_batch || '-'}</div>
                        <div className="factor-board-results-tip">{'已保留 '}{safeNum(status.result_count)}{' 个因子结果'}</div>
                        <button className="btn btn-secondary" onClick={retryFailedFactors} disabled={retrying || status.running || failedFactors.length === 0}>{retrying ? '重试中...' : '重试失败因子'}</button>
                    </div>
                </div>
                <div className="factor-board-stage-grid">
                    {stageCards.map((item, idx) => (
                        <div key={item.key} className={'factor-board-stage-card ' + phaseState(item.key, idx)}>
                            <div className="factor-board-stage-title">{item.title}</div>
                            <div className="factor-board-stage-value">{item.value}</div>
                            <div className="factor-board-stage-meta">{item.meta}</div>
                        </div>
                    ))}
                </div>
                <div className="factor-board-process-grid">
                    <div className="factor-board-process-card">
                        <div className="factor-board-process-head">
                            <div className="card-title" style={{marginBottom: 0}}>{'运行日志'}</div>
