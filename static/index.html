/* ===== Return Histogram (Canvas) ===== */
function ReturnHistogram({ histogram, var95, cvar95 }) {
    const canvasRef = useRef(null);
    useEffect(() => {
        if (!histogram || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const W = 600, H = 250;
        canvas.width = W; canvas.height = H;
        ctx.fillStyle = '#252a3a'; ctx.fillRect(0, 0, W, H);
        const counts = histogram.counts || [];
        const edges = histogram.bin_edges || [];
        if (counts.length === 0) return;
        const maxCount = Math.max(...counts);
        const barW = (W - 60) / counts.length;
        const chartH = H - 40;
        // bars
        for (let i = 0; i < counts.length; i++) {
            const h = maxCount > 0 ? (counts[i] / maxCount) * chartH : 0;
            const x = 40 + i * barW;
            const mid = (edges[i] + edges[i + 1]) / 2;
            ctx.fillStyle = mid >= 0 ? '#22c55e88' : '#ef444488';
            ctx.fillRect(x, H - 20 - h, barW - 1, h);
        }
        // VaR/CVaR lines
        const minE = edges[0], maxE = edges[edges.length - 1];
        const range = maxE - minE || 1;
        if (var95 != null) {
            const vx = 40 + ((var95 / 100 - minE) / range) * (W - 60);
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
            ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(vx, 10); ctx.lineTo(vx, H - 20); ctx.stroke();
            ctx.setLineDash([]); ctx.fillStyle = '#f59e0b'; ctx.font = '10px sans-serif'; ctx.fillText('VaR', vx + 2, 18);
        }
        if (cvar95 != null) {
            const cx = 40 + ((cvar95 / 100 - minE) / range) * (W - 60);
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
            ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(cx, 10); ctx.lineTo(cx, H - 20); ctx.stroke();
            ctx.setLineDash([]); ctx.fillStyle = '#ef4444'; ctx.font = '10px sans-serif'; ctx.fillText('CVaR', cx + 2, 18);
        }
        // axis labels
        ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
        ctx.fillText((minE * 100).toFixed(1) + '%', 40, H - 4);
        ctx.fillText((maxE * 100).toFixed(1) + '%', W - 50, H - 4);
    }, [histogram, var95, cvar95]);
    if (!histogram) return null;
    return (
        <div>
            <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>日收益分布</div>
            <div className="histogram-wrap"><canvas ref={canvasRef} style={{width:'100%',maxWidth:600,height:250}}/></div>
        </div>
    );
}

/* ===== Monthly Heatmap (Canvas) ===== */
function MonthlyHeatmap({ data }) {
    const canvasRef = useRef(null);
    const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月','年度'];
    useEffect(() => {
        if (!data || data.length === 0 || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const cellW = 52, cellH = 28, padL = 50, padT = 24;
        const W = padL + 13 * cellW + 10, H = padT + data.length * cellH + 10;
        canvas.width = W; canvas.height = H;
        ctx.fillStyle = '#252a3a'; ctx.fillRect(0, 0, W, H);
        // header
        ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        MONTHS.forEach((m, i) => ctx.fillText(m, padL + i * cellW + cellW / 2, 16));
        // rows
        data.forEach((row, ri) => {
            ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'right';
            ctx.fillText(String(row.year), padL - 6, padT + ri * cellH + cellH / 2 + 4);
            const vals = [...(row.months || []), row.annual];
            vals.forEach((v, ci) => {
                const x = padL + ci * cellW, y = padT + ri * cellH;
                if (v == null) { ctx.fillStyle = '#1a1d29'; ctx.fillRect(x + 1, y + 1, cellW - 2, cellH - 2); return; }
                const intensity = Math.min(Math.abs(v) / 10, 1);
                if (v >= 0) ctx.fillStyle = `rgba(34,197,94,${0.15 + intensity * 0.6})`;
                else ctx.fillStyle = `rgba(239,68,68,${0.15 + intensity * 0.6})`;
                ctx.fillRect(x + 1, y + 1, cellW - 2, cellH - 2);
                ctx.fillStyle = '#e2e8f0'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(v.toFixed(1) + '%', x + cellW / 2, y + cellH / 2 + 4);
            });
        });
    }, [data]);
    if (!data || data.length === 0) return null;
    return (
        <div>
            <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>月度收益热力图</div>
            <div className="monthly-heatmap-wrap"><canvas ref={canvasRef} style={{maxWidth:'100%'}}/></div>
        </div>
    );
}

/* ===== Equity Chart (Enhanced) ===== */
function EquityChart({ data, benchmarkData, trades }) {
    if (!data || data.length === 0) return <div className="text-muted text-center py-10">暂无数据</div>;

    const initial = data[0].value || 1;
    // 构建基准查找表
    const bmMap = {};
    if (benchmarkData && benchmarkData.length > 0) {
        benchmarkData.forEach(b => { bmMap[b.date] = b.value; });
    }
    // 构建买卖标记查找表
    const buyMap = {};
    const sellMap = {};
    if (trades && trades.length > 0) {
        trades.forEach(t => {
            if (t.side === 'buy') buyMap[t.date] = true;
            else sellMap[t.date] = true;
        });
    }

    const chartData = data.map(d => {
        const strategyReturn = ((d.value - initial) / initial) * 100;
        const item = { date: d.date, strategy: parseFloat(strategyReturn.toFixed(2)) };
        if (bmMap[d.date] !== undefined) {
            item.benchmark = parseFloat(((bmMap[d.date] - 1) * 100).toFixed(2));
        }
        if (buyMap[d.date]) item.buy = item.strategy;
        if (sellMap[d.date]) item.sell = item.strategy;
        return item;
    });

    const BuyShape = (props) => {
        const { cx, cy } = props;
        if (cx == null || cy == null) return null;
        return <polygon points={`${cx},${cy-7} ${cx-6},${cy+5} ${cx+6},${cy+5}`} fill="#22c55e" />;
    };
    const SellShape = (props) => {
        const { cx, cy } = props;
        if (cx == null || cy == null) return null;
        return <polygon points={`${cx},${cy+7} ${cx-6},${cy-5} ${cx+6},${cy-5}`} fill="#ef4444" />;
    };

    return (
        <ResponsiveContainer width="100%" height={380}>
            <ComposedChart data={chartData}>
                <defs>
                    <linearGradient id="colorStrategy" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="5%" stopColor="#6366f1" stopOpacity={0.3} />
                        <stop offset="95%" stopColor="#6366f1" stopOpacity={0} />
                    </linearGradient>
                </defs>
                <CartesianGrid strokeDasharray="3 3" stroke="#2d3348" />
                <XAxis dataKey="date" tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false}
                    interval={Math.floor(chartData.length / 6)} />
                <YAxis tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false}
                    tickFormatter={v => v.toFixed(1) + '%'} />
                <Tooltip contentStyle={{ background: '#1e2235', border: '1px solid #2d3348', borderRadius: 8, color: '#e2e8f0' }}
                    formatter={(v, name) => {
                        const labels = { strategy: '策略收益', benchmark: '基准收益', buy: '买入', sell: '卖出' };
                        return [v + '%', labels[name] || name];
                    }}
                    labelFormatter={l => '日期: ' + l} />
                <Legend formatter={(v) => {
                    const labels = { strategy: '策略收益', benchmark: '基准收益', buy: '买入', sell: '卖出' };
                    return labels[v] || v;
                }} />
                <Area type="monotone" dataKey="strategy" stroke="#6366f1" strokeWidth={2}
                    fillOpacity={1} fill="url(#colorStrategy)" name="strategy" />
                {benchmarkData && benchmarkData.length > 0 &&
                    <Line type="monotone" dataKey="benchmark" stroke="#f59e0b" strokeWidth={1.5}
                        strokeDasharray="5 3" dot={false} name="benchmark" />
                }
                <Scatter dataKey="buy" shape={<BuyShape />} name="buy" />
                <Scatter dataKey="sell" shape={<SellShape />} name="sell" />
            </ComposedChart>
        </ResponsiveContainer>
    );
}

/* ===== History Page ===== */
function HistoryPage({ showToast, openPortfolioWorkspace }) {
    const [results, setResults] = useState([]);
    const [detail, setDetail] = useState(null);
    const [detailTab, setDetailTab] = useState('risk');
    const [selectedIds, setSelectedIds] = useState([]);
    const [comparing, setComparing] = useState(false);
    const [compareData, setCompareData] = useState(null);
    const [historyFocusId, setHistoryFocusId] = useState(null);
    const [searchText, setSearchText] = useState('');
    const [resultFilter, setResultFilter] = useState('all');
    const [sortKey, setSortKey] = useState('created_at');
    const [sortDir, setSortDir] = useState('desc');
    const [resultMetaMap, setResultMetaMap] = useState({});
    const [prefillBanner, setPrefillBanner] = useState(null);

    const loadResults = useCallback(() => {
        api.get('/api/backtest/history').then(setResults).catch(() => {});
    }, []);

    const viewDetail = useCallback(async (id, preferredTab) => {
        try {
            const res = await api.get('/api/backtest/history/' + id);
            setDetail(res);
            setDetailTab(preferredTab || 'risk');
            setHistoryFocusId(id);
        } catch (_) {
            showToast('加载详情失败', 'error');
        }
    }, [showToast]);

    const applyHistoryFocus = useCallback(() => {
        const focus = readHistoryFocus();
        if (!focus || !focus.result_id) return;
        setHistoryFocusId(focus.result_id);
        viewDetail(focus.result_id, focus.tab || 'risk');
    }, [viewDetail]);

    const refreshMeta = useCallback(() => {
        setResultMetaMap(readResultMetaMap());
    }, []);

    useEffect(() => { loadResults(); }, [loadResults]);
    useEffect(() => { applyHistoryFocus(); }, [applyHistoryFocus]);
    useEffect(() => { refreshMeta(); }, [refreshMeta]);
    useEffect(() => {
        const handler = () => applyHistoryFocus();
        window.addEventListener('qtsys:history-focus', handler);
        return () => window.removeEventListener('qtsys:history-focus', handler);
    }, [applyHistoryFocus]);

    const toggleSelect = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    };
    const toggleFavorite = (id) => {
        const current = getResultMeta(id);
        saveResultMeta(id, { favorite: !current.favorite });
        refreshMeta();
    };
    const editNote = (id) => {
        const current = getResultMeta(id);
        const nextNote = window.prompt('请输入这次回测的备注，便于后续筛选和复盘', current.note || '');
        if (nextNote === null) return;
        saveResultMeta(id, { note: String(nextNote || '').trim() });
        refreshMeta();
    };

    const filteredResults = useMemo(() => {
        const keyword = String(searchText || '').trim().toLowerCase();
        const filtered = (results || []).filter(item => {
            const totalReturn = Number(item.metrics?.total_return || 0);
            const sharpe = Number(item.metrics?.sharpe_ratio || 0);
            const meta = resultMetaMap[String(item.id)] || {};
            if (resultFilter === 'positive' && totalReturn < 0) return false;
            if (resultFilter === 'negative' && totalReturn >= 0) return false;
            if (resultFilter === 'high_sharpe' && sharpe < 1) return false;
            if (resultFilter === 'favorites' && !meta.favorite) return false;
            if (!keyword) return true;
            const haystack = [item.strategy_name, item.universe, item.start_date, item.end_date, item.id, meta.note || ''].join(' ').toLowerCase();
            return haystack.includes(keyword);
        });
        return [...filtered].sort((a, b) => {
            let left;
            let right;
            if (sortKey === 'created_at') {
                left = String(a.created_at || '');
                right = String(b.created_at || '');
            } else if (sortKey === 'strategy_name') {
                left = String(a.strategy_name || '');
                right = String(b.strategy_name || '');
            } else if (sortKey === 'final_value') {
                left = Number(a.final_value || 0);
                right = Number(b.final_value || 0);
            } else {
                left = Number(a.metrics?.[sortKey] || 0);
                right = Number(b.metrics?.[sortKey] || 0);
            }
            const cmp = typeof left === 'string' ? left.localeCompare(right) : left - right;
            return sortDir === 'asc' ? cmp : -cmp;
        });
    }, [results, resultMetaMap, searchText, resultFilter, sortKey, sortDir]);

    const summary = useMemo(() => {
        const total = filteredResults.length;
        const positive = filteredResults.filter(item => Number(item.metrics?.total_return || 0) >= 0).length;
        const avgReturn = total ? filteredResults.reduce((sum, item) => sum + Number(item.metrics?.total_return || 0), 0) / total : 0;
        const avgSharpe = total ? filteredResults.reduce((sum, item) => sum + Number(item.metrics?.sharpe_ratio || 0), 0) / total : 0;
        const best = total ? [...filteredResults].sort((a, b) => Number(b.metrics?.total_return || 0) - Number(a.metrics?.total_return || 0))[0] : null;
        return { total, positive, avgReturn, avgSharpe, best };
    }, [filteredResults]);

    const runCompare = async () => {
        if (selectedIds.length < 2) { showToast('至少选择 2 个结果才能对比', 'error'); return; }
        setComparing(true);
        setCompareData(null);
        try {
            const res = await api.post('/api/backtest/compare', { result_ids: selectedIds });
            setCompareData(res);
        } catch (e) {
            showToast((e && e.detail) || '对比分析失败', 'error');
        }
        setComparing(false);
    };

    const sendToPortfolio = () => {
        if (selectedIds.length < 2) { showToast('至少选择 2 个结果才能做组合分析', 'error'); return; }
        pushPortfolioPrefill({ result_ids: selectedIds, method: 'max_sharpe' });
        setPrefillBanner(`已将 ${selectedIds.length} 个回测结果带入组合分析`);
        if (openPortfolioWorkspace) openPortfolioWorkspace();
    };

    if (detail) {
        return (
            <div className="fade-in space-y">
                <div className="flex items-center justify-between">
                    <button className="btn-link" onClick={() => { setDetail(null); setDetailTab('risk'); clearHistoryFocus(); }}>&larr; 返回历史</button>
                    <div className="text-xs text-muted">结果 #{detail.id}</div>
                </div>
                <BacktestResultView result={detail} tab={detailTab} setTab={setDetailTab} logs={detail.logs || []} />
            </div>
        );
    }

    if (compareData) {
        return (
            <div className="fade-in space-y">
                <button className="btn-link" onClick={() => setCompareData(null)}>&larr; 返回历史</button>
                <h2 style={{fontSize:20,fontWeight:600}}>策略对比分析</h2>
                <CompareView data={compareData} />
            </div>
        );
    }

    return (
        <div className="fade-in space-y">
            <div className="history-toolbar">
                <div>
                    <h2 style={{fontSize:20,fontWeight:600}}>回测历史</h2>
                    <div className="text-xs text-muted" style={{marginTop:6}}>集中查看历史结果、做横向对比，并把多个策略一键送入组合分析。</div>
                </div>
                <div className="flex gap-sm items-center" style={{gap:8}}>
                    {selectedIds.length >= 2 && (
                        <button className="btn btn-primary" style={{fontSize:13,padding:'6px 14px'}} onClick={runCompare} disabled={comparing}>
                            {comparing ? '对比中...' : `对比结果 (${selectedIds.length})`}
                        </button>
                    )}
                    {selectedIds.length >= 2 && (
                        <button className="btn btn-secondary" style={{fontSize:13,padding:'6px 14px'}} onClick={sendToPortfolio}>送入组合分析</button>
                    )}
                    {selectedIds.length > 0 && (
                        <button className="btn btn-secondary" style={{fontSize:12,padding:'4px 12px'}} onClick={() => setSelectedIds([])}>清空选择</button>
                    )}
                </div>
            </div>
            {prefillBanner ? (
                <div className="card" style={{padding:'12px 14px', background:'rgba(59,130,246,0.10)', border:'1px solid rgba(96,165,250,0.18)'}}>
                    <div className="text-sm" style={{color:'#dbeafe'}}>{prefillBanner}</div>
                </div>
            ) : null}

            <div className="history-summary-grid">
                <div className="history-mini-card">
                    <div className="history-mini-label">结果数量</div>
                    <div className="history-mini-value">{summary.total}</div>
                    <div className="history-mini-meta">当前筛选条件下的回测记录</div>
                </div>
                <div className="history-mini-card">
                    <div className={'history-mini-value ' + (summary.positive === summary.total && summary.total ? 'text-profit' : '')}>{summary.total ? ((summary.positive / summary.total) * 100).toFixed(1) : '0.0'}%</div>
                    <div className="history-mini-label">正收益占比</div>
                    <div className="history-mini-meta">{summary.positive} / {summary.total} 条为正收益</div>
                </div>
                <div className="history-mini-card">
                    <div className={'history-mini-value ' + (summary.avgReturn >= 0 ? 'text-profit' : 'text-loss')}>{summary.avgReturn.toFixed(2)}%</div>
                    <div className="history-mini-label">平均总收益</div>
                    <div className="history-mini-meta">平均 Sharpe {summary.avgSharpe.toFixed(2)}</div>
                </div>
                <div className="history-mini-card">
                    <div className="history-mini-value">{summary.best ? `${Number(summary.best.metrics?.total_return || 0).toFixed(2)}%` : '-'}</div>
                    <div className="history-mini-label">最佳策略</div>
                    <div className="history-mini-meta">{summary.best ? repairMojibakeText(summary.best.strategy_name) : '暂无数据'}</div>
                </div>
            </div>

            <div className="card space-y" style={{padding:'16px'}}>
                <div className="history-filter-grid">
                    <div className="field">
                        <label className="label">搜索</label>
                        <input className="input" value={searchText} onChange={e => setSearchText(e.target.value)} placeholder="按策略名、股票池、日期、结果 ID 或备注搜索" />
                    </div>
                    <div className="field">
                        <label className="label">结果筛选</label>
                        <select className="input" value={resultFilter} onChange={e => setResultFilter(e.target.value)}>
                            <option value="all">全部结果</option>
                            <option value="positive">仅正收益</option>
                            <option value="negative">仅负收益</option>
                            <option value="high_sharpe">Sharpe ≥ 1</option>
                            <option value="favorites">仅收藏</option>
                        </select>
                    </div>
                    <div className="field">
                        <label className="label">排序字段</label>
                        <select className="input" value={sortKey} onChange={e => setSortKey(e.target.value)}>
                            <option value="created_at">创建时间</option>
                            <option value="total_return">总收益率</option>
                            <option value="annual_return">年化收益率</option>
                            <option value="sharpe_ratio">Sharpe</option>
                            <option value="max_drawdown">最大回撤</option>
                            <option value="final_value">期末净值</option>
                            <option value="strategy_name">策略名称</option>
                        </select>
                    </div>
                    <div className="field">
                        <label className="label">排序方向</label>
                        <select className="input" value={sortDir} onChange={e => setSortDir(e.target.value)}>
                            <option value="desc">降序</option>
                            <option value="asc">升序</option>
                        </select>
                    </div>
                </div>
                <div className="text-xs text-muted">已选 {selectedIds.length} 条结果，可直接对比或发送到组合分析。</div>
            </div>

            {filteredResults.length === 0 ? (
                <div className="text-muted text-center py-10">当前筛选条件下没有匹配结果</div>
            ) : (
                <div className="space-y-sm">
                    {filteredResults.map(r => {
                        const totalReturn = Number(r.metrics?.total_return || 0);
                        const sharpe = Number(r.metrics?.sharpe_ratio || 0);
                        const maxDrawdown = Number(r.metrics?.max_drawdown || 0);
                        const meta = resultMetaMap[String(r.id)] || {};
                        return (
                            <div key={r.id} className="history-item" style={{position:'relative', border: historyFocusId === r.id ? '1px solid var(--accent)' : '1px solid transparent', boxShadow: historyFocusId === r.id ? '0 0 0 1px rgba(99,102,241,0.18)' : 'none'}}>
                                <div className="history-item-main" onClick={() => viewDetail(r.id, 'risk')} style={{cursor:'pointer'}}>
                                    <input type="checkbox" checked={selectedIds.includes(r.id)} onChange={(e) => { e.stopPropagation(); toggleSelect(r.id); }} style={{width:16,height:16,cursor:'pointer',accentColor:'var(--accent)'}} />
                                    <div style={{minWidth:0, flex:1}}>
                                        <div style={{fontWeight:600, color:'var(--text-100)'}}>{repairMojibakeText(r.strategy_name)}</div>
                                        <div className="text-xs text-muted" style={{marginTop:4}}>{r.start_date} ~ {r.end_date} · {repairMojibakeText(r.universe)}</div>
                                        <div className="history-item-meta">
                                            <span className="history-chip">Sharpe {sharpe.toFixed(2)}</span>
                                            <span className="history-chip">最大回撤 {maxDrawdown.toFixed(2)}%</span>
                                            <span className="history-chip">期末净值 {Number(r.final_value || 0).toLocaleString()}</span>
                                            <span className="history-chip">创建于 {(r.created_at || '').slice(0, 10)}</span>
                                            {meta.favorite ? <span className="history-chip">已收藏</span> : null}
                                            {meta.note ? <span className="history-chip">{meta.note}</span> : null}
                                        </div>
                                    </div>
                                </div>
                                <div style={{display:'flex',alignItems:'center',gap:12,marginLeft:12}}>
                                    <button className="btn-link" onClick={() => toggleFavorite(r.id)}>{meta.favorite ? '取消收藏' : '收藏'}</button>
                                    <button className="btn-link" onClick={() => editNote(r.id)}>{meta.note ? '编辑备注' : '添加备注'}</button>
                                    <button className="btn-link" onClick={() => viewDetail(r.id, 'attribution')}>详情</button>
                                    <div style={{textAlign:'right', minWidth:96}}>
                                        <div className={'history-return ' + (totalReturn >= 0 ? 'text-profit' : 'text-loss')}>
                                            {totalReturn.toFixed(2)}%
                                        </div>
                                        <div className="text-xs text-muted">ID #{r.id}</div>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            )}
        </div>
    );
}

function buildCompareSummary(data) {
    const metricsList = Array.isArray(data && data.metrics) ? data.metrics : [];
    const metricValue = (item, key) => Number((item && item.metrics && item.metrics[key]) || 0);
    const bestBy = (key, mode = 'max') => {
        if (!metricsList.length) return null;
        const sorted = [...metricsList].sort((a, b) => mode === 'max' ? metricValue(b, key) - metricValue(a, key) : metricValue(a, key) - metricValue(b, key));
        return sorted[0] || null;
    };
    return {
        bestReturn: bestBy('total_return', 'max'),
        bestSharpe: bestBy('sharpe_ratio', 'max'),
        lowestDrawdown: bestBy('max_drawdown', 'max'),
        bestAnnual: bestBy('annual_return', 'max'),
    };
}

function CompareView({ data }) {
    const COLORS = ['#6366f1', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'];
    const curves = data.curves || [];
    const metrics = data.metrics || [];
    const summary = buildCompareSummary(data);
    const metricValue = (item, key) => Number((item && item.metrics && item.metrics[key]) || 0);

    const dateMap = {};
    curves.forEach((c, idx) => {
        (c.equity_curve || []).forEach(p => {
            if (!dateMap[p.date]) dateMap[p.date] = { date: p.date };
            dateMap[p.date]['s' + idx] = parseFloat(((p.value - 1) * 100).toFixed(2));
        });
    });
    const chartData = Object.values(dateMap).sort((a, b) => a.date.localeCompare(b.date));

    const ranked = [...metrics].sort((a, b) => metricValue(b, 'total_return') - metricValue(a, 'total_return'));

    return (
        <div className="space-y">
            <div className="flex items-center justify-between" style={{gap:12, flexWrap:'wrap'}}>
                <div className="text-xs text-muted">已对齐所选策略的收益曲线、收益指标与回撤表现。</div>
                <button className="btn btn-secondary" style={{fontSize:12,padding:'4px 12px'}} onClick={() => exportCompareCSV(data)}>导出对比 CSV</button>
            </div>
            <div className="history-compare-summary">
                <div className="history-mini-card">
                    <div className="history-mini-label">总收益领先</div>
                    <div className={'history-mini-value ' + (summary.bestReturn && metricValue(summary.bestReturn, 'total_return') >= 0 ? 'text-profit' : 'text-loss')}>{summary.bestReturn ? `${metricValue(summary.bestReturn, 'total_return').toFixed(2)}%` : '-'}</div>
                    <div className="history-mini-meta">{summary.bestReturn ? repairMojibakeText(summary.bestReturn.strategy_name) : '暂无数据'}</div>
                </div>
                <div className="history-mini-card">
                    <div className="history-mini-label">最佳 Sharpe</div>
                    <div className={'history-mini-value ' + (summary.bestSharpe && metricValue(summary.bestSharpe, 'sharpe_ratio') >= 1 ? 'text-profit' : '')}>{summary.bestSharpe ? metricValue(summary.bestSharpe, 'sharpe_ratio').toFixed(2) : '-'}</div>
                    <div className="history-mini-meta">{summary.bestSharpe ? repairMojibakeText(summary.bestSharpe.strategy_name) : '暂无数据'}</div>
                </div>
                <div className="history-mini-card">
                    <div className="history-mini-label">回撤控制最佳</div>
                    <div className="history-mini-value">{summary.lowestDrawdown ? `${metricValue(summary.lowestDrawdown, 'max_drawdown').toFixed(2)}%` : '-'}</div>
                    <div className="history-mini-meta">{summary.lowestDrawdown ? repairMojibakeText(summary.lowestDrawdown.strategy_name) : '暂无数据'}</div>
                </div>
                <div className="history-mini-card">
                    <div className="history-mini-label">年化收益领先</div>
                    <div className={'history-mini-value ' + (summary.bestAnnual && metricValue(summary.bestAnnual, 'annual_return') >= 0 ? 'text-profit' : 'text-loss')}>{summary.bestAnnual ? `${metricValue(summary.bestAnnual, 'annual_return').toFixed(2)}%` : '-'}</div>
                    <div className="history-mini-meta">{summary.bestAnnual ? repairMojibakeText(summary.bestAnnual.strategy_name) : '暂无数据'}</div>
                </div>
            </div>

            <div className="history-compare-grid">
                <div className="card">
                    <div className="card-title">收益曲线对比</div>
                    <ResponsiveContainer width="100%" height={360}>
                        <ComposedChart data={chartData}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#2d3348" />
                            <XAxis dataKey="date" tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false}
                                interval={Math.max(0, Math.floor(chartData.length / 6))} />
                            <YAxis tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false}

function buildPortfolioDiagnosticModel(data) {
    const corrMatrix = data?.correlations?.correlation_matrix || [];
    const names = data?.correlations?.names || [];
    const weights = data?.weights?.weights || [];
    const portfolioMetrics = data?.portfolio?.metrics || {};
    const weightValues = weights.map(item => Math.max(Number(item.weight || 0), 0));
    const nonZeroWeights = weightValues.filter(v => v > 0);
    const hhi = nonZeroWeights.reduce((sum, value) => sum + value * value, 0);
    const effectiveCount = hhi > 0 ? 1 / hhi : 0;
    const maxWeight = weightValues.length ? Math.max(...weightValues) : 0;
    let avgCorr = 0;
    let highestPair = null;
    let pairCount = 0;
    for (let i = 0; i < corrMatrix.length; i += 1) {
        for (let j = i + 1; j < corrMatrix[i].length; j += 1) {
            const current = Number(corrMatrix[i][j] || 0);
            avgCorr += current;
            pairCount += 1;
            if (!highestPair || current > highestPair.value) {
                highestPair = { left: names[i], right: names[j], value: current };
            }
        }
    }
    avgCorr = pairCount ? avgCorr / pairCount : 0;
    return {
        method: data?.weights?.method || '-',
        avgCorr,
        effectiveCount,
        maxWeight,
        sharpe: Number(portfolioMetrics.sharpe_ratio || 0),
        totalReturn: Number(portfolioMetrics.total_return || 0),
        annualReturn: Number(portfolioMetrics.annual_return || 0),
        maxDrawdown: Number(portfolioMetrics.max_drawdown || 0),
        highestPair,
    };
}

/* ===== Correlation Heatmap (Canvas) ===== */
function CorrelationHeatmap({ names, matrix }) {
    const canvasRef = useRef(null);
    useEffect(() => {
        if (!matrix || matrix.length === 0 || !canvasRef.current) return;
        const n = names.length;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const cellS = 60, padL = 80, padT = 40;
        const W = padL + n * cellS + 10, H = padT + n * cellS + 10;
        canvas.width = W; canvas.height = H;
        ctx.fillStyle = '#252a3a'; ctx.fillRect(0, 0, W, H);
        // headers
        ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
        names.forEach((rawName, i) => {
            const nm = repairMojibakeText(rawName);
            ctx.save(); ctx.translate(padL + i * cellS + cellS/2, padT - 6);
            ctx.rotate(-0.5); ctx.textAlign = 'left';
            ctx.fillText(nm.slice(0,8), 0, 0); ctx.restore();
            ctx.textAlign = 'right';
            ctx.fillText(nm.slice(0,8), padL - 6, padT + i * cellS + cellS/2 + 4);
        });
        // cells
        for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
                const v = matrix[i][j];
                const x = padL + j * cellS, y = padT + i * cellS;
                const intensity = Math.abs(v);
                if (v >= 0) ctx.fillStyle = `rgba(239,68,68,${0.1 + intensity*0.7})`;
                else ctx.fillStyle = `rgba(99,102,241,${0.1 + intensity*0.7})`;
                ctx.fillRect(x+1, y+1, cellS-2, cellS-2);
                ctx.fillStyle = '#e2e8f0'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(v.toFixed(2), x + cellS/2, y + cellS/2 + 4);
            }
        }
    }, [names, matrix]);
    if (!matrix || matrix.length === 0) return <div className="text-muted">无数据</div>;
    return <div className="corr-heatmap-wrap"><canvas ref={canvasRef} style={{maxWidth:'100%'}}/></div>;
}

/* ===== Rolling Correlation Section ===== */
function RollingCorrelationSection({ corr }) {
    const COLORS = ['#6366f1','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];
    if (!corr.rolling_correlations || corr.rolling_correlations.length === 0) return null;
    const chartData = {};
    corr.rolling_correlations.forEach((rc, i) => {
        (rc.series || []).forEach(p => {
            if (!chartData[p.idx]) chartData[p.idx] = { idx: p.idx };
            chartData[p.idx]['p' + i] = p.value;
        });
    });
    const sorted = Object.values(chartData).sort((a, b) => a.idx - b.idx);
    return (
        <div className="card">
            <div className="card-title">滚动相关性 (60日)</div>
            <ResponsiveContainer width="100%" height={220}>
                <ComposedChart data={sorted}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#2d3348"/>
                    <XAxis dataKey="idx" tick={{fill:'#94a3b8',fontSize:10}} tickLine={false}/>
                    <YAxis tick={{fill:'#94a3b8',fontSize:10}} tickLine={false} domain={[-1,1]}/>
                    <Tooltip contentStyle={{background:'#1e2235',border:'1px solid #2d3348',borderRadius:8,color:'#e2e8f0'}}/>
                    <Legend/>
                    {corr.rolling_correlations.map((rc,i) => (
                        <Line key={i} type="monotone" dataKey={'p'+i} name={repairMojibakeText(rc.pair)}
                            stroke={COLORS[i%COLORS.length]} strokeWidth={1.5} dot={false}/>

            </ResponsiveContainer>
        </div>
    );
}

function HelpExampleSection() {
    return (
        <div className="help-section">
            <h3>示例策略: 双均线交叉</h3>
            <div className="help-code-block">{`def initialize(context):
    context.short_period = 5
    context.long_period = 20

def handle_data(context):
    for ts_code in context.universe:
        closes = context.get_history(ts_code, context.long_period + 1, "close")
        if len(closes) < context.long_period:
            continue

        ma_short = closes.tail(context.short_period).mean()
        ma_long = closes.tail(context.long_period).mean()

        closes_prev = closes.iloc[:-1]
        ma_short_prev = closes_prev.tail(context.short_period).mean()
        ma_long_prev = closes_prev.tail(context.long_period).mean()

        pos = context.positions.get(ts_code)
        has_position = pos is not None and pos.amount > 0

        # 金叉买入: 短均线上穿长均线
        if ma_short > ma_long and ma_short_prev <= ma_long_prev and not has_position:
            context.order_value(ts_code, context.portfolio_value * 0.3)
            context.log(f"{ts_code} 金叉买入")

        # 死叉卖出: 短均线下穿长均线
        elif ma_short < ma_long and ma_short_prev >= ma_long_prev and has_position:
            context.order(ts_code, -pos.amount)
            context.log(f"{ts_code} 死叉卖出")`}</div>
        </div>
    );
}

function BacktestTrustPanel({ result }) {
    const coverage = (result && result.data_coverage) || (result && result.metrics && result.metrics.data_coverage) || {};
    const execution = (result && result.execution_model) || (result && result.metrics && result.metrics.execution_model) || {};
    const note = (result && result.validation_note) || (result && result.metrics && result.metrics.validation_note) || '';
    const hasCoverage = coverage && Object.keys(coverage).length > 0;
    const missing = Number(coverage.missing_stock_count || 0);
    return (
        <div className="card" style={{padding:'14px 16px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap',marginBottom:10}}>
                <div>
                    <div style={{fontSize:12,color:'var(--text-500)',textTransform:'uppercase',letterSpacing:'0.06em'}}>可信度摘要</div>
                    <div style={{fontSize:15,fontWeight:800,color:'var(--text-100)',marginTop:4}}>{hasCoverage ? '真实行情 · 下一交易日执行 · 股票池历史快照' : '旧版本结果 · 建议重新验证'}</div>
                </div>
                {!hasCoverage ? <span className="backtest-badge" style={{color:'#fed7aa',borderColor:'rgba(251,146,60,0.25)',background:'rgba(251,146,60,0.10)'}}>请重新运行</span> : missing > 0 ? <span className="backtest-badge" style={{color:'#fed7aa',borderColor:'rgba(251,146,60,0.25)',background:'rgba(251,146,60,0.10)'}}>缺失 {missing} 只</span> : <span className="backtest-badge">数据覆盖正常</span>}
            </div>
            <div className="trust-grid">
                <div className="trust-card"><div className="trust-label">股票池</div><div className="trust-value">{coverage.universe_label || result.universe || '-'}<br/>快照：{coverage.universe_as_of_date || '按输入列表'}</div></div>
                <div className="trust-card"><div className="trust-label">行情覆盖</div><div className="trust-value">{coverage.loaded_stock_count ?? '-'} / {coverage.requested_stock_count ?? '-'} 只<br/>{coverage.trade_date_count ?? '-'} 个交易日</div></div>
                <div className="trust-card"><div className="trust-label">交易口径</div><div className="trust-value">{execution.execution_timing || '下一交易日开盘执行'}<br/>滑点 {execution.slippage ?? '-'} / 佣金 {execution.commission_rate ?? '-'}</div></div>
            </div>
            <div className="trust-note">{hasCoverage ? (note || '信号只使用当日及以前数据，订单下一交易日执行；系统股票池按回测起点前成分股快照解析。') : '该结果缺少新版数据覆盖摘要，可能生成于旧口径。为了避免误用高估曲线，建议用当前版本重新运行回测。'}</div>
        </div>
    );
}

function FactorMetricCards({ metrics }) {
    const items = [
        { label: 'IC均值', val: metrics.ic_mean, fmt: v => v?.toFixed(4) },
        { label: 'IC_IR', val: metrics.ic_ir, fmt: v => v?.toFixed(4) },
        { label: 'IC正比例', val: metrics.ic_positive_pct, fmt: v => v + '%' },
        { label: '多头收益', val: metrics.top_group_return, fmt: v => v + '%', color: v => v >= 0 ? 'text-profit' : 'text-loss' },
        { label: '空头收益', val: metrics.bottom_group_return, fmt: v => v + '%' },
        { label: '多空收益', val: metrics.long_short_return, fmt: v => v + '%', color: v => v >= 0 ? 'text-profit' : 'text-loss' },
        { label: '单调性', val: metrics.monotonicity, fmt: v => v?.toFixed(2) },
        { label: '平均换手', val: metrics.avg_turnover, fmt: v => v + '%' },
    ];
    return (
        <div style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gap:8}}>
            {items.map((it, i) => (
                <div key={i} className="factor-metric-box">
                    <div className="factor-metric-label">{it.label}</div>
                    <div className={'factor-metric-val ' + (it.color ? it.color(it.val) : '')}>{it.fmt(it.val ?? 0)}</div>
                </div>
            ))}
        </div>
    );
}

function ICChart({ data }) {
    if (!data || data.length === 0) return <div className="text-muted text-center py-10">暂无IC数据</div>;
    return (
        <ResponsiveContainer width="100%" height={300}>
            <ComposedChart data={data}>
                <CartesianGrid strokeDasharray="3 3" stroke="#2d3348" />
                <XAxis dataKey="date" tick={{ fill: '#94a3b8', fontSize: 10 }} tickLine={false}
                    interval={Math.floor(data.length / 6)} />
                <YAxis tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false} />
                <Tooltip contentStyle={{ background: '#1e2235', border: '1px solid #2d3348', borderRadius: 8, color: '#e2e8f0' }} />
                <Bar dataKey="ic" name="IC">
                    {data.map((d, i) => <Cell key={i} fill={d.ic >= 0 ? '#22c55e' : '#ef4444'} />)}
                </Bar>
            </ComposedChart>
        </ResponsiveContainer>
    );
}

function GroupReturnChart({ data }) {
    if (!data || data.length === 0) return <div className="text-muted text-center py-10">暂无分组数据</div>;
    return (
        <ResponsiveContainer width="100%" height={300}>
            <BarChart data={data}>
                <CartesianGrid strokeDasharray="3 3" stroke="#2d3348" />
                <XAxis dataKey="label" tick={{ fill: '#94a3b8', fontSize: 12 }} tickLine={false} />
                <YAxis tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false} tickFormatter={v => v + '%'} />
                <Tooltip contentStyle={{ background: '#1e2235', border: '1px solid #2d3348', borderRadius: 8, color: '#e2e8f0' }}
                    formatter={v => [v + '%', '累计收益']} />
                <Bar dataKey="cumulative_return" name="累计收益">
                    {data.map((d, i) => <Cell key={i} fill={d.cumulative_return >= 0 ? '#22c55e' : '#ef4444'} />)}
                </Bar>
            </BarChart>
        </ResponsiveContainer>
    );
}

function LongShortChart({ data }) {
    if (!data || data.length === 0) return <div className="text-muted text-center py-10">暂无多空数据</div>;
    return (
        <ResponsiveContainer width="100%" height={300}>
            <AreaChart data={data}>
                <defs>
                    <linearGradient id="colorLS" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="5%" stopColor="#6366f1" stopOpacity={0.3} />
                        <stop offset="95%" stopColor="#6366f1" stopOpacity={0} />
                    </linearGradient>
                </defs>
                <CartesianGrid strokeDasharray="3 3" stroke="#2d3348" />
                <XAxis dataKey="date" tick={{ fill: '#94a3b8', fontSize: 10 }} tickLine={false}
                    interval={Math.floor(data.length / 6)} />
                <YAxis tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false} tickFormatter={v => v + '%'} />
                <Tooltip contentStyle={{ background: '#1e2235', border: '1px solid #2d3348', borderRadius: 8, color: '#e2e8f0' }}
                    formatter={v => [v + '%', '多空收益']} />
                <Area type="monotone" dataKey="value" stroke="#6366f1" strokeWidth={2}
                    fillOpacity={1} fill="url(#colorLS)" name="多空收益" />
            </AreaChart>
        </ResponsiveContainer>
    );
}

function TurnoverChart({ data }) {
    if (!data || data.length === 0) return <div className="text-muted text-center py-10">暂无换手率数据</div>;
    return (
        <ResponsiveContainer width="100%" height={300}>
            <AreaChart data={data}>
                <CartesianGrid strokeDasharray="3 3" stroke="#2d3348" />
                <XAxis dataKey="date" tick={{ fill: '#94a3b8', fontSize: 10 }} tickLine={false}
                    interval={Math.floor(data.length / 6)} />
                <YAxis tick={{ fill: '#94a3b8', fontSize: 11 }} tickLine={false}
                    tickFormatter={v => (v * 100).toFixed(0) + '%'} />
                <Tooltip contentStyle={{ background: '#1e2235', border: '1px solid #2d3348', borderRadius: 8, color: '#e2e8f0' }}
                    formatter={v => [(v * 100).toFixed(1) + '%', '换手率']} />
                <Area type="monotone" dataKey="turnover" stroke="#f59e0b" strokeWidth={1.5}
                    fill="#f59e0b" fillOpacity={0.15} name="换手率" />
            </AreaChart>
        </ResponsiveContainer>
    );
}

function SentimentDashboard({ sentiment }) {
    if (!sentiment) return <div className="sentiment-dashboard text-muted text-center" style={{padding:20}}>加载中...</div>;
    const total = sentiment.total || 1;
    const bullPct = (sentiment.bullish / total * 100).toFixed(0);
    const bearPct = (sentiment.bearish / total * 100).toFixed(0);
    const neutPct = (100 - bullPct - bearPct);
    const sectors = sentiment.sectors || {};
    const sectorList = Object.entries(sectors).sort((a, b) => b[1].count - a[1].count);

    return (
        <div>
            <div className="sentiment-dashboard">
                <div style={{fontSize:14,fontWeight:600,marginBottom:8,color:'var(--text-100)'}}>市场情绪</div>
                <div style={{fontSize:24,fontWeight:700,color: sentiment.overall === '偏多' ? 'var(--profit)' : (sentiment.overall === '偏空' ? 'var(--loss)' : 'var(--text-300)')}}>
                    {sentiment.overall}
                </div>
                <div className="text-xs text-muted" style={{marginTop:4}}>综合评分: {sentiment.score}</div>
                <div className="sentiment-bar">
                    <div className="sentiment-bar-bull" style={{width: bullPct + '%'}} />
                    <div className="sentiment-bar-neut" style={{width: neutPct + '%'}} />
                    <div className="sentiment-bar-bear" style={{width: bearPct + '%'}} />
                </div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text-400)'}}>
                    <span className="text-profit">利好 {sentiment.bullish}</span>
                    <span>中性 {sentiment.neutral}</span>
                    <span className="text-loss">利空 {sentiment.bearish}</span>
                </div>
            </div>
            {sectorList.length > 0 && (
                <div className="sentiment-dashboard">
                    <div style={{fontSize:14,fontWeight:600,marginBottom:8,color:'var(--text-100)'}}>板块情绪</div>
                    {sectorList.map(([name, info]) => (
                        <div key={name} className="sector-heat-item">
                            <span style={{color:'var(--text-200)'}}>{name}</span>
                            <div style={{display:'flex',alignItems:'center',gap:6}}>
                                <span className="text-xs">{info.count}条</span>
                                <span style={{
                                    color: info.label === '利好' ? 'var(--profit)' : (info.label === '利空' ? 'var(--loss)' : 'var(--text-400)'),
                                    fontWeight: 600, fontSize: 12,
                                }}>{info.avg_score > 0 ? '+' : ''}{info.avg_score}</span>
                            </div>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

function NewsPage({ showToast }) {
    const [news, setNews] = useState([]);
    const [detail, setDetail] = useState(null);
    const [loading, setLoading] = useState(false);
    const [refreshing, setRefreshing] = useState(false);
    const [sentiment, setSentiment] = useState(null);
    const [filterSource, setFilterSource] = useState('');
    const [filterSentiment, setFilterSentiment] = useState('');
    const [filterSector, setFilterSector] = useState('');
    const [keyword, setKeyword] = useState('');
    const [searchText, setSearchText] = useState('');
    const [lastRefresh, setLastRefresh] = useState(null);

    const loadNews = async () => {
        setLoading(true);
        try {
            let url = '/api/news?limit=80';
            if (filterSource) url += '&source=' + encodeURIComponent(filterSource);
            if (filterSentiment) url += '&sentiment=' + encodeURIComponent(filterSentiment);
            if (filterSector) url += '&sector=' + encodeURIComponent(filterSector);
            if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
            const data = await api.get(url);
            setNews(data);
        } catch (e) { showToast('加载失败', 'error'); }
        setLoading(false);
    };

    const loadSentiment = async () => {
        try { const data = await api.get('/api/news/sentiment/summary'); setSentiment(data); }
        catch (e) {}
    };

    useEffect(() => { loadNews(); loadSentiment(); }, [filterSource, filterSentiment, filterSector, keyword]);

    const refresh = async () => {
        setRefreshing(true);
        try {
            const r = await api.post('/api/news/refresh');
            showToast(r.message, 'success');
            setLastRefresh(new Date());
            loadNews(); loadSentiment();
        } catch (e) { showToast('刷新失败', 'error'); }
        setRefreshing(false);
    };

    const viewDetail = async (id) => {
        try { const data = await api.get('/api/news/' + id); setDetail(data); }
        catch (e) { showToast('加载失败', 'error'); }
    };

    const doSearch = () => { setKeyword(searchText); };

    if (detail) {
        return <NewsDetail detail={detail} onBack={() => setDetail(null)} showToast={showToast} />;
    }

    return (
        <div className="fade-in news-layout">
            <div className="news-main">
                <NewsFilterBar filterSource={filterSource} setFilterSource={setFilterSource}
                    filterSentiment={filterSentiment} setFilterSentiment={setFilterSentiment}
                    filterSector={filterSector} setFilterSector={setFilterSector}
                    searchText={searchText} setSearchText={setSearchText} doSearch={doSearch}
                    refreshing={refreshing} refresh={refresh} lastRefresh={lastRefresh} />
                {loading ? <div className="text-center text-muted py-10"><span className="spinner" /> 加载中...</div> :
                    news.length === 0 ? <div className="text-muted text-center py-10">暂无新闻，点击"刷新新闻"获取最新资讯</div> :
                    <NewsList news={news} onView={viewDetail} />

            </div>
            <div className="news-sidebar">
                <SentimentDashboard sentiment={sentiment} />
            </div>
        </div>
    );
}

function KlineChart({ data, width, height }) {
    const mainRef = useRef(null);
    const overlayRef = useRef(null);
    const hoverRef = useRef(-1);

    // Main chart: only redraws when data/size changes
    useEffect(() => {
        const canvas = mainRef.current;
        if (!canvas || !data || data.length === 0) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const pad = { top: 8, bottom: 28, left: 2, right: 2 };
        const cw = width - pad.left - pad.right;
        const ch = height - pad.top - pad.bottom;
        const n = data.length;
        const gap = cw / n;
        const barW = Math.max(1, gap * 0.65);

        let hi = -Infinity, lo = Infinity;
        for (let i = 0; i < n; i++) { hi = Math.max(hi, data[i].high); lo = Math.min(lo, data[i].low); }
        const range = hi - lo || 1;
        const toY = v => pad.top + ch * (1 - (v - lo) / range);

        ctx.strokeStyle = '#252a3a'; ctx.lineWidth = 0.5;
        for (let i = 0; i <= 4; i++) {
            const y = pad.top + ch * i / 4;
            ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
            ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
            ctx.fillText((hi - range * i / 4).toFixed(2), width - 2, y - 2);
        }

        for (let i = 0; i < n; i++) {
            const d = data[i];
            const x = pad.left + gap * i + gap / 2;
            const isUp = d.close >= d.open;
            ctx.strokeStyle = ctx.fillStyle = isUp ? '#22c55e' : '#ef4444';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, toY(d.high)); ctx.lineTo(x, toY(d.low)); ctx.stroke();
            const bt = toY(Math.max(d.open, d.close));
            const bh = Math.max(1, toY(Math.min(d.open, d.close)) - bt);
            isUp ? ctx.strokeRect(x - barW/2, bt, barW, bh) : ctx.fillRect(x - barW/2, bt, barW, bh);
        }

        const maxVol = Math.max(...data.map(d => d.vol || 0)) || 1;
        for (let i = 0; i < n; i++) {
            const d = data[i]; const x = pad.left + gap * i + gap / 2;
            ctx.fillStyle = d.close >= d.open ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)';
            const vh = (d.vol / maxVol) * 22;
            ctx.fillRect(x - barW/2, height - pad.bottom + 4 + (22 - vh), barW, vh);
        }

        ctx.fillStyle = '#64748b'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
        const step = Math.max(1, Math.floor(n / 6));
        for (let i = 0; i < n; i += step) {
            ctx.fillText(data[i].date.slice(5), pad.left + gap * i + gap / 2, height - 2);
        }
    }, [data, width, height]);

    // Overlay: lightweight crosshair, no React state
    const handleMouseMove = (e) => {
        if (!data || data.length === 0) return;
        const rect = mainRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const gap = (width - 4) / data.length;
        const idx = Math.max(0, Math.min(data.length - 1, Math.floor((x - 2) / gap)));
        if (idx === hoverRef.current) return;
        hoverRef.current = idx;
        // draw crosshair on overlay
        const oc = overlayRef.current;
        if (!oc) return;
        const octx = oc.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        oc.width = width * dpr; oc.height = height * dpr;
        octx.scale(dpr, dpr); octx.clearRect(0, 0, width, height);
        const cx = 2 + gap * idx + gap / 2;
        octx.strokeStyle = 'rgba(99,102,241,0.5)'; octx.lineWidth = 0.5;
        octx.setLineDash([3, 3]);
        octx.beginPath(); octx.moveTo(cx, 8); octx.lineTo(cx, height - 28); octx.stroke();
        octx.setLineDash([]);
        // update info text via DOM
        const info = mainRef.current.parentElement.querySelector('.kline-info-text');
        if (info) {
            const d = data[idx];
            const c = d.close >= d.open ? 'var(--profit)' : 'var(--loss)';
            info.innerHTML = `<span>${d.date}</span><span>开 ${d.open}</span><span>高 ${d.high}</span><span>低 ${d.low}</span><span style="color:${c}">收 ${d.close}</span><span>${d.pct_chg > 0 ? '+' : ''}${d.pct_chg}%</span>`;
        }
    };

    const handleMouseLeave = () => {
        hoverRef.current = -1;
        const oc = overlayRef.current;
        if (oc) { const octx = oc.getContext('2d'); octx.clearRect(0, 0, oc.width, oc.height); }
        const info = mainRef.current && mainRef.current.parentElement.querySelector('.kline-info-text');
        if (info) info.innerHTML = '';
    };

    return (
        <div className="kline-container">
            <div style={{position:'relative'}}>
                <canvas ref={mainRef} className="kline-canvas" style={{width, height}} />
                <canvas ref={overlayRef} className="kline-canvas"
                    style={{width, height, position:'absolute', top:0, left:0}}
                    onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave} />
            </div>
            <div className="kline-info kline-info-text"></div>
        </div>
    );
}

function DrawingCanvas({ showToast }) {
    const canvasRef = useRef(null);
    const drawingRef = useRef(false);
    const pointsRef = useRef([]);
    const [matching, setMatching] = useState(false);
    const [matches, setMatches] = useState([]);
    const [pointCount, setPointCount] = useState(0);
    const wrapRef = useRef(null);
    const [matchMode, setMatchMode] = useState('pool');
    const [targetCode, setTargetCode] = useState('');
    const [searchCodes, setSearchCodes] = useState('');
    const [startDate, setStartDate] = useState('');
    const [endDate, setEndDate] = useState('');

    const drawGrid = (ctx, w, h) => {
        ctx.strokeStyle = '#252a3a'; ctx.lineWidth = 0.5;
        for (let i = 1; i < 4; i++) {
            const y = h * i / 4;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
    };

    const drawCurve = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        const w = rect.width, h = 200;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
        drawGrid(ctx, w, h);
        const pts = pointsRef.current;
        if (pts.length < 2) return;
        ctx.strokeStyle = '#818cf8'; ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
    };

    const getPos = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    };

    const startDraw = (e) => {
        drawingRef.current = true;
        pointsRef.current = [getPos(e)];
        setMatches([]);
        if (wrapRef.current) wrapRef.current.classList.add('drawing');
        drawCurve();
    };

    const moveDraw = (e) => {
        if (!drawingRef.current) return;
        pointsRef.current.push(getPos(e));
        drawCurve();
    };

    const endDraw = () => {
        drawingRef.current = false;
        if (wrapRef.current) wrapRef.current.classList.remove('drawing');
        setPointCount(pointsRef.current.length);
    };

    const clearDraw = () => {
        pointsRef.current = []; setMatches([]); setPointCount(0);
        drawCurve();
    };

    useEffect(() => { drawCurve(); }, []);

    const doMatch = async () => {
        const pts = pointsRef.current;
        if (pts.length < 10) { showToast('请绘制更长的曲线', 'error'); return; }
        if (matchMode === 'single' && !targetCode.trim()) { showToast('请输入目标股票代码', 'error'); return; }
        const ys = pts.map(p => p.y);
        const mn = Math.min(...ys), mx = Math.max(...ys);
        const range = mx - mn || 1;
        const curve = ys.map(y => 1 - (y - mn) / range);
        const sampled = [];
        const step = Math.max(1, Math.floor(curve.length / 50));
        for (let i = 0; i < curve.length; i += step) sampled.push(curve[i]);
        setMatching(true);
        try {
            const body = { curve: sampled, top_n: 6, mode: matchMode };
            if (startDate) body.start_date = startDate.replace(/-/g, '');
            if (endDate) body.end_date = endDate.replace(/-/g, '');
            if (matchMode === 'single') {
                body.target_code = targetCode.trim();
            } else if (searchCodes.trim()) {
                body.search_codes = searchCodes.split(/[,，\s]+/).filter(Boolean);
            }
            const r = await api.post('/api/market/pattern_match', body);
            setMatches(r.matches || []);
            if ((r.matches || []).length === 0) showToast('未找到相似走势', 'info');
        } catch(e) { showToast(e.detail || '匹配失败', 'error'); }
        setMatching(false);
    };

    return (
        <div className="draw-panel">
            <div className="draw-panel-title">形态匹配 - 画线找相似走势</div>
            <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center',marginBottom:10,fontSize:13}}>
                <label style={{display:'flex',alignItems:'center',gap:4}}>
                    <input type="radio" name="matchMode" checked={matchMode==='pool'} onChange={()=>setMatchMode('pool')} /> 匹配股票池
                </label>
                <label style={{display:'flex',alignItems:'center',gap:4}}>
                    <input type="radio" name="matchMode" checked={matchMode==='single'} onChange={()=>setMatchMode('single')} /> 匹配单一股票
                </label>
                {matchMode === 'single' ? (
                    <input className="input" style={{width:130}} placeholder="股票代码 如600519.SH" value={targetCode} onChange={e=>setTargetCode(e.target.value)} />
                ) : (
                    <input className="input" style={{width:220}} placeholder="自定义股票池(逗号分隔,留空用默认)" value={searchCodes} onChange={e=>setSearchCodes(e.target.value)} />
                )}
                <input type="date" className="input" style={{width:140}} value={startDate} onChange={e=>setStartDate(e.target.value)} title="起始日期(留空自动)" />
                <span style={{color:'#888'}}>~</span>
                <input type="date" className="input" style={{width:140}} value={endDate} onChange={e=>setEndDate(e.target.value)} title="结束日期(留空为今天)" />
            </div>
            <div className="draw-canvas-wrap" ref={wrapRef}>
                <canvas ref={canvasRef} className="draw-canvas"
                    onMouseDown={startDraw} onMouseMove={moveDraw}
                    onMouseUp={endDraw} onMouseLeave={endDraw} />
                {pointCount === 0 && <div className="draw-hint">按住鼠标左键绘制走势曲线</div>}
            </div>
            <div className="draw-toolbar">
                <button className="btn btn-primary" onClick={doMatch} disabled={matching || pointCount < 10}>
                    {matching ? <><span className="spinner"/> 匹配中...</> : '开始匹配'}
                </button>
                <button className="btn btn-secondary" onClick={clearDraw}>清除</button>
                <span className="text-xs text-muted" style={{marginLeft:8}}>
                    {pointCount > 0 ? `已绘制 ${pointCount} 个点` : '在上方画布中绘制您预期的走势形态'}
                </span>
            </div>
            {matches.length > 0 && (
                <div className="match-results">
                    <div style={{fontSize:14,fontWeight:600,marginBottom:8}}>匹配结果 (共{matches.length}个)</div>
                    <div className="match-grid">
                        {matches.map((m, i) => (
                            <div key={i} className="match-item">
                                <div className="match-header">
                                    <div>
                                        <span className="match-name">{m.name}</span>
                                        <span className="match-code">{m.code}</span>
                                    </div>
                                    <span className="match-score">相似度 {(m.score * 100).toFixed(1)}%</span>
                                </div>
                                <div className="match-date">{m.start_date} ~ {m.end_date}</div>
                                <KlineChart data={m.kline} width={280} height={150} />
                            </div>
                        ))}
                    </div>
                </div>
            )}
        </div>
    );
}

function MarketPage({ showToast }) {
    const [panels, setPanels] = useState([]);
    const [klineCount, setKlineCount] = useState(60);
    const [tab, setTab] = useState('watch');
    const workspaceRef = useRef(null);
    const dragRef = useRef(null);
    const zRef = useRef(10);
    const nextPos = useRef({ x: 20, y: 20 });

    // Draggable window logic
    const bringToFront = (code) => {
        zRef.current += 1;
        setPanels(prev => prev.map(p => ({
            ...p, z: p.code === code ? zRef.current : p.z,
            active: p.code === code
        })));
    };

    const onBarMouseDown = (e, code) => {
        if (e.target.closest('.stock-window-btn')) return;
        e.preventDefault();
        bringToFront(code);
        const panel = panels.find(p => p.code === code);
        if (!panel) return;
        const startX = e.clientX, startY = e.clientY;
        const origX = panel.x, origY = panel.y;
        const onMove = (ev) => {
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            setPanels(prev => prev.map(p => p.code === code ? { ...p, x: origX + dx, y: origY + dy } : p));
        };
        const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    };

    const onResizeMouseDown = (e, code) => {
        e.preventDefault(); e.stopPropagation();
        bringToFront(code);
        const panel = panels.find(p => p.code === code);
        if (!panel) return;
        const startX = e.clientX, startY = e.clientY;
        const origW = panel.w, origH = panel.h;
        const onMove = (ev) => {
            const nw = Math.max(320, origW + ev.clientX - startX);
            const nh = Math.max(240, origH + ev.clientY - startY);
            setPanels(prev => prev.map(p => p.code === code ? { ...p, w: nw, h: nh } : p));
        };
        const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    };

    const addStock = async (code) => {
        if (panels.find(p => p.code === code)) { showToast('该股票已在看盘列表中', 'info'); return; }
        const pos = { ...nextPos.current };
        nextPos.current = { x: pos.x + 30, y: pos.y + 30 };
        if (nextPos.current.x > 400) nextPos.current = { x: 20, y: 20 };
        zRef.current += 1;
        const placeholder = { code, name: '加载中...', data: [], x: pos.x, y: pos.y, w: 420, h: 300, z: zRef.current, active: true };
        setPanels(prev => [...prev.map(p => ({ ...p, active: false })), placeholder]);
        try {
            const r = await api.get('/api/market/kline?ts_code=' + encodeURIComponent(code) + '&limit=' + klineCount);
            setPanels(prev => prev.map(p => p.code === code ? { ...p, name: r.name || code, data: r.data || [] } : p));
        } catch(e) {
            showToast(e.detail || '加载失败', 'error');
            setPanels(prev => prev.filter(p => p.code !== code));
        }
    };

    const removePanel = (code) => { setPanels(prev => prev.filter(p => p.code !== code)); };

    const refreshAll = async () => {
        if (panels.length === 0) return;
        const promises = panels.map(p =>
            api.get('/api/market/kline?ts_code=' + encodeURIComponent(p.code) + '&limit=' + klineCount)
                .then(r => ({ code: p.code, name: r.name || p.name, data: r.data || [] }))
                .catch(() => ({ code: p.code, name: p.name, data: p.data }))
        );
        const results = await Promise.all(promises);
        setPanels(prev => prev.map(p => {
            const r = results.find(rr => rr.code === p.code);
            return r ? { ...p, name: r.name, data: r.data } : p;
        }));
    };

    useEffect(() => { if (panels.length > 0) refreshAll(); }, [klineCount]);

    // Auto-tile: arrange windows in grid
    const autoTile = () => {
        if (panels.length === 0) return;
        const ws = workspaceRef.current;
        const totalW = ws ? ws.offsetWidth : 1000;
        const totalH = ws ? ws.offsetHeight : 600;
        const cols = panels.length <= 2 ? panels.length : panels.length <= 4 ? 2 : 3;
        const rows = Math.ceil(panels.length / cols);
        const ww = Math.floor(totalW / cols) - 8;
        const wh = Math.floor(totalH / rows) - 8;
        setPanels(prev => prev.map((p, i) => ({
            ...p,
            x: (i % cols) * (ww + 8) + 4,
            y: Math.floor(i / cols) * (wh + 8) + 4,
            w: Math.max(320, ww), h: Math.max(240, wh)
        })));
    };

    return (
        <div className="market-page fade-in">
            <div className="tabs">
                <button className={'tab-btn' + (tab === 'watch' ? ' active' : '')} onClick={() => setTab('watch')}>自选看盘</button>
                <button className={'tab-btn' + (tab === 'pattern' ? ' active' : '')} onClick={() => setTab('pattern')}>形态匹配</button>
            </div>

            {tab === 'watch' && (<div>
                <div className="market-toolbar">
                    <StockSearchInput onSelect={addStock} placeholder="添加股票..." />
                    <div className="field" style={{width:90}}>
                        <label className="label">K线数</label>
                        <select className="input" value={klineCount} onChange={e => setKlineCount(+e.target.value)}>
                            <option value={30}>30</option>
                            <option value={60}>60</option>
                            <option value={120}>120</option>
                            <option value={250}>250</option>
                        </select>
                    </div>
                    <button className="btn btn-secondary" onClick={autoTile} disabled={panels.length===0} title="自动排列">整理窗口</button>
                    <button className="btn btn-secondary" onClick={refreshAll} disabled={panels.length===0}>刷新全部</button>
                </div>

                <div className="market-workspace" ref={workspaceRef} style={{height: 620}}>
                    {panels.length === 0 && (
                        <div className="workspace-empty">在上方搜索框输入股票代码或名称添加看盘<br/>窗口可自由拖动和缩放</div>
                    )}
                    {panels.map(p => (
                        <div key={p.code}
                            className={'stock-window' + (p.active ? ' active' : '')}
                            style={{left: p.x, top: p.y, width: p.w, height: p.h, zIndex: p.z}}
                            onMouseDown={() => bringToFront(p.code)}>
                            <div className="stock-window-bar" onMouseDown={e => onBarMouseDown(e, p.code)}>
                                <div className="stock-window-title">
                                    <span>{p.name || '加载中...'}</span>
                                    <span style={{fontSize:11,color:'var(--text-500)'}}>{p.code}</span>
                                </div>
                                <div className="stock-window-btns">
                                    <button className="stock-window-btn close-btn" onClick={() => removePanel(p.code)} title="关闭">×</button>
                                </div>
                            </div>
                            <div className="stock-window-body">
                                <StockWindowContent data={p.data} chartW={Math.max(280, (p.w || 420) - 24)} chartH={Math.max(150, (p.h || 300) - 90)} />
                            </div>
                            <div className="stock-window-resize" onMouseDown={e => onResizeMouseDown(e, p.code)} />
                        </div>
                    ))}
                </div>
            </div>)}

            {tab === 'pattern' && <DrawingCanvas showToast={showToast} />}
        </div>
    );
}

    }, [selected && selected.id]);

        const bottom = ((rankData && rankData.bottom) || []).map(item => ({ group: '\u6700\u5c0f', ...item }));

    };

    const runRank = async () => {
        if (!selected) { showToast('\u8bf7\u5148\u9009\u62e9\u56e0\u5b50', 'error'); return; }

                universe_code: form.universe_type === 'system' ? form.universe_code : '',

        const headers = ['分组', '股票代码', '股票名称', '因子值', '因子日期'];
        const escapeCsv = value => `"${String(value === undefined || value === null ? '' : value).replace(/"/g, '""')}"`;

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `factor_rank_${selected ? selected.name : 'factor'}_${compactDate(form.trade_date)}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

                    </thead>

                        {rows && rows.length ? rows.map(item => (
                            <tr key={title + item.ts_code}>
                                <td>{item.ts_code}</td>

                                <td>{Number(item.factor_value).toFixed(6)}</td>

                        )) : <tr><td colSpan="4" className="text-center text-muted">{'\u6682\u65e0\u6570\u636e'}</td></tr>}
                    </tbody>

            </div>
        </div>
    );

    return (
        <div className="card" style={{padding:14}}>
            <div className="factor-mining-toolbar" style={{marginBottom:12}}>
                <div>
                    <div className="card-title" style={{marginBottom:4}}>{'\u56e0\u5b50\u622a\u9762\u6392\u884c'}</div>
                    <div className="text-xs text-muted">{'\u8ba1\u7b97\u6307\u5b9a\u65e5\u671f\u548c\u80a1\u7968\u6c60\u4e2d\u56e0\u5b50\u503c\u6700\u5927 / \u6700\u5c0f\u7684 N \u53ea\u80a1\u7968\u3002'}</div>
                </div>
                <button className="btn btn-secondary" onClick={downloadRank} disabled={!rankData}>{'\u4e0b\u8f7d CSV'}</button>
            </div>
            <div className="factor-rank-toolbar">
                <div className="field"><label className="label">{'\u65e5\u671f'}</label><input className="input" value={form.trade_date} onChange={e => setForm(prev => ({...prev, trade_date: e.target.value}))} placeholder="YYYYMMDD" /></div>
                <div className="field"><label className="label">{'\u6570\u91cf N'}</label><input className="input" type="number" min="1" max="100" value={form.n} onChange={e => setForm(prev => ({...prev, n: Number(e.target.value || 10)}))} /></div>
                <div className="field"><label className="label">{'\u80a1\u7968\u6c60\u7c7b\u578b'}</label><select className="input" value={form.universe_type} onChange={e => setForm(prev => ({...prev, universe_type: e.target.value}))}><option value="system">{'\u7cfb\u7edf\u80a1\u7968\u6c60'}</option><option value="custom">{'\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60'}</option></select></div>
                {form.universe_type === 'system' ? (
                    <div className="field wide"><label className="label">{'\u7cfb\u7edf\u80a1\u7968\u6c60'}</label><select className="input" value={form.universe_code} onChange={e => setForm(prev => ({...prev, universe_code: e.target.value}))}>{(options.system_universes || []).map(item => <option key={item.code} value={item.code}>{item.name || item.code}</option>)}</select></div>

                    <div className="field wide"><label className="label">{'\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60'}</label><select className="input" value={form.custom_pool_id} onChange={e => setForm(prev => ({...prev, custom_pool_id: e.target.value}))}><option value="">{'\u8bf7\u9009\u62e9'}</option>{(options.custom_pools || []).map(item => <option key={item.id} value={item.id}>{item.name} ({item.stock_count})</option>)}</select></div>
                )}
                <button className="btn btn-primary" onClick={runRank} disabled={loading || !selected || (form.universe_type === 'custom' && !form.custom_pool_id)}>{loading ? <><span className="spinner"/> {'\u8ba1\u7b97\u4e2d...'}</> : '\u751f\u6210\u6392\u884c'}</button>
            </div>
            {rankData ? (
                <div className="factor-rank-grid mt-4">
                    {renderTable('\u56e0\u5b50\u503c\u6700\u5927', rankData.top || [])}
                    {renderTable('\u56e0\u5b50\u503c\u6700\u5c0f', rankData.bottom || [])}
                </div>
            ) : null}
        </div>
    );
}
