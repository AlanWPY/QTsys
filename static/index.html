                        </div>
                        <div className="factor-board-log-panel">
                            {statusLogs.length === 0 ? <div className="factor-board-empty small">{'暂无日志'}</div> : statusLogs.map((entry, idx) => (
                                <div key={idx} className="factor-board-log-line">{entry}</div>
                            ))}
                        </div>
                    </div>
                    <div className="factor-board-process-card">
                        <div className="factor-board-process-head">
                            <div className="card-title" style={{marginBottom: 0}}>{'失败因子'}</div>
                            <div className="factor-board-subtle">{failedFactors.length}{' 个'}</div>
                        </div>
                        {failedFactors.length === 0 ? <div className="factor-board-empty small">{'当前没有失败因子'}</div> : (
                            <div className="factor-board-chip-list">
                                {failedFactors.map(item => <span key={item} className="factor-board-filterchip active">{item}</span>)}
                            </div>
                        )}
                    </div>
                </div>
            </section>

            <div className="factor-board-workbench">
            <section className="card space-y factor-board-panel">
                <div className="factor-board-toolbar">
                    <div>
                        <div className="card-title" style={{marginBottom: 6}}>{'数据库连接'}</div>
                        <div className="factor-board-subtle">{'配置因子看板分析所使用的 MySQL 数据库连接信息。'}</div>
                    </div>
                    <div className="factor-board-toolbar-left">
                        <button className="btn btn-secondary" onClick={saveConfig} disabled={saving}>{saving ? '保存中...' : '保存配置'}</button>
                        <button className="btn btn-secondary" onClick={testConfig} disabled={testing}>{testing ? '测试中...' : '测试连接'}</button>
                    </div>
                </div>
                <div className="grid-2">
                    <div className="field"><label className="label">{'主机'}</label><input className="input" value={dbConfig.host || ''} onChange={e => setDbConfig(prev => ({ ...prev, host: e.target.value }))} placeholder="localhost" /></div>
                    <div className="field"><label className="label">{'端口'}</label><input className="input" type="number" value={dbConfig.port || 3306} onChange={e => setDbConfig(prev => ({ ...prev, port: Number(e.target.value || 3306) }))} placeholder="3306" /></div>
                    <div className="field"><label className="label">{'用户名'}</label><input className="input" value={dbConfig.user || ''} onChange={e => setDbConfig(prev => ({ ...prev, user: e.target.value }))} placeholder="root" /></div>
                    <div className="field"><label className="label">{'数据库名'}</label><input className="input" value={dbConfig.database || ''} onChange={e => setDbConfig(prev => ({ ...prev, database: e.target.value }))} placeholder="qtsys" /></div>
                    <div className="field" style={{gridColumn: '1 / -1'}}><label className="label">{'密码'}</label><input className="input" type="password" value={dbConfig.password || ''} onChange={e => setDbConfig(prev => ({ ...prev, password: e.target.value }))} placeholder={dbConfig.has_password ? '已保存密码，留空则保持不变' : '请输入数据库密码'} /></div>
                </div>
                <div className="factor-board-status"><span className={'factor-board-dot' + (dbConfig.has_password ? ' running' : '')}></span><span>{dbConfig.has_password ? '数据库密码已保存' : '尚未保存数据库密码'}</span></div>
            </section>

            <section className="card space-y factor-board-panel">
                <div className="factor-board-toolbar">
                    <div>
                        <div className="card-title" style={{marginBottom: 6}}>{'分析参数'}</div>
                        <div className="factor-board-subtle">{'选择回测时间区间与股票池后启动 Alpha191 因子批量分析。'}</div>
                    </div>
                    <div className="factor-board-toolbar-left">
                        <button className="btn btn-primary" onClick={startAnalysis} disabled={starting || stopping || status.running || (analysisForm.universe_type === 'custom' && !analysisForm.custom_pool_id)}>{starting ? '启动中...' : '开始分析'}</button>
                        <button className="btn btn-secondary" onClick={stopAnalysis} disabled={stopping || !status.running}>{stopping ? '停止中...' : '停止分析'}</button>
                    </div>
                </div>
                <div className="grid-2">
                    <div className="field"><label className="label">{'回测天数'}</label><input className="input" type="number" min="60" max="3650" value={analysisForm.backtest_days || 365} onChange={e => setAnalysisForm(prev => ({ ...prev, backtest_days: Number(e.target.value || 365) }))} /></div>
                    <div className="field"><label className="label">{'股票池类型'}</label><select className="input" value={analysisForm.universe_type} onChange={e => setAnalysisForm(prev => ({ ...prev, universe_type: e.target.value, custom_pool_id: e.target.value === 'custom' ? prev.custom_pool_id : '', universe_code: e.target.value === 'system' ? (prev.universe_code || '000905.SH') : prev.universe_code }))}><option value="system">{'系统股票池'}</option><option value="custom">{'自定义股票池'}</option></select></div>
                    <div className="field"><label className="label">{'开始日期'}</label><input className="input" type="date" value={analysisForm.start_date || ''} onChange={e => setAnalysisForm(prev => ({ ...prev, start_date: e.target.value }))} /></div>
                    <div className="field"><label className="label">{'结束日期'}</label><input className="input" type="date" value={analysisForm.end_date || ''} onChange={e => setAnalysisForm(prev => ({ ...prev, end_date: e.target.value }))} /></div>
                    {analysisForm.universe_type === 'system' ? (
                        <div className="field" style={{gridColumn: '1 / -1'}}><label className="label">{'系统股票池'}</label><select className="input" value={analysisForm.universe_code || '000905.SH'} onChange={e => setAnalysisForm(prev => ({ ...prev, universe_code: e.target.value }))}>{(universeOptions.system_universes || []).map(item => <option key={item.code} value={item.code}>{item.name}{'（'}{item.code}{'）'}</option>)}</select></div>
                    ) : (
                        <div className="field" style={{gridColumn: '1 / -1'}}><label className="label">{'自定义股票池'}</label><select className="input" value={analysisForm.custom_pool_id || ''} onChange={e => setAnalysisForm(prev => ({ ...prev, custom_pool_id: e.target.value }))}><option value="">{'请选择已保存的股票池'}</option>{(universeOptions.custom_pools || []).map(item => <option key={item.id} value={item.id}>{item.name}{'（'}{item.stock_count}{'只）'}</option>)}</select></div>

/* ===== Factor Mining Page ===== */
function FactorMiningPage({ showToast }) {
    const toInputDate = (text) => {
        const value = compactDate(text);
        return value && value.length === 8 ? `${value.slice(0, 4)}-${value.slice(4, 6)}-${value.slice(6, 8)}` : '';
    };
    const [options, setOptions] = useState({ system_universes: [], custom_pools: [] });
    const [form, setForm] = useState({
        universe_type: 'system',
        universe_code: '000016.SH',
        custom_pool_id: '',
        start_date: toInputDate(shiftCompactDate(todayCompactDate(), -430)),
        end_date: toInputDate(todayCompactDate()),
        max_stocks: 50,
        candidate_count: 12,
        gp_generations: 2,
        gp_population: 12,
        select_pct: 0.1,
        rebalance_days: 5,
        protocol_version: 'v4',
        research_mode: 'professional',
        factor_themes: [],
        neutralize: 'rank_zscore',
        walk_forward_windows: 3,
        embargo_days: 5,
        max_trials: 0,
        capacity_limit_pct: 0.10,
        min_dsr: -0.25,
    });
    const [globalPinned, setGlobalPinned] = useState([]);
    const [starting, setStarting] = useState(false);
    const [stopping, setStopping] = useState(false);
    const [sessionId, setSessionId] = useState('');
    const [status, setStatus] = useState(null);
    const [results, setResults] = useState([]);
    const [lastId, setLastId] = useState(0);
    const [logs, setLogs] = useState([]);
    const [savingExpression, setSavingExpression] = useState('');
    const [revalidatingId, setRevalidatingId] = useState(null);
    const [reportModal, setReportModal] = useState(null);
    const [reportLoadingId, setReportLoadingId] = useState(null);
    const pollRef = useRef(null);
    const lastIdRef = useRef(0);
    const resultsCountRef = useRef(0);

    useEffect(() => {
        api.get('/api/factor_mining/options').then(setOptions).catch(() => {});
    }, []);
    useEffect(() => {
        api.get('/api/factor_mining/pinned').then(res => setGlobalPinned((res && res.items) || [])).catch(() => {});
    }, []);

    useEffect(() => {
        return () => { if (pollRef.current) clearInterval(pollRef.current); };
    }, []);

    useEffect(() => {
        resultsCountRef.current = results.length;
    }, [results.length]);

    const best = results.length ? results[0] : null;
    const miningCurveSignature = (item) => {
        if (!item) return '';
        const key = item.trading_equivalence_key || (item.fingerprint && item.fingerprint.trading_equivalence_key);
        if (key) return `trade:${key}`;
        const curve = item.display_normalized_curve || item.normalized_curve || [];
        if (!Array.isArray(curve) || !curve.length) return `id:${item.id}`;
        const first = curve[0] || {};
        const mid = curve[Math.floor(curve.length / 2)] || {};
        const last = curve[curve.length - 1] || {};
        return ['curve', first.date, Number(first.value || 0).toFixed(6), mid.date, Number(mid.value || 0).toFixed(6), last.date, Number(last.value || 0).toFixed(6)].join('|');
    };
    const chartResults = useMemo(() => {
        const sorted = [...results].sort((a, b) => {
            const aMetrics = (a && a.display_metrics && Object.keys(a.display_metrics).length) ? a.display_metrics : ((a && a.backtest_metrics) || {});
            const bMetrics = (b && b.display_metrics && Object.keys(b.display_metrics).length) ? b.display_metrics : ((b && b.backtest_metrics) || {});
            const ax = Number(aMetrics.total_return ?? aMetrics.excess_return ?? a.score);
            const bx = Number(bMetrics.total_return ?? bMetrics.excess_return ?? b.score);
            return (Number.isFinite(bx) ? bx : Number(b.score || 0)) - (Number.isFinite(ax) ? ax : Number(a.score || 0));
        });
        const top = sorted.slice(0, 10);
        const bottom = sorted.length > 10 ? sorted.slice(-10) : [];
        const map = new Map();
        [...top, ...bottom].forEach(item => {
            if (!item || item.id === undefined) return;
            const key = item.id;
            if (!map.has(key)) map.set(key, item);
        });
        return Array.from(map.values());
    }, [results]);
    const normalizeMiningCurvePoint = (point, mode) => {
        const raw = Number(point && point.value);
        if (!Number.isFinite(raw)) return null;
        if (mode === 'excess') {
            return raw;
        }
        return (raw - 1) * 100;
    };
    const chartData = useMemo(() => {
        const map = {};
        chartResults.forEach((item, idx) => {
            const curve = item.display_normalized_curve || item.normalized_curve || [];
            curve.forEach(point => {
                const date = String(point.date || '');
                const value = normalizeMiningCurvePoint(point, 'return');
                if (!date) return;
                if (value === null || !Number.isFinite(value)) return;
                if (!map[date]) map[date] = { date };
                map[date]['f' + idx] = value;
            });
        });
        const benchmarkCurve = best && (best.display_benchmark_normalized_curve || best.benchmark_normalized_curve || []);
        if (best && Array.isArray(benchmarkCurve)) {
            benchmarkCurve.forEach(point => {
                const date = String(point.date || '');
                const value = normalizeMiningCurvePoint(point, 'return');
                if (!date) return;
                if (value === null) return;
                if (!map[date]) map[date] = { date };
                map[date].benchmark = value;
            });
        }
        const excessCurve = best && (best.display_excess_curve || best.excess_curve || []);
        if (best && Array.isArray(excessCurve)) {
            excessCurve.forEach(point => {
                const date = String(point.date || '');
                const value = normalizeMiningCurvePoint(point, 'excess');
                if (!date) return;
                if (value === null) return;
                if (!map[date]) map[date] = { date };
                map[date].excess = value;
            });
        }
        return Object.values(map).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    }, [chartResults, best]);
    const chartYDomain = useMemo(() => {
        const values = [];
        chartData.forEach(row => {
            Object.keys(row).forEach(key => {
                if (key === 'date') return;
                const value = Number(row[key]);
                if (Number.isFinite(value)) values.push(value);
            });
        });
        if (!values.length) return ['auto', 'auto'];
        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);
        const pad = Math.max((maxVal - minVal) * 0.18, 0.02);
        return [Number((minVal - pad).toFixed(4)), Number((maxVal + pad).toFixed(4))];
    }, [chartData]);
    const palette = ['#60a5fa', '#34d399', '#f59e0b', '#f472b6', '#a78bfa', '#22d3ee', '#fb7185', '#84cc16', '#facc15', '#38bdf8', '#c084fc', '#2dd4bf', '#fb923c', '#4ade80', '#e879f9', '#93c5fd', '#f87171', '#a3e635', '#67e8f9', '#fdba74'];
    const pct = (value) => {
        const num = Number(value);
        return Number.isFinite(num) ? num.toFixed(2) + '%' : '-';
    };
    const num = (value, digits = 3) => {
        const n = Number(value);
        return Number.isFinite(n) ? n.toFixed(digits) : '-';
    };
    const rankScore = (item) => {
        const excess = Number(item && (item.test_excess_return ?? (item.backtest_metrics && item.backtest_metrics.excess_return)));
        if (Number.isFinite(excess)) return excess;
        return Number(item && item.score || 0);
    };
    const isRunning = !!(status && status.running);
    const tested = Number(status && status.tested_count || 0);
    const accepted = Number(status && status.accepted_count || 0);
    const hitRate = tested > 0 ? Math.min(100, accepted / tested * 100) : 0;
    const statusKind = status && status.status === 'failed' ? 'failed' : isRunning ? 'running' : '';
    const directionLabel = (value) => value === 'bottom' ? '\u4f4e\u503c\u7ec4\u5360\u4f18' : '\u9ad8\u503c\u7ec4\u5360\u4f18';
    const metricValueClass = (value) => {
        const n = Number(value);
        if (!Number.isFinite(n) || n === 0) return '';
        return n > 0 ? 'text-profit' : 'text-loss';
    };
    const displayBacktestMetrics = (item) => {
        const metrics = item && item.display_metrics;
        return metrics && Object.keys(metrics).length ? metrics : ((item && item.backtest_metrics) || {});
    };
    const technicalOpsText = (item) => {
        const ops = item && (item.technical_operators || (item.fingerprint && item.fingerprint.technical_operators));
        return Array.isArray(ops) && ops.length ? ops.join(', ') : '-';
    };
    const csvEscape = (value) => `"${String(value === undefined || value === null ? '' : value).replace(/"/g, '""')}"`;
    const downloadSummary = () => {
        const headers = ['因子名称', '搜索来源', '主题', '因子类型', '技术算子', '因子公式', '测试IC', '测试IR', 'p-value', 'DSR', 'PBO风险', '展示最大回撤', '展示超额', '展示年化收益', '测试超额', '协议版本'];
        const rows = results.map(item => [
            item.name || '',
            item.search_source || item.source || '',
            item.theme || '',
            item.event_driven ? '事件型' : '连续型',
            technicalOpsText(item),
            item.expression || '',
            num(item.test_metrics && item.test_metrics.ic_mean, 6),
            num(item.test_metrics && item.test_metrics.ic_ir, 6),
            num(item.p_value, 6),
            num(item.dsr, 4),
            item.pbo_risk || '',
            pct(displayBacktestMetrics(item).max_drawdown),
            pct(displayBacktestMetrics(item).excess_return),
            pct(displayBacktestMetrics(item).annual_return),
            pct(item.backtest_metrics && item.backtest_metrics.excess_return),
            item.protocol_version || '',
        ]);
        const csv = '\ufeff' + [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `factor_mining_${sessionId || 'results'}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    };

    const appendLog = (message) => {
        const text = String(message || '').trim();
        if (!text) return;
        setLogs(prev => {
            if (prev.length && prev[prev.length - 1].text === text) return prev;
            return [...prev.slice(-80), { time: new Date().toLocaleTimeString(), text }];
        });
    };

    const mergeResults = (items) => {
        if (!Array.isArray(items) || !items.length) return;
        setResults(prev => {
            const map = new Map(prev.map(item => [item.id, item]));
            items.forEach(item => map.set(item.id, item));
            return Array.from(map.values()).sort((a, b) => rankScore(b) - rankScore(a));
        });
    };

    const hydrateSessionResults = async (sid, pinnedOnly = false) => {
        if (!sid) return;
        let cursor = 0;
        let allItems = [];
        for (let i = 0; i < 8; i++) {
            const res = await api.get(`/api/factor_mining/sessions/${sid}/results?after_id=${cursor}&limit=200&pinned_only=${pinnedOnly ? 'true' : 'false'}`);
            const items = Array.isArray(res && res.items) ? res.items : [];
            if (!items.length) break;
            allItems = allItems.concat(items);
            cursor = Number(res.last_id || items[items.length - 1].id || cursor);
            if (items.length < 200) break;
        }
        setResults(allItems.sort((a, b) => rankScore(b) - rankScore(a)));
        lastIdRef.current = cursor;
        setLastId(cursor);
    };

    const restoreActiveSession = async () => {
        try {
            const res = await api.get('/api/factor_mining/sessions/active');
            if (!res || !res.has_session || !res.session || !res.session.session_id) return;
            const st = res.session;
            const sid = st.session_id;
            setSessionId(sid);
            setStatus(st);
            setForm(prev => ({
                ...prev,
                universe_type: st.universe_type || prev.universe_type,
                universe_code: st.universe_type === 'system' ? (st.universe_code || prev.universe_code) : prev.universe_code,
                custom_pool_id: st.universe_type === 'custom' ? String(st.params && st.params.custom_pool_id || prev.custom_pool_id || '') : prev.custom_pool_id,
                start_date: toInputDate(st.start_date) || prev.start_date,
                end_date: toInputDate(st.end_date) || prev.end_date,
                max_stocks: Number(st.params && st.params.max_stocks || st.stock_count || prev.max_stocks),
                select_pct: Number(st.params && st.params.select_pct || prev.select_pct),
                rebalance_days: Number(st.params && st.params.rebalance_days || prev.rebalance_days),
                research_mode: st.research_mode || prev.research_mode,
                factor_themes: Array.isArray(st.factor_themes) ? st.factor_themes : prev.factor_themes,
                neutralize: st.neutralize || prev.neutralize,
                walk_forward_windows: Number(st.walk_forward_windows || prev.walk_forward_windows),
                embargo_days: Number(st.embargo_days ?? prev.embargo_days),
                max_trials: Number(st.max_trials || prev.max_trials),
                capacity_limit_pct: Number(st.capacity_limit_pct || prev.capacity_limit_pct),
                min_dsr: Number(st.min_dsr ?? prev.min_dsr),
            }));
            await hydrateSessionResults(sid, !res.active);
            appendLog(res.active ? '\u5df2\u7eed\u63a5\u6b63\u5728\u8fd0\u884c\u7684\u56e0\u5b50\u6316\u6398\u4f1a\u8bdd' : '\u5df2\u6062\u590d\u6700\u8fd1\u4e00\u6b21\u56e0\u5b50\u6316\u6398\u7ed3\u679c');
            if (st.running) pollSession(sid);
        } catch (e) {
            appendLog('\u56e0\u5b50\u6316\u6398\u4f1a\u8bdd\u6062\u590d\u5931\u8d25');
        }
    };

    const fetchIncrementalResults = async (sid) => {
        const res = await api.get(`/api/factor_mining/sessions/${sid}/results?after_id=${lastIdRef.current}&limit=80`);
        const items = Array.isArray(res && res.items) ? res.items : [];
        if (items.length) {
            mergeResults(items);
            const nextId = Number(res.last_id || items[items.length - 1].id || lastIdRef.current);
            lastIdRef.current = nextId;
            setLastId(nextId);
        }
        return items.length;
    };

    const pollSession = (sid) => {
        if (pollRef.current) clearInterval(pollRef.current);
        const tick = async () => {
            try {
                const st = await api.get(`/api/factor_mining/sessions/${sid}/status`);
                setStatus(st);
                appendLog(st.message);
                const added = await fetchIncrementalResults(sid);
                if (!added && Number(st && st.accepted_count || 0) > resultsCountRef.current) {
                    await hydrateSessionResults(sid);
                }
                if (!st.running && pollRef.current) {
                    clearInterval(pollRef.current);
                    pollRef.current = null;
                }
            } catch (e) {
                appendLog((e && e.detail) || '\u8f6e\u8be2\u6316\u6398\u72b6\u6001\u5931\u8d25');
                if (pollRef.current) {
                    clearInterval(pollRef.current);
                    pollRef.current = null;
                }
            }
        };
        tick();
        pollRef.current = setInterval(tick, 2000);
    };

    useEffect(() => {
        restoreActiveSession();
    }, []);

    const runMining = async () => {
        setStarting(true);
        try {
            const payload = {
                universe_type: form.universe_type,
                universe_code: form.universe_type === 'system' ? form.universe_code : '',
                custom_pool_id: form.universe_type === 'custom' ? Number(form.custom_pool_id || 0) || null : null,
                start_date: compactDate(form.start_date),
                end_date: compactDate(form.end_date),
                max_stocks: Number(form.max_stocks || 50),
                candidate_count: Number(form.candidate_count || 12),
                gp_generations: Number(form.gp_generations || 0),
                gp_population: Number(form.gp_population || 0),
                select_pct: Number(form.select_pct || 0.1),
                rebalance_days: Number(form.rebalance_days || 5),
                max_depth: 4,
                max_expression_length: 600,
                auto_stop_candidates: 0,
                protocol_version: 'v4',
                research_mode: form.research_mode || 'professional',
                factor_themes: Array.isArray(form.factor_themes) ? form.factor_themes : [],
                neutralize: form.neutralize || 'rank_zscore',
                walk_forward_windows: Number(form.walk_forward_windows || 3),
                embargo_days: Number(form.embargo_days || 5),
                max_trials: Number(form.max_trials || 0),
                capacity_limit_pct: Number(form.capacity_limit_pct || 0.10),
                min_dsr: Number(form.min_dsr ?? -0.25),
            };
            const data = await api.post('/api/factor_mining/sessions', payload);
            const sid = data.session_id;
            setSessionId(sid);
            setResults([]);
            setStatus({ running: true, status: 'running', phase: 'queued', message: '\u6316\u6398\u4efb\u52a1\u5df2\u63d0\u4ea4', tested_count: 0, accepted_count: 0, best_score: 0 });
            lastIdRef.current = 0;
            setLastId(0);
            setLogs([]);
            appendLog(data.already_running ? '\u5df2\u6709\u6316\u6398\u4efb\u52a1\u5728\u8fd0\u884c\uff0c\u5df2\u63a5\u5165\u5f53\u524d\u4f1a\u8bdd' : '\u6301\u7eed\u6316\u6398\u5df2\u542f\u52a8');
            pollSession(sid);
            showToast('\u6301\u7eed\u56e0\u5b50\u6316\u6398\u5df2\u542f\u52a8', 'success');
        } catch (e) {
            showToast((e && e.detail) || '\u56e0\u5b50\u6316\u6398\u5931\u8d25', 'error');
        }
        setStarting(false);
    };

    const stopMining = async () => {
        if (!sessionId) return;
        setStopping(true);
        try {
            const res = await api.post(`/api/factor_mining/sessions/${sessionId}/stop`, {});
            appendLog((res && res.message) || '\u5df2\u53d1\u9001\u505c\u6b62\u8bf7\u6c42');
            showToast((res && res.message) || '\u5df2\u53d1\u9001\u505c\u6b62\u8bf7\u6c42', 'success');
        } catch (e) {
            showToast((e && e.detail) || '\u505c\u6b62\u6316\u6398\u5931\u8d25', 'error');
        }
        setStopping(false);
    };

    const saveFactor = async (item) => {
        if (!item || !item.expression) return;
        setSavingExpression(item.expression);
        try {
            const res = await api.post('/api/factor_mining/save_factor', {
                name: item.name || '\u6316\u6398\u56e0\u5b50',
                description: `${item.description || ''}\nprotocol=${item.protocol_version || 'legacy_unverified'}; test_ic=${num(item.test_metrics && item.test_metrics.ic_mean)}; test_excess=${pct(item.backtest_metrics && item.backtest_metrics.excess_return)}; return=${pct(item.backtest_metrics && item.backtest_metrics.total_return)}`,
                expression: item.expression,
                candidate_id: item.id,
            });
            showToast((res && res.name ? res.name : '\u56e0\u5b50') + ' \u5df2\u4fdd\u5b58', 'success');
        } catch (e) {
            showToast((e && e.detail) || '\u4fdd\u5b58\u56e0\u5b50\u5931\u8d25', 'error');
        }
        setSavingExpression('');
    };

    const pinCandidate = async (item) => {
        if (!item || !item.id || item.is_pinned) return;
        try {
            const res = await api.post(`/api/factor_mining/candidates/${item.id}/pin`, {});
            if (res && res.candidate) {
                mergeResults([res.candidate]);
            } else {
                mergeResults([{ ...item, is_pinned: true }]);
            }
            showToast('\u56e0\u5b50\u5df2\u4e0a\u9501\u4fdd\u7559', 'success');
        } catch (e) {
            showToast((e && e.detail) || '\u4fdd\u7559\u56e0\u5b50\u5931\u8d25', 'error');
        }
    };

    const deleteCandidate = async (item) => {
        if (!item || !item.id) return;
        try {
            await api.remove(`/api/factor_mining/candidates/${item.id}`);
            setResults(prev => prev.filter(row => row && row.id !== item.id));
            showToast('\u56e0\u5b50\u5df2\u5220\u9664', 'success');
        } catch (e) {
            showToast((e && e.detail) || '\u5220\u9664\u56e0\u5b50\u5931\u8d25', 'error');
        }
    };

    const revalidateCandidate = async (item) => {
        if (!item || !item.id) return;
        setRevalidatingId(item.id);
        try {
            const res = await api.post(`/api/factor_mining/candidates/${item.id}/revalidate`, {});
            if (res && res.success && res.candidate) {
                mergeResults([res.candidate]);
                showToast('\u5df2\u6309\u4e25\u683c\u6837\u672c\u5916\u53e3\u5f84\u91cd\u65b0\u9a8c\u8bc1', 'success');
            } else {
                showToast((res && res.message) || '\u5019\u9009\u672a\u901a\u8fc7\u4e25\u683c\u9a8c\u8bc1', 'warning');
            }
        } catch (e) {
            showToast((e && e.detail) || '\u91cd\u65b0\u9a8c\u8bc1\u5931\u8d25', 'error');
        }
        setRevalidatingId(null);
    };

    const openResearchReport = async (item) => {
        if (!item || !item.id) return;
        setReportLoadingId(item.id);
        try {
            const res = await api.get(`/api/factor_mining/research_report/${item.id}`);
            setReportModal(res && res.research_card ? res.research_card : null);
        } catch (e) {
            showToast((e && e.detail) || '\u7814\u7a76\u62a5\u544a\u52a0\u8f7d\u5931\u8d25', 'error');
        }
        setReportLoadingId(null);
    };

    return (
        <div className="factor-mining-shell fade-in">
            <section className="card factor-mining-panel">
                <div className="factor-mining-toolbar">
                    <div>
                        <div className="factor-mining-title">{'\u56e0\u5b50\u6316\u6398'}</div>
                        <div className="factor-mining-copy">{'\u6301\u7eed\u641c\u7d22\u6570\u5b66\u3001\u65f6\u5e8f\u3001\u7edf\u8ba1\u56de\u5f52\u548c\u6761\u4ef6\u903b\u8f91\u7b97\u5b50\u7ec4\u5408\uff0c\u6bcf\u53d1\u73b0\u4e00\u4e2a\u901a\u8fc7\u771f\u5b9e\u6570\u636e\u9a8c\u8bc1\u7684\u56e0\u5b50\u5c31\u7acb\u5373\u5c55\u793a\u3002'}</div>
                    </div>
                    <div className="factor-mining-actions">
                        <button className="btn btn-primary" onClick={runMining} disabled={starting || isRunning || (form.universe_type === 'custom' && !form.custom_pool_id)}>
                            {starting ? <span className="spinner"/> : null}{starting ? '\u542f\u52a8\u4e2d...' : '\u5f00\u59cb\u6301\u7eed\u6316\u6398'}
                        </button>
                        <button className="btn btn-secondary" onClick={stopMining} disabled={!isRunning || stopping}>
                            {stopping ? <span className="spinner"/> : null}{stopping ? '\u505c\u6b62\u4e2d...' : '\u505c\u6b62\u6316\u6398'}
                        </button>
                    </div>
                </div>
            </section>

            <section className="card factor-mining-panel space-y">
                <div className="grid-4">
                    <div className="field">
                        <label className="label">{'\u80a1\u7968\u6c60\u7c7b\u578b'}</label>
                        <select className="input" value={form.universe_type} onChange={e => setForm(prev => ({ ...prev, universe_type: e.target.value }))}>
                            <option value="system">{'\u7cfb\u7edf\u80a1\u7968\u6c60'}</option>
                            <option value="custom">{'\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60'}</option>
                        </select>
                    </div>
                    {form.universe_type === 'system' ? (
                        <div className="field">
                            <label className="label">{'\u7cfb\u7edf\u80a1\u7968\u6c60'}</label>
                            <select className="input" value={form.universe_code} onChange={e => setForm(prev => ({ ...prev, universe_code: e.target.value }))}>
                                {(options.system_universes || []).map(item => <option key={item.code} value={item.code}>{item.name || item.code}</option>)}
                            </select>
                        </div>
                    ) : (
                        <div className="field">
                            <label className="label">{'\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60'}</label>
                            <select className="input" value={form.custom_pool_id} onChange={e => setForm(prev => ({ ...prev, custom_pool_id: e.target.value }))}>
                                <option value="">{'\u8bf7\u9009\u62e9'}</option>
                                {(options.custom_pools || []).map(item => <option key={item.id} value={item.id}>{item.name} ({item.stock_count})</option>)}
                            </select>
                        </div>
                    )}
                    <div className="field"><label className="label">{'\u5f00\u59cb\u65e5\u671f'}</label><input className="input" type="date" value={form.start_date} onChange={e => setForm(prev => ({ ...prev, start_date: e.target.value }))}/></div>
                    <div className="field"><label className="label">{'\u7ed3\u675f\u65e5\u671f'}</label><input className="input" type="date" value={form.end_date} onChange={e => setForm(prev => ({ ...prev, end_date: e.target.value }))}/></div>
                    <div className="field"><label className="label">{'\u6700\u5927\u80a1\u7968\u6570'}</label><input className="input" type="number" min="5" max="500" value={form.max_stocks} onChange={e => setForm(prev => ({ ...prev, max_stocks: Number(e.target.value || 50) }))}/></div>
                    <div className="field"><label className="label">{'\u5c55\u793a\u76ee\u6807\u6570'}</label><input className="input" type="number" min="3" max="200" value={form.candidate_count} onChange={e => setForm(prev => ({ ...prev, candidate_count: Number(e.target.value || 12) }))}/></div>
                    <div className="field"><label className="label">{'\u9057\u4f20\u4ee3\u6570'}</label><input className="input" type="number" min="0" max="8" value={form.gp_generations} onChange={e => setForm(prev => ({ ...prev, gp_generations: Number(e.target.value || 0) }))}/></div>
                    <div className="field"><label className="label">{'\u8c03\u4ed3\u95f4\u9694'}</label><input className="input" type="number" min="1" max="60" value={form.rebalance_days} onChange={e => setForm(prev => ({ ...prev, rebalance_days: Number(e.target.value || 5) }))}/></div>
                    <div className="field">
                        <label className="label">{'\u9884\u5904\u7406\u53e3\u5f84'}</label>
                        <select className="input" value={form.neutralize} onChange={e => setForm(prev => ({ ...prev, neutralize: e.target.value }))}>
                            <option value="rank_zscore">{'\u53bb\u6781\u503c + Rank + ZScore'}</option>
                            <option value="rank">{'\u53bb\u6781\u503c + Rank'}</option>
                            <option value="zscore">{'\u53bb\u6781\u503c + ZScore'}</option>
                        </select>
                    </div>
                    <div className="field"><label className="label">{'Walk-forward \u7a97\u53e3'}</label><input className="input" type="number" min="2" max="8" value={form.walk_forward_windows} onChange={e => setForm(prev => ({ ...prev, walk_forward_windows: Number(e.target.value || 3) }))}/></div>
                    <div className="field"><label className="label">{'Embargo \u5929\u6570'}</label><input className="input" type="number" min="0" max="30" value={form.embargo_days} onChange={e => setForm(prev => ({ ...prev, embargo_days: Number(e.target.value || 5) }))}/></div>
                    <div className="field"><label className="label">{'\u6700\u5927\u5c1d\u8bd5\u6570'}</label><input className="input" type="number" min="0" max="100000" value={form.max_trials} onChange={e => setForm(prev => ({ ...prev, max_trials: Number(e.target.value || 0) }))}/></div>
                    <div className="field"><label className="label">{'\u5bb9\u91cf\u4e0a\u9650'}</label><input className="input" type="number" step="0.01" min="0.01" max="0.5" value={form.capacity_limit_pct} onChange={e => setForm(prev => ({ ...prev, capacity_limit_pct: Number(e.target.value || 0.1) }))}/></div>
                    <div className="field"><label className="label">{'DSR \u95e8\u69db'}</label><input className="input" type="number" step="0.05" min="-5" max="5" value={form.min_dsr} onChange={e => setForm(prev => ({ ...prev, min_dsr: Number(e.target.value || -0.25) }))}/></div>
                </div>
                <div className="factor-mining-toggle" style={{marginTop:10}}>

                        <div className="factor-board-modal-head">
                            <div>
                                <div className="factor-board-modal-title">{reportModal.title || '\u56e0\u5b50\u7814\u7a76\u62a5\u544a'}</div>
                                <div className="factor-board-modal-copy">{reportModal.theme || '-'} | {reportModal.protocol || '-'}</div>
                            </div>
                            <button className="btn btn-secondary" onClick={() => setReportModal(null)}>{'\u5173\u95ed'}</button>
                        </div>
                        <div className="factor-mining-metric-grid" style={{marginBottom:12}}>
                            <div className="factor-mining-metric"><span>{'\u6d4b\u8bd5IC'}</span><b>{num(reportModal.metrics && reportModal.metrics.test && reportModal.metrics.test.ic_mean, 4)}</b></div>
                            <div className="factor-mining-metric"><span>{'\u6d4b\u8bd5IR'}</span><b>{num(reportModal.metrics && reportModal.metrics.test && reportModal.metrics.test.ic_ir, 3)}</b></div>
                            <div className="factor-mining-metric"><span>{'p-value'}</span><b>{num(reportModal.significance && reportModal.significance.p_value, 4)}</b></div>
                            <div className="factor-mining-metric"><span>{'DSR'}</span><b>{num(reportModal.significance && reportModal.significance.dsr, 3)}</b></div>
                            <div className="factor-mining-metric"><span>{'PBO'}</span><b>{reportModal.overfit_risk && reportModal.overfit_risk.pbo_risk || '-'}</b></div>
                            <div className="factor-mining-metric"><span>{'\u5bb9\u91cf\u5206'}</span><b>{num(reportModal.capacity && reportModal.capacity.capacity_score, 1)}</b></div>
                            <div className="factor-mining-metric"><span>{'\u7a33\u5065\u5206'}</span><b>{num(reportModal.robustness && reportModal.robustness.robustness_score, 1)}</b></div>
                            <div className="factor-mining-metric"><span>{'\u56e0\u5b50\u5bb6\u65cf'}</span><b>{reportModal.fingerprint && reportModal.fingerprint.family || '-'}</b></div>
                        </div>
                        <div className="factor-mining-expression" style={{whiteSpace:'pre-wrap'}}>
                            {'\u7ecf\u6d4e\u5b66\u5047\u8bbe\uff1a'}{reportModal.hypothesis || '-'}{'\n\n'}
                            {'\u56e0\u5b50\u516c\u5f0f\uff1a'}{reportModal.formula || '-'}{'\n\n'}
                            {'\u9884\u5904\u7406\uff1a'}{JSON.stringify(reportModal.preprocessing || {}, null, 2)}{'\n\n'}
                            {'\u7a33\u5065\u6027\uff1a'}{JSON.stringify(reportModal.robustness || {}, null, 2)}{'\n\n'}
                            {'\u56e0\u5b50\u6307\u7eb9\uff1a'}{JSON.stringify(reportModal.fingerprint || {}, null, 2)}{'\n\n'}
                            {'JoinQuant \u590d\u9a8c\u8bf4\u660e\uff1a'}{JSON.stringify(reportModal.joinquant || {}, null, 2)}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

        try {

            const pageParam = params.get('page');
            const hashPage = (window.location.hash || '').replace(/^#/, '');
            const allowed = new Set(pageNavItems.map(item => item.key));

            if (hashPage && allowed.has(hashPage)) return hashPage;
        } catch (_) {}
        return 'backtest';
    };
    const [page, setPage] = useState(resolveInitialPage);

    const showToast = (message, type) => setToast({ message, type: type || 'info' });
    const loadHealth = useCallback(() => {
        api.get('/api/system/health', { timeoutMs: 12000 })
            .then(setHealth)
            .catch(e => setHealth({ status: 'degraded', database: { ok: false, error: (e && e.detail) || '健康检查失败' }, settings: {} }));
    }, []);

    useEffect(() => {
        api.get('/api/system/version').then(v => setSysVersion(v.version || '')).catch(() => {});
        loadHealth();
    }, [loadHealth]);

    useEffect(() => {
        try {
            const url = new URL(window.location.href);
            url.searchParams.set('page', page);
            url.hash = page;
            window.history.replaceState({}, '', url.toString());
        } catch (_) {}
    }, [page]);

    const navItems = [
        { key: 'backtest', label: '回测' },
        { key: 'strategy', label: '策略' },
        { key: 'portfolio', label: '组合' },
        { key: 'market', label: '看盘' },
        { key: 'factor', label: '因子' },
        { key: 'factormining', label: '\u56e0\u5b50\u6316\u6398' },
        { key: 'screener', label: '\u9009\u80a1' },
        { key: 'workflow', label: '因子工作流' },
        { key: 'factorboard', label: '因子看板' },
        { key: 'news', label: '新闻' },
        { key: 'history', label: '历史' },
        { key: 'settings', label: '设置' },
        { key: 'help', label: '帮助' },
    ];

    return (
        <div className="app">
            <header className="header">
                <div className="header-brand">
                    <h1>QTsys</h1>
                    <span>量化交易分析回测系统</span>
                    {sysVersion && <span style={{fontSize:10,color:'var(--text-500)',marginLeft:4}}>v{sysVersion}</span>}
                </div>
                <nav className="nav">
                    {navItems.map(n => (
                        <button key={n.key} onClick={() => setPage(n.key)}
                            className={'nav-btn' + (page === n.key ? ' active' : '')}>
                            {n.label}
                        </button>
                    ))}
                </nav>
            </header>
            <SystemHealthStrip health={health} onRefresh={loadHealth} />
            <main className={'main' + (page === 'factormining' ? ' factor-mining-main' : '')}>
                {page === 'settings' && <SettingsPage showToast={showToast} />}
                {page === 'strategy' && <StrategyPage showToast={showToast} openBacktestWithStrategy={() => setPage('backtest')} />}
                {page === 'backtest' && <BacktestPage showToast={showToast} openHistoryWithResult={() => setPage('history')} />}
                {page === 'portfolio' && <PortfolioPage showToast={showToast} />}
                {page === 'market' && <MarketPage showToast={showToast} />}
                {page === 'factor' && <FactorPage showToast={showToast} openStrategyWorkspace={() => setPage('strategy')} openBacktestWithStrategy={() => setPage('backtest')} />}
                {page === 'factormining' && <FactorMiningPage showToast={showToast} />}
                {page === 'screener' && <StockScreenerPage showToast={showToast} />}

                {page === 'factorboard' && <FactorBoardPage showToast={showToast} openStrategyWorkspace={() => setPage('strategy')} />}
                {page === 'news' && <NewsPage showToast={showToast} />}
                {page === 'history' && <HistoryPage showToast={showToast} openPortfolioWorkspace={() => setPage('portfolio')} />}
                {page === 'help' && <HelpPage showToast={showToast} />}
            </main>
            {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
    );
}


/* ===== Stock Screener Page ===== */
function StockScreenerPage({ showToast }) {
    const [options, setOptions] = React.useState({ system_pools: [], industry_pools: [], factors: [] });
    const [poolCode, setPoolCode] = React.useState('000300.SH');
    const [fundWeight, setFundWeight] = React.useState(50);
    const [techWeight, setTechWeight] = React.useState(50);
    const [selectedFactors, setSelectedFactors] = React.useState([]);
    const [topN, setTopN] = React.useState(50);
    const [endDate, setEndDate] = React.useState('');
    const [running, setRunning] = React.useState(false);
    const [results, setResults] = React.useState(null);
    const [klineModal, setKlineModal] = React.useState(null);
    const [klineData, setKlineData] = React.useState(null);
    const [klineLoading, setKlineLoading] = React.useState(false);
    const [sortKey, setSortKey] = React.useState('rank');
    const [sortDir, setSortDir] = React.useState(1);
    const [factorSearch, setFactorSearch] = React.useState('');
    const [showFactorPicker, setShowFactorPicker] = React.useState(false);
    const [piDetails, setPiDetails] = React.useState(null);

    React.useEffect(() => {
        const now = new Date();
        setEndDate(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`);
        api.get('/api/screener/options').then(d => setOptions(d || { system_pools: [], industry_pools: [], factors: [] })).catch(() => {});
    }, []);

    const allPools = [...(options.system_pools || []), ...(options.industry_pools || [])];
    const allFactors = (options.factors || []).filter(f => f.expression);
    const filteredFactors = factorSearch ? allFactors.filter(f => (f.name||'').toLowerCase().includes(factorSearch.toLowerCase()) || (f.expression||'').toLowerCase().includes(factorSearch.toLowerCase())) : allFactors.slice(0, 40);

    const addFactor = (f) => {
        if (selectedFactors.find(x => x.id === f.id && x.expression === f.expression)) return;
        setSelectedFactors(prev => [...prev, { ...f, direction: 'high' }]);
        setShowFactorPicker(false);
    };
    const removeFactor = (idx) => setSelectedFactors(prev => prev.filter((_,i) => i !== idx));
    const toggleDir = (idx) => setSelectedFactors(prev => prev.map((f,i) => i === idx ? { ...f, direction: f.direction === 'high' ? 'low' : 'high' } : f));

    const handleWeightChange = (side, val) => {
        const v = Math.max(0, Math.min(100, Number(val)));
        if (side === 'fund') { setFundWeight(v); setTechWeight(100 - v); }
        else { setTechWeight(v); setFundWeight(100 - v); }
    };

    const runScreener = async () => {
        setRunning(true); setResults(null);
        try {
            const payload = {
                pool_code: poolCode,
                fund_weight: fundWeight / 100,
                tech_weight: techWeight / 100,
                tech_factors: selectedFactors.map(f => ({ id: f.id, name: f.name, expression: f.expression, direction: f.direction })),
                top_n: topN,
                end_date: endDate.replace(/-/g, ''),
            };
            const data = await api.post('/api/screener/run', payload, { timeoutMs: 300000 });
            setResults(data);
            showToast(`选股完成，共 ${(data.results||[]).length} 只`, 'success');
        } catch(e) { showToast((e&&e.detail)||'选股失败', 'error'); }
        setRunning(false);
    };

    const openKline = async (ts_code, name) => {
        setKlineModal({ ts_code, name }); setKlineLoading(true); setKlineData(null);
        try {
            const d = await api.get(`/api/screener/kline/${ts_code}?limit=300`);
            setKlineData(d.candles || []);
        } catch(e) { showToast('K线加载失败', 'error'); }
        setKlineLoading(false);
    };

    const sortedResults = React.useMemo(() => {
        if (!results || !results.results) return [];
        return [...results.results].sort((a, b) => {
            const av = a[sortKey] ?? 0, bv = b[sortKey] ?? 0;
            return sortDir * (bv - av);
        });
    }, [results, sortKey, sortDir]);

    const handleSort = (key) => {
        if (sortKey === key) setSortDir(d => -d);
        else { setSortKey(key); setSortDir(-1); }
    };

    const SortIcon = ({ col }) => sortKey === col ? (sortDir < 0 ? ' ↓' : ' ↑') : '';
    const num = (v, d=2) => v != null && Number.isFinite(Number(v)) ? Number(v).toFixed(d) : '-';
    const scoreColor = (v) => v == null ? '' : v >= 70 ? 'text-profit' : v >= 40 ? '' : 'text-loss';

    // K-line chart using recharts
    const KlineChart = ({ data }) => {
        if (!data || !data.length) return <div className="empty-state" style={{height:300}}>无K线数据</div>;
        const chartData = data.map(d => ({
            date: d.date ? d.date.slice(4,6)+'/'+d.date.slice(6,8) : '',
            close: d.close, open: d.open, high: d.high, low: d.low,
            vol: d.vol ? Math.round(d.vol/100) : 0,
        }));
        const closes = chartData.map(d => d.close).filter(Boolean);
        const minC = Math.min(...closes)*0.98, maxC = Math.max(...closes)*1.02;
        return (
            <div style={{width:'100%'}}>
                <ResponsiveContainer width="100%" height={280}>
                    <ComposedChart data={chartData} margin={{top:8,right:16,bottom:0,left:0}}>
                        <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.06)"/>
                        <XAxis dataKey="date" tick={{fill:'#7a94ad',fontSize:10}} tickLine={false} interval={Math.floor(chartData.length/8)}/>
                        <YAxis domain={[minC,maxC]} tick={{fill:'#7a94ad',fontSize:10}} tickLine={false} width={60} tickFormatter={v=>v.toFixed(2)}/>
                        <Tooltip contentStyle={{background:'#141e2e',border:'1px solid #1e2d44',borderRadius:8,color:'#dce8f8',fontSize:12}} formatter={(v,n)=>[Number(v).toFixed(3),n]}/>
                        <Line connectNulls type="monotone" dataKey="close" stroke="#4f6ef7" strokeWidth={2} dot={false} name="收盘"/>
                        <Line connectNulls type="monotone" dataKey="high" stroke="#1fd575" strokeWidth={1} dot={false} strokeDasharray="3 2" name="最高"/>
                        <Line connectNulls type="monotone" dataKey="low" stroke="#f0425a" strokeWidth={1} dot={false} strokeDasharray="3 2" name="最低"/>
                    </ComposedChart>
                </ResponsiveContainer>
                <ResponsiveContainer width="100%" height={80}>
                    <BarChart data={chartData} margin={{top:4,right:16,bottom:0,left:0}}>
                        <XAxis dataKey="date" tick={false} axisLine={false}/>
                        <YAxis tick={false} axisLine={false} width={60}/>
                        <Bar dataKey="vol" fill="#4f6ef7" opacity={0.5} name="成交量(百股)"/>
                    </BarChart>
                </ResponsiveContainer>
            </div>
        );
    };

    return (
        <div className="fade-in" style={{maxWidth:1400,margin:'0 auto',padding:'0 0 40px 0'}}>
            {/* ── Header ────────────────────────────── */}
            <div style={{marginBottom:20,paddingTop:4}}>
                <h2 style={{fontSize:22,fontWeight:800,color:'var(--text-100)',marginBottom:4,background:'linear-gradient(90deg,var(--accent-light),var(--cyan))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>智能选股</h2>
                <p style={{fontSize:13,color:'var(--text-400)'}}>基本面（改进版 Piotroski F-Score）+ 技术面（用户自选因子）双维度评分，按综合得分排序</p>
            </div>

            {/* ── Settings Row ──────────────────────── */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,marginBottom:16}}>
                {/* 股票池 */}
                <div className="card" style={{padding:18}}>
                    <div style={{fontWeight:700,fontSize:13,color:'var(--text-200)',marginBottom:12}}>📊 股票池</div>
                    <label className="label">选择池</label>
                    <select className="input" value={poolCode} onChange={e=>setPoolCode(e.target.value)} style={{marginBottom:8}}>
                        <optgroup label="主流指数">
                            {(options.system_pools||[]).map(p=><option key={p.code} value={p.code}>{p.name}</option>)}
                        </optgroup>
                        <optgroup label="行业板块">
                            {(options.industry_pools||[]).map(p=><option key={p.code} value={p.code}>{p.name}</option>)}
                        </optgroup>
                    </select>
                    <div style={{display:'flex',gap:8,marginTop:8}}>
                        <div style={{flex:1}}>
                            <label className="label">截止日期</label>
                            <input className="input" type="date" value={endDate} onChange={e=>setEndDate(e.target.value)}/>
                        </div>
                        <div style={{flex:'0 0 80px'}}>
                            <label className="label">展示前N</label>
                            <input className="input" type="number" min={5} max={200} value={topN} onChange={e=>setTopN(Number(e.target.value)||50)}/>
                        </div>
                    </div>
                </div>

                {/* 权重设置 */}
                <div className="card" style={{padding:18}}>
                    <div style={{fontWeight:700,fontSize:13,color:'var(--text-200)',marginBottom:12}}>⚖️ 基本面 / 技术面 权重</div>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                        <span style={{color:'var(--accent-light)',fontWeight:700,fontSize:15}}>{fundWeight}<span style={{fontSize:11,color:'var(--text-400)'}}> / 100</span></span>
                        <span style={{fontSize:12,color:'var(--text-400)'}}>基本面 ↔ 技术面</span>
                        <span style={{color:'var(--cyan)',fontWeight:700,fontSize:15}}>{techWeight}<span style={{fontSize:11,color:'var(--text-400)'}}> / 100</span></span>
                    </div>
                    <input type="range" min={0} max={100} value={fundWeight} onChange={e=>handleWeightChange('fund',e.target.value)} style={{width:'100%',accentColor:'var(--accent)',marginBottom:12}}/>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                        <div style={{background:'rgba(79,110,247,0.1)',borderRadius:10,padding:'8px 12px',border:'1px solid rgba(79,110,247,0.2)',textAlign:'center'}}>
                            <div style={{fontSize:11,color:'var(--text-400)'}}>基本面</div>
                            <div style={{fontSize:20,fontWeight:800,color:'var(--accent-light)'}}>{fundWeight}%</div>
                            <div style={{fontSize:10,color:'var(--text-500)'}}>Piotroski F-Score</div>
                        </div>
                        <div style={{background:'rgba(34,211,238,0.08)',borderRadius:10,padding:'8px 12px',border:'1px solid rgba(34,211,238,0.2)',textAlign:'center'}}>
                            <div style={{fontSize:11,color:'var(--text-400)'}}>技术面</div>
                            <div style={{fontSize:20,fontWeight:800,color:'var(--cyan)'}}>{techWeight}%</div>
                            <div style={{fontSize:10,color:'var(--text-500)'}}>自选因子</div>
                        </div>
                    </div>
                </div>

                {/* 技术因子 */}
                <div className="card" style={{padding:18}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                        <div style={{fontWeight:700,fontSize:13,color:'var(--text-200)'}}>📈 技术因子 <span style={{color:'var(--text-400)',fontWeight:400,fontSize:11}}>({selectedFactors.length}个)</span></div>
                        <button className="btn btn-primary" style={{padding:'4px 10px',fontSize:12}} onClick={()=>setShowFactorPicker(!showFactorPicker)}>+ 添加</button>
                    </div>
                    {showFactorPicker && (
                        <div style={{marginBottom:8,background:'var(--bg-600)',borderRadius:10,padding:10,border:'1px solid var(--border)'}}>
                            <input className="input" placeholder="搜索因子..." value={factorSearch} onChange={e=>setFactorSearch(e.target.value)} style={{marginBottom:8,fontSize:12}}/>
                            <div style={{maxHeight:120,overflowY:'auto'}}>
                                {filteredFactors.map(f=>(
                                    <div key={f.id||f.name} onClick={()=>addFactor(f)} style={{padding:'4px 8px',borderRadius:6,cursor:'pointer',fontSize:12,color:'var(--text-300)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--bg-500)'} onMouseLeave={e=>e.currentTarget.style.background=''}>{f.name} <span style={{color:'var(--text-500)',fontSize:10}}>{(f.expression||'').slice(0,30)}</span></div>
                                ))}
                                {filteredFactors.length === 0 && <div style={{color:'var(--text-500)',fontSize:12,textAlign:'center',padding:'8px 0'}}>无匹配因子</div>}
                            </div>
                        </div>
                    )}
                    <div style={{maxHeight:120,overflowY:'auto'}}>
                        {selectedFactors.length === 0 && <div style={{color:'var(--text-500)',fontSize:12,textAlign:'center',padding:'16px 0'}}>暂未添加技术因子</div>}
                        {selectedFactors.map((f,i)=>(
                            <div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 0',borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
                                <span style={{flex:1,fontSize:12,color:'var(--text-300)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</span>
                                <button onClick={()=>toggleDir(i)} style={{padding:'2px 8px',borderRadius:5,border:'1px solid',fontSize:10,cursor:'pointer',background:'transparent',borderColor:f.direction==='high'?'var(--profit)':'var(--loss)',color:f.direction==='high'?'var(--profit)':'var(--loss)'}}>{f.direction==='high'?'↑高好':'↓低好'}</button>
                                <button onClick={()=>removeFactor(i)} style={{color:'var(--text-500)',background:'none',border:'none',cursor:'pointer',fontSize:14,padding:'0 2px'}}>×</button>
                            </div>
                        ))}
                    </div>
                </div>
            </div>

            {/* ── Run Button ────────────────────────── */}
            <div style={{textAlign:'center',marginBottom:20}}>
                <button className="btn btn-primary" style={{padding:'12px 48px',fontSize:16,borderRadius:12}} onClick={runScreener} disabled={running}>
                    {running ? <><span className="spinner"/> 选股中...(约需1-3分钟)</> : '🔍 开始选股'}
                </button>
                {running && <div style={{fontSize:12,color:'var(--text-400)',marginTop:8}}>正在计算 {allPools.find(p=>p.code===poolCode)?.name||poolCode} 成分股评分，请稍候...</div>}
            </div>

            {/* ── Results ───────────────────────────── */}
            {results && (
                <div>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                        <div>
                            <span style={{fontWeight:700,color:'var(--text-100)',fontSize:16}}>选股结果</span>
                            <span style={{color:'var(--text-400)',fontSize:13,marginLeft:10}}>共分析 {results.total_codes} 只，展示前 {(results.results||[]).length} 名</span>
                            <span style={{color:'var(--text-500)',fontSize:11,marginLeft:8}}>截止 {results.end_date} · 基本面 {results.fund_weight}% · 技术面 {results.tech_weight}%</span>
                        </div>
                    </div>
                    <div className="card" style={{padding:0,overflow:'hidden'}}>
                        <div style={{overflowX:'auto'}}>
                            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                                <thead>
                                    <tr style={{background:'rgba(0,0,0,0.2)'}}>
                                        {[['rank','排名'],['name','股票'],['total_score','综合分'],['fund_score','基本面分'],['tech_score','技术面分'],['pe','PE'],['pb','PB'],['total_mv','市值(亿)'],['roe','ROE%'],['debt_to_assets','资负比%']].map(([k,l])=>(
                                            <th key={k} onClick={()=>handleSort(k)} style={{padding:'10px 14px',color:'var(--text-400)',fontWeight:500,cursor:'pointer',textAlign:'right',whiteSpace:'nowrap',userSelect:'none',borderBottom:'1px solid var(--border)'}}>{l}<SortIcon col={k}/></th>
                                        ))}
                                        <th style={{padding:'10px 14px',color:'var(--text-400)',fontWeight:500,borderBottom:'1px solid var(--border)'}}>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sortedResults.map((row,i)=>(
                                        <tr key={row.ts_code} style={{borderBottom:'1px solid rgba(255,255,255,0.04)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--bg-600)'} onMouseLeave={e=>e.currentTarget.style.background=''}>
                                            <td style={{padding:'9px 14px',textAlign:'right',color:'var(--text-400)',fontWeight:600}}>{row.rank}</td>
                                            <td style={{padding:'9px 14px'}}>
                                                <div style={{fontWeight:600,color:'var(--text-100)'}}>{row.name}</div>
                                                <div style={{fontSize:11,color:'var(--text-500)'}}>{row.ts_code} {row.industry&&<span style={{color:'var(--accent-light)'}}> · {row.industry}</span>}</div>
                                            </td>
                                            <td style={{padding:'9px 14px',textAlign:'right'}}>
                                                <span style={{fontWeight:800,fontSize:16,color:row.total_score>=70?'var(--profit)':row.total_score>=40?'var(--gold)':'var(--loss)'}}>{num(row.total_score,1)}</span>
                                            </td>
                                            <td style={{padding:'9px 14px',textAlign:'right',color:'var(--accent-light)',fontWeight:600}}>{num(row.fund_score,1)}</td>
                                            <td style={{padding:'9px 14px',textAlign:'right',color:'var(--cyan)',fontWeight:600}}>{num(row.tech_score,1)}</td>
                                            <td style={{padding:'9px 14px',textAlign:'right',color:'var(--text-300)'}}>{row.pe!=null?num(row.pe,1):'-'}</td>
                                            <td style={{padding:'9px 14px',textAlign:'right',color:'var(--text-300)'}}>{row.pb!=null?num(row.pb,2):'-'}</td>
                                            <td style={{padding:'9px 14px',textAlign:'right',color:'var(--text-300)'}}>{row.total_mv!=null?num(row.total_mv,1):'-'}</td>
                                            <td style={{padding:'9px 14px',textAlign:'right',color:row.roe>12?'var(--profit)':row.roe>5?'var(--text-300)':'var(--loss)'}}>{row.roe!=null?num(row.roe,1):'-'}</td>
                                            <td style={{padding:'9px 14px',textAlign:'right',color:row.debt_to_assets<50?'var(--profit)':row.debt_to_assets<70?'var(--gold)':'var(--loss)'}}>{row.debt_to_assets!=null?num(row.debt_to_assets,1):'-'}</td>
                                            <td style={{padding:'9px 14px'}}>
                                                <div style={{display:'flex',gap:6,justifyContent:'center'}}>
                                                    <button className="btn btn-secondary" style={{padding:'3px 10px',fontSize:11}} onClick={()=>openKline(row.ts_code, row.name)}>K线</button>
                                                    {row.piotroski_details && Object.keys(row.piotroski_details).length>0 && (
                                                        <button className="btn btn-secondary" style={{padding:'3px 10px',fontSize:11}} onClick={()=>setPiDetails(piDetails?.ts_code===row.ts_code?null:row)}>F分</button>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Piotroski detail popup */}
                    {piDetails && (
                        <div className="card" style={{marginTop:12,padding:16,border:'1px solid rgba(79,110,247,0.25)'}}>
                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
                                <span style={{fontWeight:700,color:'var(--text-100)'}}>{piDetails.name} — Piotroski F-Score 明细 ({piDetails.piotroski_details&&Object.values(piDetails.piotroski_details).reduce((a,b)=>a+b,0)} / 9)</span>
                                <button onClick={()=>setPiDetails(null)} style={{background:'none',border:'none',color:'var(--text-400)',cursor:'pointer',fontSize:18}}>×</button>
                            </div>
                            <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                                {Object.entries(piDetails.piotroski_details||{}).map(([k,v])=>(
                                    <div key={k} style={{padding:'5px 14px',borderRadius:20,fontSize:12,background:v?'rgba(31,213,117,0.15)':'rgba(240,66,90,0.12)',color:v?'var(--profit)':'var(--loss)',border:`1px solid ${v?'rgba(31,213,117,0.25)':'rgba(240,66,90,0.2)'}`}}>{v?'✓':'✗'} {k}</div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            )}

            {/* ── K-line Modal ──────────────────────── */}
            {klineModal && (
                <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={()=>{setKlineModal(null);setKlineData(null);}}>
                    <div style={{background:'var(--bg-700)',borderRadius:16,padding:24,width:'min(900px,95vw)',border:'1px solid var(--border)',boxShadow:'0 24px 80px rgba(0,0,0,0.5)'}} onClick={e=>e.stopPropagation()}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
                            <div>
                                <span style={{fontWeight:800,fontSize:18,color:'var(--text-100)'}}>{klineModal.name}</span>
                                <span style={{color:'var(--text-400)',fontSize:13,marginLeft:8}}>{klineModal.ts_code}</span>
                            </div>
                            <button onClick={()=>{setKlineModal(null);setKlineData(null);}} style={{background:'var(--bg-600)',border:'1px solid var(--border)',color:'var(--text-300)',borderRadius:8,padding:'4px 12px',cursor:'pointer',fontSize:14}}>关闭</button>
                        </div>
                        {klineLoading && <div style={{textAlign:'center',padding:60,color:'var(--text-400)'}}>加载中...</div>}
                        {!klineLoading && klineData && <KlineChart data={klineData}/>}
                    </div>
                </div>
            )}
        </div>
    );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
