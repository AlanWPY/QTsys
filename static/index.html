function KlineChart({ data, width, height }) {
    const mainRef = useRef(null);
    const overlayRef = useRef(null);
    const hoverRef = useRef(-1);

    // Main chart: only redraws when data/size changes
    useEffect(() => {
        const canvas = mainRef.current;
        if (!canvas || !data || data.length === 0) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const pad = { top: 8, bottom: 28, left: 2, right: 2 };
        const cw = width - pad.left - pad.right;
        const ch = height - pad.top - pad.bottom;
        const n = data.length;
        const gap = cw / n;
        const barW = Math.max(1, gap * 0.65);

        let hi = -Infinity, lo = Infinity;
        for (let i = 0; i < n; i++) { hi = Math.max(hi, data[i].high); lo = Math.min(lo, data[i].low); }
        const range = hi - lo || 1;
        const toY = v => pad.top + ch * (1 - (v - lo) / range);

        ctx.strokeStyle = '#252a3a'; ctx.lineWidth = 0.5;
        for (let i = 0; i <= 4; i++) {
            const y = pad.top + ch * i / 4;
            ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
            ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
            ctx.fillText((hi - range * i / 4).toFixed(2), width - 2, y - 2);
        }

        for (let i = 0; i < n; i++) {
            const d = data[i];
            const x = pad.left + gap * i + gap / 2;
            const isUp = d.close >= d.open;
            ctx.strokeStyle = ctx.fillStyle = isUp ? '#22c55e' : '#ef4444';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, toY(d.high)); ctx.lineTo(x, toY(d.low)); ctx.stroke();
            const bt = toY(Math.max(d.open, d.close));
            const bh = Math.max(1, toY(Math.min(d.open, d.close)) - bt);
            isUp ? ctx.strokeRect(x - barW/2, bt, barW, bh) : ctx.fillRect(x - barW/2, bt, barW, bh);
        }

        const maxVol = Math.max(...data.map(d => d.vol || 0)) || 1;
        for (let i = 0; i < n; i++) {
            const d = data[i]; const x = pad.left + gap * i + gap / 2;
            ctx.fillStyle = d.close >= d.open ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)';
            const vh = (d.vol / maxVol) * 22;
            ctx.fillRect(x - barW/2, height - pad.bottom + 4 + (22 - vh), barW, vh);
        }

        ctx.fillStyle = '#64748b'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
        const step = Math.max(1, Math.floor(n / 6));
        for (let i = 0; i < n; i += step) {
            ctx.fillText(data[i].date.slice(5), pad.left + gap * i + gap / 2, height - 2);
        }
    }, [data, width, height]);

    // Overlay: lightweight crosshair, no React state
    const handleMouseMove = (e) => {
        if (!data || data.length === 0) return;
        const rect = mainRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const gap = (width - 4) / data.length;
        const idx = Math.max(0, Math.min(data.length - 1, Math.floor((x - 2) / gap)));
        if (idx === hoverRef.current) return;
        hoverRef.current = idx;
        // draw crosshair on overlay
        const oc = overlayRef.current;
        if (!oc) return;
        const octx = oc.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        oc.width = width * dpr; oc.height = height * dpr;
        octx.scale(dpr, dpr); octx.clearRect(0, 0, width, height);
        const cx = 2 + gap * idx + gap / 2;
        octx.strokeStyle = 'rgba(99,102,241,0.5)'; octx.lineWidth = 0.5;
        octx.setLineDash([3, 3]);
        octx.beginPath(); octx.moveTo(cx, 8); octx.lineTo(cx, height - 28); octx.stroke();
        octx.setLineDash([]);
        // update info text via DOM
        const info = mainRef.current.parentElement.querySelector('.kline-info-text');
        if (info) {
            const d = data[idx];
            const c = d.close >= d.open ? 'var(--profit)' : 'var(--loss)';
            info.innerHTML = `<span>${d.date}</span><span>寮€ ${d.open}</span><span>楂?${d.high}</span><span>浣?${d.low}</span><span style="color:${c}">鏀?${d.close}</span><span>${d.pct_chg > 0 ? '+' : ''}${d.pct_chg}%</span>`;
        }
    };

    const handleMouseLeave = () => {
        hoverRef.current = -1;
        const oc = overlayRef.current;
        if (oc) { const octx = oc.getContext('2d'); octx.clearRect(0, 0, oc.width, oc.height); }
        const info = mainRef.current && mainRef.current.parentElement.querySelector('.kline-info-text');
        if (info) info.innerHTML = '';
    };

    return (
        <div className="kline-container">
            <div style={{position:'relative'}}>
                <canvas ref={mainRef} className="kline-canvas" style={{width, height}} />
                <canvas ref={overlayRef} className="kline-canvas"
                    style={{width, height, position:'absolute', top:0, left:0}}
                    onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave} />
            </div>
            <div className="kline-info kline-info-text"></div>
        </div>
    );
}

function DrawingCanvas({ showToast }) {
    const canvasRef = useRef(null);
    const drawingRef = useRef(false);
    const pointsRef = useRef([]);
    const [matching, setMatching] = useState(false);
    const [matches, setMatches] = useState([]);
    const [pointCount, setPointCount] = useState(0);
    const wrapRef = useRef(null);
    const [matchMode, setMatchMode] = useState('pool');
    const [targetCode, setTargetCode] = useState('');
    const [searchCodes, setSearchCodes] = useState('');
    const [startDate, setStartDate] = useState('');
    const [endDate, setEndDate] = useState('');

    const drawGrid = (ctx, w, h) => {
        ctx.strokeStyle = '#252a3a'; ctx.lineWidth = 0.5;
        for (let i = 1; i < 4; i++) {
            const y = h * i / 4;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
    };

    const drawCurve = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        const w = rect.width, h = 200;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
        drawGrid(ctx, w, h);
        const pts = pointsRef.current;
        if (pts.length < 2) return;
        ctx.strokeStyle = '#818cf8'; ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
    };

    const getPos = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    };

    const startDraw = (e) => {
        drawingRef.current = true;
        pointsRef.current = [getPos(e)];
        setMatches([]);
        if (wrapRef.current) wrapRef.current.classList.add('drawing');
        drawCurve();
    };

    const moveDraw = (e) => {
        if (!drawingRef.current) return;
        pointsRef.current.push(getPos(e));
        drawCurve();
    };

    const endDraw = () => {
        drawingRef.current = false;
        if (wrapRef.current) wrapRef.current.classList.remove('drawing');
        setPointCount(pointsRef.current.length);
    };

    const clearDraw = () => {
        pointsRef.current = []; setMatches([]); setPointCount(0);
        drawCurve();
    };

    useEffect(() => { drawCurve(); }, []);

    const doMatch = async () => {
        const pts = pointsRef.current;
        if (pts.length < 10) { showToast('璇风粯鍒舵洿闀跨殑鏇茬嚎', 'error'); return; }
        if (matchMode === 'single' && !targetCode.trim()) { showToast('璇疯緭鍏ョ洰鏍囪偂绁ㄤ唬鐮?, 'error'); return; }
        const ys = pts.map(p => p.y);
        const mn = Math.min(...ys), mx = Math.max(...ys);
        const range = mx - mn || 1;
        const curve = ys.map(y => 1 - (y - mn) / range);
        const sampled = [];
        const step = Math.max(1, Math.floor(curve.length / 50));
        for (let i = 0; i < curve.length; i += step) sampled.push(curve[i]);
        setMatching(true);
        try {
            const body = { curve: sampled, top_n: 6, mode: matchMode };
            if (startDate) body.start_date = startDate.replace(/-/g, '');
            if (endDate) body.end_date = endDate.replace(/-/g, '');
            if (matchMode === 'single') {
                body.target_code = targetCode.trim();
            } else if (searchCodes.trim()) {
                body.search_codes = searchCodes.split(/[,锛孿s]+/).filter(Boolean);
            }
            const r = await api.post('/api/market/pattern_match', body);
            setMatches(r.matches || []);
            if ((r.matches || []).length === 0) showToast('鏈壘鍒扮浉浼艰蛋鍔?, 'info');
        } catch(e) { showToast(e.detail || '鍖归厤澶辫触', 'error'); }
        setMatching(false);
    };

    return (
        <div className="draw-panel">
            <div className="draw-panel-title">褰㈡€佸尮閰?- 鐢荤嚎鎵剧浉浼艰蛋鍔?/div>
            <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center',marginBottom:10,fontSize:13}}>
                <label style={{display:'flex',alignItems:'center',gap:4}}>
                    <input type="radio" name="matchMode" checked={matchMode==='pool'} onChange={()=>setMatchMode('pool')} /> 鍖归厤鑲＄エ姹?
                </label>
                <label style={{display:'flex',alignItems:'center',gap:4}}>
                    <input type="radio" name="matchMode" checked={matchMode==='single'} onChange={()=>setMatchMode('single')} /> 鍖归厤鍗曚竴鑲＄エ
                </label>

function MarketPage({ showToast }) {
    const [panels, setPanels] = useState([]);
    const [klineCount, setKlineCount] = useState(60);
    const [tab, setTab] = useState('watch');
    const workspaceRef = useRef(null);
    const dragRef = useRef(null);
    const zRef = useRef(10);
    const nextPos = useRef({ x: 20, y: 20 });

    // Draggable window logic
    const bringToFront = (code) => {
        zRef.current += 1;
        setPanels(prev => prev.map(p => ({
            ...p, z: p.code === code ? zRef.current : p.z,
            active: p.code === code
        })));
    };

    const onBarMouseDown = (e, code) => {
        if (e.target.closest('.stock-window-btn')) return;
        e.preventDefault();
        bringToFront(code);
        const panel = panels.find(p => p.code === code);
        if (!panel) return;
        const startX = e.clientX, startY = e.clientY;
        const origX = panel.x, origY = panel.y;
        const onMove = (ev) => {
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            setPanels(prev => prev.map(p => p.code === code ? { ...p, x: origX + dx, y: origY + dy } : p));
        };
        const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    };

    const onResizeMouseDown = (e, code) => {
        e.preventDefault(); e.stopPropagation();
        bringToFront(code);
        const panel = panels.find(p => p.code === code);
        if (!panel) return;
        const startX = e.clientX, startY = e.clientY;
        const origW = panel.w, origH = panel.h;
        const onMove = (ev) => {
            const nw = Math.max(320, origW + ev.clientX - startX);
            const nh = Math.max(240, origH + ev.clientY - startY);
            setPanels(prev => prev.map(p => p.code === code ? { ...p, w: nw, h: nh } : p));
        };
        const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    };

    const addStock = async (code) => {
        if (panels.find(p => p.code === code)) { showToast('璇ヨ偂绁ㄥ凡鍦ㄧ湅鐩樺垪琛ㄤ腑', 'info'); return; }
        const pos = { ...nextPos.current };
        nextPos.current = { x: pos.x + 30, y: pos.y + 30 };
        if (nextPos.current.x > 400) nextPos.current = { x: 20, y: 20 };
        zRef.current += 1;
        const placeholder = { code, name: '鍔犺浇涓?..', data: [], x: pos.x, y: pos.y, w: 420, h: 300, z: zRef.current, active: true };
        setPanels(prev => [...prev.map(p => ({ ...p, active: false })), placeholder]);
        try {
            const r = await api.get('/api/market/kline?ts_code=' + encodeURIComponent(code) + '&limit=' + klineCount);
            setPanels(prev => prev.map(p => p.code === code ? { ...p, name: r.name || code, data: r.data || [] } : p));
        } catch(e) {
            showToast(e.detail || '鍔犺浇澶辫触', 'error');
            setPanels(prev => prev.filter(p => p.code !== code));
        }
    };

    const removePanel = (code) => { setPanels(prev => prev.filter(p => p.code !== code)); };

    const refreshAll = async () => {
        if (panels.length === 0) return;
        const promises = panels.map(p =>
            api.get('/api/market/kline?ts_code=' + encodeURIComponent(p.code) + '&limit=' + klineCount)
                .then(r => ({ code: p.code, name: r.name || p.name, data: r.data || [] }))
                .catch(() => ({ code: p.code, name: p.name, data: p.data }))
        );
        const results = await Promise.all(promises);
        setPanels(prev => prev.map(p => {
            const r = results.find(rr => rr.code === p.code);
            return r ? { ...p, name: r.name, data: r.data } : p;
        }));
    };

    useEffect(() => { if (panels.length > 0) refreshAll(); }, [klineCount]);

    // Auto-tile: arrange windows in grid
    const autoTile = () => {
        if (panels.length === 0) return;
        const ws = workspaceRef.current;
        const totalW = ws ? ws.offsetWidth : 1000;
        const totalH = ws ? ws.offsetHeight : 600;
        const cols = panels.length <= 2 ? panels.length : panels.length <= 4 ? 2 : 3;
        const rows = Math.ceil(panels.length / cols);
        const ww = Math.floor(totalW / cols) - 8;
        const wh = Math.floor(totalH / rows) - 8;
        setPanels(prev => prev.map((p, i) => ({
            ...p,
            x: (i % cols) * (ww + 8) + 4,
            y: Math.floor(i / cols) * (wh + 8) + 4,
            w: Math.max(320, ww), h: Math.max(240, wh)
        })));
    };

    return (
        <div className="market-page fade-in">
            <div className="tabs">
                <button className={'tab-btn' + (tab === 'watch' ? ' active' : '')} onClick={() => setTab('watch')}>鑷€夌湅鐩?/button>
                <button className={'tab-btn' + (tab === 'pattern' ? ' active' : '')} onClick={() => setTab('pattern')}>褰㈡€佸尮閰?/button>
            </div>

            {tab === 'watch' && (<div>
                <div className="market-toolbar">
                    <StockSearchInput onSelect={addStock} placeholder="娣诲姞鑲＄エ..." />
                    <div className="field" style={{width:90}}>
                        <label className="label">K绾挎暟</label>
                        <select className="input" value={klineCount} onChange={e => setKlineCount(+e.target.value)}>
                            <option value={30}>30</option>
                            <option value={60}>60</option>
                            <option value={120}>120</option>
                            <option value={250}>250</option>
                        </select>
                    </div>
                    <button className="btn btn-secondary" onClick={autoTile} disabled={panels.length===0} title="鑷姩鎺掑垪">鏁寸悊绐楀彛</button>
                    <button className="btn btn-secondary" onClick={refreshAll} disabled={panels.length===0}>鍒锋柊鍏ㄩ儴</button>
                </div>

                <div className="market-workspace" ref={workspaceRef} style={{height: 620}}>
                    {panels.length === 0 && (
                        <div className="workspace-empty">鍦ㄤ笂鏂规悳绱㈡杈撳叆鑲＄エ浠ｇ爜鎴栧悕绉版坊鍔犵湅鐩?br/>绐楀彛鍙嚜鐢辨嫋鍔ㄥ拰缂╂斁</div>
                    )}
                    {panels.map(p => (
                        <div key={p.code}
                            className={'stock-window' + (p.active ? ' active' : '')}
                            style={{left: p.x, top: p.y, width: p.w, height: p.h, zIndex: p.z}}
                            onMouseDown={() => bringToFront(p.code)}>
                            <div className="stock-window-bar" onMouseDown={e => onBarMouseDown(e, p.code)}>
                                <div className="stock-window-title">
                                    <span>{p.name || '鍔犺浇涓?..'}</span>
                                    <span style={{fontSize:11,color:'var(--text-500)'}}>{p.code}</span>
                                </div>
                                <div className="stock-window-btns">
                                    <button className="stock-window-btn close-btn" onClick={() => removePanel(p.code)} title="鍏抽棴">脳</button>
                                </div>
                            </div>
                            <div className="stock-window-body">
                                <StockWindowContent data={p.data} chartW={Math.max(280, (p.w || 420) - 24)} chartH={Math.max(150, (p.h || 300) - 90)} />
                            </div>
                            <div className="stock-window-resize" onMouseDown={e => onResizeMouseDown(e, p.code)} />
                        </div>
                    ))}
                </div>
            </div>)}

            {tab === 'pattern' && <DrawingCanvas showToast={showToast} />}
        </div>
    );
}

        setRankData(null);
    }, [selected && selected.id]);

        const top = ((rankData && rankData.top) || []).map(item => ({ group: '\u6700\u5927', ...item }));
        const bottom = ((rankData && rankData.bottom) || []).map(item => ({ group: '\u6700\u5c0f', ...item }));
        return [...top, ...bottom];
    };

    const runRank = async () => {
        if (!selected) { showToast('\u8bf7\u5148\u9009\u62e9\u56e0\u5b50', 'error'); return; }
        setLoading(true);
        try {
            const res = await api.post('/api/factors/rank', {
                factor_id: selected.id,
                trade_date: compactDate(form.trade_date),
                universe_type: form.universe_type,
                universe_code: form.universe_type === 'system' ? form.universe_code : '',
                custom_pool_id: form.universe_type === 'custom' ? Number(form.custom_pool_id || 0) || null : null,

        }

            .map(row => row.map(escapeCsv).join(',')).join('\n');

        const link = document.createElement('a');

    return (
        <div className="card" style={{padding:14}}>
            <div className="factor-mining-toolbar" style={{marginBottom:12}}>
                <div>
                    <div className="card-title" style={{marginBottom:4}}>{'\u56e0\u5b50\u622a\u9762\u6392\u884c'}</div>
                    <div className="text-xs text-muted">{'\u8ba1\u7b97\u6307\u5b9a\u65e5\u671f\u548c\u80a1\u7968\u6c60\u4e2d\u56e0\u5b50\u503c\u6700\u5927 / \u6700\u5c0f\u7684 N \u53ea\u80a1\u7968\u3002'}</div>
                </div>
                <button className="btn btn-secondary" onClick={downloadRank} disabled={!rankData}>{'\u4e0b\u8f7d CSV'}</button>
            </div>
            <div className="factor-rank-toolbar">
                <div className="field"><label className="label">{'\u65e5\u671f'}</label><input className="input" value={form.trade_date} onChange={e => setForm(prev => ({...prev, trade_date: e.target.value}))} placeholder="YYYYMMDD" /></div>
                <div className="field"><label className="label">{'\u6570\u91cf N'}</label><input className="input" type="number" min="1" max="100" value={form.n} onChange={e => setForm(prev => ({...prev, n: Number(e.target.value || 10)}))} /></div>
                <div className="field"><label className="label">{'\u80a1\u7968\u6c60\u7c7b\u578b'}</label><select className="input" value={form.universe_type} onChange={e => setForm(prev => ({...prev, universe_type: e.target.value}))}><option value="system">{'\u7cfb\u7edf\u80a1\u7968\u6c60'}</option><option value="custom">{'\u81ea\u5b9a\u4e49\u80a1\u7968\u6c60'}</option></select></div>

                )}
                <button className="btn btn-primary" onClick={runRank} disabled={loading || !selected || (form.universe_type === 'custom' && !form.custom_pool_id)}>{loading ? <><span className="spinner"/> {'\u8ba1\u7b97\u4e2d...'}</> : '\u751f\u6210\u6392\u884c'}</button>

            {rankData ? (

                </div>
            ) : null}
        </div>
    );
}

    ), [categoryMeta, sourceStats.builtin]);

    };

    const createFactor = async () => {
        if (!newName || !newExpr) { showToast('璇峰～鍐欏悕绉板拰琛ㄨ揪寮?, 'error'); return; }
        try {
            await api.post('/api/factors', { name: newName, expression: newExpr, description: newDesc, category: newCat });
            loadFactors(); loadCategories(); setNewName(''); setNewExpr(''); setNewDesc('');
            showToast('鍥犲瓙宸插垱寤?, 'success');
        } catch (e) { showToast('鍒涘缓澶辫触', 'error'); }
    };

    const deleteFactor = async (id) => {
        if (!confirm('纭鍒犻櫎?')) return;
        await api.remove('/api/factors/' + id);
        if (selected && selected.id === id) { setSelected(null); setEvalResult(null); }
        loadFactors(); loadCategories(); showToast('宸插垹闄?, 'success');
    };

    const evaluateFactor = async () => {
        if (!selected) { showToast('璇峰厛閫夋嫨鍥犲瓙', 'error'); return; }
        setLoading(true); setEvalResult(null);
        try {
            const codes = evalUniverse.split(',').map(s => s.trim()).filter(Boolean);
            const res = await api.post('/api/factors/evaluate', {
                factor_id: selected.id, universe: codes,
                start_date: evalStart, end_date: evalEnd, groups: evalGroups,
                forward_days: forwardDays,
            });
            setEvalResult(res); showToast('璇勪环瀹屾垚', 'success');
        } catch (e) { showToast(e.detail || '璇勪环澶辫触', 'error'); }
        setLoading(false);
    };

    const runGP = async () => {
        setGpRunning(true);
        try {
            const codes = evalUniverse.split(',').map(s => s.trim()).filter(Boolean);
            const res = await api.post('/api/factors/mine/gp', {
                universe: codes, start_date: evalStart, end_date: evalEnd,
                pop_size: gpPopSize, generations: gpGenerations,
            });
            loadFactors();
            showToast(`GP鎸栨帢瀹屾垚, 鍙戠幇${res.factors.length}涓洜瀛恅, 'success');
        } catch (e) { showToast(e.detail || 'GP鎸栨帢澶辫触', 'error'); }
        setGpRunning(false);
    };

    const runLLM = async () => {
        setLlmRunning(true);
        try {
            const codes = evalUniverse.split(',').map(s => s.trim()).filter(Boolean);
            const res = await api.post('/api/factors/mine/llm', {
                universe: codes, start_date: evalStart, end_date: evalEnd,
                count: llmCount, hint: llmHint,
            });
            loadFactors();
            showToast(`LLM鎸栨帢瀹屾垚, 鐢熸垚${res.factors.length}涓洜瀛恅, 'success');
        } catch (e) { showToast(e.detail || 'LLM鎸栨帢澶辫触', 'error'); }
        setLlmRunning(false);
    };

    const buildFactorResearchBacktestContext = () => {
        const meta = getMiningMeta(selected);
        const stockItems = normalizeStockItems(
            evalUniverse.split(',').map(code => ({ ts_code: code }))
        );
        const hasMiningUniverse = !!(meta && meta.universe_type);
        return normalizeBacktestContext({
            source: meta && meta.session_id ? 'factor_mining_replay' : 'factor_research',
            source_label: meta && meta.session_id ? '鍥犲瓙鎸栨帢澶嶇幇' : '鍥犲瓙鐮旂┒',
            universe_type: hasMiningUniverse ? meta.universe_type : 'custom',
            universe_code: hasMiningUniverse ? (meta.universe_code || '') : 'factor_research_custom',
            universe_name: hasMiningUniverse ? (meta.universe_name || selected.name || '鎸栨帢鑲＄エ姹?) : (selected && selected.name ? `${selected.name} 鐮旂┒鑲＄エ姹燻 : '鍥犲瓙鐮旂┒鑲＄エ姹?),
            custom_pool_id: meta && meta.custom_pool_id ? meta.custom_pool_id : undefined,
            benchmark: (meta && meta.benchmark) || '000300.SH',
            backtest_days: Math.max(parseInt((meta && meta.rebalance_days) || forwardDays, 10) || 5, 20),
            start_date: (meta && (meta.display_start || meta.session_start_date || meta.test_start)) || evalStart,
            end_date: (meta && (meta.display_end || meta.session_end_date || meta.test_end)) || evalEnd,
            stock_items: hasMiningUniverse ? [] : stockItems,
            select_pct: meta && meta.select_pct,
            rebalance_days: meta && meta.rebalance_days,
            factor_direction: meta && meta.direction,
        });
    };

    const buildFactorResearchPrompt = (factor, resultItem) => {
        if (!factor) return '';
        const metrics = resultItem && resultItem.metrics ? resultItem.metrics : {};
        const parts = [
            `璇峰熀浜?QTsys 鍥犲瓙搴撲腑鐨勫洜瀛愨€?{factor.name}鈥濈敓鎴愪竴涓彲鐩存帴淇濆瓨骞跺洖娴嬬殑鑲＄エ閲忓寲绛栫暐銆俙,
            `鍥犲瓙鍒嗙被锛?{factor.category || '鏈垎绫?}锛涙潵婧愶細${factor.source || 'user'}銆俙,
            `鍥犲瓙琛ㄨ揪寮忥細${factor.expression || '-'}`,
        ];
        if (factor.description) {
            parts.push(`鍥犲瓙璇存槑锛?{factor.description}`);
        }
        if (resultItem) {
            parts.push(
                `璇ュ洜瀛愭渶杩戠爺绌剁粨鏋滐細IC鍧囧€?${formatNum(metrics.ic_mean, 4)}锛孖C_IR ${formatNum(metrics.ic_ir, 4)}锛屽澶存敹鐩?${formatPct(metrics.top_group_return)}锛岀┖澶存敹鐩?${formatPct(metrics.bottom_group_return)}锛屽绌烘敹鐩?${formatPct(metrics.long_short_return)}锛屽钩鍧囨崲鎵?${formatPct(metrics.avg_turnover)}銆俙
            );
        }
        parts.push(`鐮旂┒鑲＄エ姹狅細${evalUniverse || '-'}`);
        parts.push(`鐮旂┒鍖洪棿锛?{evalStart || '-'} 鑷?${evalEnd || '-'}`);
        parts.push(`棰勬祴鍛ㄦ湡锛?{forwardDays || '-'} 鏃ワ紝鍒嗙粍鏁帮細${evalGroups || '-'}`);
        parts.push('璇蜂紭鍏堢洿鎺ュ鐢ㄧ郴缁熷洜瀛愭帴鍙?context.get_factor(...) 鎴?context.get_factor_history(...)锛屼笉瑕佹墜宸ラ噸鍐欒鍥犲瓙鍏紡銆?);
        parts.push('璇风粰鍑烘竻鏅扮殑寮€浠撱€佸钩浠撱€佷粨浣嶆帶鍒朵笌椋庨櫓鎺у埗閫昏緫锛屽苟纭繚浠ｇ爜涓ユ牸绗﹀悎 QTsys 鐨?initialize(context) / handle_data(context) 妯℃澘銆?);
        parts.push('濡傛灉璇ュ洜瀛愭洿閫傚悎浣滀负鍙嶅悜淇″彿锛岃鏄庣‘浣跨敤鍙嶅悜閫昏緫銆?);
        return parts.join('\n');
    };

    const openStrategyFromFactor = (factor, resultItem) => {
        if (!factor) {
            showToast('璇峰厛閫夋嫨鍥犲瓙', 'error');
            return;
        }
        const prompt = buildFactorResearchPrompt(factor, resultItem);
        const backtestContext = buildFactorResearchBacktestContext();
        pushStrategyAIPrefill({
            source: 'factor_research',
            factor_name: factor.name,
            prompt,
            auto_generate: true,
            backtest_context: backtestContext,
        });
        if (openStrategyWorkspace) openStrategyWorkspace();
        showToast('宸插皢鍥犲瓙鐮旂┒涓婁笅鏂囧彂閫佸埌 AI 绛栫暐鍔╂墜', 'success');
    };

    const createBacktestFromFactor = async (factor) => {
        if (!factor) {
            showToast('\u8bf7\u5148\u9009\u62e9\u56e0\u5b50', 'error');
            return;
        }
        try {
            const meta = getMiningMeta(factor);
            const direction = meta.direction || 'top';
            const res = await api.post(`/api/factors/${factor.id}/create_strategy`, { direction });
            const backtestContext = buildFactorResearchBacktestContext();
            saveStrategyBacktestContext(res.id, backtestContext);
            pushBacktestPrefill({
                strategy_id: String(res.id),
                strategy_name: res.name || `\u56e0\u5b50\u7b56\u7565_${factor.name || factor.id}`,
                ...backtestContext,
            });
            if (openBacktestWithStrategy) openBacktestWithStrategy();
            showToast('\u5df2\u751f\u6210\u56e0\u5b50\u7b56\u7565\u5e76\u8df3\u8f6c\u56de\u6d4b\u9875', 'success');
        } catch (e) {
            showToast((e && e.detail) || '\u751f\u6210\u56e0\u5b50\u56de\u6d4b\u7b56\u7565\u5931\u8d25', 'error');
        }
    };

    const copyFactorCode = async () => {
        const code = factorCodeModal && factorCodeModal.code ? factorCodeModal.code : '';
        if (!code) return;
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(code);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = code;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }
            showToast('\u56e0\u5b50\u4ee3\u7801\u5df2\u590d\u5236', 'success');
        } catch (e) {
            showToast('\u590d\u5236\u5931\u8d25\uff0c\u8bf7\u624b\u52a8\u9009\u4e2d\u4ee3\u7801\u590d\u5236', 'error');
        }
    };

    const openFactorCode = async (factor) => {
        if (!factor) {
            showToast('\u8bf7\u5148\u9009\u62e9\u56e0\u5b50', 'error');
            return;
        }
        setFactorCodeModal({ title: '\u56e0\u5b50\u8ba1\u7b97\u4ee3\u7801', name: factor.name, expression: factor.expression, code: '' });
        setFactorCodeLoading(true);
        try {
            const res = await api.get(`/api/factors/${factor.id}/code`);
            setFactorCodeModal({ ...res, title: '\u56e0\u5b50\u8ba1\u7b97\u4ee3\u7801' });
        } catch (e) {
            setFactorCodeModal(null);
            showToast((e && e.detail) || '\u52a0\u8f7d\u56e0\u5b50\u4ee3\u7801\u5931\u8d25', 'error');
        }
        setFactorCodeLoading(false);
    };

    const openJoinQuantCode = async (factor) => {
        if (!factor) {
            showToast('\u8bf7\u5148\u9009\u62e9\u56e0\u5b50', 'error');
            return;
        }
        setFactorCodeModal({ title: '\u805a\u5bbd\u56de\u6d4b\u4ee3\u7801', name: factor.name, expression: factor.expression, code: '' });
        setFactorCodeLoading(true);
        try {
            const res = await api.post(`/api/factors/${factor.id}/joinquant_code`, {
                ...joinQuantConfig,
                top_n: Number(joinQuantConfig.top_n || 10),
                rebalance_days: Number(joinQuantConfig.rebalance_days || 5),
                lookback: Number(joinQuantConfig.lookback || 260),
                target_exposure: Number(joinQuantConfig.target_exposure || 0.95),
                max_position_pct: Number(joinQuantConfig.max_position_pct || 0.12),
                min_trade_lot: Number(joinQuantConfig.min_trade_lot || 100),
                stop_loss_pct: Number(joinQuantConfig.stop_loss_pct || 0),
                take_profit_pct: Number(joinQuantConfig.take_profit_pct || 0),
                include_star_market: !!joinQuantConfig.include_star_market,
            });
            setFactorCodeModal({ ...res, title: '\u805a\u5bbd\u56de\u6d4b\u4ee3\u7801' });
        } catch (e) {
            setFactorCodeModal(null);
            showToast((e && e.detail) || '\u751f\u6210\u805a\u5bbd\u56de\u6d4b\u4ee3\u7801\u5931\u8d25', 'error');
        }
        setFactorCodeLoading(false);
    };

    return (
        <div className="fade-in factor-page-shell">
            <div className="factor-hero">
                <div className="factor-hero-content">
                    <div>
                        <div className="factor-kicker">JoinQuant-style factor research library</div>
                        <div className="factor-hero-title">鍥犲瓙鐮旂┒涓績</div>
                        <div className="factor-hero-desc">
                            鎸夎仛瀹藉父鐢ㄥ垎绫荤粍缁囩郴缁熼缃€佺敤鎴疯嚜瀹氫箟銆丄I 涓庡伐浣滄祦鍥犲瓙銆傛瘡涓洜瀛愬彲鐩存帴璇勪环銆佹煡鐪嬭绠椾唬鐮併€佺敓鎴愮瓥鐣ュ苟瀵煎嚭鑱氬鍥炴祴妯℃澘銆?                        </div>
                    </div>
                    <div className="factor-hero-actions">
                        <button className="btn btn-primary" onClick={initBuiltin}>鍔犺浇/鏇存柊棰勭疆鍥犲瓙</button>
                        <button className="btn btn-secondary" onClick={() => setActiveCategory('custom')}>鏌ョ湅鑷畾涔夊洜瀛?/button>
                    </div>
                </div>
                <div className="factor-stat-strip">
                    <div className="factor-stat-tile"><div className="factor-stat-label">鍥犲瓙鎬绘暟</div><div className="factor-stat-value">{factors.length}</div></div>
                    <div className="factor-stat-tile"><div className="factor-stat-label">绯荤粺棰勭疆</div><div className="factor-stat-value">{sourceStats.builtin || 0}/{builtinTotal}</div></div>
                    <div className="factor-stat-tile"><div className="factor-stat-label">鍒嗙被浣撶郴</div><div className="factor-stat-value">{categoryMeta.length}</div></div>
                    <div className="factor-stat-tile"><div className="factor-stat-label">褰撳墠缁撴灉</div><div className="factor-stat-value">{filteredFactors.length}</div></div>
                </div>
            </div>
            <div className="factor-workbench">
                <FactorSidebar factors={filteredFactors} allFactors={factors} selected={selected} setSelected={(f) => { setSelected(f); setEvalResult(null); }}
                    deleteFactor={deleteFactor} initBuiltin={initBuiltin} BADGE={BADGE} BADGE_LABEL={BADGE_LABEL}
                    categoryMeta={categoryMeta} activeCategory={activeCategory} setActiveCategory={setActiveCategory}
                    search={factorSearch} setSearch={setFactorSearch} sourceFilter={sourceFilter} setSourceFilter={setSourceFilter} />
                <div className="factor-detail-panel" style={{display:'flex',flexDirection:'column',gap:12}}>
                    {selected ? (
                        <div className="factor-detail-hero">
                            <div>
                                <div className="factor-detail-title">{factorDisplayName(selected)}</div>
                                <div className="factor-pill-row">
                                    <span className="factor-pill">{selected.category_label || getFactorCategoryMeta(categoryMeta, selected.category).label}</span>
                                    <span className="factor-pill">{BADGE_LABEL[selected.source] || '鑷畾涔?}</span>
                                    <span className="factor-pill">ID {selected.id}</span>
                                </div>
                                <div className="factor-detail-desc">{selected.description || '鏆傛棤鎻忚堪銆傚缓璁ˉ鍏呰鍥犲瓙鐨勭粡娴庡鍚箟銆侀€傜敤甯傚満鍜屽け鏁堥闄┿€?}</div>
                                <div className="factor-formula-box">{selected.expression}</div>
                            </div>
                            <div className="factor-action-grid">
                                <button className="btn btn-secondary" onClick={() => openFactorCode && openFactorCode(selected)}>鏌ョ湅浠ｇ爜</button>
                                <button className="btn btn-secondary" onClick={() => openJoinQuantCode && openJoinQuantCode(selected)}>鑱氬浠ｇ爜</button>
                                <button className="btn btn-primary" onClick={() => createBacktestFromFactor && createBacktestFromFactor(selected)}>鐢熸垚绛栫暐鍥炴祴</button>
                            </div>
                        </div>
                    ) : (
                        <div className="empty-state">
                            <div className="empty-state-icon">伪</div>
                            <div className="empty-state-title">璇烽€夋嫨涓€涓洜瀛?/div>
                            <div className="empty-state-desc">宸︿晶鎸夊垎绫绘祻瑙堝洜瀛愶紝閫夋嫨鍚庡彲鏌ョ湅鍏紡銆佽瘎浠?IC/IR銆佺敓鎴愮瓥鐣ユ垨瀵煎嚭鑱氬浠ｇ爜銆?/div>
                        </div>
                    )}
                    <FactorCreatePanel newName={newName} setNewName={setNewName} newExpr={newExpr} setNewExpr={setNewExpr}
                        newDesc={newDesc} setNewDesc={setNewDesc} newCat={newCat} setNewCat={setNewCat} createFactor={createFactor}
                        categoryMeta={categoryMeta} />
                {selected && <FactorEvalPanel selected={selected} evalUniverse={evalUniverse} setEvalUniverse={setEvalUniverse}
                    evalStart={evalStart} setEvalStart={setEvalStart} evalEnd={evalEnd} setEvalEnd={setEvalEnd}
                    evalGroups={evalGroups} setEvalGroups={setEvalGroups} forwardDays={forwardDays} setForwardDays={setForwardDays}
                    loading={loading} evaluateFactor={evaluateFactor} openStrategyFromFactor={openStrategyFromFactor}
                    createBacktestFromFactor={createBacktestFromFactor} openFactorCode={openFactorCode} openJoinQuantCode={openJoinQuantCode} />}
                {selected && (
                    <div className="card" style={{padding:14}}>
                        <div className="card-title" style={{marginBottom:8}}>{'\u805a\u5bbd\u56de\u6d4b\u4ee3\u7801\u53c2\u6570'}</div>
                        <div className="text-xs text-muted" style={{marginBottom:10}}>
                            {'\u8fd9\u4e9b\u53c2\u6570\u4f1a\u5199\u5165\u805a\u5bbd\u7b56\u7565\u4ee3\u7801\uff1b\u4ee3\u7801\u5df2\u6309 A \u80a1 100 \u80a1\u6574\u6570\u500d\u4e0b\u5355\uff0c\u9ed8\u8ba4\u8fc7\u6ee4\u79d1\u521b\u677f\uff0c\u907f\u514d\u5c0f\u989d\u59d4\u6258\u548c\u79d1\u521b\u677f\u5e02\u4ef7\u5355\u9650\u4ef7\u62a5\u9519\u3002'}
                        </div>
                        <div className="factor-rank-toolbar">
                            <div className="field">
                                <label className="label">{'\u80a1\u7968\u6c60'}</label>
                                <select className="input" value={joinQuantConfig.index_symbol} onChange={e => setJoinQuantConfig(prev => ({...prev, index_symbol: e.target.value, benchmark: e.target.value}))}>
                                    <option value="000300.XSHG">{'\u6caa\u6df1300'}</option>
                                    <option value="000016.XSHG">{'\u4e0a\u8bc150'}</option>
                                    <option value="000905.XSHG">{'\u4e2d\u8bc1500'}</option>
                                    <option value="000852.XSHG">{'\u4e2d\u8bc11000'}</option>
                                    <option value="000001.XSHG">{'\u4e0a\u8bc1\u6307\u6570'}</option>
                                    <option value="399001.XSHE">{'\u6df1\u8bc1\u6210\u6307'}</option>
                                </select>
                            </div>
                            <div className="field"><label className="label">{'\u6301\u4ed3\u6570'}</label><input className="input" type="number" min="1" value={joinQuantConfig.top_n} onChange={e => setJoinQuantConfig(prev => ({...prev, top_n: e.target.value}))} /></div>
                            <div className="field"><label className="label">{'\u8c03\u4ed3\u95f4\u9694'}</label><input className="input" type="number" min="1" value={joinQuantConfig.rebalance_days} onChange={e => setJoinQuantConfig(prev => ({...prev, rebalance_days: e.target.value}))} /></div>
                            <div className="field"><label className="label">{'\u5386\u53f2\u7a97\u53e3'}</label><input className="input" type="number" min="60" value={joinQuantConfig.lookback} onChange={e => setJoinQuantConfig(prev => ({...prev, lookback: e.target.value}))} /></div>
                            <div className="field"><label className="label">{'\u56e0\u5b50\u65b9\u5411'}</label><select className="input" value={joinQuantConfig.high_is_better ? 'high' : 'low'} onChange={e => setJoinQuantConfig(prev => ({...prev, high_is_better: e.target.value === 'high'}))}><option value="high">{'\u56e0\u5b50\u503c\u8d8a\u5927\u8d8a\u597d'}</option><option value="low">{'\u56e0\u5b50\u503c\u8d8a\u5c0f\u8d8a\u597d'}</option></select></div>
                            <div className="field"><label className="label">{'\u603b\u4ed3\u4f4d'}</label><input className="input" type="number" step="0.05" min="0" max="1" value={joinQuantConfig.target_exposure} onChange={e => setJoinQuantConfig(prev => ({...prev, target_exposure: e.target.value}))} /></div>
                            <div className="field"><label className="label">{'\u5355\u80a1\u4e0a\u9650'}</label><input className="input" type="number" step="0.01" min="0" max="1" value={joinQuantConfig.max_position_pct} onChange={e => setJoinQuantConfig(prev => ({...prev, max_position_pct: e.target.value}))} /></div>
                            <div className="field"><label className="label">{'\u6b62\u635f'}</label><input className="input" type="number" step="0.01" min="0" value={joinQuantConfig.stop_loss_pct} onChange={e => setJoinQuantConfig(prev => ({...prev, stop_loss_pct: e.target.value}))} /></div>
                            <div className="field"><label className="label">{'\u6b62\u76c8'}</label><input className="input" type="number" step="0.01" min="0" value={joinQuantConfig.take_profit_pct} onChange={e => setJoinQuantConfig(prev => ({...prev, take_profit_pct: e.target.value}))} /></div>
                            <label className="field" style={{display:'flex',alignItems:'center',gap:8,minWidth:180,paddingBottom:8}}>
                                <input type="checkbox" checked={!!joinQuantConfig.include_star_market} onChange={e => setJoinQuantConfig(prev => ({...prev, include_star_market: e.target.checked}))} />
                                <span className="label" style={{margin:0}}>{'\u5305\u542b\u79d1\u521b\u677f'}</span>
                            </label>
                        </div>
                    </div>
                )}
                {evalResult && <FactorResultView result={evalResult} tab={evalTab} setTab={setEvalTab}
                    onGenerateStrategy={() => openStrategyFromFactor(selected, evalResult)} />}
                {selected && <FactorCrossSectionPanel selected={selected} showToast={showToast} />}
                <FactorMinePanel mineTab={mineTab} setMineTab={setMineTab}
                    gpPopSize={gpPopSize} setGpPopSize={setGpPopSize} gpGenerations={gpGenerations} setGpGenerations={setGpGenerations}
                    gpRunning={gpRunning} runGP={runGP}
                    llmCount={llmCount} setLlmCount={setLlmCount} llmHint={llmHint} setLlmHint={setLlmHint}
                    llmRunning={llmRunning} runLLM={runLLM} />
                </div>
            </div>
            {factorCodeModal && (
                <div className="factor-board-modal" onClick={() => setFactorCodeModal(null)}>
                    <div className="factor-board-modal-card" onClick={e => e.stopPropagation()} style={{width:'min(1120px, 100%)'}}>
                        <div className="factor-board-modal-head">
                            <div>
                                <div className="factor-board-modal-title">{factorCodeModal.title || '\u56e0\u5b50\u8ba1\u7b97\u4ee3\u7801'}</div>
                                <div className="factor-board-modal-copy">
                                    {(factorCodeModal.name || '-') + ' | ' + (factorCodeModal.expression || '-')}
                                </div>
                            </div>
                            <div className="factor-board-toolbar-right">
                                <button className="btn btn-primary" onClick={copyFactorCode} disabled={factorCodeLoading || !factorCodeModal.code}>{'\u590d\u5236\u5168\u90e8\u4ee3\u7801'}</button>
                                <button className="btn btn-secondary" onClick={() => setFactorCodeModal(null)}>{'\u5173\u95ed'}</button>
                            </div>
                        </div>
                        {factorCodeLoading ? (
                            <div className="factor-board-empty"><span className="spinner"/> {'\u6b63\u5728\u751f\u6210\u56e0\u5b50\u4ee3\u7801...'}</div>
                        ) : (
                            <pre className="factor-code-view">{factorCodeModal.code || ''}</pre>
                        )}
                    </div>
                </div>
            )}
        </div>
    );
}

/* ===== Factor Workflow Page ===== */
const WF_NODE_W = 160;
const WF_PORT_R = 6;
const WF_GRID = 20;

const WF_CATEGORIES = [
    { key: 'data', label: '鏁版嵁婧?, color: '#3b82f6' },
    { key: 'math', label: '鏁板杩愮畻', color: '#f59e0b' },
    { key: 'timeseries', label: '鏃跺簭杩愮畻', color: '#22c55e' },
    { key: 'cross_section', label: '鎴潰杩愮畻', color: '#a855f7' },
    { key: 'condition', label: '鏉′欢閫昏緫', color: '#ef4444' },
    { key: 'output', label: '杈撳嚭', color: '#6366f1' },
];

function wfNodeH(reg) {
    const ports = Math.max((reg.inputs||[]).length, (reg.outputs||[]).length, 1);
    return 24 + 28 * ports + 8;
}

function wfPortPos(node, reg, portName, isInput) {
    const ports = isInput ? reg.inputs : reg.outputs;
    const idx = ports.indexOf(portName);
    const h = wfNodeH(reg);
    const py = 24 + 14 + idx * 28;
    return { x: node.x + (isInput ? 0 : WF_NODE_W), y: node.y + py };
}

function FactorWorkflowPage({ showToast }) {
    const [registry, setRegistry] = useState({});
    const [catColors, setCatColors] = useState({});
    const [templates, setTemplates] = useState([]);
    const [nodes, setNodes] = useState([]);
    const [edges, setEdges] = useState([]);
    const [viewport, setViewport] = useState({ x: 0, y: 0, zoom: 1.0 });
    const [selectedNode, setSelectedNode] = useState(null);
    const [selectedEdge, setSelectedEdge] = useState(null);
    const [expression, setExpression] = useState('');
    const [compileErrors, setCompileErrors] = useState([]);
    const [factorName, setFactorName] = useState('鏂板洜瀛?);
    const [factorType, setFactorType] = useState('technical');
    const [savedFactors, setSavedFactors] = useState([]);
    const [editingId, setEditingId] = useState(null);
    const [collapsedCats, setCollapsedCats] = useState({});
    const [previewData, setPreviewData] = useState(null);
    const [previewCode, setPreviewCode] = useState('000001.SZ');
    const [previewStart, setPreviewStart] = useState('20240101');
    const [previewEnd, setPreviewEnd] = useState('20241231');
    const [previewLoading, setPreviewLoading] = useState(false);

    // Backtest state
    const [btMode, setBtMode] = useState('selection');
    const [btUniverse, setBtUniverse] = useState('000001.SZ,000002.SZ,600036.SH,601318.SH,000858.SZ');
    const [btStart, setBtStart] = useState('20230101');
    const [btEnd, setBtEnd] = useState('20241231');
    const [btSelectMode, setBtSelectMode] = useState('top');
    const [btSelectPct, setBtSelectPct] = useState(0.2);
    const [btRebalDays, setBtRebalDays] = useState(5);
    const [btOpenThresh, setBtOpenThresh] = useState(0);
    const [btCloseThresh, setBtCloseThresh] = useState(0);
    const [btOpenCond, setBtOpenCond] = useState('gt');
    const [btCloseCond, setBtCloseCond] = useState('lt');
    const [btTaskId, setBtTaskId] = useState(null);
    const [btResult, setBtResult] = useState(null);
    const [btLoading, setBtLoading] = useState(false);
    const [showAlpha191Select, setShowAlpha191Select] = useState(false);
    const [alpha191Num, setAlpha191Num] = useState(1);

    // Canvas refs
    const canvasRef = useRef(null);
    const overlayRef = useRef(null);
    const wrapRef = useRef(null);
    const stateRef = useRef({ mode: 'idle', dragNode: null, dragWire: null, panStart: null, startVP: null });
    const historyRef = useRef({ stack: [], idx: -1 });
    const nextIdRef = useRef(1);
    const pollRef = useRef(null);

    // Load registry & templates on mount
    useEffect(() => {
        api.get('/api/factors/workflow/templates').then(res => {
            setRegistry(res.node_registry || {});
            setCatColors(res.category_colors || {});
            setTemplates(res.templates || []);
        }).catch(() => {});
        loadSavedFactors();
    }, []);

    const loadSavedFactors = () => {
        api.get('/api/factors').then(list => {
            setSavedFactors(list.filter(f => f.source === 'workflow'));
        }).catch(() => {});
    };

    // Auto-compile on node/edge change
    useEffect(() => {
        if (nodes.length === 0) { setExpression(''); setCompileErrors([]); return; }
        const graph = { nodes, edges, viewport };
        api.post('/api/factors/workflow/compile', { graph }).then(res => {
            setExpression(res.expression || '');
            setCompileErrors(res.errors || []);
        }).catch(() => setCompileErrors(['缂栬瘧璇锋眰澶辫触']));
    }, [nodes, edges]);

    // Draw canvas
    useEffect(() => { drawCanvas(); }, [nodes, edges, viewport, selectedNode, selectedEdge]);

    // Size overlay canvas on mount + resize (separate from drawCanvas to avoid clearing overlay buffer)
    useEffect(() => {
        const syncSize = () => {
            const ov = overlayRef.current;
            const wrap = wrapRef.current;
            if (ov && wrap) { ov.width = wrap.clientWidth; ov.height = wrap.clientHeight; }
        };
        syncSize();
        window.addEventListener('resize', syncSize);
        return () => window.removeEventListener('resize', syncSize);
    }, []);

    const genId = (prefix) => { nextIdRef.current++; return prefix + nextIdRef.current; };

    // Push undo history
    const pushHistory = () => {
        const h = historyRef.current;
        const snap = JSON.stringify({ nodes, edges });
        h.stack = h.stack.slice(0, h.idx + 1);
        h.stack.push(snap);
        if (h.stack.length > 50) h.stack.shift();
        h.idx = h.stack.length - 1;
    };

    const undo = () => {
        const h = historyRef.current;
        if (h.idx > 0) {
            h.idx--;
            const s = JSON.parse(h.stack[h.idx]);
            setNodes(s.nodes); setEdges(s.edges);
        }
    };

    const redo = () => {
        const h = historyRef.current;
        if (h.idx < h.stack.length - 1) {
            h.idx++;
            const s = JSON.parse(h.stack[h.idx]);
            setNodes(s.nodes); setEdges(s.edges);
        }
    };

    // Canvas drawing
    const drawCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const wrap = wrapRef.current;
        if (!wrap) return;
        canvas.width = wrap.clientWidth;
        canvas.height = wrap.clientHeight;
        const ctx = canvas.getContext('2d');
        const { x: vx, y: vy, zoom } = viewport;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(vx, vy);
        ctx.scale(zoom, zoom);

        // Grid
        ctx.strokeStyle = '#1e2235';
        ctx.lineWidth = 0.5 / zoom;
        const gw = canvas.width / zoom + 200;
        const gh = canvas.height / zoom + 200;
        const ox = (-vx / zoom) - 100;
        const oy = (-vy / zoom) - 100;
        for (let x = Math.floor(ox / WF_GRID) * WF_GRID; x < ox + gw; x += WF_GRID) {
            ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + gh); ctx.stroke();
        }
        for (let y = Math.floor(oy / WF_GRID) * WF_GRID; y < oy + gh; y += WF_GRID) {
            ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + gw, y); ctx.stroke();
        }

        // Edges
        edges.forEach(e => {
            const fromNode = nodes.find(n => n.id === e.from.nodeId);
            const toNode = nodes.find(n => n.id === e.to.nodeId);
            if (!fromNode || !toNode) return;
            const fromReg = registry[fromNode.type];
            const toReg = registry[toNode.type];
            if (!fromReg || !toReg) return;
            const fp = wfPortPos(fromNode, fromReg, e.from.port, false);
            const tp = wfPortPos(toNode, toReg, e.to.port, true);
            const sel = selectedEdge === e.id;
            ctx.strokeStyle = sel ? '#818cf8' : '#64748b';
            ctx.lineWidth = sel ? 2.5 / zoom : 1.5 / zoom;
            const dx = Math.abs(fp.x - tp.x) * 0.5;
            ctx.beginPath();
            ctx.moveTo(fp.x, fp.y);
            ctx.bezierCurveTo(fp.x + dx, fp.y, tp.x - dx, tp.y, tp.x, tp.y);
            ctx.stroke();
        });

        // Nodes
        nodes.forEach(node => {
            const reg = registry[node.type];
            if (!reg) return;
            const cat = WF_CATEGORIES.find(c => c.key === reg.category);
            const color = cat ? cat.color : '#6366f1';
            const h = wfNodeH(reg);
            const sel = selectedNode === node.id;

            // Shadow
            ctx.shadowColor = sel ? color : 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = sel ? 12 : 6;
            ctx.shadowOffsetY = 2;

            // Body
            ctx.fillStyle = '#1e2235';
            ctx.beginPath();
            ctx.roundRect(node.x, node.y, WF_NODE_W, h, 6);
            ctx.fill();
            ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

            // Header
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(node.x, node.y, WF_NODE_W, 24, [6, 6, 0, 0]);
            ctx.fill();

            // Title
            ctx.fillStyle = '#fff';
            ctx.font = '11px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(reg.label || node.type, node.x + 8, node.y + 12);

            // Border
            if (sel) {
                ctx.strokeStyle = color;
                ctx.lineWidth = 2 / zoom;
                ctx.beginPath();
                ctx.roundRect(node.x, node.y, WF_NODE_W, h, 6);
                ctx.stroke();
            }

            // Input ports
            (reg.inputs || []).forEach((p, i) => {
                const py = 24 + 14 + i * 28;
                ctx.fillStyle = '#3b4261';
                ctx.beginPath();
                ctx.arc(node.x, node.y + py, WF_PORT_R, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(p, node.x + 10, node.y + py + 1);
            });

            // Output ports
            (reg.outputs || []).forEach((p, i) => {
                const py = 24 + 14 + i * 28;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(node.x + WF_NODE_W, node.y + py, WF_PORT_R, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(p, node.x + WF_NODE_W - 10, node.y + py + 1);
            });

            // Param values
            const params = node.params || {};
            const paramKeys = Object.keys(reg.params || {});
            if (paramKeys.length > 0) {
                ctx.fillStyle = '#64748b';
                ctx.font = '9px monospace';
                ctx.textAlign = 'center';
                const txt = paramKeys.map(k => `${k}=${params[k] !== undefined ? params[k] : reg.params[k].default}`).join(' ');
                ctx.fillText(txt, node.x + WF_NODE_W / 2, node.y + h - 4);
            }
        });

        ctx.restore();
    };

    // Mouse 鈫?canvas coords
    const toCanvas = (e) => {
        const rect = wrapRef.current.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left - viewport.x) / viewport.zoom,
            y: (e.clientY - rect.top - viewport.y) / viewport.zoom,
        };
    };

    // Hit test: find node at position
    const hitNode = (cx, cy) => {
        for (let i = nodes.length - 1; i >= 0; i--) {
            const n = nodes[i];
            const reg = registry[n.type];
            if (!reg) continue;
            const h = wfNodeH(reg);
            if (cx >= n.x && cx <= n.x + WF_NODE_W && cy >= n.y && cy <= n.y + h) return n;
        }
        return null;
    };

    // Hit test: find port at position
    const hitPort = (cx, cy) => {
        for (const n of nodes) {
            const reg = registry[n.type];
            if (!reg) continue;
            for (const p of (reg.outputs || [])) {
                const pos = wfPortPos(n, reg, p, false);
                if (Math.hypot(cx - pos.x, cy - pos.y) < WF_PORT_R + 4) return { nodeId: n.id, port: p, isInput: false };
            }
            for (const p of (reg.inputs || [])) {
                const pos = wfPortPos(n, reg, p, true);
                if (Math.hypot(cx - pos.x, cy - pos.y) < WF_PORT_R + 4) return { nodeId: n.id, port: p, isInput: true };
            }
        }
        return null;
    };

    // Mouse handlers
    const onMouseDown = (e) => {
        const c = toCanvas(e);
        const st = stateRef.current;

        // Right/middle click 鈫?pan
        if (e.button === 1 || e.button === 2) {
            st.mode = 'pan'; st.panStart = { x: e.clientX, y: e.clientY };
            st.startVP = { ...viewport };
            e.preventDefault(); return;
        }

        // Check port hit first
        const port = hitPort(c.x, c.y);
        if (port && !port.isInput) {
            st.mode = 'drag_wire';
            st.dragWire = { from: { nodeId: port.nodeId, port: port.port }, mx: c.x, my: c.y };
            pushHistory(); return;
        }

        // Check node hit
        const node = hitNode(c.x, c.y);
        if (node) {
            st.mode = 'drag_node';
            st.dragNode = { id: node.id, ox: c.x - node.x, oy: c.y - node.y };
            setSelectedNode(node.id); setSelectedEdge(null);
            pushHistory(); return;
        }

        // Click on empty 鈫?deselect
        setSelectedNode(null); setSelectedEdge(null);
    };

    const onMouseMove = (e) => {
        const st = stateRef.current;
        if (st.mode === 'pan') {
            const dx = e.clientX - st.panStart.x;
            const dy = e.clientY - st.panStart.y;
            setViewport({ ...st.startVP, x: st.startVP.x + dx, y: st.startVP.y + dy });
            return;
        }
        if (st.mode === 'drag_node') {
            const c = toCanvas(e);
            setNodes(prev => prev.map(n =>
                n.id === st.dragNode.id ? { ...n, x: c.x - st.dragNode.ox, y: c.y - st.dragNode.oy } : n
            ));
            return;
        }
        if (st.mode === 'drag_wire') {
            const c = toCanvas(e);
            st.dragWire.mx = c.x;
            st.dragWire.my = c.y;
            // Draw wire preview on overlay
            const ov = overlayRef.current;
            if (ov) {
                ov.width = ov.parentElement.clientWidth;
                ov.height = ov.parentElement.clientHeight;
                const octx = ov.getContext('2d');
                octx.clearRect(0, 0, ov.width, ov.height);
                const fromNode = nodes.find(n => n.id === st.dragWire.from.nodeId);
                if (fromNode) {
                    const reg = registry[fromNode.type];
                    if (reg) {
                        const fp = wfPortPos(fromNode, reg, st.dragWire.from.port, false);
                        const sx = fp.x * viewport.zoom + viewport.x;
                        const sy = fp.y * viewport.zoom + viewport.y;
                        const ex = c.x * viewport.zoom + viewport.x;
                        const ey = c.y * viewport.zoom + viewport.y;
                        octx.strokeStyle = '#818cf8';
                        octx.lineWidth = 2;
                        octx.setLineDash([6, 4]);
                        const ddx = Math.abs(sx - ex) * 0.5;
                        octx.beginPath();
                        octx.moveTo(sx, sy);
                        octx.bezierCurveTo(sx + ddx, sy, ex - ddx, ey, ex, ey);
                        octx.stroke();
                        octx.setLineDash([]);
                    }
                }
            }
        }
    };

    const onMouseUp = (e) => {
        const st = stateRef.current;
        if (st.mode === 'drag_wire') {
            const c = toCanvas(e);
            const port = hitPort(c.x, c.y);
            if (port && port.isInput) {
                // Check not connecting to same node
                if (port.nodeId !== st.dragWire.from.nodeId) {
                    const fromInfo = st.dragWire.from;
                    const toInfo = { nodeId: port.nodeId, port: port.port };
                    setEdges(prev => {
                        const filtered = prev.filter(ed =>
                            !(ed.to.nodeId === toInfo.nodeId && ed.to.port === toInfo.port)
                        );
                        filtered.push({ id: genId('e'), from: fromInfo, to: toInfo });
                        return filtered;
                    });
                }
            }
            // Clear overlay
            const ov = overlayRef.current;
            if (ov) { const octx = ov.getContext('2d'); octx.clearRect(0, 0, ov.width, ov.height); }
        }
        st.mode = 'idle';
        st.dragNode = null;
        st.dragWire = null;
    };

    // Keyboard handler (single source, via window listener)
    useEffect(() => {
        const handler = (e) => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedNode) {
                    pushHistory();
                    setNodes(prev => prev.filter(n => n.id !== selectedNode));
                    setEdges(prev => prev.filter(ed => ed.from.nodeId !== selectedNode && ed.to.nodeId !== selectedNode));
                    setSelectedNode(null);
                } else if (selectedEdge) {
                    pushHistory();
                    setEdges(prev => prev.filter(ed => ed.id !== selectedEdge));
                    setSelectedEdge(null);
                }
            }
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
            if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
    }, [selectedNode, selectedEdge]);

    // Attach wheel listener with {passive:false} so preventDefault works
    useEffect(() => {
        const el = overlayRef.current;
        if (!el) return;
        const handler = (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            setViewport(v => {
                const nz = Math.max(0.25, Math.min(3.0, v.zoom * delta));
                const el2 = wrapRef.current;
                if (!el2) return v;
                const rect = el2.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                return { x: mx - (mx - v.x) * (nz / v.zoom), y: my - (my - v.y) * (nz / v.zoom), zoom: nz };
            });
        };
        el.addEventListener('wheel', handler, { passive: false });
        return () => el.removeEventListener('wheel', handler);
    }, []);

    // Add node from palette
    const addNode = (type, posX, posY) => {
        pushHistory();
        const reg = registry[type];
        if (!reg) return;
        const cx = posX != null ? posX : (-viewport.x + 300) / viewport.zoom;
        const cy = posY != null ? posY : (-viewport.y + 200) / viewport.zoom;
        setNodes(prev => [...prev, {
            id: genId('n'), type, x: cx + Math.random() * 40, y: cy + Math.random() * 40,
            params: Object.fromEntries(Object.entries(reg.params || {}).map(([k, v]) => [k, v.default])),
        }]);
    };

    // Update node param
    const updateParam = (nodeId, key, value) => {
        setNodes(prev => prev.map(n =>
            n.id === nodeId ? { ...n, params: { ...n.params, [key]: value } } : n
        ));
    };

    // Save workflow
    const saveWorkflow = async () => {
        if (!expression) { showToast('璇峰厛鏋勫缓鏈夋晥鐨勫伐浣滄祦', 'error'); return; }
        try {
            const graph = { nodes, edges, viewport };
            if (editingId) {
                await api.put(`/api/factors/workflow/${editingId}`, {
                    name: factorName, graph, factor_type: factorType, category: 'workflow',
                });
                showToast('宸ヤ綔娴佸凡鏇存柊', 'success');
            } else {
                const res = await api.post('/api/factors/workflow/save', {
                    name: factorName, graph, factor_type: factorType, category: 'workflow',
                });
                setEditingId(res.id);
                showToast('宸ヤ綔娴佸凡淇濆瓨', 'success');
            }
            loadSavedFactors();
        } catch (e) { showToast(e.detail || '淇濆瓨澶辫触', 'error'); }
    };

    // Load saved workflow
    const loadWorkflow = async (factorId) => {
        try {
            const res = await api.get(`/api/factors/${factorId}/graph`);
            if (res.graph_json) {
                setNodes(res.graph_json.nodes || []);
                setEdges(res.graph_json.edges || []);
                setViewport(res.graph_json.viewport || { x: 0, y: 0, zoom: 1.0 });
                setFactorName(res.name);
                setFactorType(res.factor_type || 'technical');
                setEditingId(factorId);
                showToast('宸插姞杞? ' + res.name, 'success');
            }
        } catch (e) { showToast('鍔犺浇澶辫触', 'error'); }
    };

    // Load template
    const loadTemplate = (idx) => {
        const tpl = templates[idx];
        if (!tpl) return;
        pushHistory();
        setNodes(tpl.graph.nodes || []);
        setEdges(tpl.graph.edges || []);
        setViewport(tpl.graph.viewport || { x: 0, y: 0, zoom: 1.0 });
        setFactorName(tpl.name);
        setEditingId(null);
        showToast('宸插姞杞芥ā鏉? ' + tpl.name, 'success');
    };

    const loadAlpha191 = async () => {
        const num = parseInt(alpha191Num);
        if (num < 1 || num > 191) {
            showToast('璇疯緭鍏?-191涔嬮棿鐨勬暟瀛?, 'error');
            return;
        }
        try {
            const res = await api.get(`/api/factors/workflow/alpha191_v2/${num}`);
            setFactorName(res.name);
            setExpression(res.expression);

            // 灏濊瘯缂栬瘧宸ヤ綔娴佸浘
            if (res.graph && res.graph.nodes && res.graph.edges) {
                try {
                    const compileRes = await api.post('/api/factors/workflow/compile', { graph: res.graph });
                    if (compileRes.errors && compileRes.errors.length > 0) {
                        // 缂栬瘧澶辫触锛屼娇鐢ㄨ〃杈惧紡妯″紡
                        console.log('宸ヤ綔娴佺紪璇戝け璐ワ紝浣跨敤琛ㄨ揪寮忔ā寮?', compileRes.errors);
                        setNodes([]);
                        setEdges([]);
                        showToast(`宸插姞杞?${res.name}锛堣〃杈惧紡妯″紡锛塦, 'success');
                    } else {
                        // 缂栬瘧鎴愬姛锛屼娇鐢ㄥ伐浣滄祦鍥?
                        setNodes(res.graph.nodes);
                        setEdges(res.graph.edges);
                        showToast(`宸插姞杞?${res.name} 宸ヤ綔娴佸浘 (${res.graph.nodes.length}鑺傜偣)`, 'success');
                    }
                } catch (e) {
                    // 缂栬瘧璇锋眰澶辫触锛屽洖閫€鍒拌〃杈惧紡妯″紡
                    console.log('缂栬瘧璇锋眰澶辫触锛屼娇鐢ㄨ〃杈惧紡妯″紡');
                    setNodes([]);
                    setEdges([]);
                    showToast(`宸插姞杞?${res.name}锛堣〃杈惧紡妯″紡锛塦, 'success');
                }
            } else {
                setNodes([]);
                setEdges([]);
                showToast(`宸插姞杞?${res.name}锛堣〃杈惧紡妯″紡锛塦, 'success');
            }
            setShowAlpha191Select(false);
        } catch (e) {
            console.error('鍔犺浇Alpha191澶辫触:', e);
            showToast('鍔犺浇澶辫触: ' + (e.response?.data?.detail || e.message), 'error');
        }
    };

    // Preview factor values
    const runPreview = async () => {
        if (!expression) { showToast('璇峰厛鏋勫缓鏈夋晥宸ヤ綔娴佹垨鍔犺浇鍥犲瓙', 'error'); return; }
        setPreviewLoading(true);
        try {
            // 濡傛灉娌℃湁鑺傜偣锛屼娇鐢ㄨ〃杈惧紡鐩存帴棰勮锛圓lpha191妯″紡锛?
            if (nodes.length === 0 && expression) {
                // 鐩存帴浣跨敤琛ㄨ揪寮忓垱寤轰复鏃跺洜瀛愯繘琛岃瘎浼?
                const tempFactorName = factorName || 'TempFactor_' + Date.now();
                const saveRes = await api.post('/api/factors', {
                    name: tempFactorName,
                    description: 'Temporary factor for preview',
                    expression: expression,
                    category: 'temp'
                });

                const res = await api.post('/api/factors/evaluate', {
                    factor_id: saveRes.id,
                    universe: [previewCode],
                    start_date: previewStart,
                    end_date: previewEnd,
                    groups: 5,
                    forward_days: 5
                });

                if (res.ic_series && res.ic_series.length > 0) {
                    // 杞崲IC搴忓垪涓洪瑙堟暟鎹牸寮?
                    setPreviewData({
                        expression,
                        data: res.ic_series.map(d => ({
                            date: d.date,
                            value: d.ic
                        }))
                    });
                    showToast('棰勮鎴愬姛锛堟樉绀篒C鍊硷級', 'success');
                } else {
                    showToast('棰勮澶辫触锛氭棤鏈夋晥鏁版嵁', 'error');
                }
            } else if (nodes.length > 0) {
                // 鏈夊伐浣滄祦鍥撅紝浣跨敤姝ｅ父棰勮
                const graph = { nodes, edges, viewport };
                const res = await api.post('/api/factors/workflow/preview', {
                    graph, ts_code: previewCode, start_date: previewStart, end_date: previewEnd,
                });
                setPreviewData(res);
                showToast('棰勮鎴愬姛', 'success');
            } else {
                showToast('璇峰厛鍔犺浇鍥犲瓙鎴栨瀯寤哄伐浣滄祦', 'error');
            }
        } catch (e) {
            console.error('Preview error:', e);
            showToast(e.response?.data?.detail || e.detail || '棰勮澶辫触', 'error');
        }
        setPreviewLoading(false);
    };

    // Run factor backtest
    const runBacktest = async () => {
        if (!expression) { showToast('璇峰厛鏋勫缓鏈夋晥宸ヤ綔娴?, 'error'); return; }
        setBtLoading(true); setBtResult(null);
        try {
            const codes = btUniverse.split(',').map(s => s.trim()).filter(Boolean);
            let res;
            if (btMode === 'selection') {
                res = await api.post('/api/factor_backtest/selection', {
                    expression, universe: codes, start_date: btStart, end_date: btEnd,
                    select_mode: btSelectMode, select_pct: btSelectPct,
                    rebalance_days: btRebalDays, initial_cash: 1000000, benchmark: '000300.SH',
                });
            } else {
                res = await api.post('/api/factor_backtest/technical', {
                    expression, ts_codes: codes, start_date: btStart, end_date: btEnd,
                    open_threshold: btOpenThresh, close_threshold: btCloseThresh,
                    open_condition: btOpenCond, close_condition: btCloseCond, initial_cash: 1000000,
                });
            }
            if (res.task_id) {
                setBtTaskId(res.task_id);
                pollBacktest(res.task_id);
            }
        } catch (e) { showToast(e.detail || '鍥炴祴鎻愪氦澶辫触', 'error'); setBtLoading(false); }
    };

    const pollBacktest = (taskId) => {
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(async () => {
            try {
                const r = await api.get('/api/factor_backtest/result/' + taskId);
                if (r.status === 'completed') {
                    clearInterval(pollRef.current); pollRef.current = null;
                    setBtResult(r.result); setBtLoading(false);
                    showToast('鍥炴祴瀹屾垚');
                } else if (r.status === 'failed') {
                    clearInterval(pollRef.current); pollRef.current = null;
                    showToast(r.error || '鍥炴祴澶辫触', 'error'); setBtLoading(false);
                }
            } catch { clearInterval(pollRef.current); pollRef.current = null; setBtLoading(false); }
        }, 2000);
    };

    // Cleanup poll interval on unmount
    useEffect(() => { return () => { if (pollRef.current) clearInterval(pollRef.current); }; }, []);

    // ===== JSX Return =====
    const selNode = nodes.find(n => n.id === selectedNode);
    const selNodeReg = selNode ? registry[selNode.type] : null;

    return (
        <div className="wf-page">
            {/* Toolbar */}
            <div className="wf-toolbar">
                <input value={factorName} onChange={e => setFactorName(e.target.value)}
                    style={{width:140,padding:'4px 8px',borderRadius:4,border:'1px solid #555',background:'#2a2a2a',color:'#eee'}} />
                <select value={factorType} onChange={e => setFactorType(e.target.value)}
                    style={{padding:'4px 8px',borderRadius:4,border:'1px solid #555',background:'#2a2a2a',color:'#eee'}}>

                    <option value="selection">閫夎偂鍥犲瓙</option>

                <button className="btn btn-sm" onClick={saveWorkflow}>{editingId ? '鏇存柊' : '淇濆瓨'}</button>
                <select onChange={e => {

                    if (val === 'alpha191') {
                        setShowAlpha191Select(true);
                    } else if (val) {
                        loadTemplate(parseInt(val));
                    }
                    e.target.value='';
                }} style={{padding:'4px 8px',borderRadius:4,border:'1px solid #555',background:'#2a2a2a',color:'#eee'}}>
                    <option value="">鍔犺浇妯℃澘...</option>
                    {templates.map((t,i) => <option key={i} value={i}>{t.name}</option>)}
                    <option value="alpha191">Alpha191鍥犲瓙</option>
                </select>
                <select onChange={e => { if (e.target.value) loadWorkflow(parseInt(e.target.value)); e.target.value=''; }}

                    <option value="">鍔犺浇宸蹭繚瀛?..</option>

                <button className="btn btn-sm" onClick={() => { setNodes([]); setEdges([]); setEditingId(null); setFactorName('鏂板洜瀛?); setBtResult(null); setPreviewData(null); }}>娓呯┖</button>
                <span style={{marginLeft:'auto',fontSize:12,color:compileErrors.length?'#f87171':'#86efac'}}>
                    {compileErrors.length ? compileErrors[0] : (expression ? '鉁?缂栬瘧鎴愬姛' : '')}

            </div>

            <div className="wf-body">

                                    <span style={{transform:collapsed?'rotate(-90deg)':'',transition:'0.15s'}}>鈻?/span> {cat.label}

                                    </div>

                            </div>

                    <div style={{marginTop:8,padding:'4px 6px'}}>
                        <button className="btn btn-sm" style={{width:'100%',fontSize:11}}

                {/* Center: Canvas */}
                <div className="wf-canvas-wrap" ref={wrapRef}

                    <canvas ref={canvasRef} style={{position:'absolute',top:0,left:0}} />

                {/* Right: Inspector */}
                <div className="wf-inspector">
                    {selNode && selNodeReg ? (
                        <div>
                            <div style={{fontWeight:600,fontSize:13,marginBottom:8,color:catColors[selNodeReg.category]||'#eee'}}>
                                {selNodeReg.label}
                            </div>
                            <div style={{fontSize:11,color:'#999',marginBottom:8}}>绫诲瀷: {selNode.type}</div>
                            {selNodeReg.tooltip && (
                                <div style={{fontSize:11,color:'#aaa',marginBottom:12,padding:8,background:'#1e1e1e',borderRadius:4,borderLeft:'3px solid '+catColors[selNodeReg.category]}}>
                                    <div style={{fontWeight:600,marginBottom:4}}>鍔熻兘璇存槑:</div>
                                    {selNodeReg.tooltip}
                                </div>
                            )}
                            {Object.keys(selNodeReg.params || {}).map(p => (
                                <div key={p} style={{marginBottom:6}}>
                                    <label style={{fontSize:11,color:'#aaa'}}>{p}</label>
                                    <input type="number" value={selNode.params[p] ?? ''} onChange={e => updateParam(selNode.id, p, parseFloat(e.target.value) || 0)}
                                        style={{width:'100%',padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:12}} />
                                </div>
                            ))}
                            <button className="btn btn-sm" style={{marginTop:8,fontSize:11,background:'#dc2626'}}
                                onClick={() => { pushHistory(); setNodes(ns => ns.filter(n => n.id !== selNode.id)); setEdges(es => es.filter(e => e.from.nodeId !== selNode.id && e.to.nodeId !== selNode.id)); setSelectedNode(null); }}>
                                鍒犻櫎鑺傜偣
                            </button>

                    ) : (
                        <div style={{color:'#666',fontSize:12,textAlign:'center',marginTop:20}}>鐐瑰嚮鑺傜偣鏌ョ湅灞炴€?/div>
                    )}
                </div>
            </div>

            {/* Expression Bar */}
            <div className="wf-expr-bar">
                <span style={{color:'#888',marginRight:8}}>琛ㄨ揪寮?</span>

                    {expression || '(绌?'}

            {/* Preview & Backtest Panel */}

                        <span style={{color:'#666'}}>~</span>
                        <input value={previewEnd} onChange={e => setPreviewEnd(e.target.value)} placeholder="缁撴潫鏃ユ湡"
                            style={{width:80,padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}} />
                        <button className="btn btn-sm" onClick={runPreview} disabled={previewLoading} style={{fontSize:11}}>

                        <select value={btMode} onChange={e => setBtMode(e.target.value)}

                            <option value="selection">閫夎偂鍥炴祴</option>
                            <option value="technical">鎶€鏈洖娴?/option>
                        </select>
                    </div>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:4,fontSize:11}}>
                        <input value={btUniverse} onChange={e => setBtUniverse(e.target.value)} placeholder="鑲＄エ姹?
                            style={{flex:1,minWidth:120,padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}} />
                        <input value={btStart} onChange={e => setBtStart(e.target.value)} style={{width:72,padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}} />
                        <input value={btEnd} onChange={e => setBtEnd(e.target.value)} style={{width:72,padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}} />
                    </div>
                    {btMode === 'selection' ? (
                        <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:4,fontSize:11}}>
                            <select value={btSelectMode} onChange={e => setBtSelectMode(e.target.value)}
                                style={{padding:'3px 6px',borderRadius:3,border:'1px solid #555',background:'#1e1e1e',color:'#eee',fontSize:11}}>
